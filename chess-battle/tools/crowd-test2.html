<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兵士の試験2（公開しない道具）</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font:14px sans-serif}#cv{width:100%;height:100%;display:block}#hud{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.6);padding:6px 8px}</style>
<canvas id="cv"></canvas><div id="hud">読みこみ中</div>
<script type="importmap">{"imports":{
  "three":"../../lib/three@0.185.1/build/three.module.min.js",
  "three/addons/":"../../lib/three@0.185.1/examples/jsm/",
  "@three.ez/instanced-mesh":"../../lib/@three.ez/instanced-mesh@0.3.16/build/index.js",
  "bvh.js":"../../lib/bvh.js@0.0.13/build/index.js"}}</script>
<script type="module">
// three 0.185 ＋ InstancedMesh2 で兵を N 人（?n=1000）。骨の行列は「動き×位相」の見本ごとに1回だけ計算し、兵の場所へ写す
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { InstancedMesh2 } from '@three.ez/instanced-mesh';
const q = new URLSearchParams(location.search), N = +(q.get('n') || 1000), POOL = 6;
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = q.get('shadow') !== '0';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c0); scene.fog = new THREE.Fog(0x9fb4c0, 60, 260);
const cam = new THREE.PerspectiveCamera(40, 1, 0.3, 800);
scene.add(new THREE.HemisphereLight(0xe8eef2, 0x4a4030, 1.6));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(-40, 60, 30); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 200 }); scene.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x4d5e33 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
const CLIPS = ['Idle_Loop', 'Walk_Loop', 'Jog_Fwd_Loop', 'Sprint_Loop', 'Sword_Attack'];
const gltf = await new Promise((ok, ng) => new GLTFLoader().load('../assets/soldier-ranger.glb', ok, undefined, ng));
let src = null; gltf.scene.traverse(m => { if (m.isSkinnedMesh) src = m; });
src.material.transparent = false; src.material.alphaTest = 0.5;
// 見本の姿勢: pose[c*POOL+k] = 骨の行列（65×16）
const mixers = [], tpls = [];
for (const c of CLIPS) for (let k = 0; k < POOL; k++) {
  const o = SkeletonUtils.clone(gltf.scene), mx = new THREE.AnimationMixer(o), clip = THREE.AnimationClip.findByName(gltf.animations, c);
  mx.clipAction(clip).play(); mx.update(clip.duration * k / POOL); mixers.push(mx);
  let sk = null; o.traverse(m => { if (m.isSkinnedMesh) sk = m.skeleton; }); tpls.push({ o, sk });
}
const NB = src.skeleton.bones.length, poses = tpls.map(() => new Float32Array(NB * 16)), tmpM = new THREE.Matrix4();
const im = new InstancedMesh2(src.geometry, src.material, { capacity: N });
im.initSkeleton(src.skeleton);
im.castShadow = true; im.receiveShadow = false;
const cols = Math.ceil(Math.sqrt(N)), who = [];
im.addInstances(N, (o, i) => {
  o.position.set((i % cols - cols / 2) * 1.5 + Math.random() * 0.4, 0, (Math.floor(i / cols) - cols / 2) * 1.7);
  o.rotateY(Math.random() * 0.4 - 0.2);
  who.push((i % CLIPS.length) * POOL + (i % POOL));
});
scene.add(im);
hud.textContent = `three ${THREE.REVISION}・InstancedMesh2・兵 ${N} 人`;
const data = im.boneTexture._data;
function poseUpdate(dt) {
  for (const m of mixers) m.update(dt);
  tpls.forEach(({ o, sk }, t) => { o.updateMatrixWorld(true); const P = poses[t]; for (let b = 0; b < NB; b++) tmpM.multiplyMatrices(sk.bones[b].matrixWorld, sk.boneInverses[b]).toArray(P, b * 16); });
  for (let i = 0; i < N; i++) data.set(poses[who[i]], i * NB * 16);
  im.boneTexture.needsUpdate = true;
}
let last = performance.now(), t = 0;
window.bench = () => { const T = (fn, n = 20) => { const a = performance.now(); for (let i = 0; i < n; i++) fn(); return ((performance.now() - a) / n).toFixed(1); }; const gl = renderer.getContext(); return { pose: T(() => poseUpdate(1 / 60)), render: T(() => { renderer.render(scene, cam); gl.finish(); }), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; };
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  poseUpdate(dt);
  const close = q.get('close');
  cam.position.set(Math.sin(t * 0.1) * (close ? 8 : 45), close ? 2.4 : 18, Math.cos(t * 0.1) * (close ? 8 : 45)); cam.lookAt(0, close ? 1.2 : 0, 0);
  renderer.render(scene, cam); requestAnimationFrame(loop);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); requestAnimationFrame(loop);
</script>
