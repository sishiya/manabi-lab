<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兵士の試験（公開しない道具）</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font:14px sans-serif}#cv{width:100%;height:100%;display:block}#hud{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.6);padding:6px 8px}</style>
<canvas id="cv"></canvas><div id="hud"></div>
<script src="../../lib/three@0.128.0/build/three.min.js"></script>
<script src="../../lib/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="../../lib/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
// 兵士を N 人並べて歩かせ、1秒あたりのコマ数を測る（?n=250&anim=Walk_Loop&close=1）
const q = new URLSearchParams(location.search), N = +(q.get('n') || 250), ANIM = q.get('anim') || 'Walk_Loop';
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c0); scene.fog = new THREE.Fog(0x9fb4c0, 40, 160);
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
scene.add(new THREE.HemisphereLight(0xe8eef2, 0x4a4030, 0.8));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.1); sun.position.set(-20, 40, 20); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 }); scene.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x5a6a40 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
const mixers = [];
const files = ['soldier-peasant', 'soldier-ranger'];
Promise.all(files.map(f => new Promise((ok, ng) => new THREE.GLTFLoader().load(`../assets/${f}.glb`, ok, undefined, ng)))).then(gl => {
  const cols = Math.ceil(Math.sqrt(N)), SHARE = q.get('share') !== '0';
  for (const g of gl) g.scene.traverse(m => { if (m.isMesh) { m.material.transparent = false; m.material.alphaTest = 0.5; m.material.depthWrite = true; } });
  // 見本の姿勢（モデルごとに位相をずらして6つ）。兵は見本の骨の向きを写すだけ（?share=0 で1人ずつ計算）
  const POOL = 6, pools = gl.map(src => Array.from({ length: POOL }, (_, k) => {
    const o = THREE.SkeletonUtils.clone(src.scene), mx = new THREE.AnimationMixer(o);
    mx.clipAction(THREE.AnimationClip.findByName(src.animations, ANIM)).play(); mx.update(k * 0.37); mixers.push(mx);
    const bones = []; o.traverse(b => { if (b.isBone) bones.push(b); }); return bones;
  }));
  window.copies = [];
  if (q.get('mode') === 'bind') {   // 兵は骨を持たず、見本の骨組みをそのまま使う（bindMode detached）。見本は原点に置いて骨の位置だけ計算
    window.templates = [];
    const tpl = gl.map(src => Array.from({ length: POOL }, (_, k) => {
      const o = THREE.SkeletonUtils.clone(src.scene), mx = new THREE.AnimationMixer(o);
      mx.clipAction(THREE.AnimationClip.findByName(src.animations, ANIM)).play(); mx.update(k * 0.37); mixers.push(mx);
      let sk = null; o.traverse(m => { if (m.isSkinnedMesh) sk = m.skeleton; }); templates.push(o); return sk;
    }));
    for (let i = 0; i < N; i++) {
      let srcMesh = null; gl[i % 2].scene.traverse(m => { if (m.isSkinnedMesh) srcMesh = m; });
      const s = new THREE.SkinnedMesh(srcMesh.geometry, srcMesh.material);
      s.bindMode = 'detached'; s.bind(tpl[i % 2][i % POOL], srcMesh.bindMatrix); s.castShadow = true; s.frustumCulled = false;
      s.position.set((i % cols - cols / 2) * 1.4 + Math.random() * 0.3, 0, (Math.floor(i / cols) - cols / 2) * 1.6);
      scene.add(s);
    }
    hud.textContent = `bind: 兵士 ${N} 人`; return;
  }
  for (let i = 0; i < N; i++) {
    const src = gl[i % 2], o = THREE.SkeletonUtils.clone(src.scene);
    o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.frustumCulled = false; } });
    o.position.set((i % cols - cols / 2) * 1.4 + Math.random() * 0.3, 0, (Math.floor(i / cols) - cols / 2) * 1.6);
    scene.add(o);
    if (SHARE) { const bones = []; o.traverse(b => { if (b.isBone) bones.push(b); }); copies.push([bones, pools[i % 2][i % POOL]]); continue; }
    const mx = new THREE.AnimationMixer(o), clip = THREE.AnimationClip.findByName(src.animations, ANIM);
    mx.clipAction(clip).play(); mx.update(Math.random() * 2); mixers.push(mx);
  }
  hud.textContent = `兵士 ${N} 人・動き ${ANIM}・動きの一覧: ${gl[0].animations.map(a => a.name).join(', ')}`;
}).catch(e => hud.textContent = 'ERR ' + e);
let last = performance.now(), frames = 0, acc = 0, t = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  for (const m of mixers) m.update(dt);
  for (const o of (window.templates || [])) o.updateMatrixWorld(true);
  for (const [bs, src] of (window.copies || [])) for (let k = 0; k < bs.length; k++) { bs[k].position.copy(src[k].position); bs[k].quaternion.copy(src[k].quaternion); }
  const close = q.get('close');
  cam.position.set(Math.sin(t * 0.1) * (close ? 6 : 30), close ? 2.2 : 14, Math.cos(t * 0.1) * (close ? 6 : 30)); cam.lookAt(0, close ? 1.2 : 0, 0);
  renderer.render(scene, cam);
  frames++; acc += dt; if (acc > 1) { window.__fps = frames / acc; document.title = 'fps ' + __fps.toFixed(0); frames = 0; acc = 0; }
  requestAnimationFrame(loop);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); requestAnimationFrame(loop);
</script>
