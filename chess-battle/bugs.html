<div id="note"><b>虫の版の見本</b>（見くらべ用。アプリにはつないでいません）<br>
手前が白の軍、奥が黒の軍。左から キング＝女王アリ・クイーン＝トンボ・ルーク＝カブトムシ・ビショップ＝ヨコバイ（横に這う）・ナイト＝バッタ（跳ぶ）・ポーン＝働きアリ。ドラッグで見まわせます。<br>
虫の形と歩き方（三脚歩行）はこのアプリで組んだもの（※ 本物の写真ではありません）。地面・草・ぼけは演出です。</div>
