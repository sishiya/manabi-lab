<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="drop-common.js"></script>
<script>
'use strict';
// 台本: ひとしずくの進化（ショート、40秒＋締め）。?short で縦長に録る
// 最初は入口のサムネイルに近い、光る群体の寄り → はじまりの2本毛 → 10分を早送り → 狩る者 → 何時間もたった大きな緑の群体
// 一滴の時計: はじまりの一滴はシード 23（out/drop/。drop-common.js）、節目の一滴はアプリの data/ のもの
const big = W => W.orgs.reduce((a, o) => !a || o.colN > a.colN ? o : a, null);   // いちばん大きな群体の1細胞
const hunter = W => W.orgs.filter(o => o.prey > 0 && o.colN === 1).reduce((a, o) => !a || o.prey + o.bp.n > a.prey + a.bp.n ? o : a, null);
const SC = [
  { a: 0, b: 6, from: 'hunt-big', rate: 1, pick: big, cam: (lt, W, D, o) => dpAt(o, 3.2) },
  { a: 6, b: 13, from: 'promo-anc', rate: 1, pick: W => dpNear(W, 1000, 700), cam: (lt, W, D, o) => dpAt(o, lerp(9, 7, lt / 7)) },
  // 10分を7秒で（はじめはゆっくり、あとで速く）。寄りから一滴全体へ引く
  { a: 13, b: 20, from: 'promo-anc', simT: lt => 600 * (lt / 7) ** 2, cam: lt => ({ x: 1000, y: 700, z: lerp(4, 1.4, ease(Math.min(1, lt / 5))) }) },
  { a: 20, b: 27.5, from: 'promo-anc-10m', rate: 1, pick: hunter, cam: (lt, W, D, o) => dpAt(o, 6) },
  { a: 27.5, b: SHORT_END + IDENT_CLOSE, from: 'green-ball', rate: 2, pick: big, cam: (lt, W, D, o) => dpAt(o, lerp(3.4, 1.6, ease(Math.min(1, lt / 7)))) },
];
const CAPS = [
  { a: 6.3, b: 12.8, main: 'はじまりは、2本の毛をもつ1つの細胞', sub: 'すべての真核生物の祖先にならった',
    en: ['It starts with one cell with two flagella', 'modeled on the ancestor of all eukaryotes'] },
  { a: 13.2, b: 19.8, main: '食べて、分かれて、ときどき変わる', sub: '決まりはそれだけ。10分で形がふえていく',
    en: ['Eat, divide, and sometimes change', 'That\'s all. In 10 minutes, new shapes appear'] },
  { a: 20.2, b: 27.3, main: 'ほかの生き物を食べる「狩る者」も', sub: '形も泳ぎ方も、だれも決めていない',
    en: ['Even "hunters" that eat other creatures', 'Nobody designed their shape or how they swim'] },
  { a: 27.7, b: 35, main: '8時間回すと、百をこえる細胞の群体に', sub: '一滴ごとに、ちがう進化をする',
    en: ['Run it 8 hours: colonies of over a hundred cells', 'Every drop evolves differently'] },
];
promoStart({
  name: 'ひとしずくの進化', out: 'drop-evolution', src: '../../drop-evolution/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 9,
  short: { iw: 1080, ih: 1920 },
  inject: DP_INJECT,
  music: { style: 'journey', root: 98, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: dpReady,
  setup(w) { return null; },
  subs: shortSubs('ひとしずくの進化', 'Evolution in a Drop', '海の水の一滴を、顕微鏡でのぞく', 'A drop of seawater under a microscope', CAPS,
    'ブラウザで動かせます。毎回ちがう進化に', 'Runs in your browser. Different evolution every time'),
  renderAt(t, w) { return dpRender(w, SC, t); },
  drawSource(g, w, OW, OH) { g.drawImage(qs(w, '#view'), 0, 0, OW, OH); },
  overlay(g, t, w) {
    drawPanel(g, 30, 150, 1020, '', [dpStats(w)], fade(t, IDENT_MINI + 0.3, 35, 0.4) * (t > 6 && t < 13 ? 0 : 1));
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, 'ひとしずくの進化', '海の水の一滴を、顕微鏡でのぞく', 'ブラウザで動かせます。毎回ちがう進化に',
      'おもな出どころ: Burki ほか（2020）、Boraas ほか（1998）、Herron ほか（2019）。時間は縮めている');
  },
});
</script>
</body>
</html>
