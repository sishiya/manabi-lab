<script>
'use strict';
// 台本: ブラウン管のドット絵 ― 使い方と見どころ（横長の説明動画、ライオンつき。2026-11-01）
// 日本語の字幕は上に焼きこみ、下は YouTube の字幕（CC。英語）にあける。アプリの画面（液晶｜ブラウン管）を画面いっぱいに、ボタンは「札」でアプリと同じ側に
// アプリの右のパネルの順（絵 → つなぎ方 → しくみ → 画面 → 細かい設定）をなぞる。数はアプリの画面の文（DEVNOTES）と同じ
const END = 148, DUR = END + IDENT_CLOSE;
const MID = [128, 112], HERO = [127, 168];
const wob = u => 0.5 + 0.12 * Math.sin(u / 2.4 * Math.PI * 2) * Math.sin(u / 2.4 * Math.PI);
// 取っ手のドラッグ（15〜27 秒）: 仕切りの位置
const DRAG = [[2.5, 0.5], [4.5, 0.82], [7, 0.2], [9, 0.5]];
const dragSplit = u => { if (u <= DRAG[0][0]) return 0.5; for (let i = 1; i < DRAG.length; i++) if (u <= DRAG[i][0]) { const [t0, a] = DRAG[i - 1], [t1, b] = DRAG[i]; return lerp(a, b, (u - t0) / (t1 - t0)); } return 0.5; };
const SC = [
  { a: 0, b: 15, pic: 'retro', split: u => u < 2.4 ? wob(u) : splitMove(0.5, 0.75, 6, 3)(u) + (u > 10 ? splitMove(0, -0.25, 10, 3.5)(u) : 0) },
  { a: 15, b: 27, pic: 'retro', split: dragSplit },
  // 「光る点」（1ドット＝15 デバイスピクセル、全体の 15/9 倍）→ ホイールでさらに寄る
  { a: 27, b: 42, pic: 'retro', cam: u => u < 1.2 ? { f: MID, m: 1 } : u < 6 ? camTo(HERO, 15 / 9, 0.8, { f: MID, m: 1 })(u - 1.2) : camTo([HERO[0], HERO[1] - 4], 4.5, 1.6, { f: HERO, m: 15 / 9 })(u - 6.6) },
  { a: 42, b: 56, pic: 'falls', ev: [], cam: u => u < 1 ? { f: MID, m: 1 } : camTo([104, 108], 2.6, 2.5)(u - 1) },
  { a: 56, b: 66, pic: 'lion', cam: u => u < 0.8 ? { f: MID, m: 1 } : camTo([110, 104], 3.4, 2.5)(u - 0.8) },
  { a: 66, b: 92, pic: 'patterns', link: 'rgb', cam: camHold([66, 80], 1.9), ev: [[8, { link: 'svideo' }], [14, { link: 'composite' }], [21, { link: 'rf' }]] },
  { a: 92, b: 116, pic: 'retro', link: 'composite', cam: camHold([128, 120], 2.4), ev: [[1, { only: 'scan' }], [7, { only: 'signal' }], [13, { only: 'mask' }], [18.6, { only: null }]] },
  { a: 116, b: 130, pic: 'retro', cam: camHold([HERO[0], HERO[1] - 4], 4.5), ev: [[5.5, { screen: 'slot' }], [10, { screen: 'grille' }]] },
  { a: 130, b: 140, pic: 'patterns', cam: camHold([40, 42], 4.2), ev: [[1.6, { frame: '0' }], [2.6, { frame: '1' }], [3.6, { frame: '0' }], [4.6, { frame: '1' }], [5.6, { frame: '0' }], [6.6, { frame: 'avg' }]] },
  { a: 140, b: DUR, pic: 'retro', split: splitMove(0.5, 0.62, 1, 6) },
];

// ---- ボタンの札（アプリと同じ言葉・同じ側。絵とつなぎ方などは右のパネル、光る点は画面の右下＝ライオンの場所なので少し左に）----
const CH = {
  zoom: { x: 900, y: 820, title: '画面の右下', btns: ['光る点', '＋', '−', '全体'] },
  pic: { x: 1240, y: 240, title: '絵（右のパネル）', btns: ['8ビットの冒険', '滝のある風景', 'ししの顔', 'しま模様とチェック'], cols: 2 },
  link: { x: 1240, y: 240, title: 'つなぎ方（右のパネル）', btns: ['RGB', 'S端子', 'ビデオ端子', 'アンテナ線'], cols: 2 },
  mech: { x: 1240, y: 240, title: 'しくみを1つずつ', btns: ['走査線 … だけ', '信号のにじみ … だけ', '赤緑青の光る点 … だけ', '全部入れる'], cols: 1 },
  scr: { x: 1240, y: 240, title: '画面（右のパネル）', btns: ['丸い点（シャドウマスク）', '細長い穴（スロットマスク）', 'たてじま（アパーチャーグリル）'], cols: 1 },
  frame: { x: 1240, y: 240, title: '細かい設定 › ドットクロール', btns: ['目に見える平均', '1コマ目', '2コマ目'], cols: 1 },
  file: { x: 1240, y: 240, title: '絵（右のパネル）', btns: ['自分の画像…'], cols: 1 },
};
const frameOn = t => { const u = t - 130; return u < 1.6 ? 0 : u < 6.6 ? (Math.floor(u - 1.6) % 2 ? 2 : 1) : 0; };
const SHOW = [
  ['zoom', 27.4, 41.5, t => t < 28.2 ? -1 : 0],
  ['pic', 42, 66, t => t < 43 ? 0 : t < 56 ? 1 : 2],
  ['pic', 66, 67.5, () => 3],
  ['link', 67.5, 91.7, t => t < 74 ? 0 : t < 80 ? 1 : t < 87 ? 2 : 3],
  ['mech', 92.3, 115.6, t => t < 93 ? -1 : t < 99 ? 0 : t < 105 ? 1 : t < 110.6 ? 2 : 3],
  ['scr', 116.2, 129.8, t => t < 121.5 ? 0 : t < 126 ? 1 : 2],
  ['frame', 130.2, 139.7, frameOn],
  ['file', 140.4, 147, () => -1],
];
const B = (k, i) => btnRect(CH[k], i);
// 取っ手の位置（画面の座標）
const HX = s => s * PW, HY = 540;
const CUR = [
  { t: 15.3, x: 700, y: 700 },
  { t: 17.4, x: HX(0.5), y: HY }, { t: 17.5, x: HX(0.5), y: HY, drag: true }, { t: 19.5, x: HX(0.82), y: HY, drag: true }, { t: 22, x: HX(0.2), y: HY, drag: true }, { t: 24, x: HX(0.5), y: HY },
  { t: 26.5, x: 900, y: 700 },
  { t: 27.8, ...B('zoom', 0) }, { t: 28.2, ...B('zoom', 0), click: true },
  { t: 32.6, x: 1000, y: 560 }, { t: 33.4, x: 1000, y: 560, wheel: true }, { t: 35.2, x: 1000, y: 560 },
  { t: 37, x: 1000, y: 560, hide: true },
  { t: 42.4, ...B('pic', 1) }, { t: 43, ...B('pic', 1), click: true },
  { t: 55.4, ...B('pic', 2) }, { t: 56, ...B('pic', 2), click: true },
  { t: 65.4, ...B('pic', 3) }, { t: 66, ...B('pic', 3), click: true },
  { t: 73.4, ...B('link', 1) }, { t: 74, ...B('link', 1), click: true },
  { t: 79.4, ...B('link', 2) }, { t: 80, ...B('link', 2), click: true },
  { t: 86.4, ...B('link', 3) }, { t: 87, ...B('link', 3), click: true },
  { t: 92.5, ...B('mech', 0) }, { t: 93, ...B('mech', 0), click: true },
  { t: 98.4, ...B('mech', 1) }, { t: 99, ...B('mech', 1), click: true },
  { t: 104.4, ...B('mech', 2) }, { t: 105, ...B('mech', 2), click: true },
  { t: 110, ...B('mech', 3) }, { t: 110.6, ...B('mech', 3), click: true },
  { t: 116.3, ...B('scr', 0) },
  { t: 121, ...B('scr', 1) }, { t: 121.5, ...B('scr', 1), click: true },
  { t: 125.4, ...B('scr', 2) }, { t: 126, ...B('scr', 2), click: true },
  { t: 131, ...B('frame', 1) }, { t: 131.6, ...B('frame', 1), click: true }, { t: 132.2, ...B('frame', 2) }, { t: 132.6, ...B('frame', 2), click: true },
  { t: 133.2, ...B('frame', 1) }, { t: 133.6, ...B('frame', 1), click: true }, { t: 134.2, ...B('frame', 2) }, { t: 134.6, ...B('frame', 2), click: true },
  { t: 135.2, ...B('frame', 1) }, { t: 135.6, ...B('frame', 1), click: true }, { t: 136.2, ...B('frame', 0) }, { t: 136.6, ...B('frame', 0), click: true },
  { t: 139, x: 1000, y: 700, hide: true },
  { t: 141, ...B('file', 0) },
  { t: 146, ...B('file', 0), hide: true },
];

// ---- 字幕（日本語は上に焼きこむ・英語は SRT）----
const CAPS = [
  { a: 6.5, b: 14.5, main: '同じドット絵を、液晶とブラウン管で見くらべる', sub: '昔のゲームの絵は、ブラウン管のテレビで見られる前提で描かれていた',
    en: ['Compare the same pixel art on an LCD and a CRT', 'Pixel art in old games was drawn to be seen on CRT TVs'] },
  { a: 15.4, b: 21.4, main: 'まんなかの取っ手をドラッグして、仕切りを動かす', sub: '左は液晶（ドットそのまま）、右がブラウン管',
    en: ['Drag the handle in the middle to move the divider', 'Left is the LCD (pixels as they are), right is the CRT'] },
  { a: 21.8, b: 26.8, main: '右は、信号・走査線・光る点をしくみごとに計算', sub: '暗めに見えるのは光る点のすきまのため（白は液晶の約45%の光）',
    en: ['On the right, the signal, scan lines and dots are each calculated', 'It looks darker because of the gaps between dots (white is about 45% of the LCD\'s light)'] },
  { a: 28.4, b: 34.6, main: '「光る点」で寄る：赤・緑・青の小さな点の集まり', sub: '大きさは 14型くらいのテレビを想定した推定',
    en: ['"Dots" zooms in: tiny red, green and blue dots', 'Their size is an estimate for a TV of about 14 inches'] },
  { a: 35, b: 41.6, main: '1行ずつの走査線。明るい行ほど帯が太る', sub: 'ホイールやピンチで寄る・ドラッグで動かす（太り方は推定）',
    en: ['Scan lines, one per row; brighter rows get thicker', 'Scroll or pinch to zoom, drag to move (how much they widen is estimated)'] },
  { a: 43.3, b: 49.3, main: '絵は4枚。どれもこのアプリで描いたもの', sub: '滝の両はしは、水と岩のチェック模様',
    en: ['Four pictures, all drawn for this app', 'Both edges of the waterfall are a checkerboard of water and rock'] },
  { a: 49.7, b: 55.6, main: '液晶ではチェックのまま。ブラウン管ではまざって、半透明のしぶきに', sub: '当時の絵は、この「まざる」を使って描かれていた',
    en: ['On the LCD it stays a checkerboard; on the CRT it blends into see-through spray', 'Artists of the time used this blending in their pictures'] },
  { a: 56.4, b: 65.6, main: '目の白い1ドット・ふちの中間の色・ディザの影', sub: 'ブラウン管では、ドットのあいだがやわらかくつながる',
    en: ['The single white pixel in the eye, in-between edge colors, dithered shading', 'On the CRT the pixels join together softly'] },
  { a: 67.6, b: 73.6, main: 'つなぎ方は4つ。RGB は赤・緑・青を別々の線で', sub: '信号のにじみはない（モニターや一部のテレビ）',
    en: ['Four connections; RGB sends red, green and blue on separate wires', 'No signal blur (monitors and some TVs)'] },
  { a: 74.3, b: 79.6, main: 'S端子：明るさと色を別の線で', sub: '色だけ横ににじみ、明るさはくっきり（帯域 4.2MHz）',
    en: ['S-Video: brightness and color on separate wires', 'Only the color blurs sideways; brightness stays sharp (4.2 MHz)'] },
  { a: 80.3, b: 86.6, main: 'ビデオ端子：明るさと色を1本の線にまぜる', sub: 'こまかい模様が色とまちがえられ、白黒のしまに色がつく',
    en: ['Composite: brightness and color mixed on one wire', 'Fine patterns are mistaken for color, so black-and-white stripes turn colored'] },
  { a: 87.3, b: 91.7, main: 'アンテナ線：さらににじみ、雪のようなノイズ', sub: 'ノイズは演出に近い',
    en: ['RF (antenna): even blurrier, with snow-like noise', 'The noise is closer to a visual effect'] },
  { a: 93.3, b: 98.7, main: 'しくみを1つずつ：「だけ」で、そのしくみだけを入れる', sub: '走査線だけ：1行ずつの光の帯と、そのあいだの暗いすきま',
    en: ['One effect at a time: "Only" turns on just that one', 'Scan lines only: bands of light, one per row, with dark gaps'] },
  { a: 99.3, b: 104.7, main: '信号のにじみだけ', sub: 'ビデオ端子だと、細い文字や輪郭の色が横ににじむ',
    en: ['Signal blur only', 'Over composite, thin letters and outlines smear sideways in color'] },
  { a: 105.3, b: 110.3, main: '赤緑青の光る点だけ', sub: '効き目の大きい順に並んでいる',
    en: ['Red, green and blue dots only', 'The effects are listed biggest first'] },
  { a: 110.9, b: 115.7, main: '全部入れると、いまの見え方', sub: '推定のところには、画面に「推定」と書いてある',
    en: ['All on: the full CRT look', 'Estimated parts are marked "estimate" on screen'] },
  { a: 116.5, b: 121.3, main: '画面の光る点のならびは3種類：丸い点', sub: 'シャドウマスク。家庭のテレビには3つともあった',
    en: ['Three dot layouts: round dots', 'The shadow mask; home TVs used all three'] },
  { a: 121.8, b: 125.7, main: '細長い穴（スロットマスク）', sub: '',
    en: ['Slots (slot mask)', ''] },
  { a: 126.3, b: 129.8, main: 'たてじま（アパーチャーグリル）', sub: '細かさは3つとも、14型くらいを想定した推定',
    en: ['Stripes (aperture grille)', 'All three use the same estimated fineness for about 14 inches'] },
  { a: 130.6, b: 135.6, main: '細かい設定：ドットクロール', sub: '色の波は1コマごとにずれ、模様のふちの点が 60分の1秒ごとに入れかわる',
    en: ['More settings: dot crawl', 'The color wave shifts each frame, so dots at pattern edges swap every 1/60 second'] },
  { a: 136, b: 139.7, main: 'ふだんは、目に見える2コマの平均', sub: '',
    en: ['Normally it shows the two-frame average your eye sees', ''] },
  { a: 140.6, b: 147.3, main: '自分の画像も試せる（この端末の中だけで計算）', sub: '拡大したスクリーンショットは、元のドットに戻して計算',
    en: ['Try your own image too (processed only on your device)', 'Enlarged screenshots are shrunk back to their original pixels'] },
];

const MUSIC = { style: 'journey', root: 131, stopAt: END, cues: [{ t: END, type: 'jingle' }] };
const EXP = [[0, 'calm'], [6.8, 'smile'], [10.5, 'calm'], [15.6, 'smile'], [19, 'calm'], [22, 'think'], [26, 'calm'], [28.6, 'wow'], [32, 'calm'], [35.2, 'smile'], [39, 'calm'],
  [43.5, 'smile'], [47, 'calm'], [50, 'wow'], [54, 'calm'], [56.6, 'smile'], [61, 'calm'], [67.8, 'calm'], [74.5, 'smile'], [78, 'calm'], [80.5, 'shock'], [84, 'calm'], [87.5, 'wow'], [90.5, 'calm'],
  [93.5, 'think'], [97, 'calm'], [99.5, 'smile'], [103, 'calm'], [105.5, 'think'], [109, 'calm'], [111, 'proud'], [115, 'calm'], [116.7, 'smile'], [120, 'calm'], [126.5, 'wow'], [129, 'calm'],
  [130.8, 'think'], [134, 'calm'], [136.2, 'smile'], [139, 'calm'], [140.8, 'smile'], [END - 7.6, 'smile']];
MUSIC.cues.push(...lionSetup({ caps: CAPS, cur: CUR, exp: EXP, end: END, bye: END - 5.8 }));
promoStart({
  name: 'ブラウン管のドット絵（使い方）', out: 'crt-pixels-guide', src: '../../crt-pixels/index.html', iw: 1920, ih: 1080, dur: DUR, peek: 82,
  inject: CR_INJECT,
  music: MUSIC,
  ready: w => !!LION.api && crReady(w),
  setup(w) { return w.document.getElementById('cv'); },
  subs: () => guideSubs(END, 'ブラウン管のドット絵', 'Pixel Art on a CRT', CAPS),
  renderAt(t, w) { crRender(w, SC, t); },
  overlay(g, t, w) {
    crDivider(g, w, SC, t, 250, t < END ? 1 : 0);
    for (const [k, a, b, on] of SHOW) drawChip(g, CH[k], on(t), fade(t, a, b, 0.4));
    drawCursor(g, CUR, t);
    // しま模様の場面は字幕の後ろが細かい模様で読みにくいので、上に暗い帯を敷く
    const band = Math.max(fade(t, 66, 92, 0.5), fade(t, 130, 140, 0.5));
    if (band > 0) { g.shadowBlur = 0; g.fillStyle = `rgba(0,0,0,${0.6 * band})`; g.fillRect(0, 0, PW, 205); }
    drawCaps(g, t, CAPS, true);
    drawGuideChrome(g, t, END, 'ブラウン管のドット絵',
      'おもな出どころ: T. Lottes「crt-lottes」（パブリックドメイン）、Wikipedia「NTSC」「YIQ」、ITU-R BT.1886（2011）、NESdev Wiki「NTSC video」「Overscan」。絵はすべて自作。光る点の大きさ・にじみの強さ・帯域の一部は推定');
    drawLion(g, t);
  },
  errors: w => (w.__crpiErr || []).map(String),
});
lionOpen();
</script>
</body>
</html>
