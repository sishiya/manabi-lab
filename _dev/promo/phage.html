<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="phage-common.js"></script>
<script>
'use strict';
// 台本: 細菌にとりつくウイルス（ショート、40秒＋締め）。?short で縦長に録る
// 人のからだ → たくさんの大腸菌 → くっついて DNA を入れる → 細菌の中で組み立て → 破れて出る → となりの細菌へ。カメラはアプリのおまかせ
const V = new URLSearchParams(location.search).has('short');
const VIEW = V ? [0, 0, 1080, 1920] : [0, 0, 1920, 1080];
const KEYS = [[0, 0], [5.5, 0.0429], [8, 0.0714], [12, 0.1557], [17, 0.2286], [18.5, 0.27],
  [18.5, 0.4989], [25, 0.6041], [25, 0.7268], [26.5, 0.80], [30, 0.857], [36, 0.95], [40, 0.99]];
const CAPS = [
  { a: 6, b: 12, main: 'T4 ファージは、細菌だけにとりつくウイルス', sub: '大きさ約0.2µm。泳げず、ただよって大腸菌にぶつかる',
    en: ['The T4 phage is a virus that infects only bacteria', 'About 0.2 µm long. It cannot swim; it drifts until it bumps into E. coli'] },
  { a: 12.3, b: 18.3, main: '脚でつかまり、注射器のように DNA を入れる', sub: 'しっぽのさやが縮み、針が外膜を破る',
    en: ['It grabs on with its legs and injects its DNA like a syringe', 'The tail sheath contracts and a needle pierces the outer membrane'] },
  { a: 18.8, b: 25.8, main: '細菌の工場を乗っとって、自分の部品を作らせる', sub: '頭に DNA をつめ、しっぽと脚が付く',
    en: ['It hijacks the bacterium\'s factories to make its own parts', 'DNA is packed into heads, then tails and legs attach'] },
  { a: 26.1, b: 30.3, main: '約25分で破れて、100〜150個が外へ', sub: '細菌は死に、膜はかけらになる',
    en: ['In about 25 minutes the cell bursts, releasing 100–150', 'The bacterium dies and its membranes break into pieces'] },
  { a: 30.6, b: 35, main: 'となりの細菌へ。くり返すたびに何十〜百倍', sub: 'ファージは人にはうつらない',
    en: ['On to the next bacteria. Each round multiplies them tens to a hundred times', 'Phages do not infect people'] },
];
promoStart({
  name: '細菌にとりつくウイルス', out: 'phage', src: '../../phage/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 20,
  inject: { dpr: 2, raf: true },
  music: { style: 'journey', root: 110, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: w => w.__ph && w.__ph.Story && w.document.getElementById('nowCard'),
  setup(w) { phSize(w, VIEW[2], VIEW[3]); return null; },
  subs: shortSubs('細菌にとりつくウイルス', 'The Virus That Infects Bacteria', '人のおなかから、分子の大きさまで寄っていく', 'Zoom from the human body down to molecules', CAPS,
    'ブラウザで動かせます。時間のスライダーで、どこでも寄れます', 'Runs in your browser. Scrub through time and zoom in anywhere'),
  renderAt(t, w) { phRender(w, KEYS, [], t); },
  drawSource(g, w) { phDraw(g, w, VIEW[0] * RES, VIEW[1] * RES, VIEW[2] * RES, VIEW[3] * RES); },
  overlay(g, t, w) {
    const n = phNow(w);
    drawPanel(g, 30, V ? 300 : 30, V ? 700 : 760, '', [n.title, n.label], fade(t, IDENT_MINI + 0.3, 35, 0.4));
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, '細菌にとりつくウイルス', '人のおなかから、分子の大きさまで寄っていく', 'ブラウザで動かせます。時間のスライダーで、どこでも寄れます',
      'おもな出どころ: Miller ほか（2003）、Yap と Rossmann（2014）、Taylor ほか（2016）ほか。模式図です');
  },
  errors: w => (w.__phErr || []).map(String),
});
</script>
</body>
</html>
