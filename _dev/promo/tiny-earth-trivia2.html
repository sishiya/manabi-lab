<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく tiny-earth-2（型H 当ててみて）「小さい地球では、あなたがエベレストより高い」。台本は trivia/tiny-earth.md。?short で録る
// f = 1/6371（半径 6371km → 1km）。エベレスト 8848.86m → 1.389m、海の平均の深さ 3682m → 0.578m。木 30m・人 1.70m は縮まない
const DUR = 24;
const F = 1 / 6371;
const subs = [
  { a: 0.0, b: 3.0, ja: '地球を、そのまま[半径1km]に縮めました', en: 'We shrank Earth, as is, to a 1 km radius', noBurn: true },
  { a: 3.0, b: 7.0, ja: 'この星でいちばん高いのは？\nA エベレスト　B 木　C あなた', en: 'What is the tallest thing on this planet?\nA: Everest  B: a tree  C: you' },
  { a: 7.0, b: 12.0, ja: '山も海も、星といっしょに縮む\nエベレストは[1m39cm]。海の深さは平均[58cm]', en: 'Mountains and seas shrink with it.\nEverest is 1.39 m. The ocean averages 58 cm deep' },
  { a: 12.0, b: 18.0, ja: 'でも、生きものは縮まない\n木は30mのまま。[エベレストの20倍]', en: 'But living things don’t shrink.\nA tree stays 30 m: 20 times Everest' },
  { a: 18.0, b: 22.0, ja: 'そして、あなたも。\n[エベレストより、あなたが高い]', en: 'And so do you.\nYou are taller than Everest' },
  { a: 22.0, b: 24.0, ja: '答えは [B]。2位は、あなた', en: 'The answer is B. Second place: you' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.0, type: 'tick' }, { t: 5.0, type: 'tick' }, { t: 6.0, type: 'tick' },
  { t: 7.0, type: 'rise' }, { t: 9.0, type: 'pop' }, { t: 10.6, type: 'pop' }, { t: 12.0, type: 'whoosh' }, { t: 14.2, type: 'ding' },
  { t: 18.0, type: 'whoosh' }, { t: 19.6, type: 'pop' }, { t: 22.0, type: 'ding' },
];

// ---- 版画の道具（このページだけ。PL.* を組み合わせる）----
const TAU = Math.PI * 2;
// ローカル座標（右向き・足もとが y=0）から画面へ写す。dir=-1 で左向き
function mapper(x0, y0, s, rot = 0, dir = 1) { const c = Math.cos(rot), n = Math.sin(rot); return (x, y) => { x *= dir; return [x0 + s * (x * c - y * n), y0 + s * (x * n + y * c)]; }; }
// ローカル座標で道を作る。b(P) の P: M・L・Q・Z と E（楕円）
const lp = (m, b) => g => {
  const P = { M: (x, y) => g.moveTo(...m(x, y)), L: (x, y) => g.lineTo(...m(x, y)), Q: (a, c, x, y) => g.quadraticCurveTo(...m(a, c), ...m(x, y)), Z: () => g.closePath(),
    E: (cx, cy, rx, ry, rot = 0) => { for (let i = 0; i <= 40; i++) { const t = i / 40 * TAU, x = Math.cos(t) * rx, y = Math.sin(t) * ry, p = m(cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)); i ? g.lineTo(...p) : g.moveTo(...p); } g.closePath(); } };
  b(P);
};
// 手彩色＋かげの斜線＋墨の輪郭。o.lit: 光の当たる所（斜線を抜く）
function solid(g, path, color, o = {}) {
  PL.tint(g, path, color, o.a ?? 0.65);
  if (o.hatch !== false) PL.hatch(g, path, { angle: o.angle ?? 0.7, gap: o.gap ?? 9, w: o.hw ?? 1.8, not: o.lit, cx: o.cx, cy: o.cy });
  PL.ink(g, path, o.w ?? 5, o.ink || PL.INK);
}
// 墨の矢印（頭は手彩色＋輪郭）
function arrowPL(g, x0, y0, x1, y1, color = PL.INK, w = 8) {
  const a = Math.atan2(y1 - y0, x1 - x0), h = w * 3.4;
  PL.ink(g, gg => { gg.moveTo(x0, y0); gg.lineTo(x1 - Math.cos(a) * h * 0.7, y1 - Math.sin(a) * h * 0.7); }, w, color);
  const head = PL.poly([[x1, y1], [x1 - Math.cos(a - 0.42) * h, y1 - Math.sin(a - 0.42) * h], [x1 - Math.cos(a + 0.42) * h, y1 - Math.sin(a + 0.42) * h]]);
  PL.tint(g, head, color, 1); PL.ink(g, head, Math.max(2, w * 0.45), color);
}
// 答えの札: 手彩色の札（筆のルックでは字の下が濃くなり字と重なる）をやめ、紙の札に朱の二重わくで示す
function answerChoices(g, t, a, b, opts, o) {
  const card = TK.card; TK.card = (gg, x, y, w, h) => card(gg, x, y, w, h, {});
  try { TK.choices(g, t, a, b, opts, o); } finally { TK.card = card; }
  if (t < (o.reveal ?? Infinity) || t < a || t > b) return;
  const y = (o.y ?? PH * 0.34) + o.answer * ((o.h || 190) + (o.gap ?? 40)), h = o.h || 190, f = clamp((t - o.reveal) / 0.35, 0, 1) * fade(t, a, b, 0.3);
  g.save(); g.globalAlpha *= f; PL.ink(g, PL.rect(78, y - 12, PW - 156, h + 24), 6, PL.RED); PL.ink(g, PL.rect(90, y, PW - 180, h), 3, PL.RED); g.restore();
}

function planet(g, cx, cy, r, f = 1) {   // tiny-earth-trivia1.html と同じ（筆のルックでは LOOK.planet＝本物の地形）
  if (window.LOOK && LOOK.planet) return LOOK.planet(g, cx, cy, r, f);
  g.save(); g.globalAlpha *= f;
  const land = [[-0.3, -0.2, 0.32, 0.22, -0.3], [0.35, 0.25, 0.25, 0.17, 0.35], [0.1, -0.55, 0.18, 0.12, 0.1]];
  PL.sphere(g, cx, cy, r, PL.T.sea, { inside: gg => { const p = gg2 => land.forEach(([dx, dy, rx, ry, rot]) => PL.ellipse(cx + dx * r, cy + dy * r, rx * r, ry * r, rot)(gg2)); PL.tint(gg, p, PL.T.land, 0.8); PL.ink(gg, p, Math.max(3, r / 60)); } });
  g.restore();
}
function person(g, x, y, h) { PL.walker(g, x, y, 0, 0, h / 258); }   // 足もと x,y、背の高さ h（px）
function tree(g, x, y, h) { PL.tree(g, x, y, 0, h); }
function mountain(g, x, y, h, wf = 1.3) {   // 底の幅（形はかざり）。岩の斜線・雪・尾根の線
  const body = PL.poly([[x - h * wf, y], [x - h * 0.08, y - h], [x + h * 0.05, y - h * 0.96], [x + h * wf, y]]);
  PL.tint(g, body, PL.T.gray, 0.75);
  PL.hatch(g, body, { angle: 1.0, gap: Math.max(5, h / 18), w: Math.max(1.2, h / 160), not: PL.poly([[x - h * wf - 20, y], [x - h * 0.08, y - h - 10], [x - h * 0.02, y]]), cx: x, cy: y });
  const snow = PL.poly([[x - h * 0.08 - h * wf * 0.22, y - h * 0.78], [x - h * 0.08, y - h], [x + h * 0.05, y - h * 0.96], [x + h * wf * 0.26, y - h * 0.74], [x + h * 0.05, y - h * 0.8], [x - h * 0.05, y - h * 0.72]]);
  PL.tint(g, snow, '#f4efe2', 1);
  PL.ink(g, gg => { gg.moveTo(x - h * 0.08, y - h); gg.quadraticCurveTo(x - h * 0.02, y - h * 0.75, x + h * 0.08, y - h * 0.55); }, Math.max(1.5, h / 120));   // 尾根
  PL.ink(g, body, Math.max(2.5, h / 90)); PL.ink(g, snow, Math.max(1.5, h / 160));
}
function ground(g, y) {
  const s = PL.rect(0, y, PW, 60); PL.tint(g, s, PL.T.land, 0.55);
  PL.ink(g, gg => { for (let x = 20; x < PW; x += 36) { gg.moveTo(x, y + 6); gg.lineTo(x - 12, y + 24); } }, 1.6);
  PL.ink(g, gg => { gg.moveTo(0, y); gg.lineTo(PW, y); }, 4);
}
function scaleBar(g, x, y, px, label) {
  PL.ink(g, gg => { gg.moveTo(x, y); gg.lineTo(x + px, y); gg.moveTo(x, y - 12); gg.lineTo(x, y + 12); gg.moveTo(x + px, y - 12); gg.lineTo(x + px, y + 12); for (let k = 1; k < 10; k++) { gg.moveTo(x + px * k / 10, y); gg.lineTo(x + px * k / 10, y - 7); } }, 3.5);
  TK.text(g, label, x + px / 2, y + 40, 36, { color: TK.C.sub, bold: false });
}

function draw(g, t) {
  // 0〜3: フック（小さな星と、その上の山・木・人。大きさは見やすく変えている）
  if (t < 3.0) {
    planet(g, 540, 760, 260);
    tree(g, 540 - 70, 760 - 252, 110); mountain(g, 540 + 90, 760 - 247, 40); person(g, 540 + 10, 760 - 259, 60);
    TK.hook(g, t, 0.0, 3.0, '[いちばん高い]のは？', { y: 300, size: 110 });
    g.save(); g.globalAlpha = fade(t, 0.3, 3.0, 0.3); TK.text(g, '半径1kmの地球', PW / 2, 1090, 54, { color: TK.C.sub }); g.restore();
  }
  // 3〜7: 3択
  TK.choices(g, t, 3.0, 7.0, ['エベレスト', '高さ30mの木', 'あなた（170cm）'], { y: 480, h: 170, think: [4.0, 7.0] });
  // 7〜12: 縮む
  if (t >= 7.0 && t < 12.0) {
    const f = fade(t, 7.0, 12.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, 'いっしょに縮む（6371分の1）', PW / 2, 240, 60, { color: TK.C.sub });
    const k1 = TK.out((t - 7.6) / 1.3), k2 = TK.out((t - 9.4) / 1.3);
    TK.text(g, 'エベレスト', 470, 400, 54, { color: TK.C.sub });
    TK.text(g, k1 > 0 ? (k1 < 1 ? Math.round(lerp(8849, 1.389, k1)).toLocaleString('ja-JP') + ' m' : '[1.39 m]') : '8,849 m', 470, 500, 110);
    if (t > 9.0) {
      TK.text(g, '海の平均の深さ', 470, 700, 54, { color: TK.C.sub });
      TK.text(g, k2 > 0 ? (k2 < 1 ? Math.round(lerp(3682, 0.578, k2)).toLocaleString('ja-JP') + ' m' : '[58 cm]') : '3,682 m', 470, 800, 110);
    }
    // 大人（170cm）とくらべる目盛り
    const gy = 1150, M = 300 / 1.7, px = 950;
    PL.ink(g, gg => { gg.moveTo(820, gy); gg.lineTo(1040, gy); }, 4);
    person(g, px, gy, 1.7 * M);
    if (t > 10.8) {
      g.save(); g.setLineDash([10, 8]);
      PL.ink(g, gg => { gg.moveTo(870, gy - 1.389 * M); gg.lineTo(1040, gy - 1.389 * M); gg.moveTo(870, gy - 0.578 * M); gg.lineTo(1040, gy - 0.578 * M); }, 3.5, PL.RED);
      g.restore();
      PL.label(g, '1.39m', 855, gy - 1.389 * M, 34, { align: 'right', color: PL.RED });
      PL.label(g, '58cm', 855, gy - 0.578 * M, 34, { align: 'right', color: PL.RED });
      TK.text(g, '大人の胸くらい／ひざ〜ももくらい', 110, 1000, 40, { align: 'left', color: TK.C.sub, bold: false, maxw: 640 });
    }
    g.restore();
  }
  // 12〜18: 木は30mのまま（1m = 25px）
  if (t >= 12.0 && t < 18.0) {
    const f = fade(t, 12.0, 18.0, 0.3), M = 25, gy = 1040;
    g.save(); g.globalAlpha = f;
    ground(g, gy);
    tree(g, 330, gy, 30 * M);
    mountain(g, 700, gy, 8848.86 * F * M);
    person(g, 860, gy, 1.70 * M);
    TK.text(g, '木 30m', 330, 245, 56);
    TK.text(g, 'エベレスト', 700, 960, 40, { color: TK.C.sub });
    TK.text(g, 'あなた', 870, 960, 40, { color: TK.C.sub });
    if (t > 14.2) TK.text(g, 'エベレストの [20倍]', 720, 500, 64);
    scaleBar(g, 600, 700, 10 * M, '10m');
    g.restore();
  }
  // 18〜22: 人とエベレスト（1m = 400px）
  if (t >= 18.0 && t < 22.0) {
    const f = fade(t, 18.0, 22.0, 0.3), M = 400, gy = 1040, he = 8848.86 * F * M, hp = 1.70 * M;
    g.save(); g.globalAlpha = f;
    ground(g, gy);
    mountain(g, 400, gy, he, 0.55);
    person(g, 850, gy, hp);
    g.save(); g.setLineDash([12, 10]); PL.ink(g, gg => { gg.moveTo(100, gy - he); gg.lineTo(980, gy - he); }, 3.5, PL.RED); g.restore();
    TK.text(g, 'エベレスト 1.39m', 400, gy - he - 50, 50, { color: TK.C.sub });
    TK.text(g, 'あなた 1.70m', 850, gy - hp - 50, 50, { color: PL.RED });
    g.restore();
  }
  // 22〜24: 答え
  answerChoices(g, t, 22.0, 24.0, ['エベレスト（1.39m）', '高さ30mの木', 'あなた（2位）'], { y: 480, h: 170, reveal: 22.3, answer: 1 });
  if (t >= 7.0 && t < 22.0) TK.note(g, t, 7.0, 22.0, '地形も星と同じ割合で縮むとした計算（人と木は実物の大きさ）', { size: 30 });
  if (t >= 22.0) TK.note(g, t, 22.0, 24.0, '出どころ: エベレスト 8,848.86m（2020 ネパール・中国の共同発表）\n海の平均の深さ 3,682m（NOAA）・NASA Earth Fact Sheet', { size: 28, y: 1120 });
}

triviaStart({ out: 'tiny-earth-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
