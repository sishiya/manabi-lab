<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく tiny-earth-2（型H 当ててみて）「小さい地球では、あなたがエベレストより高い」。台本は trivia/tiny-earth.md。?short で録る
// f = 1/6371（半径 6371km → 1km）。エベレスト 8848.86m → 1.389m、海の平均の深さ 3682m → 0.578m。木 30m・人 1.70m は縮まない
const DUR = 24;
const F = 1 / 6371;
const subs = [
  { a: 0.0, b: 3.0, ja: '地球を、そのまま[半径1km]に縮めました', en: 'We shrank Earth, as is, to a 1 km radius', noBurn: true },
  { a: 3.0, b: 7.0, ja: 'この星でいちばん高いのは？\nA エベレスト　B 木　C あなた', en: 'What is the tallest thing on this planet?\nA: Everest  B: a tree  C: you' },
  { a: 7.0, b: 12.0, ja: '山も海も、星といっしょに縮む\nエベレストは[1m39cm]。海の深さは平均[58cm]', en: 'Mountains and seas shrink with it.\nEverest is 1.39 m. The ocean averages 58 cm deep' },
  { a: 12.0, b: 18.0, ja: 'でも、生きものは縮まない\n木は30mのまま。[エベレストの20倍]', en: 'But living things don’t shrink.\nA tree stays 30 m: 20 times Everest' },
  { a: 18.0, b: 22.0, ja: 'そして、あなたも。\n[エベレストより、あなたが高い]', en: 'And so do you.\nYou are taller than Everest' },
  { a: 22.0, b: 24.0, ja: '答えは [B]。2位は、あなた', en: 'The answer is B. Second place: you' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.0, type: 'tick' }, { t: 5.0, type: 'tick' }, { t: 6.0, type: 'tick' },
  { t: 7.0, type: 'rise' }, { t: 9.0, type: 'pop' }, { t: 10.6, type: 'pop' }, { t: 12.0, type: 'whoosh' }, { t: 14.2, type: 'ding' },
  { t: 18.0, type: 'whoosh' }, { t: 19.6, type: 'pop' }, { t: 22.0, type: 'ding' },
];

function planet(g, cx, cy, r) {
  const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  gr.addColorStop(0, '#5fa8ff'); gr.addColorStop(1, '#1d4fa3');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(89,227,154,0.75)';
  [[-0.3, -0.2, 0.32], [0.35, 0.25, 0.25], [0.1, -0.55, 0.18]].forEach(([dx, dy, rr]) => { g.beginPath(); g.ellipse(cx + dx * r, cy + dy * r, rr * r, rr * r * 0.7, dx, 0, Math.PI * 2); g.fill(); });
}
function person(g, x, y, h, color = '#fff') {   // 足もと x,y、背の高さ h（px）
  const s = h / 120;
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = color; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -52); g.lineTo(-16, 0); g.moveTo(0, -52); g.lineTo(16, 0); g.moveTo(0, -52); g.lineTo(0, -96);
  g.moveTo(0, -86); g.lineTo(-20, -58); g.moveTo(0, -86); g.lineTo(20, -58); g.stroke();
  g.fillStyle = color; g.beginPath(); g.arc(0, -108, 13, 0, Math.PI * 2); g.fill();
  g.restore();
}
function tree(g, x, y, h) {
  g.save();
  g.fillStyle = '#8a5a3a'; g.fillRect(x - h * 0.025, y - h * 0.45, h * 0.05, h * 0.45);
  g.fillStyle = '#3fbf7a';
  for (let i = 0; i < 4; i++) { const yy = y - h * (0.3 + i * 0.15), w = h * (0.22 - i * 0.04); g.beginPath(); g.moveTo(x - w, yy); g.lineTo(x + w, yy); g.lineTo(x, yy - h * 0.25); g.fill(); }
  g.restore();
}
function mountain(g, x, y, h) {   // 底の幅は高さの 2.6 倍（形はかざり）
  g.save();
  g.fillStyle = '#7c86a3'; g.beginPath(); g.moveTo(x - h * 1.3, y); g.lineTo(x, y - h); g.lineTo(x + h * 1.3, y); g.fill();
  g.fillStyle = '#eef3ff'; g.beginPath(); g.moveTo(x - h * 0.33, y - h * 0.75); g.lineTo(x, y - h); g.lineTo(x + h * 0.33, y - h * 0.75); g.lineTo(x + h * 0.1, y - h * 0.68); g.lineTo(x - h * 0.08, y - h * 0.78); g.fill();
  g.restore();
}
function ground(g, y) {
  g.fillStyle = '#0a1530'; g.fillRect(0, y, PW, 1100 - y);
  g.strokeStyle = 'rgba(160,190,255,0.6)'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, y); g.lineTo(PW, y); g.stroke();
}
function scaleBar(g, x, y, px, label) {
  g.save(); g.strokeStyle = TK.C.sub; g.lineWidth = 4;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + px, y); g.moveTo(x, y - 12); g.lineTo(x, y + 12); g.moveTo(x + px, y - 12); g.lineTo(x + px, y + 12); g.stroke();
  TK.text(g, label, x + px / 2, y + 40, 36, { color: TK.C.sub, bold: false });
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック（小さな星と、その上の山・木・人）
  if (t < 3.0) {
    planet(g, 540, 760, 260);
    tree(g, 540 - 70, 760 - 252, 110); mountain(g, 540 + 90, 760 - 245, 40); person(g, 540 + 10, 760 - 259, 60);
    TK.hook(g, t, 0.0, 3.0, '[いちばん高い]のは？', { y: 300, size: 110 });
    g.save(); g.globalAlpha = fade(t, 0.3, 3.0, 0.3); TK.text(g, '半径1kmの地球', PW / 2, 1080, 54, { color: TK.C.sub }); g.restore();
  }
  // 3〜7: 3択
  TK.choices(g, t, 3.0, 7.0, ['エベレスト', '高さ30mの木', 'あなた（170cm）'], { y: 480, h: 170, think: [4.0, 7.0] });
  // 7〜12: 縮む
  if (t >= 7.0 && t < 12.0) {
    const f = fade(t, 7.0, 12.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, 'いっしょに縮む（6371分の1）', PW / 2, 240, 60, { color: TK.C.sub });
    const k1 = TK.out((t - 7.6) / 1.3), k2 = TK.out((t - 9.4) / 1.3);
    TK.text(g, 'エベレスト', PW / 2, 400, 54, { color: TK.C.sub });
    TK.text(g, k1 > 0 ? (k1 < 1 ? Math.round(lerp(8849, 1.389, k1)).toLocaleString('ja-JP') + ' m' : '[1.39 m]') : '8,849 m', PW / 2, 500, 110);
    if (t > 9.0) {
      TK.text(g, '海の平均の深さ', PW / 2, 700, 54, { color: TK.C.sub });
      TK.text(g, k2 > 0 ? (k2 < 1 ? Math.round(lerp(3682, 0.578, k2)).toLocaleString('ja-JP') + ' m' : '[58 cm]') : '3,682 m', PW / 2, 800, 110);
    }
    if (t > 10.8) TK.text(g, '大人の胸くらい／ひざ〜ももくらい', PW / 2, 960, 44, { color: TK.C.sub, bold: false });
    g.restore();
  }
  // 12〜18: 木は30mのまま（1m = 25px）
  if (t >= 12.0 && t < 18.0) {
    const f = fade(t, 12.0, 18.0, 0.3), M = 25, gy = 1040;
    g.save(); g.globalAlpha = f;
    ground(g, gy);
    tree(g, 330, gy, 30 * M);
    mountain(g, 700, gy, 8848.86 * F * M);
    person(g, 860, gy, 1.70 * M);
    TK.text(g, '木 30m', 330, 245, 56);
    TK.text(g, 'エベレスト', 700, 960, 40, { color: TK.C.sub });
    TK.text(g, 'あなた', 870, 960, 40, { color: TK.C.sub });
    if (t > 14.2) TK.text(g, 'エベレストの [20倍]', 720, 500, 64);
    scaleBar(g, 600, 700, 10 * M, '10m');
    g.restore();
  }
  // 18〜22: 人とエベレスト（1m = 400px）
  if (t >= 18.0 && t < 22.0) {
    const f = fade(t, 18.0, 22.0, 0.3), M = 400, gy = 1040, he = 8848.86 * F * M, hp = 1.70 * M;
    g.save(); g.globalAlpha = f;
    ground(g, gy);
    mountain(g, 400, gy, he);
    person(g, 820, gy, hp);
    g.strokeStyle = TK.C.acc; g.lineWidth = 4; g.setLineDash([12, 10]);
    g.beginPath(); g.moveTo(100, gy - he); g.lineTo(980, gy - he); g.stroke(); g.setLineDash([]);
    TK.text(g, 'エベレスト 1.39m', 400, gy - he - 50, 50, { color: TK.C.sub });
    TK.text(g, 'あなた 1.70m', 820, gy - hp - 50, 50, { color: TK.C.acc });
    g.restore();
  }
  // 22〜24: 答え
  TK.choices(g, t, 22.0, 24.0, ['エベレスト（1.39m）', '高さ30mの木', 'あなた（2位）'], { y: 480, h: 170, reveal: 22.3, answer: 1 });
  if (t >= 7.0 && t < 22.0) TK.note(g, t, 7.0, 22.0, '地形も星と同じ割合で縮むとした計算（人と木は実物の大きさ）', { size: 30 });
  if (t >= 22.0) TK.note(g, t, 22.0, 24.0, '出どころ: エベレスト 8,848.86m（2020 ネパール・中国の共同発表）\n海の平均の深さ 3,682m（NOAA）・NASA Earth Fact Sheet', { size: 28 });
}

triviaStart({ out: 'tiny-earth-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
