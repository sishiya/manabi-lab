<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="animal-common.js"></script>
<script>
'use strict';
// 台本: いきものの感じる世界（ショート、40秒＋締め）。?short で縦長に録る
// 同じ庭を、人間 → カラス（紫外線）→ マムシ（熱）→ コウモリ（こだま）→ ネコ（暗い所。左半分は人間）。ハエは縦長だと六角形がつぶれるので使わない
const V = new URLSearchParams(location.search).has('short');
const SC = [
  { a: 0, b: 6, animal: 'human', time: 'day', poi: '花壇', turn: [{ a: 0, b: 6, yaw: 0.2 }] },
  { a: 6, b: 12.5, animal: 'crow', time: 'day', poi: 'ヒマワリ', turn: [{ a: 0, b: 6.5, yaw: 0.15 }] },
  { a: 12.5, b: 19.5, animal: 'snake', time: 'night', poi: 'ネズミ', t0: 0 },
  { a: 19.5, b: 26.5, animal: 'bat', time: 'night', poi: '庭の上', turn: [{ a: 0, b: 7, yaw: 0.5 }] },
  { a: 26.5, b: SHORT_END + IDENT_CLOSE, animal: 'cat', time: 'night', poi: 'ネズミ', split: true },
];
const NAMES = [
  [IDENT_MINI + 0.3, 5.8, '人間', ''],
  [6.3, 12.3, 'カラス', ''],
  [12.8, 19.3, 'マムシ', ''],
  [19.8, 26.3, 'コウモリ', ''],
  [26.8, 35, 'ネコ', '左半分は人間の目'],
];
const CAPS = [
  { a: 6.3, b: 12.3, main: 'カラス: 紫外線が見える', sub: 'ヒマワリの花びらの先が、紫外線で光って見える',
    en: ['Crow: sees ultraviolet', 'The sunflower\'s petal tips glow in UV'] },
  { a: 12.8, b: 19.3, main: 'マムシ: まっくらでも、熱が見える', sub: '鼻のくぼみ（ピット器官）で、ネズミの体温をとらえる',
    en: ['Pit viper: sees heat in total darkness', 'Its pit organs pick up a mouse\'s body heat'] },
  { a: 19.8, b: 26.3, main: 'コウモリ: こだまで見る', sub: '声の返ってきた所だけが浮かび上がる',
    en: ['Bat: sees with echoes', 'Only what bounces its call back shows up'] },
  { a: 26.8, b: 35, main: 'ネコ: 暗い所で、人の約5倍見える', sub: '左半分は人間の目。同じ暗さでも、ネコにはよく見える',
    en: ['Cat: sees about five times better in the dark', 'The left half is the human view. In the same darkness, the cat sees much more'] },
];
promoStart({
  name: 'いきものの感じる世界', out: 'animal-senses', src: '../../animal-senses/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 15,
  inject: { dpr: 2, raf: true },
  music: { style: 'journey', root: 130.81, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: w => w.__as && w.__as.R && w.__as.R.size,
  setup(w) { if (V) asSize(w, 1440, 2560); else asSize(w, 2560, 1440); w.__as.frame(1); return qs(w, '#gl'); },
  subs: shortSubs('いきものの感じる世界', 'How Animals Sense the World', '同じ庭を、いろいろな動物の感覚で', 'The same garden, through different animals\' senses', CAPS,
    'ブラウザで動かせます。14の見え方を切りかえられます', 'Runs in your browser. Switch between 14 ways of seeing'),
  renderAt(t, w) { asRender(w, SC, t); },
  overlay(g, t) {
    for (const [a, b, n, sub] of NAMES) drawName(g, t, a, b, n, sub, 60, V ? 230 : 120);
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, 'いきものの感じる世界', '同じ庭を、いろいろな動物の感覚で', 'ブラウザで動かせます。14の見え方を切りかえられます',
      '見え方は研究をもとに置き換えたもの。おもな出どころ: Ödeen と Håstad（2003）、Gracheva ほか（2010）ほか');
  },
  errors: w => w.__as.err,
});
</script>
</body>
</html>
