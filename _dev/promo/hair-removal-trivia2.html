<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく hair-2（型B もしも計算）「太ももの毛がずっと伸びたら、何cm？」。台本は trivia/hair-removal.md。?short で録る
// 数字: 太ももの成長期 男性 約54日（Seago & Ebling 1985）、頭の毛 3〜5年（Wolfram 2003、BioNumbers 114255）。3年÷54日≈20、5年÷54日≈34。
// 「同じ速さなら」の仮定の計算（実際は頭の毛の方が速く伸びるので、もっと長くなるはず。速さの数字は出さない）。1cm の毛は例。
const DUR = 30;
const subs = [
  { a: 0.0, b: 3.0, ja: 'もしも太ももの毛が\n頭の毛と同じだけ[伸び続けたら]？', en: 'What if your thigh hair kept growing\nas long as your scalp hair?' },
  { a: 3.0, b: 8.0, ja: '太ももの毛が伸びる時期は\n男性で[約54日]', en: 'Thigh hair grows for\nabout 54 days in men' },
  { a: 8.0, b: 14.0, ja: '頭の毛は[3〜5年]\n20〜34倍の長さ', en: 'Scalp hair: 3–5 years,\n20–34 times longer' },
  { a: 14.0, b: 21.0, ja: '同じ速さなら、いまの20〜34倍\n1cmの毛なら[20〜34cm]（推定）', en: 'At the same speed, 20–34 times longer:\na 1 cm hair would reach 20–34 cm (estimate)' },
  { a: 21.0, b: 26.0, ja: 'でも実際は、2か月ほどで止まって休み\n[抜けて生えかわる]', en: 'In reality it stops after about 2 months,\nrests, falls out and is replaced' },
  { a: 26.0, b: 30.0, ja: '太ももの毛が伸びすぎないのは\n[早く休む]から', en: 'Thigh hair stays short\nbecause it rests early' },
];
const cues = [
  { t: 0.05, type: 'rise' }, { t: 3.0, type: 'pop' }, { t: 6.0, type: 'ding' }, { t: 8.0, type: 'whoosh' }, { t: 9.6, type: 'rise' },
  { t: 14.0, type: 'pop' }, { t: 16.5, type: 'ding' }, { t: 21.0, type: 'whoosh' }, { t: 24.0, type: 'pop' }, { t: 26.0, type: 'ding' },
];
const HAIR = '#5fd4ff', SKIN_Y = 900, HX = 540;

function skin(g) {
  g.save(); g.fillStyle = 'rgba(255,190,160,0.12)'; g.fillRect(60, SKIN_Y, 960, 90);
  g.strokeStyle = 'rgba(255,200,170,0.8)'; g.lineWidth = 5; g.beginPath(); g.moveTo(60, SKIN_Y); g.lineTo(1020, SKIN_Y); g.stroke(); g.restore();
}
function hair(g, x, base, L, o = {}) {
  g.save();
  g.strokeStyle = 'rgba(207,224,255,0.5)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(x - 20, SKIN_Y); g.lineTo(x - 20, SKIN_Y + 70); g.moveTo(x + 20, SKIN_Y); g.lineTo(x + 20, SKIN_Y + 70); g.stroke();
  g.fillStyle = o.rest ? 'rgba(207,224,255,0.35)' : HAIR; g.beginPath(); g.ellipse(x, base + 70, 22, 18, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = HAIR; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, base + 60); g.lineTo(x, base - L); g.stroke();
  g.restore();
}
// 日数の札
function dayCard(g, days, hl) {
  const s = days < 365 ? Math.round(days) + ' 日' : (days / 365).toFixed(1) + ' 年';
  TK.card(g, 260, 150, 560, 130, { r: 60, stroke: hl ? TK.C.acc : 'rgba(160,190,255,0.35)', lw: hl ? 6 : 3 });
  TK.text(g, '伸びた日数  ' + s, PW / 2, 215, 64, { color: hl ? TK.C.acc : '#fff' });
}

function draw(g, t) {
  // 0〜8: 54 日まで伸びる（54日で 140 画素）
  const PX_DAY = 140 / 54;
  if (t < 8.0) {
    skin(g);
    const days = t < 3 ? 54 * 0.6 * ease(t / 3) : 54 * 0.6 + 54 * 0.4 * ease((t - 3.2) / 2.6);
    hair(g, HX, SKIN_Y, days * PX_DAY);
    if (t < 3.0) TK.text(g, 'もしも[止まらなかったら]？', PW / 2, 330, 76);
    else dayCard(g, days, days > 53.5);
    if (t >= 6.0) TK.text(g, '太もも（男性）はここで止まる', PW / 2, SKIN_Y - 230, 46, { color: TK.C.sub });
  }
  // 8〜14: 3年 → 5年。毛は画面の上をつきぬける
  if (t >= 8.0 && t < 14.0) {
    skin(g);
    const k = ease((t - 8.4) / 4.0), days = lerp(54, 1826, k);
    const L = days * PX_DAY;
    hair(g, HX, SKIN_Y, L);
    // 54 日の印
    g.strokeStyle = TK.C.acc; g.lineWidth = 4; g.setLineDash([10, 10]); g.beginPath(); g.moveTo(HX - 160, SKIN_Y - 140); g.lineTo(HX + 160, SKIN_Y - 140); g.stroke(); g.setLineDash([]);
    TK.text(g, '54日', HX + 230, SKIN_Y - 140, 44, { color: TK.C.acc });
    dayCard(g, days, days > 1094);
    if (days > 1094) TK.text(g, '[20〜34倍]', PW / 2, 420, 110, { stroke: 'rgba(0,0,0,0.8)' });
    TK.note(g, t, 8.6, 14, '頭の毛の伸びる時期 3〜5年（一例）', { size: 32 });
  }
  // 14〜21: ものさし 1cm → 20〜34cm
  if (t >= 14.0 && t < 21.0) {
    const f = fade(t, 14, 21, 0.3); g.save(); g.globalAlpha = f;
    const x0 = 130, y = 640, cm = 22;   // 1cm＝22画素（34cm で 748 画素）
    g.strokeStyle = 'rgba(207,224,255,0.8)'; g.lineWidth = 4; g.strokeRect(x0, y, 34 * cm + 40, 110);
    for (let c = 0; c <= 34; c++) { const x = x0 + 20 + c * cm, long = c % 5 === 0; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + (long ? 46 : 26)); g.stroke(); if (c % 10 === 0) TK.text(g, String(c), x, y + 80, 34, { color: TK.C.dim, bold: false }); }
    const k1 = ease((t - 14.4) / 0.6), k2 = ease((t - 15.4) / 1.6);
    g.strokeStyle = HAIR; g.lineWidth = 12; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0 + 20, y - 60); g.lineTo(x0 + 20 + cm * 1 * k1, y - 60); g.stroke();
    TK.text(g, 'いま 1cm', x0 + 20, y - 120, 46, { align: 'left', color: TK.C.sub });
    if (t > 15.4) {
      g.strokeStyle = TK.C.acc; g.beginPath(); g.moveTo(x0 + 20, y + 180); g.lineTo(x0 + 20 + cm * lerp(1, 34, k2), y + 180); g.stroke();
      g.fillStyle = 'rgba(255,207,74,0.25)'; g.fillRect(x0 + 20 + cm * 20, y + 150, cm * 14 * k2, 60);
      if (k2 >= 1) TK.text(g, '[20〜34cm]（推定）', PW / 2, y + 300, 76);
    }
    TK.text(g, 'cm', x0 + 34 * cm + 70, y + 80, 34, { color: TK.C.dim, bold: false });
    g.restore();
    TK.note(g, t, 14.4, 21, '「同じ速さなら」の仮定の計算。頭の毛は速く伸びるので\n実際はもっと長くなるはず。1cm は例', { size: 30 });
  }
  // 21〜26: 実際は止まって、休んで、抜ける
  if (t >= 21.0 && t < 26.0) {
    skin(g);
    const u = clamp((t - 21.2) / 4.4, 0, 1);
    const stages = [['伸びる', 0, 0.3], ['止まる', 0.3, 0.45], ['休む', 0.45, 0.75], ['抜ける', 0.75, 1.01]];
    const cur = stages.find(s => u >= s[1] && u < s[2]);
    stages.forEach((s, i) => { const x = 90 + i * 232, on = s === cur; TK.card(g, x, 160, 212, 110, { r: 30, fill: on ? 'rgba(255,207,74,0.25)' : 'rgba(20,34,72,0.85)', stroke: on ? TK.C.acc : 'rgba(160,190,255,0.35)', lw: on ? 6 : 3 }); TK.text(g, s[0], x + 106, 215, 50, { color: on ? '#fff' : TK.C.dim }); });
    const L = 140 * Math.min(1, u / 0.3), sink = u > 0.3 ? Math.min(1, (u - 0.3) / 0.3) * 40 : 0;
    const dy = u > 0.75 ? -200 * (u - 0.75) / 0.25 : 0;
    g.save(); g.translate(0, dy); if (u > 0.75) g.globalAlpha = 1 - (u - 0.75) / 0.25 * 0.8;
    hair(g, HX, SKIN_Y - sink, L, { rest: u > 0.45 });
    g.restore();
    if (u > 0.8) { const k = (u - 0.8) / 0.2; g.save(); g.globalAlpha = k; hair(g, HX, SKIN_Y, 30 * k); g.restore(); TK.text(g, '新しい毛', HX + 150, SKIN_Y - 60, 44, { color: TK.C.sub, align: 'left' }); }
    TK.note(g, t, 21.4, 26, '太もも（男性）は、伸びる時期が約54日', { size: 32 });
  }
  // 26〜30
  if (t >= 26.0) {
    const f = fade(t, 26, 30.5, 0.3); g.save(); g.globalAlpha = f;
    TK.card(g, 110, 330, 860, 400);
    TK.lines(g, '伸びすぎないのは\n[早く休む]から', PW / 2, 530, 88);
    g.restore();
    TK.note(g, t, 27.0, 30, '出どころ: Seago & Ebling (1985) Br J Dermatol 113:9\nWolfram (2003) J Am Acad Dermatol 48:S106', { size: 30 });
  }
}

triviaStart({ out: 'hair-removal-trivia2', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
