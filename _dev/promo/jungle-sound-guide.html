<script>
'use strict';
// 台本: 熱帯雨林の音 ― 使い方と見どころ（横長の説明動画、ライオンつき。2026-11-14）
// 日本語の字幕は上に焼きこみ、下は YouTube の字幕（CC）にあける。音は BGM なし: アプリと同じ重ね方の森の音（本物の録音）がずっと聞こえる。
// ライオンは森の声を聞かせるため、あいさつ（はじめと終わり）だけしゃべる。右下（x 1530〜・y 620〜）はライオンの場所。
// アプリの順（声の帯 → いま鳴いている → 行を開く → ON/OFF → だけ・▶| → まとめボタン → 全部）をなぞる。
const END = 132, DUR = END + IDENT_CLOSE;
const SEG = [
  { t: 0, f: 40, off: [] },
  { t: 38.0, f: 85.4 },                         // 帯の Amazonian Trogon の行を押す → 近くの声の1秒前へ（アプリの Lanes と同じ）
  { t: 47.5, sel: 'sobcac1' },                  // 一覧の行を押す（選ぶ）
  { t: 55.0, off: ['bed'] },                    // 虫・カエルを OFF（鳥は +20 dB）
  { t: 67.3, off: [] },
  { t: 68.0, off: ['putfru1'] },
  { t: 74.5, off: 'solo:scrpih1', solo: 'scrpih1' },
  { t: 76.0, f: 166, sel: 'scrpih1' },           // ▶|（アプリの List.next と同じ: 次の声の1秒前へ）
  { t: 82.0, f: 35.9 },                         // ▶|: 最後の声のあとは、はじめの声へ
  { t: 85.0, f: 166 },
  { t: 87.5, off: 'solo:putfru1', solo: 'putfru1' },
  { t: 88.3, f: 2.5, sel: 'putfru1' },
  { t: 96.5, off: 'unknown', solo: null, label: '種が不明の音だけ' },
  { t: 97.3, f: 22.5, sel: '????' },
  { t: 110.0, off: [], solo: null, sel: null },   // 全部（選んだ行はたたむ）
];
// 置き場所（横 1920×1080。字幕は上 〜170、下 940〜 は YouTube の字幕、右下はライオン）
const LX = 40, LW = 1460, LY = 248, ROWH = 19, PY = 632, SPX = 40, SPY = 690, SPW = 620, SPH = 230, GX = 680, GY = 690, GW = 820, RY = 742, RH = 56, RFS = 19, CX = 1530, CY = 196, CW = 350;
// 一覧に出す行（場面ごと。行を入れかえるときは 0.4 秒でうすく入れかえる）
const ROWSETS = [[0, ['bed', 'viotro3', 'sobcac1']], [53.5, ['bed', 'putfru1', 'sobcac1']], [73.5, ['bed', 'scrpih1', 'putfru1']], [95.5, ['bed', '????', 'scrpih1']]];
const CAPS = [
  { a: 7.0, b: 13.0, main: 'アマゾン（ペルー）の夜明け、5時25分ごろの森', sub: '本物の録音を、虫・カエルの「土台」と鳥の声に分けて、ブラウザで重ねて鳴らす',
    en: ['The Amazon rainforest (Peru) at dawn, around 5:25 a.m.', 'Real recordings, split into a base layer (insects, frogs) and bird calls, layered again in your browser'] },
  { a: 13.3, b: 19.6, main: '音はすべて本物の録音から', sub: '録音と鳥の名前の注釈: Hopping, Kahl & Klinck（2022）、CC BY 4.0',
    en: ['Every sound comes from real recordings', 'Recordings and bird labels: Hopping, Kahl & Klinck (2022), CC BY 4.0'] },
  { a: 20.0, b: 26.8, main: '声の帯: 横が3分、1行が1つの声', sub: '鳥の17行と、うしろの灰色の波（虫・カエルなど）で18の声',
    en: ['Voice lanes: 3 minutes across, one row per voice', '17 bird rows plus the gray wave behind them (insects, frogs, etc.): 18 voices'] },
  { a: 27.1, b: 33.8, main: '色は「どこまで分かっているか」', sub: '緑＝種まで分かった鳥　黄＝鳥だが種は不明　灰＝分けられていない（虫・カエルなど）',
    en: ['The colors show how much we know', 'Green: species known. Yellow: a bird, species unknown. Gray: not separated (insects, frogs, etc.)'] },
  { a: 34.1, b: 39.8, main: '白い線がいま。帯を押すと、その時刻へ', sub: '近くに声があれば、その声の1秒前から',
    en: ['The white line is now. Tap the lanes to jump there', 'If a call is nearby, it starts 1 second before it'] },
  { a: 40.4, b: 46.8, main: 'いま鳴いている声は、名前の札と写真が光る', sub: '帯の行も明るくなる',
    en: ['Voices calling now light up: name tag and photo', 'Their rows in the lanes brighten too'] },
  { a: 47.2, b: 53.4, main: '行を押すと、写真と紹介', sub: '写真は Wikimedia Commons（作者と条件は説明欄に）',
    en: ['Tap a row for a photo and a short description', 'Photos from Wikimedia Commons (authors and licenses in the description)'] },
  { a: 54.0, b: 60.8, main: 'ON／OFF で、声ごとに鳴らす・消す', sub: '虫・カエルを OFF にすると、鳥の声だけが残る',
    en: ['ON/OFF plays or mutes each voice', 'Turn insects and frogs OFF and only the birds remain'] },
  { a: 61.1, b: 67.0, main: '鳥だけのときは +20 dB（本物より大きく）', sub: '小さな声も聞きやすいように',
    en: ['Birds only: raised by +20 dB (louder than real)', 'So that quiet calls are easier to hear'] },
  { a: 67.6, b: 73.3, main: 'OFF にした声は、帯が枠だけに', sub: '消しても、いつ鳴くかは見える',
    en: ['A muted voice shows only outlines in the lanes', 'You can still see when it calls'] },
  { a: 74.2, b: 81.0, main: '「だけ」で、その声だけを聞く', sub: 'ムジカザリドリ。森の中で 400 m 先まで届く声',
    en: ['"Solo" plays only that voice', 'Screaming Piha: its call carries 400 m through the forest'] },
  { a: 81.3, b: 86.9, main: '▶| で、その声の次の鳴き声へ', sub: '最後まで行くと、はじめにもどる',
    en: ['▶| jumps to the next call of that voice', 'After the last one, it goes back to the first'] },
  { a: 87.3, b: 95.2, main: 'マエカケカザリドリだけ', sub: 'オスはのどに赤紫の羽。数羽の群れで、おもに木の実を食べる',
    en: ['Purple-throated Fruitcrow only', 'Males have reddish-purple throat feathers; small groups eat mostly fruit'] },
  { a: 96.2, b: 102.8, main: 'まとめて切りかえ:「種が不明の音だけ」', sub: '種の付かなかった鳥と、虫・カエルなど',
    en: ['Switch in groups: "Unknown sounds only"', 'Unidentified birds plus insects, frogs, etc.'] },
  { a: 103.1, b: 109.6, main: '分かり方は3つ', sub: '種まで（専門家が録音に種の名前を付けた）・鳥だが種は不明・分けられていない',
    en: ['Three levels of knowing', 'Species known (experts labeled the recording) · bird, species unknown · not separated'] },
  { a: 110.4, b: 116.6, main: '全部 ON にもどすと、夜明けの森', sub: '18の声が重なって、ひとつの音に',
    en: ['Back to all ON: the forest at dawn', '18 voices layered into one sound'] },
  { a: 117.0, b: 123.8, main: '耳だけで、何種の鳥が聞き分けられる？', sub: 'パソコンでもスマホでも、ブラウザで',
    en: ['How many birds can you tell apart by ear?', 'On a PC or a phone, in your browser'] },
];
const EXP = [[0, 'calm'], [7.2, 'smile'], [11, 'calm'], [20.2, 'think'], [24, 'calm'], [38.1, 'wow'], [41, 'smile'], [45, 'calm'], [47.6, 'smile'], [52, 'calm'],
  [55.2, 'think'], [58, 'calm'], [61.3, 'wow'], [64, 'calm'], [68.2, 'think'], [71, 'calm'], [77.1, 'wow'], [80.5, 'smile'], [83, 'calm'], [89.4, 'smile'], [94, 'calm'],
  [98.4, 'think'], [102, 'calm'], [103.3, 'proud'], [107, 'calm'], [110.6, 'smile'], [114, 'calm'], [117.2, 'think'], [121, 'smile'], [END - 7.6, 'smile']];
const MUSIC = { style: 'none', stopAt: END, cues: [{ t: END, type: 'jingle' }], extra: juExtra };
let CUR = [], CUR_T = 0;
const rowsAt = t => { let i = 0; while (i + 1 < ROWSETS.length && ROWSETS[i + 1][0] <= t) i++; return i; };
promoStart({
  name: '熱帯雨林の音（使い方）', out: 'jungle-sound-guide', src: '../../jungle-sound/index.html', iw: 1100, ih: 900, dur: DUR, peek: 45,
  music: MUSIC,
  ready: w => !!LION.api && juReady(w),
  async setup(w) {
    await juLoad(w);
    const all = ['bed', ...JU.order];
    for (const s of SEG) {
      if (typeof s.off === 'string' && s.off.startsWith('solo:')) { const c = s.off.slice(5); s.off = all.filter(x => x !== c); }
      else if (s.off === 'unknown') s.off = all.filter(x => juKind(x) === 'sp');   // アプリの「種が不明の音だけ」: 種まで分かった鳥を消す
    }
    juPrep(SEG); juBuild(DUR, { end: END });
    // ボタンの位置（矢印の行き先）: 一度描いて測る
    const c = document.createElement('canvas').getContext('2d');
    const P = ROWSETS.map(([, rows]) => juList(c, GX, RY, GW, RH, rows, 0, RFS)), G = juGroups(c, GX, GY, GW, 20);
    const lan = juLanes(c, LX, LY, LW, ROWH, 0, { gut: 240, font: 17 });
    const tro = { x: lan.X(86.4 + 0.4), y: lan.rowY('viotro3') };
    CUR = [
      { t: 34.4, x: 900, y: 560 }, { t: 37.5, ...tro }, { t: 38.0, ...tro, click: true }, { t: 39.4, x: 1000, y: 560, hide: true },
      { t: 46.4, x: 1100, y: 860 }, { t: 47.2, ...P[0].sobcac1.body }, { t: 47.5, ...P[0].sobcac1.body, click: true }, { t: 48.8, x: 1100, y: 880, hide: true },
      { t: 54.2, x: 900, y: 880 }, { t: 54.7, ...P[1].bed.sw }, { t: 55.0, ...P[1].bed.sw, click: true }, { t: 56.2, x: 1000, y: 880, hide: true },
      { t: 66.4, x: 900, y: 880 }, { t: 67.0, ...P[1].bed.sw }, { t: 67.3, ...P[1].bed.sw, click: true }, { t: 67.7, ...P[1].putfru1.sw }, { t: 68.0, ...P[1].putfru1.sw, click: true }, { t: 69.2, x: 1000, y: 880, hide: true },
      { t: 73.8, x: 1200, y: 880 }, { t: 74.2, ...P[2].scrpih1.solo }, { t: 74.5, ...P[2].scrpih1.solo, click: true }, { t: 75.7, ...P[2].scrpih1.next }, { t: 76.0, ...P[2].scrpih1.next, click: true }, { t: 77.2, x: 1300, y: 900, hide: true },
      { t: 81.2, x: 1300, y: 900 }, { t: 81.7, ...P[2].scrpih1.next }, { t: 82.0, ...P[2].scrpih1.next, click: true }, { t: 84.7, ...P[2].scrpih1.next }, { t: 85.0, ...P[2].scrpih1.next, click: true }, { t: 86.2, x: 1300, y: 900, hide: true },
      { t: 86.8, x: 1200, y: 900 }, { t: 87.2, ...P[2].putfru1.solo }, { t: 87.5, ...P[2].putfru1.solo, click: true }, { t: 88.0, ...P[2].putfru1.next }, { t: 88.3, ...P[2].putfru1.next, click: true }, { t: 89.5, x: 1300, y: 900, hide: true },
      { t: 95.6, x: 1100, y: 800 }, { t: 96.2, ...G[2] }, { t: 96.5, ...G[2], click: true }, { t: 97.0, ...P[3]['????'].next }, { t: 97.3, ...P[3]['????'].next, click: true }, { t: 98.5, x: 1300, y: 900, hide: true },
      { t: 109.2, x: 900, y: 800 }, { t: 109.7, ...G[0] }, { t: 110.0, ...G[0], click: true }, { t: 111.2, x: 1000, y: 820, hide: true },
    ];
    // ライオン: 森の声を聞かせるため、しゃべるのはあいさつだけ
    const talk = lionSetup({ caps: [], cur: CUR, exp: EXP, end: END, bye: END - 5.8 });
    MUSIC.cues.push(...talk);
    return null;
  },
  subs: () => guideSubs(END, '熱帯雨林の音', 'Rainforest Sounds', CAPS, 'Runs in your browser (PC or phone). The app is in Japanese and English'),
  renderAt(t) { CUR_T = t; },
  drawSource(g, w, OW, OH) {
    g.fillStyle = JU_COL.bg; g.fillRect(0, 0, OW, OH);
    g.save(); g.scale(RES, RES); scene(g, CUR_T); g.restore();
  },
  overlay(g, t) {
    drawCursor(g, CUR, t);
    drawCaps(g, t, CAPS, true);
    drawGuideChrome(g, t, END, '熱帯雨林の音',
      'おもな出どころ: 録音と鳥の注釈 W. A. Hopping, S. Kahl, H. Klinck（2022）Zenodo doi:10.5281/zenodo.7079124、CC BY 4.0（このアプリで切り出して重ねた）。鳥の写真: Wikimedia Commons（作者と条件は説明欄）。和名: Wikidata');
    drawLion(g, t);
  },
  errors: w => (w.__jusoErr || []).map(String),
});
lionOpen();
function scene(g, t) {
  juChips(g, LX, 196, LW, t, 24);
  juLanes(g, LX, LY, LW, ROWH, t, { gut: 240, font: 17 });
  juPlayer(g, LX, PY, t, 22);
  juSpec(g, SPX, SPY, SPW, SPH, t, 8, 17);
  juGroups(g, GX, GY, GW, 20, [[96.5, 2], [110.0, 0]].reduce((p, [a, i]) => t >= a && t < a + 0.35 ? i : p, -1));
  // 一覧（場面の入れかえは 0.4 秒でうすく）
  const i = rowsAt(t), k = i > 0 ? clamp((t - ROWSETS[i][0]) / 0.4, 0, 1) : 1;
  if (k < 1) { g.save(); g.globalAlpha = 1 - k; juList(g, GX, RY, GW, RH, ROWSETS[i - 1][1], t, RFS); g.restore(); }
  g.save(); g.globalAlpha = k; juList(g, GX, RY, GW, RH, ROWSETS[i][1], t, RFS); g.restore();
  // 写真のカード（選んだ声、なければ いま鳴いている声）。題名のあいだは出さない
  const f = clamp((t - 6.6) / 0.5, 0, 1);
  if (f > 0) { g.save(); g.globalAlpha = f; juCard(g, CX, CY, CW, juFeatured(t), t, 22, 3); g.restore(); }
}
</script>
</body>
</html>
