<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="air-flow-common.js"></script>
<script>
'use strict';
// 台本: 空気の流れの見える部屋（ショート、40秒＋締め）。?short で縦長に録る
// 24時間換気だけ → 窓1か所 → 窓2か所 → サーキュレーター。数字はアプリの換気回数
const V = new URLSearchParams(location.search).has('short');
const MAP = V ? [0, 440, 1080, 675] : [200, 60, 1520, 950];
const SC = [
  { a: 0, b: 13.2, scene: '24h', speed: 600 },
  { a: 13.2, b: 21.2, scene: 'single', speed: 60 },
  { a: 21.2, b: 28.2, scene: 'single', speed: 60, ev: [{ t: 0.8, run: w => w.setState('w1', 2) }] },
  { a: 28.2, b: SHORT_END + IDENT_CLOSE, scene: 'circ', speed: 60 },
];
const CAPS = [
  { a: 6, b: 13, main: '24時間換気だけだと、空気はゆっくり入れかわる', sub: '色は「空気の年齢」。外から入って何分たったか',
    en: ['With only the 24-hour ventilation, the air changes slowly', 'Color shows "air age": minutes since it came in from outside'] },
  { a: 13.5, b: 21, main: '窓を1か所あけても、風はあまり通らない', sub: '空気の出口がないと、窓の近くだけ',
    en: ['Opening just one window doesn\'t move much air', 'With no way out, only the air near the window changes'] },
  { a: 21.5, b: 28, main: '2か所あけると、風の通り道ができる', sub: '数分で家じゅうが入れかわる',
    en: ['Open two, and the wind finds a path', 'The whole home turns over in minutes'] },
  { a: 28.5, b: 35, main: 'サーキュレーターで、よどむ部屋に風を送る', sub: '置く場所と向きで、効き方が変わる',
    en: ['A circulator fan pushes air into a stale room', 'Where you put it and how you point it matters'] },
];
promoStart({
  name: '空気の流れの見える部屋', out: 'air-flow', src: '../../air-flow/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 18,
  inject: { dpr: 2, raf: true },
  music: { style: 'journey', root: 146.83, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: w => w.__af && w.__af.S && w.__af.S.scene && w.fit,
  setup(w) { afSize(w, MAP[2], MAP[3]); return null; },
  subs: shortSubs('空気の流れの見える部屋', 'Seeing Airflow at Home', '家の空気は、どこがよどむ？', 'Where does the air go stale in your home?', CAPS,
    'ブラウザで動かせます。窓や換気扇を押して試せます', 'Runs in your browser. Tap windows and fans to try'),
  renderAt(t, w) { afRender(w, SC, t); },
  drawSource(g, w) {
    g.fillStyle = '#0b0e14'; g.fillRect(0, 0, PW * RES, PH * RES);
    g.drawImage(qs(w, '#view'), MAP[0] * RES, MAP[1] * RES, MAP[2] * RES, MAP[3] * RES);
  },
  overlay(g, t, w) {
    // 換気回数（地図の上、目印がはけてから）。窓1か所の場面は出さない
    const f = fade(t, IDENT_MINI + 0.3, 13, 0.4) + fade(t, 21.5, 35, 0.4);
    drawPanel(g, 30, MAP[1] - 140, 700, '家全体の換気回数', [afText(w, '#roVal') + ' 回/時  ' + afText(w, '#roTag')], f);
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, '空気の流れの見える部屋', '家の空気は、どこがよどむ？', 'ブラウザで動かせます。窓や換気扇を押して試せます',
      'おもな出どころ: 建築基準法施行令 第20条の8、Sandberg（1981）、Etheridge と Sandberg（1996）ほか');
  },
  errors: w => [w.__af.err].filter(Boolean).map(String),
});
</script>
</body>
</html>
