/// ---- 図鑑の版画の道具で描く部品（PL.*）----
const TAU = Math.PI * 2, BLUE = '#2f5f7a';
const curvy = pts => g => {   // なめらかな閉じた形
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]); g.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = mid(p, pts[(i + 1) % n]); g.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
  g.closePath();
};
// 10球の色（青 → 朱）
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const ballCol = b => { const a = hex(BLUE), c = hex(PL.RED), k = b / 9; return `rgb(${a.map((v, i) => Math.round(lerp(v, c[i], k))).join(',')})`; };
// 野球のボール（革の手彩色・かげ・赤い縫い目）。何個もまとめて1回でぬる（筆のルックはぬるたびにぼかすので、回数を少なく）
// B: [{ x, y, r, tint, ring }]
function balls(g, B) {
  if (!B.length) return;
  const un = (L, f) => gg => L.forEach(b => f(b)(gg));
  PL.tint(g, un(B.filter(b => !b.tint), b => PL.circle(b.x, b.y, b.r)), PL.T.sand, 0.35);
  const hl = B.filter(b => b.tint); if (hl.length) PL.tint(g, un(hl, b => PL.circle(b.x, b.y, b.r)), hl[0].tint, 0.8);
  const big = B.filter(b => b.r >= 10);
  if (big.length) PL.hatch(g, un(big, b => PL.circle(b.x, b.y, b.r)), { angle: 0.7, gap: 4.5, w: 1.2, not: un(big, b => PL.circle(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r)) });
  const seam = b => gg => { const { x, y, r } = b, R = r * 0.95, c1 = x - r * 1.3, c2 = x + r * 1.3; gg.moveTo(c1 + R * Math.cos(-0.8), y + R * Math.sin(-0.8)); gg.arc(c1, y, R, -0.8, 0.8); gg.moveTo(c2 + R * Math.cos(Math.PI + 0.8), y + R * Math.sin(Math.PI + 0.8)); gg.arc(c2, y, R, Math.PI + 0.8, Math.PI - 0.8, true); };
  PL.ink(g, un(B, seam), Math.max(1.2, B[0].r / 9), PL.RED);
  const cols = [...new Set(B.map(b => b.ring || PL.INK))];
  cols.forEach(c => { const L = B.filter(b => (b.ring || PL.INK) === c); PL.ink(g, un(L, b => PL.circle(b.x, b.y, b.r)), Math.max(2.4, L[0].r / 6), c); });

const baseball = (g, x, y, r, o = {}) => balls(g, [Object.assign({ x, y, r }, o)]);

const SX0 = 110, SX1 = 970;
const sx = y => SX0 + (16.64 - y) / 16.64 * (SX1 - SX0), sz = (z, base) => base - z * 260;
function ground(g, base, ruler = true) {
  const dirt = PL.rect(60, base, 960, 34);
  PL.tint(g, dirt, PL.T.sand, 0.7); PL.hatch(g, dirt, { angle: 0.9, gap: 10, w: 1.8 });

// 7〜13秒のずれの点（イメージ。乱数は固定）
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const proj = (x, y, z) => { const d = y - CAMY; return [CCX + FOC * x / d, CCY - FOC * (z - CAMZ) / d]; };
function field(g) {   // 捕手の目の地面とマウンド
  const turf = PL.rect(30, CCY + 40, PW - 60, 1190 - CCY - 40);
  PL.tint(g, turf, PL.T.land, 0.3);
  PL.ink(g, gg => { for (let k = 1; k < 9; k++) { const d = 2 + k * k * 0.5, y = CCY + FOC * CAMZ / d; if (y < 1190) { gg.moveTo(30, y); gg.lineTo(PW - 30, y); } } }, 1.2, 'rgba(35,28,21,0.35)');   // 遠いほどつまる横線
  const [mx, my] = proj(0, 18.44, 0), rx = FOC * 2.7 / (18.44 - CAMY);
  const mound = PL.ellipse(mx, my, rx, 18);
  PL.tint(g, mound, PL.T.sand, 0.85); PL.hatch(g, mound, { angle: 0.3, gap: 6, w: 1.4, not: PL.ellipse(mx, my - 8, rx, 18) }); PL.ink(g, mound, 3);
  PL.ink(g, gg => { gg.moveTo(30, CCY + 40); gg.lineTo(PW - 30, CCY + 40); }, 2);
}
function zone(g) {
  const [zx0, zy0] = proj(-0.215, 0.43, 1.05), [zx1, zy1] = proj(0.215, 0.43, 0.48);
  PL.ink(g, gg => { for (let k = 1; k < 3; k++) { const x = lerp(zx0, zx1, k / 3), y = lerp(zy0, zy1, k / 3); gg.moveTo(x, zy0); gg.lineTo(x, zy1); gg.moveTo(zx0, y); gg.lineTo(zx1, y); } }, 1.4, 'rgba(35,28,21,0.5)');
  PL.ink(g, PL.rect(zx0, zy0, zx1 - zx0, zy1 - zy0), 5);

}
// チョウ（上から。前ばね・後ろばね・脈・触角）
function butterfly(g, x, y, s) {
  const P = (u, v) => [x + u * s, y + v * s];
  [-1, 1].forEach(d => {
    const fw = curvy([P(d * 4, -6), P(d * 40, -52), P(d * 92, -60), P(d * 96, -30), P(d * 56, 2), P(d * 8, 4)]);
    const hw = curvy([P(d * 6, 2), P(d * 58, 4), P(d * 76, 40), P(d * 50, 70), P(d * 18, 54), P(d * 4, 18)]);
    [[hw, PL.T.gold], [fw, PL.T.rust]].forEach(([p, c]) => {
      PL.tint(g, p, c, 0.65);
      PL.hatch(g, p, { angle: 0.7, gap: 7, w: 1.5, not: g2 => g2.rect(0, 0, PW, y - 10 * s) });
      PL.ink(g, p, 4);
    });
    PL.ink(g, gg => { [[90, -54], [94, -34], [70, -8]].forEach(([u, v]) => { const [a, b] = P(d * 6, -2), [c, e] = P(d * u, v); gg.moveTo(a, b); gg.quadraticCurveTo((a + c) / 2, (b + e) / 2 - 6 * s, c, e); }); [[64, 30], [46, 60]].forEach(([u, v]) => { const [a, b] = P(d * 6, 6), [c, e] = P(d * u, v); gg.moveTo(a, b); gg.lineTo(c, e); }); }, 1.6);   // 脈
    const sp = PL.circle(...P(d * 72, -38), 7 * s); PL.tint(g, sp, PL.INK, 0.8);   // 目玉もよう
    PL.ink(g, gg => { const [a, b] = P(d * 2, -26), [c, e] = P(d * 26, -70); gg.moveTo(a, b); gg.quadraticCurveTo(a + d * 4 * s, e + 20 * s, c, e); }, 2.4);   // 触角
    PL.ink(g, PL.circle(...P(d * 26, -70), 3 * s), 3);
  });
  const body = PL.ellipse(x, y + 8 * s, 6 * s, 40 * s);
  PL.tint(g, body, PL.T.brown, 0.9); PL.ink(g, body, 3);
}
// 弾丸（横から。とがった先・胴・底）
function bullet(g, x, y, s) {
  const L = 150 * s, R = 26 * s, nose = 70 * s;
  const p = g2 => { g2.moveTo(x - L / 2, y - R); g2.lineTo(x + L / 2 - nose, y - R); g2.quadraticCurveTo(x + L / 2 - nose * 0.3, y - R, x + L / 2, y); g2.quadraticCurveTo(x + L / 2 - nose * 0.3, y + R, x + L / 2 - nose, y + R); g2.lineTo(x - L / 2, y + R); g2.closePath(); };
  PL.tint(g, p, PL.T.gold, 0.75);
  PL.hatch(g, p, { angle: 0.2, gap: 6, w: 1.6, not: PL.rect(0, 0, PW, y + R * 0.2) });
  PL.ink(g, gg => { gg.moveTo(x - L / 2 + 22 * s, y - R); gg.lineTo(x - L / 2 + 22 * s, y + R); gg.moveTo(x - L / 2 + 30 * s, y - R); gg.lineTo(x - L / 2 + 30 * s, y + R); gg.moveTo(x - L / 2 + 10, y - R * 0.55); gg.lineTo(x + L / 2 - nose, y - R * 0.55); }, 1.8);
  PL.ink(g, p, 5);
  PL.ink(g, gg => { for (let k = 0; k < 3; k++) { const yy = y - R * 0.6 + k * R * 0.6; gg.moveTo(x - L / 2 - 30 - k * 20, yy); gg.lineTo(x - L / 2 - 110 - k * 20, yy); } }, 3, 'rgba(35,28,21,0.6)');   // まっすぐ飛ぶ線
}
// 1円玉（アルミ。若木のもよう）
function coin(g, x, y, r) {
  const c = PL.circle(x, y, r);
  PL.tint(g, c, PL.T.gray, 0.45);
  PL.hatch(g, c, { angle: 0.7, gap: 10, w: 1.8, not: PL.circle(x - r * 0.25, y - r * 0.25, r), cx: x, cy: y });
  PL.ink(g, c, 6); PL.ink(g, PL.circle(x, y, r * 0.9), 2);
  const ex = x - r * 0.45, ey = y + r * 0.15;   // 若木（左がわ。右がわの物差しとかさねない）
  PL.ink(g, gg => { gg.moveTo(ex, ey + r * 0.45); gg.lineTo(ex, ey - r * 0.25); }, 4);
  [[-1, -0.12], [1, -0.02], [-1, 0.12], [1, 0.22]].forEach(([d, v]) => { const lf = PL.ellipse(ex + d * r * 0.1, ey + v * r, r * 0.11, r * 0.05, d * 0.5); PL.tint(g, lf, PL.T.leaf, 0.6); PL.ink(g, lf, 2.4); });
}

function draw(g, t) {

    if (t > 0.9) {
      const p = clamp(TK.pop(t, 0.9, 0.3), 0, 1.2);
      PL.ink(g, gg => { gg.moveTo(540 - 200 * p, 480 - 200 * p); gg.lineTo(540 + 200 * p, 480 + 200 * p); gg.moveTo(540 + 200 * p, 480 - 200 * p); gg.lineTo(540 - 200 * p, 480 + 200 * p); }, 30, PL.RED);
