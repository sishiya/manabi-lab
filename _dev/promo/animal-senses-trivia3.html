<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく animal-senses-3（型G ループ）「トナカイには、雪の上のエサが黒く見える」。台本は trivia/animal-senses.md。?short で録る
// 出どころ: Hogg ほか (2011) J Exp Biol 214:2014–2019（角膜・水晶体は約300〜320 nm まで透過、ハナゴケのなかまは紫外線を強く吸う（Petzold & Goward 1988 を引用）、
// オオカミと白い毛は紫外線の反射が低い（Reynolds & Lavigne 1981 を引用）、冬の薄明かりは短い波長が多い）。
// 「エサとオオカミがくっきり」は著者の説（トナカイがそれで見つけている実験ではない）→ 画面に「説」。紫外線の白黒は想像図
const DUR = 15;
const subs = [
  { a: 0.0, b: 3.0, ja: '雪はまっ白。だから、トナカイは…', en: 'Snow is pure white. So reindeer…' },
  { a: 3.0, b: 7.0, ja: '[紫外線]が見える。雪は紫外線をはね返し\nエサのコケは吸いこむ', en: '…see ultraviolet. Snow reflects UV,\nwhile their lichen food absorbs it' },
  { a: 7.0, b: 11.0, ja: 'エサも、天敵オオカミの毛も\n雪の上で[黒く浮かぶ]…という説', en: 'Food, and even a wolf’s fur,\nstand out dark on the snow — so the idea goes' },
  { a: 11.0, b: 15.0, ja: '冬の北極は紫外線の多い薄明かりが長い。\n雪はまっ白。だから、トナカイは…', en: 'Arctic winters bring long, UV-rich twilight.\nSnow is pure white. So reindeer…', size: 56 },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.2, type: 'ding' }, { t: 7.0, type: 'pop' }, { t: 8.2, type: 'pop' },
  { t: 11.0, type: 'whoosh' }, { t: 13.6, type: 'whoosh' },
];
const rnd = (i, j = 0) => { const s = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return s - Math.floor(s); };
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// 色: [人の目, 紫外線の白黒]
const COL = {
  sky: [[120, 150, 205], [120, 120, 120]],
  snow: [[236, 242, 252], [246, 246, 246]],
  snow2: [[214, 224, 242], [226, 226, 226]],
  lichen: [[214, 218, 200], [28, 28, 28]],
  wolf: [[226, 222, 210], [62, 62, 62]],
  deer: [[120, 100, 80], [90, 90, 90]],
};
const C = (name, k) => rgb(mix(COL[name][0], COL[name][1], k));
const BX = 70, BY = 250, BW = 940, BH = 820;

function reindeer(g, x, y, s, col, line) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col; g.strokeStyle = line; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
  // 脚
  for (const lx of [-70, -45, 50, 75]) { g.beginPath(); g.moveTo(lx, 20); g.lineTo(lx + 4, 120); g.lineWidth = 10; g.strokeStyle = col; g.stroke(); }
  g.lineWidth = 4; g.strokeStyle = line;
  g.beginPath(); g.ellipse(0, 0, 105, 50, 0, 0, Math.PI * 2); g.fill(); g.stroke();                       // 胴
  g.beginPath(); g.moveTo(80, -20); g.lineTo(130, -90); g.lineTo(160, -80); g.lineTo(120, 0); g.closePath(); g.fill(); g.stroke();   // 首
  g.beginPath(); g.ellipse(170, -95, 42, 22, 0.3, 0, Math.PI * 2); g.fill(); g.stroke();                 // 頭
  // 角
  g.lineWidth = 6;
  g.beginPath(); g.moveTo(150, -112); g.quadraticCurveTo(120, -190, 160, -250); g.moveTo(132, -170); g.lineTo(100, -200); g.moveTo(142, -215); g.lineTo(115, -245);
  g.moveTo(165, -112); g.quadraticCurveTo(170, -180, 210, -230); g.moveTo(178, -165); g.lineTo(205, -185); g.stroke();
  g.restore();
}
function wolf(g, x, y, s, col, line) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col; g.strokeStyle = line; g.lineWidth = 4; g.lineJoin = 'round';
  for (const lx of [-50, -30, 35, 55]) { g.fillRect(lx - 6, 10, 12, 70); }
  g.beginPath(); g.ellipse(0, 0, 75, 32, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-70, -5); g.quadraticCurveTo(-120, 10, -125, 50); g.lineTo(-110, 45); g.quadraticCurveTo(-100, 15, -68, 10); g.fill(); g.stroke();   // しっぽ
  g.beginPath(); g.moveTo(55, -15); g.lineTo(95, -50); g.lineTo(100, -75); g.lineTo(110, -52); g.lineTo(140, -35); g.lineTo(105, -15); g.lineTo(70, 10); g.closePath(); g.fill(); g.stroke();
  g.restore();
}
// 雪原の場面。k: 0=人の目、1=紫外線の白黒
function scene(g, t, k, showWolf) {
  g.fillStyle = C('sky', k); g.fillRect(BX, BY, BW, BH);
  g.fillStyle = C('snow2', k); g.beginPath(); g.moveTo(BX, BY + 330); g.quadraticCurveTo(BX + 300, BY + 270, BX + 560, BY + 320); g.quadraticCurveTo(BX + 800, BY + 360, BX + BW, BY + 300); g.lineTo(BX + BW, BY + BH); g.lineTo(BX, BY + BH); g.fill();
  g.fillStyle = C('snow', k); g.beginPath(); g.moveTo(BX, BY + 420); g.quadraticCurveTo(BX + 400, BY + 380, BX + BW, BY + 440); g.lineTo(BX + BW, BY + BH); g.lineTo(BX, BY + BH); g.fill();
  // コケ（ハナゴケのなかま）のかたまり
  g.fillStyle = C('lichen', k);
  for (let i = 0; i < 26; i++) {
    const x = BX + 30 + rnd(i) * (BW - 60), y = BY + 450 + rnd(i, 1) * (BH - 480), r = 14 + rnd(i, 2) * 26;
    for (let j = 0; j < 5; j++) { g.beginPath(); g.arc(x + (rnd(i, j + 3) - 0.5) * r * 1.6, y + (rnd(i, j + 9) - 0.5) * r * 0.6, r * (0.4 + 0.4 * rnd(i, j + 5)), 0, Math.PI * 2); g.fill(); }
  }
  if (showWolf > 0) { g.save(); g.globalAlpha *= showWolf; wolf(g, BX + 720, BY + 330, 0.85, C('wolf', k), k > 0.5 ? 'rgba(0,0,0,0.3)' : 'rgba(180,180,200,0.6)'); g.restore(); }
  reindeer(g, BX + 230, BY + 600, 1.05, C('deer', k), k > 0.5 ? 'rgba(50,50,50,0.9)' : 'rgba(60,40,30,0.8)');
}

function draw(g, t) {
  // 紫外線の白黒への切りかえ（ワイプ）: 3.0〜4.0 で左→右、13.6〜14.6 で戻る
  const wipeIn = clamp((t - 3.0) / 1.0, 0, 1), wipeOut = clamp((t - 13.6) / 1.0, 0, 1);
  const showWolf = clamp((t - 7.0) / 0.6, 0, 1);
  g.save();
  g.beginPath(); g.roundRect(BX, BY, BW, BH, 30); g.clip();
  scene(g, t, 0, showWolf);
  const wx = BX + BW * ease(wipeIn) * (1 - ease(wipeOut));
  if (wx > BX + 1) {
    g.save(); g.beginPath(); g.rect(BX, BY, wx - BX, BH); g.clip(); scene(g, t, 1, showWolf); g.restore();
    if (wipeIn < 1 || wipeOut > 0) { g.strokeStyle = TK.C.acc; g.lineWidth = 6; g.beginPath(); g.moveTo(wx, BY); g.lineTo(wx, BY + BH); g.stroke(); }
  }
  // 冬の薄明かり（11〜14.6）
  const dusk = clamp((t - 11.0) / 1.2, 0, 1) * (1 - clamp((t - 13.6) / 1.0, 0, 1));
  if (dusk > 0) { g.fillStyle = `rgba(40,70,170,${0.35 * dusk})`; g.fillRect(BX, BY, BW, BH); }
  g.restore();
  g.save(); g.strokeStyle = 'rgba(160,190,255,0.5)'; g.lineWidth = 4; g.beginPath(); g.roundRect(BX, BY, BW, BH, 30); g.stroke(); g.restore();
  // 見出し
  const uv = wipeIn > 0.5 && wipeOut < 0.5;
  TK.text(g, uv ? '紫外線で見ると（白黒・想像図）' : '人の目で見ると', PW / 2, 190, 58, { color: uv ? TK.C.acc : TK.C.sub });
  if (t > 4.2 && t < 11.0) {
    g.save(); g.globalAlpha = TK.pop(t, 4.2) * fade(t, 4.2, 11.0, 0.3);
    TK.text(g, 'エサのコケ', BX + 640, BY + 700, 46, { color: '#000', blur: 0, stroke: 'rgba(255,255,255,0.9)' });
    g.restore();
  }
  if (t > 8.2 && t < 11.0) {
    g.save(); g.globalAlpha = TK.pop(t, 8.2) * fade(t, 8.2, 11.0, 0.3);
    TK.text(g, 'オオカミ', BX + 720, BY + 220, 46, { color: '#000', blur: 0, stroke: 'rgba(255,255,255,0.9)' });
    g.restore();
  }
  if (t >= 3.0 && t < 7.0) TK.note(g, t, 3.0, 7.0, 'トナカイの角膜・水晶体は 約300〜320 nm の紫外線まで通す', { size: 30 });
  if (t >= 7.0 && t < 11.0) TK.note(g, t, 7.0, 11.0, '「くっきり見えて役に立つ」は著者の説（見つけている実験ではない）', { size: 30 });
  if (t >= 11.0) TK.note(g, t, 11.0, 15.0, '出どころ: Hogg ほか (2011) J Exp Biol 214: 2014–2019', { size: 30 });
}

triviaStart({ out: 'animal-senses-trivia3', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
