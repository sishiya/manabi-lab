<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく black-hole-2（型A ぜんぶ逆）「大きなブラックホールは、平均すると空気より軽い」。台本は trivia/black-hole.md。?short で録る
// 平均の密度 = 重さ ÷（地平線の半径 r=2GM/c² の、ふつうの球の体積）。太陽の重さで 1.84e19 kg/m³、M⁻² に比例。
// 水と同じ 1.36e8 太陽、M87*（6.5e9 太陽、EHT 2019）で 0.44 kg/m³、空気 1.225 kg/m³（国際標準大気）
const DUR = 30;
const RHO_SUN = 1.84e19;
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹', sup = n => (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(d => SUP[d]).join('');
const sci = v => { const e = Math.floor(Math.log10(v) + 1e-9), m = v / Math.pow(10, e); return e >= -1 && e <= 3 ? (v >= 10 ? Math.round(v).toLocaleString('ja-JP') : v.toFixed(2)) : m.toFixed(1) + '×10' + sup(e); };
const jaNum = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '億' : n >= 1e4 ? Math.round(n / 1e4).toLocaleString('ja-JP') + '万' : Math.round(n).toLocaleString('ja-JP');

const subs = [
  { a: 0.0, b: 2.6, ja: 'ブラックホールは、ぎゅうぎゅう…\n大きいものは、[平均すると]ちがう', en: 'Black holes are packed tight... but the big ones, on average, are not', noBurn: true },
  { a: 2.6, b: 8.0, ja: '太陽をブラックホールにすると、直径たった[6km]\n平均すると、1cm³で[180億トン]', en: 'Turn the Sun into a black hole: just 6 km across.\nOn average, 18 billion tonnes per cm³' },
  { a: 8.0, b: 15.0, ja: '重くするほど、地平線は重さに比例して大きくなる\n体積は3乗で増えるので、[平均の密度は下がる]', en: 'Make it heavier and the horizon grows in proportion.\nVolume grows as the cube, so the average density drops' },
  { a: 15.0, b: 19.0, ja: '太陽の[1億4千万倍]で、水と同じ', en: 'At 140 million Suns, it matches water' },
  { a: 19.0, b: 26.0, ja: '人類が初めて写した M87 のブラックホールは太陽の65億倍\n平均すると、[空気よりすかすか]', en: 'M87*, the first black hole ever imaged, weighs 6.5 billion Suns.\nOn average, it is less dense than air' },
  { a: 26.0, b: 30.0, ja: '重いほど、すかすか。\n…なのに、[光も出られない]', en: 'The heavier, the emptier.\n...and still, not even light gets out' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 2.6, type: 'whoosh' }, { t: 3.4, type: 'thud' }, { t: 5.4, type: 'ding' },
  { t: 8.0, type: 'rise' }, { t: 15.0, type: 'ding' }, { t: 19.0, type: 'whoosh' }, { t: 21.5, type: 'pop' }, { t: 23.0, type: 'ding' },
  { t: 26.0, type: 'pop' }, { t: 28.0, type: 'thud' },
];

// ブラックホール（黒い丸＋光の輪）。r は地平線の半径の絵の大きさ
function hole(g, x, y, r, t, f = 1) {
  g.save(); g.globalAlpha *= f;
  const gl = g.createRadialGradient(x, y, r * 0.9, x, y, r * 1.9);
  gl.addColorStop(0, 'rgba(255,170,80,0.85)'); gl.addColorStop(0.35, 'rgba(255,120,40,0.35)'); gl.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 1.9, 0, Math.PI * 2); g.fill();
  g.lineWidth = Math.max(2, r * 0.08); g.strokeStyle = 'rgba(255,214,150,0.9)';
  g.beginPath(); g.arc(x, y, r * 1.12, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#000'; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.restore();
}
function balloon(g, x, y, s, t) {
  const by = y + Math.sin(t * 2.2) * 10 * s;
  g.save();
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, by + 95 * s);
  g.bezierCurveTo(x - 20 * s, by + 160 * s, x + 20 * s, by + 220 * s, x, by + 290 * s); g.stroke();
  const gr = g.createRadialGradient(x - 25 * s, by - 30 * s, 5, x, by, 100 * s);
  gr.addColorStop(0, '#ffd2d2'); gr.addColorStop(1, '#e94b5a');
  g.fillStyle = gr; g.beginPath(); g.ellipse(x, by, 78 * s, 95 * s, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(x - 10 * s, by + 100 * s); g.lineTo(x + 10 * s, by + 100 * s); g.lineTo(x, by + 88 * s); g.fill();
  g.restore();
}
// 重さ（太陽の何倍、log10）を時刻で
function logM(t) {
  if (t < 8.0) return 0;
  if (t < 15.0) return 7.6 * ease((t - 8.0) / 7.0);
  if (t < 19.0) return lerp(7.6, 8.1324, ease((t - 15.0) / 1.2));
  if (t < 26.0) return lerp(8.1324, Math.log10(6.5e9), ease((t - 19.4) / 2.2));
  return Math.log10(6.5e9);
}
// 密度のものさし（右がわ、縦、対数）。10^20 〜 10^-1 kg/m³
const GX = 870, GY0 = 260, GY1 = 1060;
const gaugeY = lr => lerp(GY0, GY1, (20 - lr) / 21);
function gauge(g, t, rho, f) {
  g.save(); g.globalAlpha *= f;
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 6; g.beginPath(); g.moveTo(GX, GY0); g.lineTo(GX, GY1); g.stroke();
  [[3, '水', TK.C.acc2], [Math.log10(1.225), '空気', TK.C.green]].forEach(([lr, s, c]) => {
    const y = gaugeY(lr);
    g.strokeStyle = c; g.lineWidth = 4; g.beginPath(); g.moveTo(GX - 40, y); g.lineTo(GX + 40, y); g.stroke();
    TK.text(g, s, GX - 54, y, 40, { align: 'right', color: c });
  });
  const y = gaugeY(clamp(Math.log10(rho), -1, 20));
  g.fillStyle = TK.C.acc; g.beginPath(); g.moveTo(GX + 14, y); g.lineTo(GX + 50, y - 22); g.lineTo(GX + 50, y + 22); g.fill();
  TK.text(g, '平均の密度', GX, GY0 - 50, 36, { color: TK.C.sub, bold: false });
  g.restore();
}

function draw(g, t) {
  // 0〜2.6: フック
  if (t < 2.6) {
    hole(g, 330, 760, 150, t);
    balloon(g, 760, 690, 1.15, t);
    TK.hook(g, t, 0.0, 2.6, '平均すると、\n空気より[すかすか]', { y: 330, size: 118 });
    TK.text(g, 'ブラックホール', 330, 1010, 46, { color: TK.C.sub });
    TK.text(g, '空気', 760, 1010, 46, { color: TK.C.sub });
  }
  // 2.6〜8: 太陽が縮んで直径6km
  if (t >= 2.6 && t < 8.0) {
    const k = ease((t - 2.8) / 1.6);
    if (k < 1) {
      g.save(); const r = lerp(380, 60, k);
      const gr = g.createRadialGradient(540, 700, 0, 540, 700, r); gr.addColorStop(0, '#fff6c8'); gr.addColorStop(0.7, '#ffc24a'); gr.addColorStop(1, 'rgba(255,140,40,0.2)');
      g.fillStyle = gr; g.globalAlpha = 1 - k * 0.6; g.beginPath(); g.arc(540, 700, r, 0, Math.PI * 2); g.fill(); g.restore();
    }
    if (k > 0.6) hole(g, 540, 700, 60, t, clamp((k - 0.6) / 0.4, 0, 1));
    TK.card(g, 170, 200, 740, 150);
    TK.text(g, k < 1 ? '太陽' : '太陽の重さのブラックホール', PW / 2, 275, 60);
    if (t > 3.8) {
      g.save(); g.globalAlpha = fade(t, 3.8, 8.0, 0.3);
      TK.text(g, '直径 [5.9 km]', PW / 2, 900, 80);
      g.restore();
    }
    if (t > 5.2) {
      g.save(); g.globalAlpha = fade(t, 5.2, 8.0, 0.3);
      TK.text(g, '1cm³ あたり [180億トン]', PW / 2, 1030, 72);
      g.restore();
    }
  }
  // 8〜26: 重くすると、球が大きく、密度が下がる
  if (t >= 8.0 && t < 26.0) {
    const lm = logM(t), M = Math.pow(10, lm), rho = RHO_SUN / (M * M);
    const f = fade(t, 8.0, 26.0, 0.3);
    const r = 40 + 22 * lm;   // 絵は対数（本当は重さに比例）
    hole(g, 420, 660, r, t, f);
    g.save(); g.globalAlpha = f;
    TK.card(g, 90, 180, 660, 130);
    TK.text(g, '重さ: 太陽の [' + jaNum(M) + '] 倍', 420, 245, 62, { maxw: 620 });
    TK.text(g, sci(rho) + ' kg/m³' + (t >= 23.0 ? ' ＜ 空気 1.2' : ''), 400, 1025, 62, { maxw: 560, color: rho < 1.225 ? TK.C.green : rho < 1500 ? TK.C.acc2 : '#fff' });
    g.restore();
    gauge(g, t, rho, f);
    if (t >= 9.5 && t < 15.0) {
      g.save(); g.globalAlpha = fade(t, 9.5, 15.0, 0.3);
      TK.text(g, '重さ ×10 → 半径 ×10 → 体積 ×1000', 420, 350, 40, { color: TK.C.sub, maxw: 640 });
      g.restore();
    }
    if (t >= 15.4 && t < 19.0) { g.save(); g.globalAlpha = fade(t, 15.4, 19.0, 0.3); TK.text(g, '[水]と同じ', 420, 355, 64); g.restore(); }
    if (t >= 21.6) {
      g.save(); g.globalAlpha = fade(t, 21.6, 26.0, 0.3);
      TK.text(g, 'M87*（初めて写されたブラックホール）', 420, 350, 40, { color: TK.C.sub, maxw: 640 });
      g.restore();
    }
    TK.note(g, t, 8.0, 26.0, '重さを、地平線の大きさのふつうの球の体積で割った目安／絵の大きさは桁で', { size: 30 });
  }
  // 26〜30: まとめ
  if (t >= 26.0) {
    hole(g, 540, 650, 230, t);
    g.save(); g.globalAlpha = fade(t, 26.0, 31, 0.3);
    TK.lines(g, '重いほど、すかすか\n（平均すると）', PW / 2, 260, 84, { lh: 1.25 });
    g.restore();
    TK.note(g, t, 27.4, 30.0, '出どころ: EHT Collaboration (2019) ApJL 875 L6・r = 2GM/c²（一般相対論）\n空気 1.225 kg/m³（国際標準大気）', { size: 28 });
  }
}

triviaStart({ out: 'black-hole-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
