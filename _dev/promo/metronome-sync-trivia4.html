<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>

</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく metronome-sync-2（型F 会話）「ホイヘンスは、寝こんでいた」。台本は trivia/metronome-sync.md。?short で録る
// （metronome-sync-trivia1〜3 はもうあるので、台本2をこの trivia4 にした）
// 数字・話: Pikovsky ほか 2001（Synchronization, 付録 A1）: 1665-02-26 の父への手紙、数日ベッドにいた、ずらしても30分でそろいにもどる、空気の動きのせいと考えた。
// 梁の目に見えない動き: Scientific American 2000-09-11。再現の時計がいつも逆向きにそろった: ScienceDaily 2000-09-21（Bennett ほか 2002）。
// 振り子の絵はモデルではなく絵（逆向きの位相をそのまま描く。ずれが戻る時間はちぢめてある）。病名は言わない。
// 声はまだ（2人の会話。字幕の上に「聞き手」「答える人」の札を出す。札は net-route-trivia3 の書き方）
const DUR = 35;
const subs = [
  { a: 0.0, b: 1.7, who: 'q', ja: '振り子がひとりでにそろうって、だれが見つけたの？', en: 'Q: Who discovered that pendulums fall in step on their own?', noBurn: true },
  { a: 1.7, b: 3.0, who: 'a', ja: '[寝こんでた]人。', en: 'A: Someone stuck in bed.' },
  { a: 3.0, b: 9.0, who: 'a', ja: '1665年、オランダの[ホイヘンス]。\n数日ベッドから出られなくて、\n部屋の時計2つをずっと見てたの。', en: 'A: Huygens, in the Netherlands, 1665. He couldn’t leave his bed for days,\nso he kept watching the two clocks in his room.' },
  { a: 9.0, b: 10.6, who: 'q', ja: 'ひまだね。', en: 'Q: Sounds boring.' },
  { a: 10.6, b: 15.0, who: 'a', ja: 'そしたら、2つの振り子が、\n[ぴったりそろってる]。', en: 'A: Then he noticed the two pendulums\nswinging perfectly in step.' },
  { a: 15.0, b: 19.6, who: 'a', ja: 'わざとずらしても、\n[30分]たつと、また元どおり。', en: 'A: Even when he threw them off on purpose,\nwithin 30 minutes they were back in step.' },
  { a: 19.6, b: 21.0, who: 'q', ja: 'こわい。', en: 'Q: Creepy.' },
  { a: 21.0, b: 24.6, who: 'a', ja: '本人ははじめ、振り子が起こす\n[空気の流れ]のせいだと思った。', en: 'A: At first he blamed the air currents\nstirred up by the pendulums.' },
  { a: 24.6, b: 28.0, who: 'a', ja: 'でも本当は、時計をかけた木が、\n目に見えないくらい動いて、[つないでいた]。', en: 'A: But really, the wooden beam holding the clocks moved, too slightly to see,\nand linked them.' },
  { a: 28.0, b: 32.4, who: 'a', ja: '340年後に同じ時計を作った実験でも、\nやっぱりそろった。いつも、[逆向きに]。', en: 'A: About 340 years later, replica clocks synced too.\nAlways in opposite directions.' },
  { a: 32.4, b: 35.0, who: 'q', ja: '寝こむのも、[むだじゃない]ね。', en: 'Q: So being stuck in bed wasn’t a waste.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.7, type: 'ding' }, { t: 3.0, type: 'whoosh' }, { t: 3.4, type: 'pop' },
  { t: 9.0, type: 'pop' }, { t: 10.6, type: 'rise' }, { t: 12.0, type: 'ding' },
  { t: 15.6, type: 'thud' }, { t: 16.5, type: 'tick' }, { t: 17.5, type: 'tick' }, { t: 18.5, type: 'tick' }, { t: 19.3, type: 'ding' }, { t: 19.6, type: 'pop' },
  { t: 21.0, type: 'whoosh' }, { t: 22.4, type: 'buzz' }, { t: 24.6, type: 'whoosh' }, { t: 25.6, type: 'ding' },
  { t: 28.0, type: 'whoosh' }, { t: 29.0, type: 'pop' }, { t: 32.4, type: 'pop' },
];

// 振り子の見た目の動き（絵）。周期 1.4 秒・ふれはば 0.3 rad。2本目は逆向き（π ずれ）＋ d（ずらした分）
const WS = 2 * Math.PI / 1.4, AMP = 0.3;
function shiftAt(t) {   // ずらした量（15.6 で 1.5 rad、16.4〜19.3 で 0 へ。本当は 30 分 → ちぢめてある）
  if (t < 15.6 || t > 21.0) return 0;
  if (t < 16.4) return 1.5 * ease((t - 15.6) / 0.25);
  return 1.5 * (1 - ease((t - 16.4) / 2.9));
}
function angs(t) { return [AMP * Math.sin(WS * t), AMP * Math.sin(WS * t + Math.PI + shiftAt(t))]; }

// 振り子時計（17世紀の箱の時計の線画）。x, y はかけた所（上のまん中）。s: 大きさ、ang: 振り子の角度、min: 長い針（分）
function pclock(g, x, y, s, ang, o = {}) {
  const P = (px, py) => [x + px * s, y + py * s], lw = Math.max(2, 3 * s), ow = Math.max(3, 4.5 * s);
  const hood = PL.poly([P(-78, 24), P(0, -18), P(78, 24)]), cas = PL.poly([P(-85, 24), P(85, 24), P(85, 460), P(-85, 460)]);
  PL.tint(g, cas, PL.T.wood, 0.75); PL.tint(g, hood, PL.T.wood, 0.9);
  PL.ink(g, gg => { for (let i = 0; i < 5; i++) { const xx = -70 + i * 34; gg.moveTo(...P(xx, 30)); gg.bezierCurveTo(...P(xx + 6, 160), ...P(xx - 6, 300), ...P(xx + 4, 455)); } }, lw * 0.4, 'rgba(35,28,21,0.4)');   // 木目
  PL.hatch(g, cas, { angle: 0.9, gap: Math.max(7, 8 * s), w: lw * 0.6, not: PL.poly([P(-85, 24), P(40, 24), P(40, 460), P(-85, 460)]) });
  PL.ink(g, cas, ow); PL.ink(g, hood, ow);
  const win = PL.rect(...P(-66, 165), 132 * s, 282 * s); PL.tint(g, win, PL.T.brown, 0.55); PL.ink(g, win, lw);   // 振り子の窓
  const dial = PL.circle(...P(0, 90), 58 * s); PL.tint(g, dial, PL.T.sand, 0.9); PL.ink(g, dial, ow);
  PL.ink(g, gg => { for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; gg.moveTo(...P(Math.sin(a) * 44, 90 - Math.cos(a) * 44)); gg.lineTo(...P(Math.sin(a) * 53, 90 - Math.cos(a) * 53)); } }, lw * 0.8);
  const mn = (o.min ?? 10) / 60 * Math.PI * 2, hr = ((o.hour ?? 3) + (o.min ?? 10) / 60) / 12 * Math.PI * 2;
  PL.ink(g, gg => { gg.moveTo(...P(0, 90)); gg.lineTo(...P(Math.sin(hr) * 28, 90 - Math.cos(hr) * 28)); }, ow * 1.1);
  PL.ink(g, gg => { gg.moveTo(...P(0, 90)); gg.lineTo(...P(Math.sin(mn) * 46, 90 - Math.cos(mn) * 46)); }, ow * 0.8, o.minColor || PL.INK);
  // 振り子（棒とおもり）
  const px = x, py = y + 172 * s, c = Math.cos(ang), n = Math.sin(ang), Q = (u, v) => [px + s * (u * c - v * n), py + s * (u * n + v * c)];
  g.save(); g.beginPath(); win(g); g.clip();
  PL.ink(g, gg => { gg.moveTo(...Q(0, 0)); gg.lineTo(...Q(0, 225)); }, ow);
  const bob = PL.circle(...Q(0, 235), 24 * s); PL.tint(g, bob, o.bob || PL.T.gold, 1); PL.hatch(g, bob, { angle: 0.8, gap: Math.max(7, 6 * s), w: lw * 0.6, not: PL.circle(...Q(-8, 227), 24 * s) }); PL.ink(g, bob, ow * 0.9);
  g.restore();
}
// 木の梁（時計をかける横木）。dx: 横のずれ（大げさに）
function beam(g, y, dx = 0, o = {}) {
  const b = PL.rect(110 + dx, y - 28, PW - 340, 56);
  PL.tint(g, b, PL.T.wood, 0.8);
  PL.ink(g, gg => { for (let i = 0; i < 3; i++) { gg.moveTo(140 + dx, y - 12 + i * 12); gg.bezierCurveTo(360 + dx, y - 20 + i * 12, 560 + dx, y - 2 + i * 12, 830 + dx, y - 10 + i * 12); } }, 1.6, 'rgba(35,28,21,0.45)');
  PL.hatch(g, b, { angle: 0.9, gap: 8, w: 1.6, not: PL.rect(110 + dx, y - 28, PW - 340, 30) });
  PL.ink(g, b, o.hi ? 7 : 5, o.hi ? PL.RED : PL.INK);
}
// ベッド（寝ている人は頭と髪だけ）
function bed(g, x, y, s) {
  const P = (px, py) => [x + px * s, y + py * s], R = (a, b, w, h) => PL.rect(...P(a, b), w * s, h * s), ow = Math.max(3, 4.5 * s);
  const head = R(-380, -150, 40, 230), frame = R(-340, -20, 700, 60);
  [head, frame].forEach(p => { PL.tint(g, p, PL.T.wood, 0.8); PL.hatch(g, p, { angle: 0.9, gap: 8, w: 1.6 }); PL.ink(g, p, ow); });
  PL.ink(g, gg => { gg.moveTo(...P(-340, 40)); gg.lineTo(...P(-340, 80)); gg.moveTo(...P(360, 40)); gg.lineTo(...P(360, 80)); }, ow * 1.4);
  const pillow = PL.ellipse(...P(-280, -40), 58 * s, 22 * s); PL.tint(g, pillow, '#f4eedc', 0.9); PL.ink(g, pillow, ow * 0.8);
  const hd = PL.circle(...P(-245, -66), 34 * s); PL.tint(g, hd, PL.T.rose, 0.6); PL.ink(g, hd, ow * 0.9);
  const hair = PL.poly([P(-278, -64), P(-272, -92), P(-245, -102), P(-216, -90), P(-226, -78), P(-250, -84), P(-262, -62)]); PL.tint(g, hair, PL.T.brown, 0.9); PL.hatch(g, hair, { angle: 0.4, gap: 7, w: 1.4 }); PL.ink(g, hair, ow * 0.7);
  const blanket = PL.poly([P(-200, -20), ...qB(P(-200, -20), P(-120, -96), P(220, -92), P(352, -24)), P(352, -20)]);
  PL.tint(g, blanket, PL.T.sea, 0.55); PL.hatch(g, blanket, { angle: 0.9, gap: 9, w: 1.6, not: PL.poly([P(-200, -60), P(360, -90), P(360, -120), P(-200, -120)]) });
  PL.ink(g, gg => { for (let i = 1; i < 5; i++) { gg.moveTo(...P(-200 + i * 110, -24)); gg.quadraticCurveTo(...P(-190 + i * 110, -50), ...P(-200 + i * 110 + 20, -78)); } }, 1.6, 'rgba(35,28,21,0.5)');   // ふとんのしわ
  PL.ink(g, blanket, ow);
}
function qB(p0, c1, c2, p1, n = 16) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, a = (1 - t) ** 3, b = 3 * t * (1 - t) ** 2, c = 3 * t * t * (1 - t), d = t ** 3; return [a * p0[0] + b * c1[0] + c * c2[0] + d * p1[0], a * p0[1] + b * c1[1] + c * c2[1] + d * p1[1]]; }); }
function tag(g, t) {   // 字幕の帯のすぐ上に「聞き手」「答える人」の札
  const s = subs.find(x => t >= x.a && t < x.b && !x.noBurn); if (!s) return;
  const q = s.who === 'q', f = fade(t, s.a, s.b, 0.12);
  g.save(); g.globalAlpha = f;
  const lines = s.ja.split('\n').length, y = PL.SUBY - PL.bandH(lines) - 42;
  const w = 220, x = PW / 2 - w / 2;
  TK.card(g, x, y - 30, w, 60, {});
  PL.label(g, q ? '聞き手' : '答える人', PW / 2, y + 2, 34, { color: q ? '#2f5f7a' : PL.RED });
  g.restore();
}
// 2つの時計を梁にかけた場面
const BY = 400, X1 = 330, X2 = 690;
function twoClocks(g, t, o = {}) {
  const [a1, a2] = angs(t), dx = o.wob ? 7 * Math.sin(WS * t) : 0;
  beam(g, BY, dx, o);
  pclock(g, X1 + dx, BY + 20, o.s || 1, a1, { min: o.min, hour: o.hour });
  pclock(g, X2 + dx, BY + 20, o.s || 1, a2, { bob: PL.T.sea, min: o.min, hour: o.hour, minColor: o.minColor });
}
function ok(g, x, y, rx, ry, k) { g.save(); g.globalAlpha *= k; PL.ink(g, PL.ellipse(x, y, rx, ry), 12, PL.GREEN); g.restore(); }
function ng(g, x0, y0, x1, y1, k) { g.save(); g.globalAlpha *= k; PL.ink(g, gg => { gg.moveTo(x0, y0); gg.lineTo(x1, y1); gg.moveTo(x1, y0); gg.lineTo(x0, y1); }, 14, PL.RED); g.restore(); }

function draw(g, t) {
  // 0〜3: フック。時計2つ＋ベッド「1665年2月」
  if (t < 3.0) {
    const [a1, a2] = angs(t + 9);
    PL.label(g, '[1665年2月]', PW / 2 - 60, 290, 80);
    beam(g, 400);
    pclock(g, X1, 420, 0.68, a1);
    pclock(g, X2, 420, 0.68, a2, { bob: PL.T.sea });
    bed(g, 520, 960, 1.0);
    TK.hook(g, t, 0.15, 1.7, 'だれが\n見つけた？', { y: 1130, size: 110 });
  }
  // 3〜9: 父への手紙
  if (t >= 3.0 && t < 9.0) {
    const k = TK.pop(t, 3.3, 0.4);
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    TK.card(g, 120, 200, PW - 360, 300);
    PL.label(g, '1665年 [2月26日]', PW / 2 - 60, 280, 76);
    PL.label(g, 'ホイヘンス（オランダ）', PW / 2 - 60, 370, 54);
    PL.label(g, '父への手紙より', PW / 2 - 60, 445, 44, { color: TK.C.sub, bold: false });
    g.restore();
    const [a1, a2] = angs(t + 9);
    beam(g, 545);
    pclock(g, 330, 560, 0.5, a1);
    pclock(g, 590, 560, 0.5, a2, { bob: PL.T.sea });
    bed(g, 520, 920, 0.85);
    TK.note(g, t, 3.6, 9, 'なぜベッドにいたのかは、手紙に書かれていない', { size: 32, y: 1045 });
  }
  // 9〜15: 逆向きにそろう
  if (t >= 9.0 && t < 15.0) {
    PL.label(g, '2つの振り子', PW / 2 - 60, 280, 60, { color: TK.C.sub });
    twoClocks(g, t);
    if (t > 11.6) {
      g.save(); g.globalAlpha = fade(t, 11.6, 15, 0.3);
      TK.card(g, 260, 925, 440, 90);
      PL.label(g, '[逆向き]にそろう', PW / 2 - 60, 971, 50);
      const [a1, a2] = angs(t);   // 振れる向きの矢印（おもりの下）
      [[X1, a1], [X2, a2]].forEach(([x, a]) => { const d = Math.sign(Math.cos(WS * t) * (x === X1 ? 1 : -1)) || 1; PL.ink(g, gg => { gg.moveTo(x - 40 * d, 895); gg.lineTo(x + 40 * d, 895); gg.moveTo(x + 22 * d, 883); gg.lineTo(x + 40 * d, 895); gg.lineTo(x + 22 * d, 907); }, 4, PL.RED); });
      g.restore();
    }
  }
  // 15〜21: ずらす → 30分 → また元どおり
  if (t >= 15.0 && t < 21.0) {
    const k = clamp((t - 16.4) / 2.9, 0, 1), m = Math.round(30 * ease(k));
    twoClocks(g, t, { min: 10 + 30 * ease(k), hour: 3, minColor: PL.RED });
    if (t > 15.4 && t < 16.4) {   // 押した印
      g.save(); g.globalAlpha = fade(t, 15.4, 16.4, 0.15);
      PL.ink(g, gg => { gg.moveTo(X2 + 230, 820); gg.lineTo(X2 + 110, 820); gg.moveTo(X2 + 135, 800); gg.lineTo(X2 + 108, 820); gg.lineTo(X2 + 135, 840); }, 8, PL.RED);
      PL.label(g, 'ずらす', X2 + 175, 765, 44, { color: PL.RED });
      g.restore();
    }
    TK.card(g, 240, 200, 480, 120);
    PL.label(g, t < 16.4 ? 'ずれた！' : (k < 1 ? m + ' 分' : '[30分]で元どおり'), PW / 2 - 60, 262, k < 1 ? 64 : 52, { color: k < 1 ? PL.INK : PL.RED });
    TK.note(g, t, 16.4, 21, '絵の時間はちぢめてある（本当は 30 分）', { size: 32, y: 960 });
  }
  // 21〜28: 空気？ × → 木の梁 ○
  if (t >= 21.0 && t < 28.0) {
    const air = t < 24.6;
    twoClocks(g, t, { wob: !air, hi: !air });
    if (air) {
      g.save(); g.globalAlpha = fade(t, 21.2, 24.6, 0.3) * 0.85;
      PL.ink(g, gg => { for (let i = 0; i < 4; i++) { const y = 700 + i * 50; for (let x = 420; x <= 600; x += 6) { const yy = y + 12 * Math.sin((x - 420) / 22 + t * 5 + i); x === 420 ? gg.moveTo(x, yy) : gg.lineTo(x, yy); } } }, 4, '#2f5f7a');
      g.restore();
      TK.card(g, 240, 200, 480, 120);
      PL.label(g, '空気の流れ？', PW / 2 - 60, 262, 60);
      if (t > 22.4) ng(g, 420, 660, 600, 880, fade(t, 22.4, 24.6, 0.2));
    } else {
      TK.card(g, 150, 200, 660, 120);
      PL.label(g, '[木の梁]が ほんの少し動く', PW / 2 - 60, 262, 54);
      if (t > 25.6) ok(g, PW / 2 - 60, BY, 420, 80, fade(t, 25.6, 28, 0.2));
      TK.note(g, t, 24.8, 28, '梁の動きは大げさに描いた（本当は目に見えないほど）', { size: 32, y: 960 });
    }
  }
  // 28〜35: 340年後の再現
  if (t >= 28.0) {
    const k = TK.pop(t, 28.3, 0.4);
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    TK.card(g, 150, 170, PW - 420, 160);
    PL.label(g, '約340年後', PW / 2 - 60, 230, 64, { color: PL.RED });
    PL.label(g, '同じつくりの時計で再現', PW / 2 - 60, 295, 44, { color: TK.C.sub, bold: false });
    g.restore();
    twoClocks(g, t, { s: 0.9 });
    if (t > 29.6) {
      g.save(); g.globalAlpha = fade(t, 29.6, 35, 0.3);
      TK.card(g, 240, 870, 480, 90);
      PL.label(g, 'いつも [逆向き]', PW / 2 - 60, 916, 50);
      g.restore();
    }
    TK.note(g, t, 29.6, 31.6, '再現でも、そろわずに止まってしまうこともあった', { size: 32 });
    TK.note(g, t, 31.8, 35, '出どころ: Pikovsky ほか (2001) Synchronization 付録A1（1665年の手紙）\nBennett ほか (2002) Proc. R. Soc. A 458:563・Scientific American (2000)', { size: 28, y: 1030 });
  }
  tag(g, t);
}

triviaStart({ out: 'metronome-sync-trivia4', dur: DUR, draw, subs, cues, peek: 1.5, voice: 'auto' });
</script>
</body>
</html>
