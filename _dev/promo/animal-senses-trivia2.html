<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく animal-senses-2（型H 当ててみて）「コウモリの声、どれくらい大きい？」。台本は trivia/animal-senses.md。?short で録る
// 出どころ: Surlykke & Kalko (2008) PLoS ONE 3(4):e2036（パナマの11種、122〜134 dB SPL（口から10 cm）、Noctilio は最大140超。水面の反射で約6 dB 大きめかも → 「推定」）。
// 台本の注意どおり: 3択は数字だけ（図書館・電車の目安は出どころを取っていないので出さない）。「ジェット機なみ」は使わない。人に聞こえる高さの数字も出さない
const DUR = 25;
const subs = [
  { a: 0.0, b: 1.6, ja: 'この声、何デシベル？', en: 'How loud is this call?', noBurn: true },
  { a: 1.6, b: 4.0, ja: 'コウモリの超音波、\n口の[10 cm]先で何デシベル？', en: 'A bat’s ultrasonic call —\nhow many decibels, 10 cm from its mouth?' },
  { a: 4.0, b: 6.0, ja: '考えて…', en: 'Think…' },
  { a: 6.0, b: 11.0, ja: '答えは [C]。122〜134 dB。\nいちばん大きい種は[140]をこえた', en: 'The answer is C: 122–134 dB.\nThe loudest species topped 140' },
  { a: 11.0, b: 16.0, ja: 'デシベルは10上がるごとに強さが10倍。\n130は、40の[10億倍]の強さ', en: 'Every 10 dB is 10 times the intensity.\n130 dB is a billion times 40 dB', size: 58 },
  { a: 16.0, b: 21.0, ja: 'でも高すぎて、人の耳には\nまったく聞こえない。だから夜の庭は静か', en: 'But it is too high-pitched for human ears.\nSo the night garden stays quiet' },
  { a: 21.0, b: 25.0, ja: 'そんな大声を出すのは\n遠くの小さな虫の[こだま]を拾うため', en: 'It shouts that loud to catch the faint echo\nof a small insect far away' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.6, type: 'pop' }, { t: 1.78, type: 'pop' }, { t: 1.96, type: 'pop' },
  { t: 4.0, type: 'tick' }, { t: 5.0, type: 'tick' }, { t: 6.0, type: 'ding' }, { t: 6.6, type: 'rise' }, { t: 9.0, type: 'pop' },
  { t: 11.0, type: 'whoosh' }, ...Array.from({ length: 9 }, (_, i) => ({ t: 11.6 + i * 0.32, type: 'tick' })), { t: 14.8, type: 'ding' },
  { t: 16.0, type: 'whoosh' }, { t: 21.0, type: 'whoosh' }, { t: 23.2, type: 'pop' },
];

/// 絵は「図鑑の版画」（trivia-plate.js の PL.*）。コウモリは背中から見た図（腕・指の骨で張る翼膜・親指のつめ・大きな耳・しっぽの膜）、
// ガは上から見た図（前翅・後翅・くし形の触角）。目盛りは墨の線、帯は手彩色、字は形の外に置いて引き出し線でつなぐ
const TAU = Math.PI * 2;
function mapper(x0, y0, s, rot = 0) { const c = Math.cos(rot), n = Math.sin(rot); return (x, y) => [x0 + s * (x * c - y * n), y0 + s * (x * n + y * c)]; }
const pathOf = (m, pts, close = true) => g => { pts.forEach((p, i) => { const q = m(p[0], p[1]); if (p.length > 2) { const c = m(p[0], p[1]), e = m(p[2], p[3]); g.quadraticCurveTo(c[0], c[1], e[0], e[1]); } else if (i) g.lineTo(...q); else g.moveTo(...q); }); if (close) g.closePath(); };
const ellPts = (cx, cy, rx, ry, n = 28) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * TAU) * rx, cy + Math.sin(i / n * TAU) * ry]);
// コウモリ（背中から。頭が上）。rot で向きを変える
function bat(g, x, y, s, t, rot = 0) {
  const f = Math.sin(t * 9) * 0.22, m = mapper(x, y, s, rot), ow = Math.max(2.4, 4 * s), lw = Math.max(1.4, 2.4 * s);
  for (const sd of [-1, 1]) {
    const W = (px, py) => [sd * px, py - f * px * 0.7];   // はばたき: 先ほど上下に動く
    const sh = W(20, -18), el = W(70, -52), wr = W(128, -40), d3 = W(250, -26), d4 = W(222, 38), d5 = W(140, 70), an = W(34, 66);
    const mem = pathOf(m, [sh, el, wr, d3, [...W(214, 6), ...d4], [...W(176, 40), ...d5], [...W(84, 54), ...an], [0, 40]]);
    PL.tint(g, mem, PL.T.gray, 0.7); PL.tint(g, mem, PL.T.brown, 0.35);
    PL.hatch(g, mem, { angle: sd > 0 ? 0.5 : -0.5, gap: Math.max(6, 9 * s), w: lw * 0.7 });
    PL.ink(g, mem, ow * 0.8);
    PL.ink(g, pathOf(m, [sh, el, wr], false), ow * 1.4);   // 上腕・前腕の骨
    PL.ink(g, pathOf(m, [wr, d3, wr, d4, wr, d5], false), lw * 1.2);   // 指の骨
    PL.ink(g, pathOf(m, [wr, W(140, -56), W(146, -50)], false), lw * 1.4);   // 親指のつめ
  }
  // しっぽの膜と足
  const tail = pathOf(m, [[-34, 66], [-16, 40], [16, 40], [34, 66], [0, 92, -34, 66]]);
  PL.tint(g, tail, PL.T.gray, 0.7); PL.hatch(g, tail, { angle: 0.3, gap: Math.max(6, 9 * s), w: lw * 0.7 }); PL.ink(g, tail, ow * 0.7);
  PL.ink(g, pathOf(m, [[0, 40], [0, 84]], false), lw);
  // 胴（毛）と頭・耳
  const body = pathOf(m, ellPts(0, 6, 24, 42)), head = pathOf(m, ellPts(0, -48, 20, 18));
  const earL = pathOf(m, [[-8, -60], [-30, -98, -24, -104], [-8, -90, -2, -64]]), earR = pathOf(m, [[8, -60], [30, -98, 24, -104], [8, -90, 2, -64]]);
  [earL, earR].forEach(e => { PL.tint(g, e, PL.T.rose, 0.6); PL.ink(g, e, ow * 0.7); });
  [body, head].forEach(p => { PL.tint(g, p, PL.T.brown, 0.85); PL.hatch(g, p, { angle: 0.8, gap: Math.max(4, 5 * s), w: lw * 0.8 }); PL.ink(g, p, ow * 0.8); });
  PL.ink(g, gg => { for (let k = 0; k < 14; k++) { const a = k / 14 * TAU, p = m(Math.cos(a) * 24, 6 + Math.sin(a) * 42), q = m(Math.cos(a) * 30, 6 + Math.sin(a) * 48); gg.moveTo(...p); gg.lineTo(...q); } }, lw * 0.8);   // 毛のふち
}
// ガ（上から）
function moth(g, x, y, s, a = 1) {
  const m = mapper(x, y, s), ow = Math.max(2, 3 * s), lw = Math.max(1.2, 1.6 * s);
  g.save(); g.globalAlpha *= a;
  for (const sd of [-1, 1]) {
    const fw = pathOf(m, [[sd * 4, -10], [sd * 30, -34, sd * 54, -24], [sd * 60, -6], [sd * 30, 4, sd * 6, 0]]), hw = pathOf(m, [[sd * 5, 0], [sd * 40, 4, sd * 40, 22], [sd * 22, 34, sd * 5, 12]]);
    PL.tint(g, hw, PL.T.sand, 0.8); PL.ink(g, hw, ow * 0.8);
    PL.tint(g, fw, PL.T.wood, 0.85); PL.hatch(g, fw, { angle: 0.8, gap: 5, w: lw * 0.7 }); PL.ink(g, fw, ow);
    PL.ink(g, pathOf(m, [[sd * 14, -14], [sd * 46, -12]], false), lw);
    PL.ink(g, pathOf(m, [[sd * 2, -26], [sd * 14, -46, sd * 22, -50]], false), lw);   // 触角
    PL.ink(g, gg => { for (let k = 1; k < 5; k++) { const p = m(sd * (2 + k * 4), -26 - k * 5.5), q = m(sd * (6 + k * 4), -24 - k * 5.5); gg.moveTo(...p); gg.lineTo(...q); } }, lw * 0.7);
  }
  const body = pathOf(m, ellPts(0, 0, 6, 24)); PL.tint(g, body, PL.T.brown, 0.9); PL.ink(g, body, ow * 0.8);
  PL.ink(g, gg => { for (let k = 0; k < 4; k++) { const p = m(-5, 6 + k * 5), q = m(5, 6 + k * 5); gg.moveTo(...p); gg.lineTo(...q); } }, lw * 0.7);
  g.restore();
}
// 音の大きさの目盛り（縦、0〜150 dB）
const MY0 = 1060, MY1 = 330, dbY = d => MY0 - (MY0 - MY1) * d / 150;
function meter(g, lvl) {
  const x = 230, w = 100, tube = PL.rect(x, MY1, w, MY0 - MY1), fill = PL.rect(x, dbY(lvl), w, MY0 - dbY(lvl));
  PL.tint(g, tube, PL.T.sand, 0.2);
  PL.tint(g, fill, lvl > 100 ? PL.T.rust : PL.T.gold, 0.8); PL.hatch(g, fill, { angle: 0.9, gap: 11, w: 2, cx: x, cy: MY0 });
  PL.ink(g, tube, 5);
  PL.ink(g, gg => { for (let d = 0; d <= 150; d += 10) { gg.moveTo(x - (d % 50 ? 12 : 24), dbY(d)); gg.lineTo(x, dbY(d)); } }, 2.5);
  for (let d = 0; d <= 150; d += 20) PL.label(g, d + '', x - 34, dbY(d), 32, { align: 'right', color: TK.C.sub, bold: false });
  PL.label(g, 'dB', x + w / 2, MY1 - 40, 40, { color: TK.C.sub });
}

function draw(g, t) {
  // 0〜6: 当ててみて
  if (t < 6.3) {
    g.save(); g.globalAlpha *= fade(t, -1, 6.3, 0.3);
    bat(g, 540, t < 1.6 ? 960 : 225, t < 1.6 ? 1.55 : 0.62, t);
    g.restore();
    TK.hook(g, t, 0.0, 1.6, 'この声、\n[何デシベル？]', { y: 420, size: 120 });
    TK.choices(g, t, 1.6, 6.3, ['40 dB', '80 dB', '130 dB 以上'], { y: 560, h: 130, gap: 22, size: 70, reveal: 6.0, answer: 2, think: [4.0, 6.0] });
  }
  // 6〜11: 目盛りがのびる
  if (t >= 6.3 && t < 11.0) {
    g.save(); g.globalAlpha *= fade(t, 6.3, 11.0, 0.3);
    const lvl = t < 9.0 ? 128 * TK.out((t - 6.3) / 2.0) : 128 + 13 * TK.out((t - 9.0) / 0.8);
    meter(g, lvl);
    if (t > 8.0) {   // 122〜134 のかっこ
      g.save(); g.globalAlpha *= clamp((t - 8.0) / 0.4, 0, 1);
      PL.ink(g, gg => { gg.moveTo(352, dbY(134)); gg.lineTo(372, dbY(134)); gg.lineTo(372, dbY(122)); gg.lineTo(352, dbY(122)); }, 5, PL.RED);
      PL.leader(g, 372, (dbY(134) + dbY(122)) / 2, 420, (dbY(134) + dbY(122)) / 2);
      PL.label(g, '11種の多くが [122〜134]', 432, (dbY(134) + dbY(122)) / 2, 46, { align: 'left' });
      g.restore();
    }
    if (t > 9.0) {
      g.save(); g.globalAlpha *= clamp((t - 9.0) / 0.3, 0, 1);
      g.setLineDash([12, 10]); PL.ink(g, gg => { gg.moveTo(340, dbY(140)); gg.lineTo(960, dbY(140)); }, 3, PL.RED); g.setLineDash([]);
      PL.label(g, 'いちばん大きい種 140 こえ（推定）', 360, dbY(140) - 44, 36, { align: 'left', color: PL.RED });
      g.restore();
    }
    bat(g, 690, 840, 0.95, t);
    g.restore();
  }
  // 11〜16: 10 dB ごとに10倍（階段）
  if (t >= 11.0 && t < 16.0) {
    g.save(); g.globalAlpha *= fade(t, 11.0, 16.0, 0.3);
    PL.label(g, '10 dB 上がるごとに 強さ ×10', 90, 210, 56, { align: 'left', color: TK.C.sub });
    const n = clamp(Math.floor((t - 11.6) / 0.32) + 1, 0, 9);
    for (let i = 0; i < 9; i++) {
      const y = 1050 - i * 72, on = i < n, x0 = 330 + i * 34, step = PL.rect(x0, y - 28, 300, 56);
      g.save(); g.globalAlpha *= on ? 1 : 0.35;
      if (on) { PL.tint(g, step, PL.T.gold, 0.35 + 0.06 * i); PL.hatch(g, step, { angle: 0.9, gap: 12, w: 1.8, cx: x0, cy: y }); }
      PL.ink(g, step, 4);
      PL.label(g, (40 + i * 10) + '→' + (50 + i * 10), 300, y, 36, { align: 'right', color: on ? PL.INK : TK.C.sub, bold: false });
      if (on) PL.label(g, '×10', x0 + 318, y, 42, { align: 'left', color: PL.RED });
      g.restore();
    }
    if (t > 14.8) { g.save(); g.globalAlpha *= clamp((t - 14.8) / 0.3, 0, 1); PL.label(g, '[10億倍]', 90, 345, 110, { align: 'left' }); PL.label(g, '（40 dB とくらべて）', 560, 360, 40, { align: 'left', color: TK.C.sub, bold: false }); g.restore(); }
    g.restore();
  }
  // 16〜21: 音の高さ。人に聞こえる範囲の外
  if (t >= 16.0 && t < 21.0) {
    g.save(); g.globalAlpha *= fade(t, 16.0, 21.0, 0.3);
    PL.label(g, '音の高さ', 90, 260, 58, { align: 'left', color: TK.C.sub });
    const y = 620, x0 = 110, x1 = 960, xm = 620;
    PL.ink(g, gg => { gg.moveTo(x0, y); gg.lineTo(x1, y); gg.moveTo(x1 - 22, y - 14); gg.lineTo(x1, y); gg.lineTo(x1 - 22, y + 14); }, 5);
    PL.label(g, '低い', x0, y + 56, 40, { align: 'left', color: TK.C.sub });
    PL.label(g, '高い', x1, y - 48, 40, { align: 'right', color: TK.C.sub });
    const hum = PL.rect(x0, y - 120, xm - x0, 80);
    PL.tint(g, hum, PL.T.leaf, 0.6); PL.hatch(g, hum, { angle: 0.9, gap: 12, w: 1.8 }); PL.ink(g, hum, 4);
    PL.label(g, '人に聞こえる高さ', (x0 + xm) / 2, y - 168, 46, { color: PL.GREEN });
    const k = TK.out((t - 16.6) / 0.8);
    if (k > 0) {
      g.save(); g.globalAlpha *= k; const bc = PL.rect(xm + 60, y + 40, x1 - xm - 60, 80);
      PL.tint(g, bc, PL.T.rose, 0.7); PL.hatch(g, bc, { angle: 0.9, gap: 12, w: 1.8 }); PL.ink(g, bc, 4);
      PL.label(g, 'コウモリの声', (xm + 60 + x1) / 2, y + 166, 44, { color: PL.RED });
      g.restore();
    }
    if (t > 18.0) {   // 静かな夜の庭
      g.save(); g.globalAlpha *= clamp((t - 18.0) / 0.5, 0, 1);
      PL.ink(g, gg => { for (let i = 0; i < 16; i++) { const gx = 130 + i * 52 + Math.sin(i * 7) * 10, h = 70 + Math.sin(i * 3.1) * 25; gg.moveTo(gx, 1110); gg.quadraticCurveTo(gx - 16, 1110 - h * 0.6, gx + 8 + Math.sin(t + i) * 4, 1110 - h); } gg.moveTo(100, 1110); gg.lineTo(980, 1110); }, 3, PL.GREEN);
      bat(g, 760 + Math.sin(t) * 60, 900, 0.42, t);
      PL.label(g, 'しーん…', 130, 930, 52, { align: 'left', color: TK.C.sub });
      g.restore();
    }
    g.restore();
  }
  // 21〜25: こだまで虫を見つける
  if (t >= 21.0) {
    g.save(); g.globalAlpha *= fade(t, 21.0, 25.5, 0.3);
    const bx = 230, by = 640, mx = 860, my = 520, ox = bx + 60, oy = by;   // ox, oy: 口の前
    bat(g, bx, by, 0.75, t, Math.PI / 2);
    for (let i = 0; i < 4; i++) {   // 出ていく音の輪（虫の向きへ）
      const r = (t - 21.0) * 260 - i * 140; if (r <= 0 || r > 700) continue;
      g.save(); g.globalAlpha *= 1 - r / 700; PL.ink(g, gg => gg.arc(ox, oy, r, -0.44, -0.02), 6, PL.RED); g.restore();
    }
    const ek = t - 23.0;
    if (ek > 0) for (let i = 0; i < 3; i++) {   // こだま（もどってくる小さな輪）
      const r = ek * 260 - i * 90; if (r <= 0 || r > 600) continue;
      g.save(); g.globalAlpha *= 1 - r / 600; PL.ink(g, gg => gg.arc(mx, my, r, Math.PI - 0.35, Math.PI + 0.35), 4, '#2f5f7a'); g.restore();
    }
    moth(g, mx, my, 1.1, ek > 0 ? 1 : 0.4);
    if (t > 23.2) { g.save(); g.globalAlpha *= clamp((t - 23.2) / 0.3, 0, 1); PL.leader(g, mx - 20, my + 40, 880, 690, '#2f5f7a'); PL.label(g, 'こだま', 880, 724, 54, { color: '#2f5f7a' }); g.restore(); }
    PL.label(g, '大声 → 小さな虫のこだま', 90, 260, 58, { align: 'left', color: TK.C.sub });
    g.restore();
  }
  if (t >= 6.0 && t < 11.0) TK.note(g, t, 6.0, 11.0, 'どれも口から 10 cm の値（パナマの11種）。\n140 こえは水面の反射で大きめかもしれない（推定）', { size: 28, y: 1140 });
  if (t >= 16.0 && t < 21.0) TK.note(g, t, 16.0, 21.0, '高さの帯は模式（目盛りなし）', { size: 30 });
  if (t >= 21.0) TK.note(g, t, 21.0, 25.0, '出どころ: Surlykke & Kalko (2008)\nPLoS ONE 3(4): e2036', { size: 28, y: 1140 });
}

triviaStart({ out: 'animal-senses-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
