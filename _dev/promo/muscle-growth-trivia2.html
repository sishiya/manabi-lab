<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく muscle-2（型A ぜんぶ逆）「筋肉痛がひどい日、筋肉はまだ育っていない」。台本は trivia/muscle-growth.md。?short で録る
// 出どころ: Damas ほか (2016) J Physiol 594:5209（重水で毎日の合成を10週、はじめ・3週・10週。はじめは傷も合成もいちばん高いが太さと関係なし、3週・10週は関係あり）。
// はかったのは「筋肉の傷」で「筋肉痛の強さ」ではない → 画面で「傷（筋肉痛が出るような）」と言いかえる。グラフの形はイメージ（数字は出さない）。
const DUR = 35;
const subs = [
  { a: 0.0, b: 2.0, ja: '「筋肉痛は、育っている証拠」…\nじつは、[ちがいます]', en: '“Sore muscles mean they’re growing”…\nNot quite', noBurn: true },
  { a: 2.0, b: 8.0, ja: '筋トレのはじめは\n筋線維が[あちこち傷つく]', en: 'Early in training,\nmuscle fibers get damaged here and there' },
  { a: 8.0, b: 15.0, ja: '筋肉の材料を作る速さは\n[最初がいちばん高い]。なのに…', en: 'Muscle builds protein fastest\nat the very start. And yet…' },
  { a: 15.0, b: 21.0, ja: 'その材料は、ほとんど[修理]に使われて\n太さにつながらなかった', en: 'that protein went mostly to repairs,\nnot to bigger muscles' },
  { a: 21.0, b: 28.0, ja: '傷が減ってきた[3週目]からやっと\n作った分が太さになる', en: 'Only from week 3, as damage fades,\ndoes new protein turn into size' },
  { a: 28.0, b: 33.0, ja: '10週間、材料を作る量を\n[毎日はかった]研究でわかりました', en: 'A study that measured protein building\nevery day for 10 weeks' },
  { a: 33.0, b: 35.0, ja: '傷は、育つための条件ではない\n（同じ研究者のまとめ）', en: 'Damage isn’t required for growth\n(the same researchers’ review)' },
];
const cues = [
  { t: 0.05, type: 'thud' }, { t: 0.5, type: 'buzz' }, { t: 2.0, type: 'whoosh' }, { t: 3.6, type: 'buzz' }, { t: 8.0, type: 'pop' }, { t: 9.0, type: 'rise' },
  { t: 15.0, type: 'pop' }, { t: 21.0, type: 'whoosh' }, { t: 23.0, type: 'ding' }, { t: 28.0, type: 'pop' }, { t: 33.0, type: 'pop' },
];

// ---- 図鑑の版画の部品 ----
const many = ps => g => ps.forEach(p => p(g));
// 筋線維の縦の断面（サルコメアの並び）。dmg 0〜1 で Z線が乱れ（朱）、すき間にむくみ（水色の粒）が出る
function fibers(g, x0, y0, w, h, dmg, t, labels = true) {
  const rows = 5, rh = h / rows, cols = 9, cw = w / cols;
  const bands = [], abands = [], zOk = [], zHit = [], drops = [];
  for (let r = 0; r < rows; r++) {
    const y = y0 + r * rh;
    bands.push(PL.rect(x0, y + 8, w, rh - 16));
    for (let c = 0; c <= cols; c++) {
      const hit = ((r * 7 + c * 3) % 5 === 0) && c > 0 && c < cols, jx = hit ? dmg * 22 * Math.sin(r * 2 + c) : 0, x = x0 + c * cw;
      if (hit && dmg > 0) zHit.push(gg => { gg.moveTo(x + jx, y + 10); gg.lineTo(x - jx, y + rh * 0.35); gg.lineTo(x + jx * 1.4, y + rh * 0.65); gg.lineTo(x - jx, y + rh - 10); });
      else zOk.push(gg => { gg.moveTo(x, y + 10); gg.lineTo(x, y + rh - 10); });
      if (c < cols) abands.push(PL.rect(x + cw * 0.25 + (hit ? jx * 0.5 : 0), y + rh * 0.28, cw * 0.5, rh * 0.44));   // 太いフィラメント（A帯）
    }
    if (dmg > 0.4 && r < rows - 1) for (let i = 0; i < 6; i++) drops.push(PL.circle(x0 + (i * 151 + r * 67) % w, y + rh, 8 + 4 * Math.sin(t * 3 + i)));
  }
  const B = many(bands), A = many(abands);
  PL.tint(g, B, PL.T.rose, 0.45); PL.hatch(g, B, { angle: 0.9, gap: 12, w: 1.4 });
  PL.tint(g, A, PL.T.rust, 0.7);
  PL.ink(g, gg => { for (let r = 0; r < rows; r++) { const y = y0 + r * rh; for (let k = 1; k < 4; k++) { gg.moveTo(x0, y + rh * (0.28 + k * 0.11)); gg.lineTo(x0 + w, y + rh * (0.28 + k * 0.11)); } } }, 1.2, 'rgba(35,28,21,0.35)');   // 細いフィラメントのすじ
  PL.ink(g, B, 3); PL.ink(g, many(zOk), 5);
  if (zHit.length) PL.ink(g, many(zHit), 6, dmg > 0.3 ? PL.RED : PL.INK);
  if (drops.length) { g.save(); g.globalAlpha *= (dmg - 0.4) / 0.6; const D = many(drops); PL.tint(g, D, PL.T.sea, 0.9); PL.ink(g, D, 2.5, '#2f5f7a'); g.restore(); }
  if (!labels) return;
  PL.leader(g, x0 + cw, y0 - 6, x0 + cw + 60, y0 - 50, TK.C.sub); PL.label(g, 'Z線', x0 + cw + 70, y0 - 66, 34, { align: 'left', color: TK.C.sub, bold: false });
  PL.leader(g, x0 + cw * 3.5, y0 + rh * 0.3, x0 + cw * 4.3, y0 - 50, TK.C.sub); PL.label(g, '太いフィラメント（ちぢめる糸）', x0 + cw * 4.3 + 10, y0 - 66, 32, { align: 'left', color: TK.C.sub, bold: false });
}
// 週ごとのグラフ（0〜10週）。syn: 作る速さ、thick: 太さ（どちらも形はイメージ）
const GX0 = 130, GX1 = 950, GY = 900, GH = 520;
const gx = w => GX0 + (GX1 - GX0) * w / 10;
const syn = w => 0.35 + 0.6 * Math.exp(-Math.pow((w - 0.7) / 0.9, 2)) + 0.12 * clamp((w - 1.5) / 2, 0, 1);
const thick = w => 0.12 + 0.55 * clamp((w - 2.2) / 7.8, 0, 1) * (0.6 + 0.4 * clamp((w - 2.2) / 7.8, 0, 1));
function graph(g, upto, o = {}) {
  PL.ink(g, gg => { gg.moveTo(GX0, GY - GH); gg.lineTo(GX0, GY); gg.lineTo(GX1, GY); for (let w = 1; w <= 10; w++) { gg.moveTo(gx(w), GY); gg.lineTo(gx(w), GY + ([1, 3, 10].includes(w) ? 14 : 7)); } }, 4);
  for (const w of [1, 3, 10]) PL.label(g, w + '週', gx(w), GY + 48, 38, { color: TK.C.sub, bold: false });
  const line = (f, color) => PL.ink(g, gg => { for (let w = 0; w <= upto; w += 0.05) { const x = gx(w), y = GY - GH * f(w); w ? gg.lineTo(x, y) : gg.moveTo(x, y); } }, 9, color);
  // 線の下をうすく手彩色
  const area = f => g2 => { g2.moveTo(gx(0), GY); for (let w = 0; w <= upto; w += 0.1) g2.lineTo(gx(w), GY - GH * f(w)); g2.lineTo(gx(upto), GY); g2.closePath(); };
  PL.tint(g, area(syn), PL.T.rose, 0.35);
  if (o.thick) { PL.tint(g, area(thick), PL.T.leaf, 0.45); PL.hatch(g, area(thick), { angle: 0.9, gap: 10, w: 1.4 }); }
  line(syn, PL.RED);
  if (o.thick) line(thick, PL.GREEN);
  PL.label(g, '材料を作る速さ', GX0 + 20, GY - GH - 90, 42, { align: 'left', color: PL.RED });
  if (o.thick) { const u = Math.min(upto, 10), right = u > 6; PL.label(g, '筋肉の太さ', right ? GX1 - 30 : gx(u) + 24, GY - GH * thick(u) - (right ? 60 : 30), 42, { align: right ? 'right' : 'left', color: PL.GREEN }); }
}

function draw(g, t) {
  // 0〜2: 「筋肉痛＝育ってる証拠」に ×（字には重ねない）
  if (t < 2.0) {
    TK.card(g, 110, 360, 860, 200);
    PL.label(g, '筋肉痛 ＝ 育ってる証拠', PW / 2, 460, 78);
    const k = TK.pop(t, 0.35, 0.3);
    if (t > 0.35) { g.save(); g.globalAlpha = clamp(k, 0, 1); const r = 170 * k; PL.ink(g, gg => { gg.moveTo(PW / 2 - r, 820 - r); gg.lineTo(PW / 2 + r, 820 + r); gg.moveTo(PW / 2 + r, 820 - r); gg.lineTo(PW / 2 - r, 820 + r); }, 34, PL.RED); g.restore(); }
  }
  // 2〜8: 筋線維の傷
  if (t >= 2.0 && t < 8.0) {
    const f = fade(t, 2, 8, 0.3); g.save(); g.globalAlpha = f;
    const dmg = ease((t - 3.4) / 1.6);
    PL.label(g, '筋線維（縦の断面）', 90, 220, 48, { align: 'left', color: TK.C.sub, bold: false });
    fibers(g, 110, 370, 860, 580, dmg, t);
    if (dmg > 0.9) PL.label(g, '[傷]（筋肉痛が出るような）', PW / 2, 1030, 56);
    g.restore();
    TK.note(g, t, 2.4, 8, '赤い線＝乱れた Z線、水色＝むくみ（イメージ）', { size: 30 });
  }
  // 8〜28: グラフ
  if (t >= 8.0 && t < 28.0) {
    const f = fade(t, 8, 28, 0.3); g.save(); g.globalAlpha = f;
    const upto = t < 15 ? 1.6 * ease((t - 8.4) / 2.0) : t < 21 ? 1.6 : 1.6 + 8.4 * ease((t - 21.4) / 3.5);
    graph(g, Math.max(0.05, upto), { thick: t >= 15 });
    if (t >= 9.6 && t < 21) { const x = gx(0.7), y = GY - GH * syn(0.7), c = PL.circle(x, y, 16); PL.tint(g, c, PL.RED, 1); PL.ink(g, c, 3, PL.RED); PL.label(g, 'いちばん高い', x + 50, y - 30, 44, { align: 'left', color: PL.RED }); }
    if (t >= 15.4 && t < 21) {
      const k = clamp(TK.pop(t, 15.4, 0.35), 0, 1.2); g.save(); g.translate(gx(1) + 200, GY - GH * 0.45); g.scale(k, k);
      TK.card(g, -120, -60, 240, 110); PL.label(g, '修理', 0, -4, 64, { color: '#2f5f7a' }); g.restore();
      PL.label(g, '太さは、まだ動かない', PW / 2, GY + 120, 50, { color: PL.GREEN });
    }
    if (t >= 23.0) {
      g.save(); g.globalAlpha *= fade(t, 23, 28, 0.3);
      g.save(); g.setLineDash([10, 10]); PL.ink(g, gg => { for (const w of [3, 10]) { gg.moveTo(gx(w), GY); gg.lineTo(gx(w), GY - GH); } }, 4, PL.GREEN); g.restore();
      PL.label(g, 'ここから [作った分が太さに]', PW / 2, GY + 120, 50);
      g.restore();
    }
    g.restore();
    TK.note(g, t, 8.4, 28, 'グラフの形はイメージ（はかったのは はじめ・3週・10週）', { size: 30 });
  }
  // 28〜35: 研究 → まとめ
  if (t >= 28.0) {
    const f = fade(t, 28, 36, 0.3); g.save(); g.globalAlpha = f;
    TK.card(g, 110, 260, 860, 460);
    if (t < 33.0) TK.lines(g, '10週間\n材料を作る量を\n[毎日はかった]', PW / 2, 490, 80);
    else TK.lines(g, '傷は\n育つための\n[条件ではない]', PW / 2, 490, 84);
    fibers(g, 230, 790, 620, 230, t < 33 ? 0 : 0.6, t, false);
    g.restore();
    TK.note(g, t, 29.0, 35, '傷をはかった研究で、筋肉痛の強さは、はかっていません\n出どころ: Damas ほか (2016) J Physiol 594:5209・Damas ほか (2018) Eur J Appl Physiol', { size: 28, y: 1135 });
  }
}

triviaStart({ out: 'muscle-growth-trivia2', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
