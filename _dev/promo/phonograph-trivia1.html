<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく phonograph-1（型H 当ててみて）「エジソンが考えた蓄音機の使いみち、1番は？」。台本は trivia/phonograph.md。?short で録る
// T. A. Edison「The Phonograph and Its Future」North American Review 126（1878）。本文に番号はない（並んだ順）→「最初に書いた」。
// 「50〜100回」はエジソンの見込み。すず箔が何回で聞こえなくなるかは言わず、すり減る絵（推定）だけ。古い紙面は写さず文字は自分で組む
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.0, ja: '1878年、エジソンが雑誌に書いた蓄音機の使いみち。\nいちばん最初に書いたのは？', en: 'In 1878, Edison listed uses for the phonograph.\nWhat did he write first?', noBurn: true },
  { a: 5.0, b: 12.0, ja: '答えは B。速記の人なしで手紙を書く。\n[声のまま]手紙を送る', en: 'The answer is B: writing letters without a stenographer,\nand sending letters as voice.' },
  { a: 12.0, b: 20.0, ja: '[音楽]は、そのあと。\n[しゃべる時計]まで書いてある', en: 'Music comes later.\nHe even listed talking clocks.' },
  { a: 20.0, b: 28.0, ja: '「声を[しまっておける]」ことが、\nいちばんの発明だった', en: 'Being able to store a voice\nwas the real invention.' },
  { a: 28.0, b: 35.0, ja: 'エジソンは[50〜100回]くり返せると書いた。\nすず箔で試すと…', en: 'Edison wrote it could replay 50 to 100 times.\nTry it on tinfoil, and...' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.3, type: 'pop' }, { t: 0.5, type: 'pop' }, { t: 0.7, type: 'pop' }, { t: 3.0, type: 'tick' }, { t: 4.0, type: 'tick' }, { t: 5.0, type: 'ding' },
  { t: 8.2, type: 'whoosh' }, { t: 12.0, type: 'whoosh' }, { t: 12.4, type: 'tick' }, { t: 13.0, type: 'tick' }, { t: 13.6, type: 'tick' }, { t: 14.2, type: 'pop' }, { t: 14.8, type: 'tick' }, { t: 15.4, type: 'tick' }, { t: 16.0, type: 'pop' },
  { t: 20.0, type: 'whoosh' }, { t: 28.0, type: 'pop' }, { t: 30.0, type: 'whoosh' }, { t: 32.5, type: 'buzz' },
];
const LIST = ['手紙・口述筆記', '本の朗読（目の見えない人のため）', '話し方の練習', '音楽', '家族の記録', 'オルゴール・おもちゃ', 'しゃべる時計', '広告・演説・電話の改良 …'];

function envelope(g, x, y, w, h) {
  g.save(); g.strokeStyle = '#e8f0ff'; g.lineWidth = 6; g.fillStyle = 'rgba(244,247,255,0.08)'; g.lineJoin = 'round';
  g.beginPath(); g.rect(x, y, w, h); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x, y); g.lineTo(x + w / 2, y + h * 0.55); g.lineTo(x + w, y); g.stroke(); g.restore();
}
function wave(g, x, y, w, amp, t, c = TK.C.acc, ph = 0) {
  g.save(); g.strokeStyle = c; g.lineWidth = 6; g.beginPath();
  for (let i = 0; i <= 80; i++) { const u = i / 80, xx = x + u * w, yy = y + amp * Math.sin(u * 22 + t * 8 + ph) * Math.sin(u * Math.PI) * (0.6 + 0.4 * Math.sin(u * 5 + t)); i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
  g.stroke(); g.restore();
}

function draw(g, t) {
  // 0〜8: 3択
  if (t < 8.0) {
    TK.card(g, 120, 190, 720, 130, { r: 30 });
    TK.text(g, '1878年 エジソンの「使いみち」', PW / 2 - 60, 255, 56);
    if (t < 3.0) { g.save(); g.globalAlpha = TK.pop(t, 0.1, 0.4) * fade(t, 0, 3.0, 0.25); TK.text(g, '[最初に]書いたのは？', PW / 2 - 60, 415, 76, { stroke: 'rgba(0,0,0,0.6)' }); g.restore(); }
    TK.choices(g, t, 0.2, 8.0, ['音楽を聴く', '手紙と口述筆記', 'しゃべるおもちゃ'], { y: 520, h: 160, gap: 30, answer: 1, reveal: 5.0, think: [3.0, 5.0], size: 62 });
  }
  // 8〜12: 声のまま手紙
  if (t >= 8.0 && t < 12.0) {
    const k = TK.pop(t, 8.2, 0.4);
    g.save(); g.globalAlpha = k; envelope(g, 250, 330, 460, 300); g.restore();
    wave(g, 290, 760, 380, 60 * k, t);
    TK.text(g, '声のまま、手紙に', PW / 2 - 60, 920, 60, { color: TK.C.sub });
  }
  // 12〜20: リスト
  if (t >= 12.0 && t < 20.0) {
    TK.text(g, '本文に書かれた順', PW / 2 - 60, 220, 48, { color: TK.C.sub });
    LIST.forEach((s, i) => {
      const a = 12.4 + i * 0.6; if (t < a) return;
      const hot = i === 3 || i === 6, first = i === 0, y = 310 + i * 92;
      g.save(); g.globalAlpha = TK.pop(t, a, 0.3);
      if (hot || first) TK.card(g, 100, y - 40, 760, 80, { r: 20, fill: first ? 'rgba(89,227,154,0.18)' : 'rgba(255,207,74,0.2)', stroke: first ? TK.C.green : TK.C.acc });
      TK.text(g, s, 140, y, i === 7 ? 40 : 50, { align: 'left', color: first ? TK.C.green : hot ? TK.C.acc : (i === 7 ? TK.C.dim : '#fff') });
      g.restore();
    });
    TK.note(g, t, 13, 20, '本文に番号はない（書かれた順）', { size: 32 });
  }
  // 20〜28: 声 → 振動板 → 針 → 溝
  if (t >= 20.0 && t < 28.0) {
    const s = i => clamp((t - 20.3 - i * 1.2) / 0.4, 0, 1);
    g.save(); g.globalAlpha = s(0); wave(g, 70, 420, 220, 70, t); TK.text(g, '声', 180, 300, 48, { color: TK.C.acc }); g.restore();
    const vib = Math.sin(t * 40) * 10 * s(1);
    g.save(); g.globalAlpha = s(1); g.strokeStyle = '#e8f0ff'; g.lineWidth = 8;
    g.beginPath(); g.moveTo(340, 300); g.quadraticCurveTo(360 + vib, 420, 340, 540); g.stroke(); TK.text(g, '振動板', 345, 250, 44, { color: TK.C.sub }); g.restore();
    g.save(); g.globalAlpha = s(2); g.strokeStyle = TK.C.acc2; g.lineWidth = 6;
    g.beginPath(); g.moveTo(352, 420); g.lineTo(520, 420); g.lineTo(560, 470 + vib * 0.6); g.stroke(); TK.text(g, '針', 470, 370, 44, { color: TK.C.acc2 }); g.restore();
    // すず箔を巻いた筒と溝（断面）
    g.save(); g.globalAlpha = s(3);
    TK.card(g, 520, 490, 380, 330, { r: 60, fill: 'rgba(200,210,230,0.18)', stroke: '#cfe0ff' });
    g.strokeStyle = TK.C.acc; g.lineWidth = 5; g.beginPath();
    for (let i = 0; i <= 80; i++) { const u = i / 80, x = 540 + u * 340, y = 560 + 20 * Math.sin(u * 30 - t * 6) * (0.5 + 0.5 * Math.sin(u * 4 + t)); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
    TK.text(g, 'すず箔の溝', 710, 880, 44, { color: TK.C.sub });
    g.restore();
  }
  // 28〜35: なぞるたびにすり減る（推定の絵）
  if (t >= 28.0) {
    g.save(); g.globalAlpha = TK.pop(t, 28.1, 0.4);
    TK.card(g, 120, 190, 720, 150, { r: 30, fill: 'rgba(255,207,74,0.16)', stroke: TK.C.acc });
    TK.text(g, '「[50〜100回] くり返せる」', PW / 2 - 60, 245, 60); TK.text(g, '（エジソンの見込み）', PW / 2 - 60, 305, 38, { color: TK.C.sub, bold: false });
    g.restore();
    if (t > 30.0) {
      const wear = clamp((t - 30.0) / 3.0, 0, 1);
      g.save(); g.strokeStyle = TK.C.acc; g.lineWidth = 7; g.beginPath();
      for (let i = 0; i <= 120; i++) { const u = i / 120, x = 120 + u * 720, y = 620 + 110 * (1 - wear * 0.92) * Math.sin(u * 26) * (0.6 + 0.4 * Math.sin(u * 5)); i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke(); g.restore();
      // なぞる針
      const nx = 120 + 720 * (((t - 30) * 1.3) % 1);
      g.save(); g.fillStyle = TK.C.acc2; g.beginPath(); g.moveTo(nx, 470); g.lineTo(nx - 14, 440); g.lineTo(nx + 14, 440); g.closePath(); g.fill(); g.restore();
      TK.text(g, 'なぞるたびに、溝がすり減る', PW / 2 - 60, 860, 54, { color: TK.C.sub });
    }
    TK.note(g, t, 30.0, 32.5, 'すり減り方はアプリのモデルの推定の絵', { size: 32 });
    TK.note(g, t, 32.5, 35, '出どころ: T. A. Edison「The Phonograph and Its Future」\nNorth American Review 126（1878）', { size: 30 });
  }
}

triviaStart({ out: 'phonograph-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
