<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="wifi-common.js"></script>
<script>
'use strict';
// 台本: 電波の見える部屋（ショート、40秒＋締め）。?short で縦長に録る
// 見せ場: 玄関のルーターから波が広がる → 強さの色 → ルーターを真ん中へ → 5 GHz
const V = new URLSearchParams(location.search).has('short');
const MAP = V ? [0, 440, 1080, 675] : [200, 60, 1520, 950];
const ENT = [1.0, 2.85], MID = [5.0, 3.05];
const SC = [
  { a: 0, b: 13.2, preset: 'flat', mode: 'wave', pre: 0 },
  { a: 13.2, b: 28.2, preset: 'flat', mode: 'heat', pre: 5000, drag: [{ a: 9.3, b: 12, from: ENT, to: MID }] },
  { a: 28.2, b: SHORT_END + IDENT_CLOSE, preset: 'flat', freq: '5', mode: 'heat', pre: 5000 },
];
const CAPS = [
  { a: 6, b: 13, main: '壁を通るたびに弱まり、すき間から回りこむ', sub: '電磁波の式を、0.75cm のマス目で計算している',
    en: ['Each wall weakens it, and it bends through gaps', 'Calculated from the equations of electromagnetism on a 0.75 cm grid'] },
  { a: 13.5, b: 21.5, main: '強さで見ると、まだら模様（干渉）', sub: '数cm 動くだけで、強さが変わる',
    en: ['Viewed by strength, it\'s patchy (interference)', 'Move a few centimeters and the signal changes'] },
  { a: 22, b: 28, main: 'ルーターを家の真ん中へ動かすと', sub: '奥の部屋まで届くようになる',
    en: ['Move the router to the middle of the home', 'and it reaches the far rooms'] },
  { a: 28.5, b: 35, main: '5 GHz は、壁の向こうで弱まりやすい', sub: '2.4 GHz は遠くまで届き、5 GHz は速いが届きにくい',
    en: ['5 GHz fades more behind walls', '2.4 GHz reaches farther; 5 GHz is faster but shorter-range'] },
];
promoStart({
  name: '電波の見える部屋', out: 'wifi-wave', src: '../../wifi-wave/index.html', iw: 1680, ih: 1000, dur: SHORT_END + IDENT_CLOSE, peek: 18,
  inject: { dpr: 2 },
  music: { style: 'drone', root: 73, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: w => w.__ww && w.__ww.CAL && w.__ww.CAL['2.4'],
  setup(w) { w.__ww.S.paused = true; return null; },
  subs: shortSubs('電波の見える部屋', 'Seeing WiFi at Home', 'WiFi の電波が、家の中をどう伝わるか', 'How WiFi actually travels through a home', CAPS,
    'ブラウザで動かせます。壁を描いて試せます', 'Runs in your browser. Draw your own walls and test'),
  renderAt(t, w) { wwRender(w, SC, t); },
  drawSource(g, w) { wwDraw2(g, w, MAP); },
  overlay(g, t, w) {
    // 周波数（左上、目印がはけてから）
    const s = wwScAt(SC, t);
    const ff = fade(t, IDENT_MINI + 0.3, 35, 0.4);
    if (ff > 0) { prep(g); g.textAlign = 'left'; g.globalAlpha = ff; txt(g, (s.freq || '2.4') + ' GHz', 60, MAP[1] - 60, 60, s.freq === '5' ? '#ffd27a' : '#fff', true); g.globalAlpha = 1; g.shadowBlur = 0; }
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, '電波の見える部屋', 'WiFi の電波が、家の中をどう伝わるか', 'ブラウザで動かせます。壁を描いて試せます',
      'おもな出どころ: ITU-R 勧告 P.2040-3（2023）、ITU-R P.525、IEEE 802.11、Taflove と Hagness（2005）ほか');
  },
  errors: w => [w.__wwErr].filter(Boolean).map(String),
});
</script>
</body>
</html>
