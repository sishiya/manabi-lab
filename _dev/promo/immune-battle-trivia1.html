<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく immune-1（型H 当ててみて）「抗体が半分に減るまで、何年？」。台本は trivia/immune-battle.md。?short で録る
// 数字: Amanna, Carlson, Slifka (2007) NEJM 357:1903（著者の発表スライド・PMC6105026 で確認）。破傷風 11年・ジフテリア 19年・水ぼうそう 50年・はしか／おたふく 200年以上（推定）。
// 「3014年」という数字は使わない（もとの表を見られていない）。ワクチンのすすめにしない（最後に注）。
const DUR = 35;
const subs = [
  { a: 0.0, b: 2.0, ja: '体の中の抗体が半分に減るまで\n長いのはどっち？', en: 'How long until your antibodies drop by half?\nWhich lasts longer?', noBurn: true },
  { a: 2.0, b: 4.0, ja: '（考えてみて）', en: '(Take a guess)' },
  { a: 4.0, b: 9.0, ja: '破傷風は[約11年]', en: 'Tetanus: about 11 years' },
  { a: 9.0, b: 16.0, ja: 'はしかは… [200年以上]（推定）', en: 'Measles… over 200 years (estimate)' },
  { a: 16.0, b: 22.0, ja: '同じ抗体でも、[こんなにちがう]', en: 'Same kind of antibody, very different lifetimes' },
  { a: 22.0, b: 29.0, ja: '45人の血を、最長26年はかった研究\nウイルスに一度かかった記憶は[とくに長もち]', en: 'A study tracked 45 people’s blood for up to 26 years.\nMemories of past virus infections last especially long' },
  { a: 29.0, b: 33.0, ja: '人の一生より、[ずっと長い]', en: 'Far longer than a human lifetime' },
  { a: 33.0, b: 35.0, ja: '抗体の量が半分になるまでの、推定の年数です', en: 'These are estimated half-lives of antibody levels' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 2.0, type: 'tick' }, { t: 3.0, type: 'tick' }, { t: 4.0, type: 'ding' }, { t: 6.5, type: 'thud' },
  { t: 9.0, type: 'whoosh' }, { t: 10.0, type: 'rise' }, { t: 13.2, type: 'ding' }, { t: 16.0, type: 'pop' }, { t: 22.0, type: 'whoosh' }, { t: 29.0, type: 'pop' },
];
const LX = 290, RX = 790, HY = 640;   // 砂時計2つの位置

// 砂時計。top は上の砂の残り（0〜1）
function hourglass(g, x, y, h, top, color, o = {}) {
  const w = h * 0.55;
  g.save(); g.translate(x, y);
  g.strokeStyle = o.stroke || 'rgba(207,224,255,0.9)'; g.lineWidth = 6; g.lineJoin = 'round';
  const shape = () => { g.beginPath(); g.moveTo(-w / 2, -h / 2); g.lineTo(w / 2, -h / 2); g.lineTo(18, 0); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.lineTo(-18, 0); g.closePath(); };
  // 砂
  g.save(); shape(); g.clip();
  g.fillStyle = color;
  const ht = (h / 2) * Math.sqrt(top);   // 上の砂（下にたまる形）
  g.fillRect(-w / 2, -ht + 0, w, ht);
  const hb = (h / 2) * Math.sqrt(1 - top) * 0.9;
  g.fillRect(-w / 2, h / 2 - hb, w, hb);
  if (top > 0.002 && top < 0.999) g.fillRect(-3, 0, 6, h / 2);
  g.restore();
  shape(); g.stroke();
  g.lineWidth = 10; g.beginPath(); g.moveTo(-w / 2 - 20, -h / 2); g.lineTo(w / 2 + 20, -h / 2); g.moveTo(-w / 2 - 20, h / 2); g.lineTo(w / 2 + 20, h / 2); g.stroke();
  g.restore();
}
// 抗体（Y の形）
function antibody(g, x, y, s, ang, color) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.strokeStyle = color; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 40); g.lineTo(0, 0); g.lineTo(-26, -34); g.moveTo(0, 0); g.lineTo(26, -34); g.stroke();
  g.restore();
}

function draw(g, t) {
  // 0〜9: 砂時計2つ
  if (t < 16.0) {
    const f = t < 9 ? 1 : fade(t, -1, 16, 0.3);
    g.save(); g.globalAlpha = f;
    const yrs = t < 4.4 ? 0 : t < 9 ? 11 * ease((t - 4.4) / 2.0) : 11 + 190 * ease((t - 9.6) / 3.6);
    const lt = Math.max(0, 1 - yrs / 11) * 0.5 + (yrs >= 11 ? 0 : 0.5) * (1 - yrs / 11);   // 左: 11年で上の砂が半分に（＝減りきり）
    const leftTop = 1 - Math.min(1, yrs / 11) * 0.5;
    const rightTop = 1 - Math.min(1, yrs / 200) * 0.5;
    const ldim = t >= 9.0 ? 0.45 : 1;
    g.save(); g.globalAlpha *= ldim; hourglass(g, LX, HY, 520, leftTop, 'rgba(95,212,255,0.8)'); g.restore();
    hourglass(g, RX, HY, 520, rightTop, 'rgba(255,207,74,0.85)');
    TK.text(g, '破傷風', LX, HY + 330, 64, { color: TK.C.acc2 });
    TK.text(g, 'はしか', RX, HY + 330, 64, { color: TK.C.acc });
    if (t >= 4.4) TK.text(g, Math.round(Math.min(yrs, 11)) + ' 年', LX, HY - 340, 70, { color: yrs >= 10.9 ? TK.C.acc2 : '#fff' });
    if (t >= 9.6) TK.text(g, yrs >= 200 ? '200年以上' : Math.round(yrs) + ' 年', RX, HY - 340, 70, { color: yrs >= 200 ? TK.C.acc : '#fff' });
    if (t >= 9.6 && t < 16) {
      const yr = 2026 + Math.round(yrs);
      TK.text(g, '西暦 ' + yr + ' 年' + (yrs >= 200 ? '…' : ''), PW / 2, 1075, 48, { color: TK.C.sub, bold: false });
    }
    g.restore();
    if (t < 2.0) TK.hook(g, t, 0, 2.0, '抗体が半分に減るまで\n長いのは？', { y: 230, size: 80 });
    if (t >= 2.0 && t < 4.0) {   // 考える時間の輪
      const k = (t - 2.0) / 2.0, cx = PW / 2, cy = 190, r = 70;
      g.lineWidth = 14; g.strokeStyle = 'rgba(255,255,255,0.15)'; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = TK.C.acc; g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k)); g.stroke();
      TK.text(g, String(Math.max(1, Math.ceil(2 - (t - 2.0)))), cx, cy + 4, 72);
    }
    if (t >= 9.6) TK.note(g, t, 9.6, 16, '抗体の量が半分になるまでの年数（病気にかからない期間とはちがいます）', { size: 30 });
  }
  // 16〜22: 棒でくらべる
  if (t >= 16.0 && t < 22.0) {
    TK.text(g, '抗体が半分に減るまで', PW / 2, 220, 56, { color: TK.C.sub });
    TK.bars(g, t, 16.0, 22.0, [
      { label: '破傷風', v: 11 / 210, color: TK.C.acc2, text: '' },
      { label: 'ジフテリア', v: 19 / 210, color: TK.C.acc2, text: '' },
      { label: '水ぼうそう', v: 50 / 210, color: TK.C.green, text: '50年' },
      { label: 'はしか・おたふく', v: 1.0, color: TK.C.acc, text: '200年以上' },
    ], { y: 330, gap: 190, stagger: 0.35 });
    if (t > 17.2) {   // 短い棒は数字を外に
      g.save(); g.globalAlpha = fade(t, 17.2, 22, 0.3);
      TK.text(g, '11年', 110 + 96, 330 + 72, 44, { align: 'left', color: '#fff' });
      TK.text(g, '19年', 110 + 160, 330 + 190 + 72, 44, { align: 'left', color: '#fff' });
      g.restore();
    }
    TK.note(g, t, 16.5, 22, 'はしか・おたふくは、測った期間をのばした推定', { size: 30 });
  }
  // 22〜29: 抗体がウイルスにくっつく（線の図）
  if (t >= 22.0 && t < 29.0) {
    const f = fade(t, 22, 29, 0.3); g.save(); g.globalAlpha = f;
    const cx = PW / 2, cy = 600, R = 150;
    g.fillStyle = 'rgba(255,107,107,0.25)'; g.strokeStyle = TK.C.red; g.lineWidth = 6;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill(); g.stroke();
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; g.beginPath(); g.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.lineTo(cx + Math.cos(a) * (R + 26), cy + Math.sin(a) * (R + 26)); g.stroke(); g.beginPath(); g.arc(cx + Math.cos(a) * (R + 32), cy + Math.sin(a) * (R + 32), 8, 0, Math.PI * 2); g.stroke(); }
    TK.text(g, 'ウイルス', cx, cy, 48, { color: '#fff' });
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + 0.2, k = ease((t - 22.4 - i * 0.25) / 1.2);
      const d = lerp(520, R + 80, k), x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 0.95;
      antibody(g, x, y, 1.3, a - Math.PI / 2 + Math.PI, TK.C.acc);
    }
    TK.card(g, 110, 140, 860, 130, { r: 40 });
    TK.text(g, '45人の血を、最長 [26年] はかった', PW / 2, 205, 56);
    g.restore();
    TK.note(g, t, 22.5, 29, '抗体（Y）がウイルスにくっつく、イメージの絵', { size: 30 });
  }
  // 29〜35: 人の一生より長い
  if (t >= 29.0) {
    const f = fade(t, 29, 36, 0.3); g.save(); g.globalAlpha = f;
    TK.card(g, 110, 330, 860, 400);
    TK.lines(g, 'はしかの抗体\n[人の一生より]\nずっと長もち（推定）', PW / 2, 530, 76);
    g.restore();
    TK.note(g, t, 30.5, 35, '推定（約15〜26年の測定をのばした計算）・接種は医師・公的機関の案内で\n出どころ: Amanna, Carlson, Slifka (2007) N Engl J Med 357:1903', { size: 28 });
  }
}

triviaStart({ out: 'immune-battle-trivia1', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
