<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく eye-optics-2（型H 当ててみて）「暗い星は、まっすぐ見ると消える」。台本は trivia/eye-optics.md。?short で録る
// 出どころ: Curcio ほか (1990) J Comp Neurol 292:497–523（桿体のない区域の横の直径 0.350 mm＝1.25°、桿体 平均 9200万個。要旨）。
// 網膜の分布のグラフは形だけの模式（値は描いていない）。星が消える演出は分かりやすくするため（実際は暗さ・慣れぐあいで変わる）
const DUR = 25;
const ROD = '#8fb4ff', CONE = '#ffcf4a';
const subs = [
  { a: 0.0, b: 1.6, ja: 'この星、どこを見ると いちばん見える？', en: 'Where should you look to see this star best?', noBurn: true },
  { a: 1.6, b: 4.0, ja: '暗い星を見たい。どこを見る？', en: 'You want to see a faint star. Where do you look?' },
  { a: 4.0, b: 6.0, ja: '考えて…', en: 'Think…' },
  { a: 6.0, b: 10.0, ja: '答えは [B]。まっすぐ見ると\n暗い星は消える', en: 'The answer is B. Look straight at it\nand a faint star disappears' },
  { a: 10.0, b: 17.0, ja: '暗い光を感じる細胞（[桿体]）は\n網膜のまん中、直径[約1.2度]だけ 1本もない', en: 'The cells for dim light (rods) are completely absent\nfrom the center of the retina — about 1.2° across', size: 56 },
  { a: 17.0, b: 21.0, ja: '腕をのばした[指1本ぶん]。\nそこに暗い星を置くと見えない', en: 'About one finger at arm’s length.\nPut a faint star there and it vanishes' },
  { a: 21.0, b: 25.0, ja: 'だから、星好きは[少しずらして]見る。\n暗さのセンサーは目に約9200万個', en: 'So stargazers look slightly to the side.\nEach eye has about 92 million rods' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.6, type: 'pop' }, { t: 1.78, type: 'pop' }, { t: 1.96, type: 'pop' },
  { t: 4.0, type: 'tick' }, { t: 5.0, type: 'tick' }, { t: 6.0, type: 'ding' }, { t: 7.4, type: 'buzz' }, { t: 9.0, type: 'rise' },
  { t: 10.0, type: 'whoosh' }, { t: 12.0, type: 'pop' }, { t: 17.0, type: 'whoosh' }, { t: 18.6, type: 'pop' }, { t: 21.0, type: 'whoosh' }, { t: 22.6, type: 'ding' },
];
const rnd = (i, j = 0) => { const s = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return s - Math.floor(s); };

// 星空の窓。gx, gy: 見ているところ。star: 暗い星の位置。見ているところのまわり（桿体のない所）は暗い星が消える
function sky(g, t, x, y, w, h, gx, gy, o = {}) {
  g.save();
  g.fillStyle = '#050a1c'; g.strokeStyle = 'rgba(160,190,255,0.5)'; g.lineWidth = 4;
  g.beginPath(); g.roundRect(x, y, w, h, 30); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(x, y, w, h, 30); g.clip();
  for (let i = 0; i < 70; i++) { const sx = x + rnd(i) * w, sy = y + rnd(i, 1) * h, b = 0.25 + 0.5 * rnd(i, 2); g.fillStyle = `rgba(255,255,255,${b})`; g.beginPath(); g.arc(sx, sy, 1.5 + 2 * rnd(i, 3), 0, Math.PI * 2); g.fill(); }
  // 暗い星
  const sx = o.sx ?? x + w / 2, sy = o.sy ?? y + h / 2;
  const d = Math.hypot(sx - gx, sy - gy), vis = clamp((d - 45) / 50, 0, 1) * (o.vis ?? 1);
  const glow = 0.25 + 0.75 * vis;
  const gr = g.createRadialGradient(sx, sy, 0, sx, sy, 50);
  gr.addColorStop(0, `rgba(220,235,255,${0.85 * glow})`); gr.addColorStop(1, 'rgba(220,235,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(sx, sy, 50, 0, Math.PI * 2); g.fill();
  g.fillStyle = `rgba(255,255,255,${0.15 + 0.85 * vis})`; g.beginPath(); g.arc(sx, sy, 7, 0, Math.PI * 2); g.fill();
  g.restore();
  // 見ているところ（十字）
  if (o.gaze !== false) {
    g.save(); g.strokeStyle = TK.C.acc; g.lineWidth = 4;
    g.beginPath(); g.arc(gx, gy, 26, 0, Math.PI * 2); g.moveTo(gx - 44, gy); g.lineTo(gx - 30, gy); g.moveTo(gx + 30, gy); g.lineTo(gx + 44, gy); g.moveTo(gx, gy - 44); g.lineTo(gx, gy - 30); g.moveTo(gx, gy + 30); g.lineTo(gx, gy + 44); g.stroke();
    g.restore();
  }
}
function redX(g, x, y, r, k) {
  if (k <= 0) return;
  g.save(); g.strokeStyle = TK.C.red; g.lineWidth = r * 0.18; g.lineCap = 'round'; g.globalAlpha *= clamp(k, 0, 1);
  const s = r * (0.7 + 0.3 * TK.back(k));
  g.beginPath(); g.moveTo(x - s, y - s); g.lineTo(x + s, y + s); g.moveTo(x + s, y - s); g.lineTo(x - s, y + s); g.stroke();
  g.restore();
}

// 網膜の中心からの角度と、桿体・錐体の数（形だけの模式）
const GX0 = 120, GX1 = 960, GY = 820, GH = 420, EMAX = 10;
const ex = e => GX0 + (GX1 - GX0) * (e + EMAX) / (2 * EMAX);
const rodF = e => { const a = Math.abs(e); return a < 0.625 ? 0 : 0.9 * (1 - Math.exp(-(a - 0.625) / 2.6)); };
const coneF = e => 0.95 * Math.exp(-Math.abs(e) / 0.35) + 0.05;
function retinaGraph(g, t, k) {
  g.save();
  g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(GX0, GY); g.lineTo(GX1, GY); g.stroke();
  TK.text(g, '← 網膜のまん中から →', 540, GY + 50, 38, { color: TK.C.sub, bold: false });
  const curve = (f, c, kk) => {
    g.strokeStyle = c; g.lineWidth = 7; g.lineJoin = 'round'; g.beginPath();
    const n = 400;
    for (let i = 0; i <= n; i++) { const e = -EMAX + 2 * EMAX * i / n, X = ex(e), Y = GY - GH * f(e) * kk; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }
    g.stroke();
  };
  curve(rodF, ROD, TK.out(k * 1.5));
  curve(coneF, CONE, TK.out(k * 1.5 - 0.3));
  // 桿体のない所
  if (k > 0.5) {
    const a = clamp((k - 0.5) * 3, 0, 1);
    g.globalAlpha = a;
    g.fillStyle = 'rgba(255,107,107,0.25)'; g.fillRect(ex(-0.625), GY - GH - 20, ex(0.625) - ex(-0.625), GH + 20);
    g.strokeStyle = TK.C.red; g.lineWidth = 3; g.setLineDash([8, 6]);
    g.beginPath(); g.moveTo(ex(-0.625), GY); g.lineTo(ex(-0.625), GY - GH - 20); g.moveTo(ex(0.625), GY); g.lineTo(ex(0.625), GY - GH - 20); g.stroke(); g.setLineDash([]);
    TK.text(g, '桿体 0本', 540, GY - GH - 60, 56, { color: TK.C.red });
    TK.text(g, '直径 約1.2度', 540, GY - GH - 115, 44, { color: TK.C.sub });
  }
  g.restore();
  TK.text(g, '暗さのセンサー（桿体）', 120, 940, 42, { align: 'left', color: ROD });
  TK.text(g, '色のセンサー（錐体）', 120, 1000, 42, { align: 'left', color: CONE });
}

// 腕をのばした指（横から）
function armFinger(g, t, k) {
  const hx = 170, hy = 650;
  g.save(); g.strokeStyle = '#cfe0ff'; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.arc(hx, hy, 70, 0, Math.PI * 2); g.stroke();             // 頭
  g.beginPath(); g.moveTo(hx + 10, hy + 70); g.lineTo(hx + 10, hy + 330); g.stroke(); // 胴
  g.beginPath(); g.moveTo(hx + 10, hy + 110); g.lineTo(hx + 10 + 700 * k, hy + 40 - 20 * k); g.stroke(); // 腕
  g.restore();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(hx + 40, hy - 10, 8, 0, Math.PI * 2); g.fill();   // 目
  if (k >= 1) {
    const fx = hx + 710, fy = hy + 20;
    g.save(); g.fillStyle = '#ffd9c0'; g.beginPath(); g.roundRect(fx - 14, fy - 110, 28, 110, 14); g.fill(); g.restore();
    const a = clamp((t - 18.4) / 0.6, 0, 1);
    g.save(); g.globalAlpha *= a; g.strokeStyle = TK.C.acc; g.lineWidth = 3;
    g.beginPath(); g.moveTo(hx + 40, hy - 10); g.lineTo(fx - 14, fy - 100); g.moveTo(hx + 40, hy - 10); g.lineTo(fx + 14, fy - 100); g.stroke();
    g.restore();
    if (t > 18.6) { g.save(); g.globalAlpha *= TK.pop(t, 18.6); TK.text(g, '指1本 ≒ [約1度]', 600, 420, 72); g.restore(); }
  }
}

function draw(g, t) {
  // 0〜10: 当ててみて
  if (t < 10.0) {
    const f = fade(t, -1, 10.0, 0.3);
    g.save(); g.globalAlpha = f;
    if (t < 6.0) {
      sky(g, t, 290, 120, 500, 220, 0, 0, { gaze: false });
    }
    g.restore();
    TK.hook(g, t, 0.0, 1.6, 'この星、どこを見ると\n[いちばん見える？]', { y: 700, size: 92 });
    TK.choices(g, t, 1.6, 6.3, ['まっすぐ見る', '少し横を見る', '目を細める'], { y: 600, h: 150, gap: 28, size: 64, reveal: 6.0, answer: 1, think: [4.0, 6.0] });
    if (t >= 6.0) {
      // 6〜8 まっすぐ見ると消える → 8〜10 少し横を見ると見える
      g.save(); g.globalAlpha = fade(t, 6.0, 10.0, 0.3);
      const cx = 540, cy = 560, off = ease(clamp((t - 8.0) / 0.8, 0, 1)) * 160;
      TK.text(g, t < 8.0 ? 'A まっすぐ見ると…' : 'B 少し横を見ると', PW / 2, 230, 64, { color: t < 8.0 ? TK.C.red : TK.C.green });
      sky(g, t, 110, 310, 860, 520, cx + off, cy - off * 0.3, { sx: cx, sy: cy, vis: t < 8.0 ? 1 - 0.0 : 1 });
      if (t > 7.4 && t < 8.0) redX(g, cx, cy, 50, (t - 7.4) / 0.3);
      if (t > 9.0) { g.save(); g.globalAlpha *= TK.pop(t, 9.0); TK.text(g, '見えた！', cx - 10, cy + 110, 60, { color: TK.C.green }); g.restore(); }
      g.save(); TK.text(g, '＋ ＝ 見ているところ', PW / 2, 900, 40, { color: TK.C.acc, bold: false }); g.restore();
      g.restore();
    }
  }
  // 10〜17: 網膜のまん中には桿体がない
  if (t >= 10.0 && t < 17.0) {
    g.save(); g.globalAlpha = fade(t, 10.0, 17.0, 0.3);
    TK.text(g, '網膜の細胞の数（形だけの模式）', PW / 2, 190, 54, { color: TK.C.sub });
    retinaGraph(g, t, clamp((t - 10.3) / 2.4, 0, 1));
    g.restore();
  }
  // 17〜21: 腕をのばした指1本ぶん
  if (t >= 17.0 && t < 21.0) {
    g.save(); g.globalAlpha = fade(t, 17.0, 21.0, 0.3);
    armFinger(g, t, ease(clamp((t - 17.2) / 1.0, 0, 1)));
    g.restore();
  }
  // 21〜25: 少しずらして見る ＋ 9200万個
  if (t >= 21.0) {
    g.save(); g.globalAlpha = fade(t, 21.0, 25.5, 0.3);
    const cx = 540, cy = 640, off = 70 + 90 * ease(clamp((t - 21.2) / 1.0, 0, 1));
    sky(g, t, 110, 420, 860, 440, cx + off, cy + off * 0.3, { sx: cx, sy: cy });
    if (t > 22.6) { g.save(); g.globalAlpha *= TK.pop(t, 22.6); TK.text(g, '桿体 約[9200万]個', PW / 2, 280, 84, { stroke: 'rgba(0,0,0,0.6)' }); g.restore(); }
    g.restore();
  }
  if (t >= 6.0 && t < 10.0) TK.note(g, t, 6.0, 10.0, '星が消える絵は分かりやすくするため（実際は暗さ・慣れぐあいで変わる）', { size: 30 });
  if (t >= 10.0 && t < 17.0) TK.note(g, t, 10.0, 17.0, '桿体のない所: 直径 0.35 mm（1.25°）。曲線の形は模式', { size: 30 });
  if (t >= 17.0 && t < 21.0) TK.note(g, t, 17.0, 21.0, '「指1本で約1度」は目安（腕の長さで変わる）', { size: 30 });
  if (t >= 21.0) TK.note(g, t, 21.0, 25.0, '出どころ: Curcio ほか (1990)\nJ Comp Neurol 292: 497–523', { size: 30 });
}

triviaStart({ out: 'eye-optics-trivia2', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
