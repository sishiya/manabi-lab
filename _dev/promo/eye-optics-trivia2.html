<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく eye-optics-2（型H 当ててみて）「暗い星は、まっすぐ見ると消える」。台本は trivia/eye-optics.md。?short で録る
// 出どころ: Curcio ほか (1990) J Comp Neurol 292:497–523（桿体のない区域の横の直径 0.350 mm＝1.25°、桿体 平均 9200万個。要旨）。
// 網膜の分布のグラフは形だけの模式（値は描いていない）。星が消える演出は分かりやすくするため（実際は暗さ・慣れぐあいで変わる）
const DUR = 25;
const ROD = '#2f5f7a', CONE = '#a8740f';   // 桿体・錐体の線の色（図鑑の版画の墨の色）
const subs = [
  { a: 0.0, b: 1.6, ja: 'この星、どこを見ると いちばん見える？', en: 'Where should you look to see this star best?', noBurn: true },
  { a: 1.6, b: 4.0, ja: '暗い星を見たい。どこを見る？', en: 'You want to see a faint star. Where do you look?' },
  { a: 4.0, b: 6.0, ja: '考えて…', en: 'Think…' },
  { a: 6.0, b: 10.0, ja: '答えは [B]。まっすぐ見ると\n暗い星は消える', en: 'The answer is B. Look straight at it\nand a faint star disappears' },
  { a: 10.0, b: 17.0, ja: '暗い光を感じる細胞（[桿体]）は\n網膜のまん中、直径[約1.2度]だけ 1本もない', en: 'The cells for dim light (rods) are completely absent\nfrom the center of the retina — about 1.2° across', size: 56 },
  { a: 17.0, b: 21.0, ja: '腕をのばした[指1本ぶん]。\nそこに暗い星を置くと見えない', en: 'About one finger at arm’s length.\nPut a faint star there and it vanishes' },
  { a: 21.0, b: 25.0, ja: 'だから、星好きは[少しずらして]見る。\n暗さのセンサーは目に約9200万個', en: 'So stargazers look slightly to the side.\nEach eye has about 92 million rods' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.6, type: 'pop' }, { t: 1.78, type: 'pop' }, { t: 1.96, type: 'pop' },
  { t: 4.0, type: 'tick' }, { t: 5.0, type: 'tick' }, { t: 6.0, type: 'ding' }, { t: 7.4, type: 'buzz' }, { t: 9.0, type: 'rise' },
  { t: 10.0, type: 'whoosh' }, { t: 12.0, type: 'pop' }, { t: 17.0, type: 'whoosh' }, { t: 18.6, type: 'pop' }, { t: 21.0, type: 'whoosh' }, { t: 22.6, type: 'ding' },
];
const rnd = (i, j = 0) => { const s = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return s - Math.floor(s); };

/// 星空の窓（古い星図のように: 手彩色の夜空＋細い斜線、星は紙の色の点に墨のふち）。
// gx, gy: 見ているところ。star: 暗い星の位置。見ているところのまわり（桿体のない所）は暗い星が消える
function sky(g, t, x, y, w, h, gx, gy, o = {}) {
  const box = PL.rect(x, y, w, h);
  PL.tint(g, box, PL.T.sea, 0.95); PL.tint(g, box, PL.T.brown, 0.35);
  PL.hatch(g, box, { angle: 0.15, gap: 7, w: 1.3, color: 'rgba(35,28,21,0.55)' });
  g.save(); g.beginPath(); box(g); g.clip();
  // 星座のような細い線と、ふつうの星
  PL.ink(g, gg => { for (let i = 0; i < 6; i++) { gg.moveTo(x + rnd(i) * w, y + rnd(i, 1) * h); gg.lineTo(x + rnd(i + 1) * w, y + rnd(i + 1, 1) * h); } }, 1.2, 'rgba(239,230,210,0.35)');
  for (let i = 0; i < 70; i++) {
    const sx = x + rnd(i) * w, sy = y + rnd(i, 1) * h, r = 1.8 + 3 * rnd(i, 3);
    g.fillStyle = PL.PAPER; g.beginPath(); g.arc(sx, sy, r, 0, Math.PI * 2); g.fill();
    if (r > 3.6) PL.ink(g, gg => { gg.moveTo(sx - r * 2.2, sy); gg.lineTo(sx + r * 2.2, sy); gg.moveTo(sx, sy - r * 2.2); gg.lineTo(sx, sy + r * 2.2); }, 1.4, PL.PAPER);
  }
  // 暗い星（見ているところに近いと消える）
  const sx = o.sx ?? x + w / 2, sy = o.sy ?? y + h / 2;
  const d = Math.hypot(sx - gx, sy - gy), vis = clamp((d - 45) / 50, 0, 1) * (o.vis ?? 1);
  g.save(); g.globalAlpha *= 0.12 + 0.88 * vis;
  g.fillStyle = PL.PAPER; g.beginPath(); g.arc(sx, sy, 9, 0, Math.PI * 2); g.fill();
  PL.ink(g, gg => { for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, l = i % 2 ? 18 : 30; gg.moveTo(sx + Math.cos(a) * 13, sy + Math.sin(a) * 13); gg.lineTo(sx + Math.cos(a) * l, sy + Math.sin(a) * l); } }, 2.4, PL.PAPER);
  g.restore();
  g.restore();
  PL.ink(g, box, 5); PL.ink(g, PL.rect(x - 10, y - 10, w + 20, h + 20), 1.6);   // 二重のわく
  // 見ているところ（十字）
  if (o.gaze !== false) PL.ink(g, gg => { gg.moveTo(gx + 26, gy); gg.arc(gx, gy, 26, 0, Math.PI * 2); gg.moveTo(gx - 44, gy); gg.lineTo(gx - 30, gy); gg.moveTo(gx + 30, gy); gg.lineTo(gx + 44, gy); gg.moveTo(gx, gy - 44); gg.lineTo(gx, gy - 30); gg.moveTo(gx, gy + 30); gg.lineTo(gx, gy + 44); }, 5, PL.RED);
}
function redX(g, x, y, r, k) {
  if (k <= 0) return;
  g.save(); g.globalAlpha *= clamp(k, 0, 1);
  const s = r * (0.7 + 0.3 * TK.back(k));
  PL.ink(g, gg => { gg.moveTo(x - s, y - s); gg.lineTo(x + s, y + s); gg.moveTo(x + s, y - s); gg.lineTo(x - s, y + s); }, r * 0.18, PL.RED);
  g.restore();
}

// 網膜の中心からの角度と、桿体・錐体の数（形だけの模式）
const GX0 = 120, GX1 = 960, GY = 820, GH = 420, EMAX = 10;
const ex = e => GX0 + (GX1 - GX0) * (e + EMAX) / (2 * EMAX);
const rodF = e => { const a = Math.abs(e); return a < 0.625 ? 0 : 0.9 * (1 - Math.exp(-(a - 0.625) / 2.6)); };
const coneF = e => 0.95 * Math.exp(-Math.abs(e) / 0.35) + 0.05;
function retinaGraph(g, t, k) {
  const curve = (f, kk) => { const n = 400, P = []; for (let i = 0; i <= n; i++) { const e = -EMAX + 2 * EMAX * i / n; P.push([ex(e), GY - GH * f(e) * kk]); } return P; };
  const area = P => g2 => { g2.moveTo(GX0, GY); P.forEach(p => g2.lineTo(...p)); g2.lineTo(GX1, GY); g2.closePath(); };
  const line = P => g2 => P.forEach((p, i) => i ? g2.lineTo(...p) : g2.moveTo(...p));
  const R = curve(rodF, TK.out(k * 1.5)), C = curve(coneF, TK.out(k * 1.5 - 0.3));
  PL.tint(g, area(R), PL.T.sky, 0.6); PL.tint(g, area(C), PL.T.gold, 0.6);
  PL.ink(g, line(R), 6, ROD); PL.ink(g, line(C), 6, CONE);
  // 軸と目もり（5度ごと）
  PL.ink(g, gg => { gg.moveTo(GX0, GY); gg.lineTo(GX1, GY); for (let e = -10; e <= 10; e += 5) { gg.moveTo(ex(e), GY); gg.lineTo(ex(e), GY + 14); } }, 4);
  for (let e = -10; e <= 10; e += 5) PL.label(g, Math.abs(e) + '°', ex(e), GY + 38, 28, { color: TK.C.sub, bold: false });
  PL.label(g, '← 網膜のまん中から →', 540, GY + 86, 36, { color: TK.C.sub, bold: false });
  // 桿体のない所
  if (k > 0.5) {
    const a = clamp((k - 0.5) * 3, 0, 1), z = PL.rect(ex(-0.625), GY - GH - 20, ex(0.625) - ex(-0.625), GH + 20);
    g.save(); g.globalAlpha *= a;
    PL.hatch(g, z, { angle: 0.8, gap: 9, w: 2, color: PL.RED });
    g.save(); g.setLineDash([8, 6]); PL.ink(g, gg => { gg.moveTo(ex(-0.625), GY); gg.lineTo(ex(-0.625), GY - GH - 20); gg.moveTo(ex(0.625), GY); gg.lineTo(ex(0.625), GY - GH - 20); }, 3, PL.RED); g.restore();
    PL.label(g, '桿体 0本', 540, GY - GH - 60, 56, { color: PL.RED });
    PL.label(g, '直径 約1.2度', 540, GY - GH - 115, 44, { color: TK.C.sub });
    g.restore();
  }
  // 凡例（見本の線つき）
  [[ROD, PL.T.sky, '暗さのセンサー（桿体）', 970], [CONE, PL.T.gold, '色のセンサー（錐体）', 1035]].forEach(([c, tc, s, y]) => {
    PL.tint(g, PL.rect(120, y - 14, 60, 28), tc, 0.6); PL.ink(g, gg => { gg.moveTo(120, y - 14); gg.lineTo(180, y - 14); }, 6, c);
    PL.label(g, s, 200, y, 42, { align: 'left', color: c });
  });
}

// 腕をのばした人（横顔）と、立てた人さし指
const HEAD = [['M', 105, 660], ['Q', 105, 575, 180, 572], ['Q', 232, 575, 236, 630], ['L', 254, 668], ['L', 236, 678], ['Q', 240, 700, 226, 716], ['Q', 205, 727, 188, 724], ['L', 186, 760], ['L', 140, 760], ['L', 142, 716], ['Q', 105, 700, 105, 660], ['Z']];
const pathC = cmds => g => { for (const c of cmds) { if (c[0] === 'M') g.moveTo(c[1], c[2]); else if (c[0] === 'L') g.lineTo(c[1], c[2]); else if (c[0] === 'Q') g.quadraticCurveTo(c[1], c[2], c[3], c[4]); else g.closePath(); } };
function armFinger(g, t, k) {
  const ax = 210 + 640 * k, ay = 772 - 60 * k;   // 手の位置（腕がのびる）
  // 胴（服）
  const body = PL.poly([[128, 752], [204, 752], [236, 790], [244, 1000], [100, 1000], [104, 790]]);
  PL.tint(g, body, PL.T.sea, 0.6); PL.hatch(g, body, { angle: 0.8, gap: 9, w: 1.8, not: PL.rect(0, 0, 180, 1100) }); PL.ink(g, body, 5);
  // 腕（そで＋手首）
  const ux = ax - 214, uy = ay - 776, ul = Math.hypot(ux, uy) || 1, nx = -uy / ul, ny = ux / ul;
  const arm = PL.poly([[214 + nx * 22, 776 + ny * 22], [ax + nx * 16, ay + ny * 16], [ax - nx * 16, ay - ny * 16], [214 - nx * 22, 776 - ny * 22]]);
  PL.tint(g, arm, PL.T.sea, 0.6); PL.hatch(g, arm, { angle: 0.8, gap: 8, w: 1.6, not: PL.poly([[214 - nx * 2, 776 - ny * 2], [ax - nx * 2, ay - ny * 2], [ax - nx * 40, ay - ny * 40], [214 - nx * 40, 776 - ny * 40]]) }); PL.ink(g, arm, 5);
  // にぎった手と、立てた人さし指
  const fist = g2 => { g2.moveTo(ax - 8, ay - 22); g2.quadraticCurveTo(ax + 40, ay - 34, ax + 46, ay - 4); g2.quadraticCurveTo(ax + 48, ay + 26, ax + 12, ay + 26); g2.quadraticCurveTo(ax - 10, ay + 24, ax - 8, ay - 22); g2.closePath(); };
  const finger = g2 => { g2.moveTo(ax + 14, ay - 26); g2.lineTo(ax + 14, ay - 120); g2.quadraticCurveTo(ax + 28, ay - 136, ax + 42, ay - 120); g2.lineTo(ax + 42, ay - 26); g2.closePath(); };
  [fist, finger].forEach(p => { PL.tint(g, p, PL.T.rose, 0.75); PL.hatch(g, p, { angle: 0.7, gap: 6, w: 1.2, not: PL.rect(ax - 60, ay - 160, 80, 210) }); PL.ink(g, p, 4); });
  PL.ink(g, gg => { gg.moveTo(ax + 18, ay - 110); gg.quadraticCurveTo(ax + 28, ay - 104, ax + 38, ay - 110); gg.moveTo(ax + 18, ay - 70); gg.lineTo(ax + 38, ay - 70); for (let i = 0; i < 3; i++) { gg.moveTo(ax + 44, ay - 8 + i * 11); gg.lineTo(ax + 30, ay - 6 + i * 11); } }, 1.6);   // つめ・ふし・にぎった指
  // 頭（横顔）。髪・耳・目
  const head = pathC(HEAD);
  PL.tint(g, head, PL.T.rose, 0.7);
  g.save(); g.beginPath(); head(g); g.clip(); PL.tint(g, g2 => { g2.moveTo(100, 690); g2.quadraticCurveTo(140, 600, 238, 612); g2.lineTo(238, 560); g2.lineTo(100, 560); g2.closePath(); }, PL.T.brown, 0.9); g.restore();
  PL.hatch(g, head, { angle: 0.7, gap: 7, w: 1.4, not: PL.rect(150, 500, 200, 300) });
  PL.ink(g, head, 5);
  const ear = PL.ellipse(158, 668, 11, 19); PL.tint(g, ear, PL.T.rose, 0.8); PL.ink(g, ear, 2.6);
  PL.ink(g, gg => { gg.moveTo(204, 640); gg.quadraticCurveTo(214, 632, 224, 640); gg.quadraticCurveTo(214, 646, 204, 640); }, 2.4);
  g.fillStyle = PL.INK; g.beginPath(); g.arc(216, 640, 3.5, 0, Math.PI * 2); g.fill();
  return { ex: 216, ey: 640, fx0: ax + 14, fx1: ax + 42, fy: ay - 128 };
}

function draw(g, t) {
  // 0〜10: 当ててみて
  if (t < 10.0) {
    if (t < 6.0) { g.save(); g.globalAlpha = fade(t, -1, 6.0, 0.3); sky(g, t, 290, 120, 500, 220, 0, 0, { gaze: false }); g.restore(); }
    TK.hook(g, t, 0.0, 1.6, 'この星、どこを見ると\n[いちばん見える？]', { y: 700, size: 92 });
    TK.choices(g, t, 1.6, 6.3, ['まっすぐ見る', '少し横を見る', '目を細める'], { y: 600, h: 150, gap: 28, size: 64, reveal: 6.0, answer: 1, think: [4.0, 6.0] });
    if (t >= 6.3) {
      // まっすぐ見ると消える → 8〜10 少し横を見ると見える
      g.save(); g.globalAlpha = fade(t, 6.3, 10.0, 0.3);
      const cx = 540, cy = 560, off = ease(clamp((t - 8.0) / 0.8, 0, 1)) * 160;
      PL.label(g, t < 8.0 ? 'A まっすぐ見ると…' : 'B 少し横を見ると', PW / 2, 230, 64, { color: t < 8.0 ? PL.RED : PL.GREEN });
      sky(g, t, 110, 310, 860, 520, cx + off, cy - off * 0.3, { sx: cx, sy: cy });
      if (t > 7.4 && t < 8.0) redX(g, cx, cy, 50, (t - 7.4) / 0.3);
      if (t > 9.0) { g.save(); g.globalAlpha *= clamp(TK.pop(t, 9.0), 0, 1); PL.leader(g, cx - 16, cy + 30, 430, 862, PL.GREEN); PL.label(g, '見えた！', 430, 900, 56, { color: PL.GREEN }); g.restore(); }
      PL.label(g, '＋ ＝ 見ているところ', 960, 900, 38, { align: 'right', color: PL.RED, bold: false });
      g.restore();
    }
  }
  // 10〜17: 網膜のまん中には桿体がない
  if (t >= 10.0 && t < 17.0) {
    g.save(); g.globalAlpha = fade(t, 10.0, 17.0, 0.3);
    PL.label(g, '網膜の細胞の数（形だけの模式）', PW / 2, 190, 54, { color: TK.C.sub });
    retinaGraph(g, t, clamp((t - 10.3) / 2.4, 0, 1));
    g.restore();
  }
  // 17〜21: 腕をのばした指1本ぶん
  if (t >= 17.0 && t < 21.0) {
    g.save(); g.globalAlpha = fade(t, 17.0, 21.0, 0.3);
    const k = ease(clamp((t - 17.2) / 1.0, 0, 1)), p = armFinger(g, t, k);
    if (k >= 1) {
      const a = clamp((t - 18.4) / 0.6, 0, 1);
      g.save(); g.globalAlpha *= a;
      PL.dots(g, [[p.ex, p.ey], [p.fx0, p.fy]], { w: 4, dash: [3, 10] }); PL.dots(g, [[p.ex, p.ey], [p.fx1, p.fy]], { w: 4, dash: [3, 10] });
      g.restore();
      if (t > 18.6) { g.save(); g.globalAlpha *= clamp(TK.pop(t, 18.6), 0, 1); PL.label(g, '指1本 ≒ [約1度]', 560, 420, 72); g.restore(); }
    }
    g.restore();
  }
  // 21〜25: 少しずらして見る ＋ 9200万個
  if (t >= 21.0) {
    g.save(); g.globalAlpha = fade(t, 21.0, 25.5, 0.3);
    const cx = 540, cy = 640, off = 70 + 90 * ease(clamp((t - 21.2) / 1.0, 0, 1));
    sky(g, t, 110, 420, 860, 440, cx + off, cy + off * 0.3, { sx: cx, sy: cy });
    if (t > 22.6) { g.save(); g.globalAlpha *= clamp(TK.pop(t, 22.6), 0, 1); PL.label(g, '桿体 約[9200万]個', PW / 2, 280, 84); g.restore(); }
    g.restore();
  }
  if (t >= 6.0 && t < 10.0) TK.note(g, t, 6.0, 10.0, '星が消える絵は分かりやすくするため（実際は暗さ・慣れぐあいで変わる）', { size: 30 });
  if (t >= 10.0 && t < 17.0) TK.note(g, t, 10.0, 17.0, '桿体のない所: 直径 0.35 mm（1.25°）。曲線の形は模式', { size: 30 });
  if (t >= 17.0 && t < 21.0) TK.note(g, t, 17.0, 21.0, '「指1本で約1度」は目安（腕の長さで変わる）', { size: 30 });
  if (t >= 21.0) TK.note(g, t, 21.0, 25.0, '出どころ: Curcio ほか (1990)\nJ Comp Neurol 292: 497–523', { size: 30, y: 1150 });   // 2行なので絵の下に（クレジットと重ねない）
}

triviaStart({ out: 'eye-optics-trivia2', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
