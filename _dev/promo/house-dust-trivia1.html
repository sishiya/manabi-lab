<script>
'use strict';
// うんちく house-dust-1（型A ぜんぶ逆）「アメリカの家では、ほこりの6割は外から」。台本は trivia/house-dust.md。?short で録る
// REVIEW の直し: 「アメリカ（土足）の家のモデル」を大きめに・「根拠がない」→「確かめた研究が見つからない」・最後の「玄関」は「かも」まで。
// 6割以上は Layton & Beamer (2009) のアメリカ中西部の家のコンピューターのモデル（ScienceDaily の紹介）。円グラフは 60:40 で描き、字は「以上／以下」
const DUR = 30;
const subs = [
  { a: 0.0, b: 1.8, ja: 'ほこりの8割は人の皮ふ？', en: 'Is 80% of house dust dead skin?', noBurn: true },
  { a: 1.8, b: 4.0, ja: 'よく聞くけど、\n[確かめた研究]が見つからない', en: 'You hear it a lot, but no study seems to back it up' },
  { a: 4.0, b: 10.0, ja: '2009年、アメリカの研究。土足の家のほこりが\nどこから来るかを、[計算で]追いかけた', en: 'A 2009 US study used a computer model to trace\nwhere dust comes from in homes where people wear shoes' },
  { a: 10.0, b: 14.5, ja: '答え: [6割以上は、外]から。\n靴の土と、窓やすき間から入る空気の粒', en: 'Answer: over 60% comes from outdoors —\nsoil on shoes and particles in outside air' },
  { a: 14.5, b: 18.0, ja: '靴をぬぐ日本の家では、\n外の分は[もっと少ない]かも', en: 'In Japanese homes, where shoes come off,\nthe outdoor share may be smaller' },
  { a: 18.0, b: 25.0, ja: '皮ふも入っている。\nでも、[主役じゃない]', en: 'Skin is in there too.\nBut it isn’t the main ingredient' },
  { a: 25.0, b: 30.0, ja: 'ほこりを減らす近道は…\n[玄関]、かも', en: 'The shortcut to less dust…\nmight be your front door' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.9, type: 'buzz' }, { t: 4.0, type: 'whoosh' }, { t: 5.2, type: 'tick' }, { t: 6.4, type: 'tick' },
  { t: 10.0, type: 'rise' }, { t: 11.2, type: 'ding' }, { t: 14.5, type: 'pop' }, { t: 18.0, type: 'whoosh' },
  { t: 19.0, type: 'pop' }, { t: 20.0, type: 'pop' }, { t: 21.0, type: 'pop' }, { t: 22.0, type: 'pop' }, { t: 23.0, type: 'pop' },
  { t: 25.0, type: 'whoosh' }, { t: 26.6, type: 'ding' },
];
const rnd = (i, k = 1) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
// 絵は「図鑑の版画」（PL.*）。粒はまとめて1つの道にして、手彩色と墨の線を1回ずつ（筆のルックのにじみは重いので）
const SOIL = PL.T.wood, AIR = PL.T.sky, SKIN = PL.T.rose, FIBER = PL.T.sea, POLLEN = PL.T.gold, SOOT = PL.T.gray;

// 「アメリカ（土足）の家のモデル」の札（大きめ。消さない）
function modelTag(g, y, a = 1) {
  g.save(); g.globalAlpha *= a;
  TK.card(g, 110, y - 62, PW - 220, 124); PL.ink(g, PL.rect(110, y - 62, PW - 220, 124), 5, PL.RED);   // 札の地は紙のまま（色をぬると字の下がつぶれる）
  TK.text(g, '[アメリカ（土足）]の家のモデル', PW / 2, y, 70, { maxw: 780 });
  g.restore();
}
// 小さな粒の道（土はとがった形、空気の粒は丸）
const grain = (x, y, r, i) => g => { const n = 6; for (let j = 0; j < n; j++) { const a = j / n * Math.PI * 2 + i, rr = r * (0.7 + rnd(i * 7 + j, 3) * 0.5); g[j ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); };
function grains(g, list, color, round) {   // list: [x, y, r, i]
  if (!list.length) return;
  const path = gg => list.forEach(([x, y, r, i]) => (round ? PL.circle(x, y, r) : grain(x, y, r, i))(gg));
  PL.tint(g, path, color, 0.9); PL.ink(g, path, 2);
}
// 靴（横から。ひもの靴）。x は靴のまん中、y は底、dir: 1 右向き
function shoe(g, x, y, s = 1, dir = 1, soil = true) {
  const P = (px, py) => [x + px * s * dir, y + py * s];
  const up = gg => { [[-55, -8], [-57, -40], [-48, -54], [-24, -50], [-2, -36], [28, -32], [50, -22], [60, -8]].forEach((p, i) => gg[i ? 'lineTo' : 'moveTo'](...P(...p))); gg.closePath(); };
  const sole = gg => { [[-58, -9], [62, -9], [64, -2], [58, 2], [-58, 2]].forEach((p, i) => gg[i ? 'lineTo' : 'moveTo'](...P(...p))); gg.closePath(); };
  PL.tint(g, up, PL.T.sea, 0.55); PL.hatch(g, up, { angle: 0.5, gap: 6, w: 1.3, not: gg => { gg.rect(-50, -50, PW + 100, y - 30 * s + 50); } });
  PL.ink(g, gg => { for (let k = 0; k < 3; k++) { gg.moveTo(...P(-14 + k * 10, -44 + k * 3)); gg.lineTo(...P(-4 + k * 10, -36 + k * 3)); } }, 2);
  PL.ink(g, up, 3.5);
  PL.tint(g, sole, soil ? PL.T.brown : PL.T.gray, 0.85); PL.ink(g, sole, 3);
}
// 棚と、その上に積もったほこりの層
function shelf(g, y) {
  const board = PL.rect(170, y, 740, 34), legL = PL.rect(200, y + 34, 26, 160), legR = PL.rect(854, y + 34, 26, 160);
  [board, legL, legR].forEach(p => { PL.tint(g, p, PL.T.wood, 0.75); PL.hatch(g, p, { angle: 0.9, gap: 8, w: 1.5 }); PL.ink(g, p, 4); });
  const layer = gg => { gg.moveTo(180, y); for (let x = 180; x <= 900; x += 12) gg.lineTo(x, y - 7 - rnd(x) * 6); gg.lineTo(900, y); gg.closePath(); };
  PL.tint(g, layer, PL.T.gray, 0.8);
  grains(g, Array.from({ length: 34 }, (_, i) => [190 + rnd(i) * 700, y - 10 - rnd(i, 2) * 6, 4 + rnd(i, 3) * 3, i]), SOIL);
  PL.ink(g, gg => { for (let i = 0; i < 18; i++) { const x = 190 + rnd(i, 5) * 680; gg.moveTo(x, y - 6); gg.quadraticCurveTo(x + 12, y - 20, x + 26, y - 8); } }, 1.6, 'rgba(47,95,122,0.9)');   // 繊維
  PL.ink(g, layer, 2);
}
// 家の断面（玄関・窓・すき間）。k は外の粒の流れこみの進み
const HL = 150, HR = 930, HT = 560, HB = 1060;
function walls(g, door = true) {
  const roof = PL.poly([[HL - 50, HT + 6], [PW / 2, HT - 180], [HR + 50, HT + 6], [HR + 20, HT + 24], [PW / 2, HT - 148], [HL - 20, HT + 24]]);
  PL.tint(g, roof, PL.T.rust, 0.7); PL.hatch(g, roof, { angle: 1.0, gap: 9, w: 1.5 }); PL.ink(g, roof, 4);
  const wl = [PL.rect(HL - 18, HT + 24, 18, 740 - HT - 24), PL.rect(HL - 18, 960, 18, HB - 960), PL.rect(HR, HT + 24, 18, 690 - HT - 24), PL.rect(HR, 860, 18, HB - 860)];
  if (!door) wl[0] = PL.rect(HL - 18, HT + 24, 18, 960 - HT - 24);
  wl.forEach(p => { PL.tint(g, p, PL.T.gray, 0.7); PL.hatch(g, p, { angle: 0.8, gap: 6, w: 1.3 }); PL.ink(g, p, 3); });
  const floor = PL.rect(HL - 18, HB, HR - HL + 36, 22);
  PL.tint(g, floor, PL.T.wood, 0.75); PL.hatch(g, floor, { angle: 0.9, gap: 8, w: 1.4 }); PL.ink(g, floor, 3.5);
  const glass = PL.rect(HR + 2, 690, 14, 170);   // 窓（すき間）
  PL.tint(g, glass, PL.T.sky, 0.6); PL.ink(g, glass, 3, TK.C.acc2);
  PL.ink(g, gg => { gg.moveTo(HL - 18, HT + 24); gg.lineTo(HR + 18, HT + 24); }, 3);   // 天井
}
function arrow(g, x0, y0, x1, y1, c) {
  PL.ink(g, gg => { gg.moveTo(x0, y0); gg.lineTo(x1, y1); }, 8, c);
  const a = Math.atan2(y1 - y0, x1 - x0);
  PL.ink(g, gg => { gg.moveTo(x1 - 34 * Math.cos(a - 0.5), y1 - 34 * Math.sin(a - 0.5)); gg.lineTo(x1, y1); gg.lineTo(x1 - 34 * Math.cos(a + 0.5), y1 - 34 * Math.sin(a + 0.5)); }, 8, c);
}
function house(g, t, k) {
  walls(g);
  shoe(g, lerp(10, 330, ease((t - 4.6) / 3)), HB, 1.5, 1);
  const soil = [], air = [];
  for (let i = 0; i < 70; i++) {
    const p = clamp(k * 1.4 - rnd(i) * 0.4, 0, 1); if (p <= 0) continue;
    if (i % 2 === 0) soil.push([lerp(HL - 20, HL + 80 + rnd(i, 4) * 640, p), lerp(HB - 12, HB - 8 - rnd(i, 5) * 6, p), 7, i]);
    else air.push([lerp(HR + 120, HL + 60 + rnd(i, 6) * 680, p), lerp(760 + rnd(i, 7) * 80, HB - 10 - rnd(i, 8) * 6, ease(p)), 6, i]);
  }
  grains(g, soil, SOIL); grains(g, air, AIR, true);
  PL.label(g, '玄関', 75, 690, 40, { color: TK.C.sub });
  if (t > 5.0) { g.save(); g.globalAlpha = fade(t, 5.0, 10, 0.3); arrow(g, 20, 900, 240, 900, PL.T.brown); PL.label(g, '靴の土', 40, 1125, 44, { align: 'left', color: '#7a5a3a' }); g.restore(); }
  if (t > 6.2) { g.save(); g.globalAlpha = fade(t, 6.2, 10, 0.3); arrow(g, 1070, 775, 840, 775, TK.C.acc2); PL.leader(g, HR + 30, 690, 990, 470, TK.C.acc2); PL.label(g, '窓・すき間から', 1050, 440, 40, { align: 'right', color: TK.C.acc2 }); g.restore(); }
}
// 円グラフ（外 60・中 40 として描く）。名前はグラフの外に、引き出し線で
function pie(g, t, cx, cy, r) {
  const k = TK.out((t - 10.4) / 1.6), aO = Math.PI * 2 * 0.6 * k, a0 = -Math.PI / 2;
  const wedge = (b0, b1) => gg => { gg.moveTo(cx, cy); gg.arc(cx, cy, r, b0, b1); gg.closePath(); };
  PL.tint(g, PL.circle(cx, cy, r), PL.T.sand, 0.15);
  if (k > 0.01) {
    const w = wedge(a0, a0 + aO); PL.tint(g, w, SOIL, 0.75); PL.hatch(g, w, { angle: 0.7, gap: 12, w: 1.6, cx, cy });
    g.save(); g.beginPath(); w(g); g.clip(); grains(g, Array.from({ length: 40 }, (_, i) => [cx + (rnd(i, 21) - 0.5) * 2 * r, cy + (rnd(i, 22) - 0.5) * 2 * r, 5, i]), PL.T.brown); g.restore();
    PL.ink(g, w, 4);
  }
  if (k > 0.98) {
    const k2 = TK.out((t - 12.0) / 1.0), w = wedge(a0 + aO, a0 + aO + Math.PI * 2 * 0.4 * k2);
    if (k2 > 0.01) {
      PL.tint(g, w, SKIN, 0.7);
      g.save(); g.beginPath(); w(g); g.clip(); PL.ink(g, gg => { for (let i = 0; i < 16; i++) { const x = cx - r + rnd(i, 31) * r, y = cy - r + rnd(i, 32) * r * 2; gg.moveTo(x, y); gg.bezierCurveTo(x + 30, y - 30, x + 50, y + 20, x + 80, y - 6); } }, 2, 'rgba(47,95,122,0.8)'); g.restore();   // 繊維
      PL.ink(g, w, 4);
    }
    if (k2 > 0.5) {
      g.save(); g.globalAlpha *= clamp((k2 - 0.5) * 3, 0, 1);
      PL.leader(g, cx + r * 0.6, cy + r * 0.3, 840, cy + 150); PL.label(g, '外', 940, cy + 150, 54, { color: '#7a5a3a' }); PL.label(g, '[6割以上]', 940, cy + 215, 52);
      PL.leader(g, cx - r * 0.55, cy - r * 0.35, 240, cy - 120); PL.label(g, '中', 150, cy - 200, 48, { color: TK.C.sub }); PL.label(g, '4割以下', 150, cy - 140, 44, { color: TK.C.sub });
      g.restore();
    }
  }
  if (t > 13) {
    g.save(); g.globalAlpha = fade(t, 13, 18, 0.3);
    PL.label(g, '外 = 靴の土 ＋ 外の空気の粒', PW / 2, cy + r + 60, 44, { color: TK.C.sub });
    PL.label(g, '中 = 皮ふ・服や家具の繊維 など', PW / 2, cy + r + 115, 44, { color: TK.C.sub });
    g.restore();
  }
}
// ルーペの中（積もったほこり）。名前はレンズの外に
function loupe(g, t) {
  const cx = 490, cy = 680, r = 300;
  const handle = PL.poly([[cx + r * 0.7 - 16, cy + r * 0.7 + 16], [cx + r * 0.7 + 16, cy + r * 0.7 - 16], [cx + r * 0.7 + 150, cy + r * 0.7 + 118], [cx + r * 0.7 + 118, cy + r * 0.7 + 150]]);
  PL.tint(g, handle, PL.T.wood, 0.85); PL.hatch(g, handle, { angle: 0.4, gap: 7, w: 1.5 }); PL.ink(g, handle, 4);
  const lens = PL.circle(cx, cy, r);
  PL.tint(g, lens, PL.T.sky, 0.18);
  g.save(); g.beginPath(); lens(g); g.clip();
  grains(g, Array.from({ length: 30 }, (_, i) => [cx - r + rnd(i, 9) * r * 2, cy - r + rnd(i, 10) * r * 2, 4 + rnd(i, 11) * 4, i]), PL.T.gray);   // 背景の小さな粒
  const kinds = [
    { n: 'つち', s: 'rock', x: -140, y: -130, lx: 95, ly: 450, side: -1 }, { n: 'すす', s: 'soot', x: 120, y: -160, lx: 900, ly: 470, side: 1 },
    { n: '花粉', s: 'pollen', x: 140, y: 110, lx: 930, ly: 740, side: 1 }, { n: '繊維', s: 'fiber', x: -10, y: 10, lx: 920, ly: 620, side: 1 },
    { n: '皮ふ', s: 'flake', x: -150, y: 170, lx: 95, ly: 900, side: -1 },
  ];
  const shown = [];
  kinds.forEach((q, i) => {
    const k = clamp(TK.pop(t, 19 + i, 0.4), 0, 1.2); if (k <= 0) return;
    const x = cx + q.x, y = cy + q.y, S = k; shown.push([q, x, y, k]);
    if (q.s === 'rock') { const p = grain(x, y, 55 * S, 3); PL.tint(g, p, SOIL, 0.85); PL.hatch(g, p, { angle: 0.7, gap: 7, w: 1.5, cx: x, cy: y, not: PL.circle(x - 16, y - 16, 40 * S) }); PL.ink(g, gg => { gg.moveTo(x - 20 * S, y - 10 * S); gg.lineTo(x + 10 * S, y + 20 * S); }, 1.6); PL.ink(g, p, 4); }
    if (q.s === 'soot') { const p = gg => { for (let j = 0; j < 9; j++) PL.circle(x + Math.cos(j * 2.1) * 26 * S * (j % 3 ? 1 : 0.4), y + Math.sin(j * 1.7) * 22 * S, 15 * S)(gg); }; PL.tint(g, p, SOOT, 1); PL.hatch(g, p, { angle: 0.8, gap: 5, w: 1.3, cx: x, cy: y }); PL.ink(g, p, 2.5); }
    if (q.s === 'pollen') { PL.sphere(g, x, y, 40 * S, POLLEN, { contour: false, ow: 3.5 }); PL.ink(g, gg => { for (let j = 0; j < 16; j++) { const a = j / 16 * Math.PI * 2; gg.moveTo(x + Math.cos(a) * 40 * S, y + Math.sin(a) * 40 * S); gg.lineTo(x + Math.cos(a) * 52 * S, y + Math.sin(a) * 52 * S); } }, 3); }
    if (q.s === 'fiber') { const pth = gg => { gg.moveTo(x - 130 * S, y - 40 * S); gg.bezierCurveTo(x - 40 * S, y + 60 * S, x + 40 * S, y - 80 * S, x + 140 * S, y + 30 * S); }; PL.ink(g, pth, 16 * S, PL.INK); PL.ink(g, pth, 10 * S, '#7fb0c8'); PL.ink(g, pth, 2, 'rgba(35,28,21,0.5)'); }
    if (q.s === 'flake') { const p = PL.poly([[x - 60 * S, y - 10 * S], [x, y - 40 * S], [x + 62 * S, y - 6 * S], [x + 24 * S, y + 34 * S], [x - 46 * S, y + 28 * S]]); PL.tint(g, p, SKIN, 0.8); PL.ink(g, gg => { gg.moveTo(x - 30 * S, y - 22 * S); gg.lineTo(x - 6 * S, y + 4 * S); gg.lineTo(x - 30 * S, y + 26 * S); gg.moveTo(x - 6 * S, y + 4 * S); gg.lineTo(x + 30 * S, y - 22 * S); gg.moveTo(x - 6 * S, y + 4 * S); gg.lineTo(x + 20 * S, y + 30 * S); }, 1.6); PL.ink(g, p, 3); }   // 角質の細胞のさかい目
  });
  g.restore();
  PL.ink(g, lens, 14); PL.ink(g, PL.circle(cx, cy, r - 12), 2);
  shown.forEach(([q, x, y, k]) => { g.save(); g.globalAlpha *= clamp(k, 0, 1); PL.leader(g, x, y, q.lx + (q.side < 0 ? 60 : -60), q.ly); PL.label(g, q.n, q.lx, q.ly - 45, 46); g.restore(); });
}
// 玄関マット
function doorMat(g, t) {
  walls(g);
  const mat = PL.rect(HL + 30, HB - 14, 300, 14);
  PL.tint(g, mat, PL.T.leaf, 0.85); PL.hatch(g, mat, { angle: 1.2, gap: 6, w: 1.4 }); PL.ink(g, mat, 3);
  PL.ink(g, gg => { for (let x = HL + 34; x < HL + 330; x += 10) { gg.moveTo(x, HB - 14); gg.lineTo(x + 3, HB - 22); } }, 1.4);   // マットの毛
  shoe(g, HL + 460, HB, 1.4, -1, false); shoe(g, HL + 640, HB, 1.4, -1, false);
  const k = fade(t, 26.2, 30, 0.4), p = 0.5 + 0.5 * Math.sin(t * 4);
  g.save(); g.globalAlpha *= k;
  PL.dots(g, [[HL + 10, 760], [HL + 350, 760], [HL + 350, HB + 30], [HL + 10, HB + 30], [HL + 10, 760]], { color: PL.RED, w: 6 + 3 * p, dash: [22, 14] });
  g.restore();
  PL.label(g, '玄関', HL + 180, 700, 56, { color: PL.RED });
}

function draw(g, t) {
  // 0〜4: フック
  if (t < 4.0) {
    shelf(g, 940);
    const k = TK.pop(t, 0.0, 0.4);
    g.save(); g.globalAlpha = fade(t, -1, 4, 0.3);
    PL.label(g, 'ほこりの[8割]は', 80, 260, 88 * (0.6 + 0.4 * k), { align: 'left' });
    PL.label(g, '人の皮ふ？', 80, 370, 88 * (0.6 + 0.4 * k), { align: 'left' });
    if (t > 0.9) {   // 朱の ×（字の右に。字に重ねない）
      const x = TK.out((t - 0.9) / 0.25), cx = 880, cy = 310, r = 80;
      PL.ink(g, gg => { gg.moveTo(cx - r, cy - r); gg.lineTo(cx - r + 2 * r * x, cy - r + 2 * r * x); if (x > 0.5) { const y = (x - 0.5) * 2; gg.moveTo(cx + r, cy - r); gg.lineTo(cx + r - 2 * r * y, cy - r + 2 * r * y); } }, 20, PL.RED);
    }
    if (t > 1.2) {
      g.globalAlpha *= clamp((t - 1.2) / 0.3, 0, 1);
      PL.label(g, '→ 6割は [外] から', PW / 2, 580, 88);
      modelTag(g, 730);
    }
    g.restore();
    PL.leader(g, 420, 928, 360, 860); PL.label(g, '棚に積もったほこり', 360, 830, 38, { color: TK.C.sub, bold: false });
  }
  // 4〜10: 家の断面
  if (t >= 4.0 && t < 10.0) {
    modelTag(g, 230, fade(t, 4, 30, 0.3));
    house(g, t, clamp((t - 5.0) / 4.5, 0, 1));
  }
  // 10〜18: 円グラフ
  if (t >= 10.0 && t < 18.0) {
    modelTag(g, 230);
    pie(g, t, PW / 2, 600, 250);
    if (t > 14.5) { g.save(); g.globalAlpha = fade(t, 14.5, 18, 0.3); PL.label(g, '日本の家（靴をぬぐ）は、たしかめた数字なし', PW / 2, 1070, 40, { color: TK.C.sub, bold: false }); g.restore(); }
  }
  // 18〜25: ルーペ
  if (t >= 18.0 && t < 25.0) { PL.label(g, '積もったほこりの中', PW / 2, 230, 60, { color: TK.C.sub }); loupe(g, t); }
  // 25〜30: 玄関
  if (t >= 25.0) { doorMat(g, t); if (t < 27.8) TK.note(g, t, 25.2, 27.8, '研究の結論ではなく、そこからの思いつきです', { size: 32 }); }
  if (t >= 4 && t < 18) TK.note(g, t, 4, 18, 'アメリカ中西部の家のコンピューターのモデル（推定）。家・季節・土足かどうかで変わります', { size: 30 });
  if (t >= 27.8) TK.note(g, t, 27.8, 30.0, '出どころ: Layton & Beamer (2009) Environ. Sci. Technol. 43:8199', { size: 30 });
}
