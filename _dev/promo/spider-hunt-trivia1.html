<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>

<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく spider-hunt-1（型H 当ててみて）「赤い光の中で跳ぶと、どうなる？」。台本は trivia/spider-hunt.md。?short で録る
// Nagata ほか 2012（Science）・2013（Biophysics, PMC4629671）: 主眼の網膜は4層。緑（約520nm）は第1層（いちばん奥）でくっきり、
// 第2層ではいつもぼける。そのぼけの大きさで距離をはかる。赤（約630nm）では目当てより有意に短く跳ぶ。6倍明るい赤でも同じ。
// こわがらせない: クモは横から見た線の小さな模式だけ（顔・牙は描かない）。どれだけ手前かは描かない（数は論文の図だけで読めていない）。
const DUR = 35;
const GREEN = '#59e39a', RED = '#ff6b6b';
const subs = [
  { a: 0.0, b: 3.4, ja: 'ハエトリグモを赤い光の中に置くと、ジャンプはどうなる？', en: 'Put a jumping spider under red light. What happens to its jump?', noBurn: true },
  { a: 3.4, b: 8.0, ja: 'ぴったり？ 跳びすぎ？\n手前に落ちる？', en: 'Spot on? Too far? Or short?' },
  { a: 8.0, b: 13.0, ja: '答え：[手前に落ちる]\n緑の光ではぴったりなのに', en: 'Answer: it lands short.\nUnder green light it’s spot on' },
  { a: 13.0, b: 17.0, ja: '大きな前の目は、網膜が[4段がさね]', en: 'Its big front eyes have a retina in four layers' },
  { a: 17.0, b: 21.0, ja: '緑の光は、いちばん奥の段で[くっきり]\nその1つ手前の段では、いつも[ぼける]', en: 'Green light is sharp on the deepest layer,\nand always blurry on the one in front' },
  { a: 21.0, b: 27.0, ja: 'このぼけ方のちがいで、距離を測っている\n[片目だけで]', en: 'It measures distance from how blurry it is,\nwith a single eye' },
  { a: 27.0, b: 32.0, ja: '赤い光は、緑とピントの位置が少しずれる\nぼけ方が“[もっと近い物]”と同じになって…', en: 'Red light focuses at a slightly different spot,\nso the blur looks like a closer object…' },
  { a: 32.0, b: 35.0, ja: '…ジャンプが届かない\nぼけを“見て”距離を測る目', en: '…and the jump falls short.\nAn eye that sees distance in blur' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.2, type: 'whoosh' }, { t: 3.4, type: 'pop' }, { t: 4.6, type: 'tick' }, { t: 5.6, type: 'tick' }, { t: 6.6, type: 'tick' },
  { t: 7.6, type: 'ding' }, { t: 8.6, type: 'whoosh' }, { t: 10.6, type: 'thud' }, { t: 13.0, type: 'whoosh' }, { t: 17.2, type: 'pop' }, { t: 18.6, type: 'pop' },
  { t: 21.0, type: 'whoosh' }, { t: 27.0, type: 'rise' }, { t: 30.0, type: 'buzz' }, { t: 32.4, type: 'thud' },
];

// ---- 横から見た場面（線の模式）----
// クモ: 丸い頭胸部＋腹部、脚4本の線（こちら向きの顔や牙は描かない）
function spider(g, x, y, s = 1, color = '#e8eefc', crouch = 0) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = color; g.fillStyle = 'rgba(232,238,252,0.18)'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
  const by = -26 + crouch * 8;
  // 脚（ひざが上に出る形）
  for (let i = 0; i < 4; i++) {
    const hx = -8 + i * 8, kx = -34 + i * 22, fx = -46 + i * 30;
    g.beginPath(); g.moveTo(hx, by); g.lineTo(kx, by - 18 + crouch * 6); g.lineTo(fx, 0); g.stroke();
  }
  g.beginPath(); g.ellipse(-26, by - 4, 24, 18, -0.2, 0, Math.PI * 2); g.fill(); g.stroke();   // 腹
  g.beginPath(); g.ellipse(12, by - 6, 20, 15, 0, 0, Math.PI * 2); g.fill(); g.stroke();        // 頭胸部
  g.restore();
}
// ハエ（的）: 体の楕円と羽2枚
function fly(g, x, y, s = 1) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = '#e8eefc'; g.lineWidth = 3.5; g.fillStyle = 'rgba(232,238,252,0.18)';
  g.beginPath(); g.ellipse(-4, -18, 16, 22, -0.5, 0, Math.PI * 2); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(0, -14, 22, 11, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  g.beginPath(); g.arc(22, -16, 8, 0, Math.PI * 2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-10, -4); g.lineTo(-14, 2); g.moveTo(6, -4); g.lineTo(8, 2); g.moveTo(16, -6); g.lineTo(20, 2); g.stroke();
  g.restore();
}
// 1つの場面（台・クモ・ハエ・跳ぶ道すじ）。land: 着地の x（的は x1）。u: 0〜1 の跳躍の進み
function scene(g, y0, col, land, u, label) {
  const x0 = 200, x1 = 800;
  // 光の色
  g.save();
  const gr = g.createRadialGradient(540, y0 - 150, 40, 540, y0 - 120, 520);
  gr.addColorStop(0, col + '40'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(60, y0 - 360, 900, 420);
  g.restore();
  // 地面
  g.strokeStyle = 'rgba(200,215,255,0.55)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(90, y0); g.lineTo(950, y0); g.stroke();
  fly(g, x1, y0, 2.1);
  // 道すじ（点線）
  const peak = 170;
  const path = k => [lerp(x0, land, k), y0 - 4 * peak * k * (1 - k)];
  g.save(); g.setLineDash([12, 14]); g.strokeStyle = col; g.lineWidth = 4; g.globalAlpha = 0.85;
  g.beginPath(); for (let i = 0; i <= 40; i++) { const k = i / 40 * u, [x, y] = path(k); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore();
  const [sx, sy] = path(u);
  spider(g, sx, sy, 2.1, '#e8eefc', u <= 0 ? 1 : 0);
  if (u >= 1) {
    g.strokeStyle = col; g.lineWidth = 5;
    if (Math.abs(land - x1) < 5) { g.beginPath(); g.arc(x1, y0 - 36, 90, 0, Math.PI * 2); g.stroke(); }
    else { g.beginPath(); g.moveTo(land - 26, y0 + 30); g.lineTo(land + 26, y0 + 80); g.moveTo(land + 26, y0 + 30); g.lineTo(land - 26, y0 + 80); g.stroke(); }
  }
  if (label) TK.text(g, label, 110, y0 - 300, 54, { align: 'left', color: col });
}

// ---- 目の断面（模式）----
const LX = 190, LY = 660, AP = 120;            // レンズの中心と、光の入る高さの半分
const LAYERS = [880, 820, 760, 700];            // 第1層（いちばん奥）〜第4層の x
function eyeBase(g, f = 1, hi = -1) {
  g.save(); g.globalAlpha *= f;
  // 目の筒
  g.strokeStyle = 'rgba(200,215,255,0.45)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(LX + 20, LY - 190); g.lineTo(620, LY - 230); g.quadraticCurveTo(940, LY - 250, 940, LY); g.quadraticCurveTo(940, LY + 250, 620, LY + 230); g.lineTo(LX + 20, LY + 190); g.stroke();
  // レンズ
  g.fillStyle = 'rgba(95,212,255,0.18)'; g.strokeStyle = TK.C.acc2; g.lineWidth = 4;
  g.beginPath(); g.ellipse(LX, LY, 46, 175, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  // 網膜の4層
  LAYERS.forEach((x, i) => {
    const on = hi === i;
    g.strokeStyle = on ? TK.C.acc : 'rgba(200,215,255,0.55)'; g.lineWidth = on ? 9 : 6;
    g.beginPath(); g.moveTo(x - 14, LY - 200); g.quadraticCurveTo(x + 14, LY, x - 14, LY + 200); g.stroke();
  });
  g.restore();
}
// 光の束: レンズから焦点 fx へ集まる。ぼけの大きさ（その層での半分の高さ）を返す
function rays(g, fx, col, f = 1) {
  g.save(); g.globalAlpha *= f; g.strokeStyle = col; g.lineWidth = 3.5;
  for (let i = -2; i <= 2; i++) {
    const y = LY + i / 2 * AP;
    g.beginPath(); g.moveTo(40, y); g.lineTo(LX, y);
    const ex = Math.min(930, fx + 60), ey = y + (LY - y) * (ex - LX) / (fx - LX);
    g.lineTo(ex, ey); g.stroke();
  }
  g.fillStyle = col; g.beginPath(); g.arc(fx, LY, 9, 0, Math.PI * 2); g.fill();
  g.restore();
}
const blurAt = (fx, x) => AP * Math.abs(fx - x) / (fx - LX);
function blurMark(g, x, b, col) {
  g.save(); g.strokeStyle = col; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + 2, LY - Math.max(4, b)); g.lineTo(x + 2, LY + Math.max(4, b)); g.stroke(); g.restore();
}

function draw(g, t) {
  // 0〜3.4: フック（緑 → 赤）
  if (t < 3.4) {
    const k = clamp((t - 1.0) / 0.6, 0, 1), col = k < 0.5 ? GREEN : RED;
    g.save(); g.globalAlpha = fade(t, -1, 3.4, 0.3);
    scene(g, 960, col, 800, 0, k < 0.5 ? '緑の光' : '赤の光');
    g.restore();
    TK.hook(g, t, 0.0, 3.4, '赤い光だと\nジャンプは [どうなる？]', { y: 380, size: 116 });
  }
  // 3.4〜8: 当ててみて
  if (t >= 3.4 && t < 8.0) {
    TK.choices(g, t, 3.4, 8.0, ['ぴったり届く', '跳びすぎる', '手前に落ちる'], { y: 420, answer: 2, reveal: 7.5, think: [4.4, 7.4] });
  }
  // 8〜13: 緑と赤の跳躍（上下）
  if (t >= 8.0 && t < 13.0) {
    const u1 = clamp((t - 8.6) / 1.2, 0, 1), u2 = clamp((t - 9.6) / 1.2, 0, 1);
    g.save(); g.globalAlpha = fade(t, 8, 13, 0.3);
    scene(g, 500, GREEN, 800, u1, '緑の光');
    scene(g, 940, RED, 610, u2, '赤の光');
    g.restore();
    TK.note(g, t, 8.6, 13.0, '模式の絵（どれだけ手前かは描いていません）\n赤を6倍明るくしても、短いまま＝明るさではなく色のせい', { size: 32 });
  }
  // 13〜21: 目の断面。4層、緑は第1層でくっきり、第2層でぼける
  if (t >= 13.0 && t < 21.0) {
    const f = fade(t, 13, 21, 0.3);
    TK.text(g, 'クモの前の目（断面の模式）', PW / 2, 250, 54, { color: TK.C.sub });
    const hi = t < 17 ? Math.floor(clamp((t - 13.6) / 0.6, 0, 3.99)) : (t < 18.6 ? 0 : 1);
    eyeBase(g, f, t < 15.6 ? 3 - hi : (t < 17 ? -1 : hi));
    if (t < 17) {
      g.save(); g.globalAlpha = f;
      LAYERS.forEach((x, i) => { if (t > 13.6 + (3 - i) * 0.6) TK.text(g, String(i + 1), x, LY + 250, 50, { color: TK.C.acc }); });
      if (t > 15.6) TK.text(g, '網膜が [4段]（人は1段）', PW / 2, 1000, 64);
      TK.text(g, '光 →', 90, LY - 240, 44, { color: TK.C.sub });
      TK.text(g, '奥', 900, LY - 280, 44, { color: TK.C.sub });
      g.restore();
    } else {
      rays(g, LAYERS[0], GREEN, f * clamp((t - 17) / 0.5, 0, 1));
      if (t > 17.2) { g.save(); g.globalAlpha = f; TK.text(g, '第1層 くっきり', 640, 360, 50, { color: GREEN }); g.restore(); }
      if (t > 18.6) {
        g.save(); g.globalAlpha = f; blurMark(g, LAYERS[1], blurAt(LAYERS[0], LAYERS[1]), TK.C.acc);
        TK.text(g, '第2層 いつもぼける', 640, 930, 50, { color: TK.C.acc }); g.restore();
      }
    }
  }
  // 21〜27: 近い物ほどピントが奥へ → 第2層のぼけが大きい
  if (t >= 21.0 && t < 27.0) {
    const f = fade(t, 21, 27, 0.3);
    const near = 0.5 - 0.5 * Math.cos(clamp((t - 21.6) / 4.6, 0, 1) * Math.PI * 2);   // 遠い → 近い → 遠い
    const fx = LAYERS[0] + 50 * near;
    eyeBase(g, f * 0.85, 1); rays(g, fx, GREEN, f);
    const b = blurAt(fx, LAYERS[1]);
    g.save(); g.globalAlpha = f; blurMark(g, LAYERS[1], b, TK.C.acc);
    // 上: ハエの近さと、第2層のぼけの丸
    TK.card(g, 120, 190, 840, 200);
    const fxIcon = lerp(780, 380, near);
    fly(g, fxIcon, 330, 1.1);
    g.strokeStyle = TK.C.sub; g.lineWidth = 3; g.beginPath(); g.moveTo(190, 340); g.lineTo(860, 340); g.stroke();
    spider(g, 230, 340, 0.8);
    TK.text(g, near > 0.5 ? 'ハエが近い' : 'ハエが遠い', 540, 230, 42, { color: TK.C.sub });
    TK.text(g, 'ぼけ', 760, 960, 44, { color: TK.C.acc });
    g.fillStyle = 'rgba(255,207,74,0.25)'; g.strokeStyle = TK.C.acc; g.lineWidth = 4;
    g.beginPath(); g.arc(900, 1000, 6 + b * 1.6, 0, Math.PI * 2); g.fill(); g.stroke();
    g.restore();
    TK.note(g, t, 21.6, 27, '近い物ほど、ピントが奥へずれて、第2層のぼけが大きくなる', { size: 32 });
  }
  // 27〜32: 赤い光はピントの位置がずれる → もっと近いと読みちがえる
  if (t >= 27.0 && t < 32.0) {
    const f = fade(t, 27, 32, 0.3), k = TK.out((t - 27.6) / 1.2);
    eyeBase(g, f * 0.85, 1);
    rays(g, LAYERS[0], GREEN, f * 0.45);
    const fr = LAYERS[0] + 45 * k;
    rays(g, fr, RED, f * clamp((t - 27.4) / 0.4, 0, 1));
    g.save(); g.globalAlpha = f;
    blurMark(g, LAYERS[1], blurAt(fr, LAYERS[1]), RED);
    TK.text(g, '緑', 620, 360, 50, { color: GREEN });
    TK.text(g, '赤', 720, 360, 50, { color: RED });
    if (t > 29.2) TK.text(g, 'ぼけが大きい ＝ “[もっと近い]”？', PW / 2, 1000, 62);
    g.restore();
    TK.note(g, t, 27.6, 32, 'ずれの大きさは推定（赤と緑の焦点のちがいはアプリの推定値）', { size: 32 });
  }
  // 32〜35: 赤の中で手前に落ちる
  if (t >= 32.0) {
    const u = clamp((t - 32.2) / 1.2, 0, 1);
    scene(g, 900, RED, 610, u, '赤の光');
    TK.note(g, t, 32.2, 35.0, 'アダンソンハエトリ（大阪市立大学ほかの研究）\n出どころ: Nagata ほか (2012) Science／Nagata ほか (2013) Biophysics', { size: 30 });
  }
}

triviaStart({ out: 'spider-hunt-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
