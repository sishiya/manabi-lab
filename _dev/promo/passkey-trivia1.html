<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく passkey-1（型A ぜんぶ逆）「パスキーは指紋をサイトに送っている…じゃない」。台本は trivia/passkey.md。?short で録る
// FIDO Alliance「How Passkeys Work」・W3C WebAuthn Level 3: 生体の確かめは端末の中だけ、サイトは公開鍵とサインだけを受けとる。
// 決まり: 本物のログイン画面に似せない（入力欄・ロゴ・ボタンの形を描かない）。舞台は金庫・家・小包の絵。こわがらせず「だから安心」で終わる。
// 同期するパスキーは秘密鍵が暗号化されて自分の端末どうしを移ることがある →「1台から一歩も出ない」とは言わない
const DUR = 30;
const subs = [
  { a: 0.0, b: 3.0, ja: 'パスキーでログイン。\n指紋がサイトに送られる…じゃない', en: 'Signing in with a passkey?\nYour fingerprint is NOT sent to the site.', noBurn: true },
  { a: 3.0, b: 9.0, ja: '指紋や顔は、スマホの中で\n「[金庫をあけてよいか]」を確かめるだけ', en: 'Your fingerprint or face only checks, inside the phone,\nwhether the vault may open.' },
  { a: 9.0, b: 16.0, ja: '送るのは、その場かぎりの[サイン]。\n毎回ちがう', en: 'What gets sent is a one-time signature,\ndifferent every time.' },
  { a: 16.0, b: 23.0, ja: 'サイトが持っているのは、[鍵穴の形]だけ。\n合言葉もない', en: 'The site only keeps the shape of the keyhole.\nNo password at all.' },
  { a: 23.0, b: 30.0, ja: 'だから、サイトの中身が盗まれても、\nあなたの[鍵は作れない]', en: 'So even if the site’s data is stolen,\nno one can make your key.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.8, type: 'whoosh' }, { t: 1.5, type: 'buzz' }, { t: 3.0, type: 'whoosh' }, { t: 4.4, type: 'pop' }, { t: 6.0, type: 'ding' },
  { t: 9.0, type: 'whoosh' }, { t: 10.2, type: 'pop' }, { t: 12.0, type: 'whoosh' }, { t: 14.0, type: 'pop' },
  { t: 16.0, type: 'whoosh' }, { t: 17.0, type: 'pop' }, { t: 23.0, type: 'whoosh' }, { t: 24.6, type: 'pop' }, { t: 26.0, type: 'buzz' }, { t: 27.4, type: 'ding' },
];

// 指（指紋のうず）
function finger(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = '#e8f0ff'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(-60, 140); g.lineTo(-60, -20); g.arc(0, -20, 60, Math.PI, 0); g.lineTo(60, 140); g.stroke();
  g.strokeStyle = TK.C.acc2; g.lineWidth = 3.5;
  for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(0, -10, 12 + i * 9, 18 + i * 11, 0, Math.PI * 1.05, Math.PI * 2.95); g.stroke(); }
  g.restore();
}
// 家（サイト）。名前は出さない
function house(g, x, y, s, o = {}) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = '#e8f0ff'; g.lineWidth = 6; g.lineJoin = 'round'; g.fillStyle = 'rgba(160,190,255,0.10)';
  g.beginPath(); g.moveTo(-120, -10); g.lineTo(0, -120); g.lineTo(120, -10); g.lineTo(100, -10); g.lineTo(100, 120); g.lineTo(-100, 120); g.lineTo(-100, -10); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(-30, 30, 60, 90, 6); g.stroke();
  if (o.keyhole) keyhole(g, 0, 70, 0.7, TK.C.acc);
  g.restore();
}
function keyhole(g, x, y, s, c) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = c;
  g.beginPath(); g.arc(0, -14, 16, 0, Math.PI * 2); g.moveTo(-9, -6); g.lineTo(-16, 30); g.lineTo(16, 30); g.lineTo(9, -6); g.closePath(); g.fill(); g.restore();
}
// スマホと金庫
function phoneVault(g, x, y, s, open) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = '#e8f0ff'; g.lineWidth = 6; g.beginPath(); g.roundRect(-110, -200, 220, 400, 30); g.stroke();
  g.fillStyle = 'rgba(160,190,255,0.12)'; g.strokeStyle = TK.C.acc; g.lineWidth = 6;
  g.beginPath(); g.roundRect(-75, -110, 150, 150, 14); g.fill(); g.stroke();
  // 金庫のダイヤル（開くと回る）
  g.save(); g.translate(0, -35); g.rotate(open * Math.PI); g.strokeStyle = TK.C.acc; g.beginPath(); g.arc(0, 0, 32, 0, Math.PI * 2); g.moveTo(0, -32); g.lineTo(0, -14); g.stroke(); g.restore();
  g.restore();
}
// 色の模様の札（サインのたとえ）。seed で毎回ちがう模様
function sigCard(g, x, y, w, h, seed, k = 1) {
  g.save(); g.globalAlpha *= k; TK.card(g, x, y, w, h, { r: 18, fill: 'rgba(244,247,255,0.92)', stroke: TK.C.acc });
  const cols = ['#ff6b6b', '#ffcf4a', '#59e39a', '#5fd4ff', '#a98bff'];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
    const v = Math.abs(Math.sin(seed * 12.9898 + i * 78.233 + j * 37.719) * 43758.5453) % 1;
    g.fillStyle = cols[Math.floor(v * 5)]; g.fillRect(x + 20 + i * (w - 40) / 4 + 4, y + 18 + j * (h - 36) / 3 + 4, (w - 40) / 4 - 8, (h - 36) / 3 - 8);
  }
  g.restore();
}
function cross(g, cx, cy, r, k) {
  g.save(); g.strokeStyle = TK.C.red; g.lineWidth = 18; g.lineCap = 'round'; g.globalAlpha *= k;
  g.beginPath(); g.moveTo(cx - r, cy - r); g.lineTo(cx + r, cy + r); g.moveTo(cx + r, cy - r); g.lineTo(cx - r, cy + r); g.stroke(); g.restore();
}
// わるもの（かわいい影。こわくしない）
function thief(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = 'rgba(120,130,160,0.9)';
  g.beginPath(); g.arc(0, -70, 40, 0, Math.PI * 2); g.fill(); g.beginPath(); g.roundRect(-45, -30, 90, 110, 30); g.fill();
  g.fillStyle = '#0b1430'; g.fillRect(-36, -82, 72, 18); g.fillStyle = '#fff'; g.beginPath(); g.arc(-14, -73, 5, 0, Math.PI * 2); g.arc(14, -73, 5, 0, Math.PI * 2); g.fill();
  g.restore();
}

function draw(g, t) {
  // 0〜3: 指 → 家 に ✕
  if (t < 3.0) {
    finger(g, 200, 560, 1.4);
    house(g, 740, 560, 1.3);
    const k = clamp((t - 0.8) / 0.7, 0, 1);
    g.save(); g.strokeStyle = TK.C.acc2; g.lineWidth = 8; g.setLineDash([18, 12]); g.beginPath(); g.moveTo(310, 520); g.lineTo(lerp(310, 580, k), 520); g.stroke(); g.restore();
    cross(g, 450, 520, 90, TK.pop(t, 1.5, 0.3));
    TK.hook(g, t, 0.2, 3.0, '指紋は [送られない]', { y: 260, size: 110 });
    TK.text(g, 'サイト', 740, 760, 44, { color: TK.C.sub });
  }
  // 3〜9: スマホの中で金庫をあける
  if (t >= 3.0 && t < 9.0) {
    const open = clamp((t - 6.0) / 0.8, 0, 1);
    phoneVault(g, PW / 2 - 60, 560, 1.5, open);
    g.save(); g.globalAlpha = TK.pop(t, 4.4, 0.4); finger(g, PW / 2 - 60, 860, 0.7); g.restore();
    if (open > 0) { g.save(); g.globalAlpha = open; TK.text(g, 'あいた', PW / 2 - 60, 220, 60, { color: TK.C.green }); g.restore(); }
    TK.note(g, t, 3.5, 9, '指紋や顔のデータは、スマホの外へ出ない', { size: 32 });
  }
  // 9〜16: その場かぎりのサイン
  if (t >= 9.0 && t < 16.0) {
    phoneVault(g, 220, 520, 0.9, 1);
    house(g, 740, 520, 1.0);
    const n = Math.floor((t - 10.2) / 2.0), u = ((t - 10.2) % 2.0) / 1.4;
    if (t >= 10.2 && u <= 1) { const x = lerp(260, 620, TK.out(u)), y = 500 - Math.sin(u * Math.PI) * 120; sigCard(g, x - 90, y - 60, 180, 120, n + 1); }
    if (t >= 10.2) TK.text(g, 'サイン ' + (n + 1) + ' 回目', PW / 2 - 60, 230, 56, { color: TK.C.acc });
    TK.text(g, '毎回ちがう模様', PW / 2 - 60, 820, 48, { color: TK.C.sub });
  }
  // 16〜23: サイトには鍵穴の形だけ
  if (t >= 16.0 && t < 23.0) {
    house(g, PW / 2 - 60, 520, 2.0, { keyhole: t > 17.0 });
    if (t > 17.0) { g.save(); g.globalAlpha = TK.pop(t, 17.0, 0.4); TK.text(g, '鍵穴の形（公開鍵）', PW / 2 - 60, 860, 56, { color: TK.C.acc }); g.restore(); }
    if (t > 19.0) { g.save(); g.globalAlpha = TK.pop(t, 19.0, 0.4); TK.card(g, 200, 180, 560, 110, { r: 55 }); TK.text(g, '合言葉は 持っていない', PW / 2 - 60, 235, 52); g.restore(); }
  }
  // 23〜30: 鍵穴の形を盗まれても、開かない → 安心
  if (t >= 23.0) {
    house(g, 280, 540, 1.3, { keyhole: true });
    const k = TK.out((t - 23.4) / 1.0);
    thief(g, lerp(560, 720, k), 600, 1.5);
    if (t > 24.6) { g.save(); g.globalAlpha = TK.pop(t, 24.6, 0.3); keyhole(g, 580, 600, 1.4, TK.C.acc); g.restore(); }
    if (t > 26.0) { g.save(); g.globalAlpha = TK.pop(t, 26.0, 0.3); TK.card(g, 520, 760, 380, 100, { r: 50, fill: 'rgba(255,107,107,0.2)', stroke: TK.C.red }); TK.text(g, '鍵は作れない', 710, 810, 50, { color: TK.C.red }); g.restore(); }
    if (t > 27.4) { g.save(); g.globalAlpha = TK.pop(t, 27.4, 0.4); TK.text(g, 'だから [安心]', PW / 2 - 60, 250, 90); g.restore(); }
    TK.note(g, t, 26.5, 30, '出どころ: FIDO Alliance「How Passkeys Work」・W3C Web Authentication Level 3\n同期するパスキーは、鍵が暗号化されて自分の端末どうしを移ることがある', { size: 28 });
  }
}

triviaStart({ out: 'passkey-trivia1', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
