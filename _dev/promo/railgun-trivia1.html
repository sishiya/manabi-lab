<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく railgun-1（型B もしも計算）「コンセントでレールガンを充電したら？」。台本は trivia/railgun.md。?short で録る
// 数字: 防衛装備庁 技術シンポジウム2025 の資料（充電 5MJ・全長 約6m・初速 2,300m/s 以上・20ft コンテナ 4台）。
// 5MJ ÷ 1,500W = 3,333秒 = 55.6分。発射 t = 2×6m ÷ 2,300m/s = 5.2ms（推定の上限）。3,333 ÷ 0.0052 = 64万倍。5MJ ÷ 5.2ms ≈ 100万kW。
// 弾に入る 17% はアプリのモデル（320g・2,297m/s → 0.84MJ）。兵器の強さを売りにしない（弾と的は出さない、電気の話だけ）
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.0, ja: 'もしも、家のコンセントで\nレールガンを充電したら？', en: 'What if you charged a railgun\nfrom a wall outlet at home?', noBurn: true },
  { a: 3.0, b: 10.0, ja: '日本の試作機の充電は[500万ジュール]。\nコンセント1つ（1500W）なら、[約56分]', en: 'Japan’s prototype stores 5 million joules.\nOne outlet (1,500 W) would take about 56 minutes.' },
  { a: 10.0, b: 17.0, ja: 'それを、たった[0.005秒]ほどで放電する', en: 'And it discharges that in about 0.005 seconds.' },
  { a: 17.0, b: 25.0, ja: '[64万倍]の勢い。そのあいだだけ、\n大きな発電所1基ぶんの電力', en: '640,000 times faster. For that instant,\nthe power of a large power plant.' },
  { a: 25.0, b: 31.0, ja: 'しかも弾に入るのは[約2割]。\n残りは熱と火花（モデルの推定）', en: 'And only about 1/5 goes into the projectile.\nThe rest is heat and sparks (model estimate).' },
  { a: 31.0, b: 35.0, ja: 'だから、ためる箱は\n大きなコンテナ[4つぶん]', en: 'That’s why the energy storage\nfills four shipping containers.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.3, type: 'buzz' }, { t: 3.0, type: 'whoosh' }, { t: 3.6, type: 'rise' }, { t: 8.6, type: 'ding' },
  { t: 10.0, type: 'whoosh' }, { t: 11.0, type: 'thud' }, { t: 14.6, type: 'ding' },
  { t: 17.0, type: 'pop' }, { t: 18.4, type: 'ding' }, { t: 20.5, type: 'whoosh' }, { t: 21.3, type: 'thud' },
  { t: 25.0, type: 'pop' }, { t: 26.4, type: 'tick' }, { t: 27.4, type: 'buzz' },
  { t: 31.0, type: 'pop' }, { t: 31.6, type: 'tick' }, { t: 32.0, type: 'tick' }, { t: 32.4, type: 'tick' }, { t: 32.8, type: 'tick' },
];
const MIN = 5e6 / 1500 / 60;   // 55.6 分

// コンセント（日本の2つ穴）
function outlet(g, x, y, s, glow = 0) {
  g.save(); g.translate(x, y); g.scale(s, s);
  TK.card(g, -110, -140, 220, 280, { r: 30, fill: 'rgba(230,238,255,0.12)', stroke: '#e8f0ff', lw: 5 });
  g.fillStyle = '#e8f0ff'; g.beginPath(); g.roundRect(-52, -50, 22, 70, 6); g.roundRect(30, -50, 22, 70, 6); g.fill();
  g.beginPath(); g.arc(0, 75, 16, Math.PI, 0); g.lineTo(16, 92); g.lineTo(-16, 92); g.closePath(); g.fill();
  if (glow > 0) { g.globalAlpha = glow; g.strokeStyle = TK.C.acc; g.lineWidth = 8; g.shadowColor = TK.C.acc; g.shadowBlur = 30; g.beginPath(); g.roundRect(-110, -140, 220, 280, 30); g.stroke(); }
  g.restore();
}
// いなずま
function bolt(g, x, y, s, a = 1) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = TK.C.acc; g.shadowColor = TK.C.acc; g.shadowBlur = 30;
  g.beginPath(); g.moveTo(20, -120); g.lineTo(-50, 10); g.lineTo(0, 10); g.lineTo(-20, 120); g.lineTo(55, -20); g.lineTo(5, -20); g.closePath(); g.fill();
  g.restore();
}
// 電気をためる箱（メーター付き）
function box(g, x, y, w, h, fill, label) {
  TK.card(g, x, y, w, h, { r: 22 });
  g.fillStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.roundRect(x + 24, y + 24, w - 48, h - 48, 14); g.fill();
  const hh = (h - 48) * clamp(fill, 0, 1);
  g.fillStyle = TK.C.acc; g.beginPath(); g.roundRect(x + 24, y + h - 24 - hh, w - 48, Math.max(hh, 0.01), 14); g.fill();
  if (label) TK.text(g, label, x + w / 2, y + h / 2, 56, { color: '#fff' });
}
// 発電所（冷却塔の線画。特定の発電所ではない）
function plant(g, x, y, s, a) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.strokeStyle = '#e8f0ff'; g.lineWidth = 5; g.fillStyle = 'rgba(160,190,255,0.12)';
  for (const dx of [-110, 110]) {
    g.beginPath(); g.moveTo(dx - 80, 120); g.quadraticCurveTo(dx - 40, 0, dx - 55, -110); g.lineTo(dx + 55, -110); g.quadraticCurveTo(dx + 40, 0, dx + 80, 120); g.closePath(); g.fill(); g.stroke();
  }
  g.beginPath(); g.moveTo(-240, 120); g.lineTo(240, 120); g.stroke();
  g.restore();
}
// 20ft コンテナ
function container(g, x, y, w, h, k) {
  g.save(); g.globalAlpha *= k;
  g.fillStyle = 'rgba(95,212,255,0.18)'; g.strokeStyle = TK.C.acc2; g.lineWidth = 5;
  g.beginPath(); g.roundRect(x, y, w, h, 8); g.fill(); g.stroke();
  g.lineWidth = 2.5; g.beginPath(); for (let i = 1; i < 12; i++) { const xx = x + w * i / 12; g.moveTo(xx, y + 10); g.lineTo(xx, y + h - 10); } g.stroke();
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック
  if (t < 3.0) {
    const k = TK.pop(t, 0.1, 0.4);
    g.save(); g.globalAlpha = k; outlet(g, 300, 760, 1.3); g.restore();
    if (t > 1.3) bolt(g, 700, 760, 1.6, TK.pop(t, 1.3, 0.3));
    TK.hook(g, t, 0.0, 3.0, '家のコンセントで\n[レールガン]を充電したら？', { y: 330, size: 92 });
  }
  // 3〜10: 5MJ をコンセントでためる
  if (t >= 3.0 && t < 10.0) {
    const k = clamp((t - 3.6) / 5.0, 0, 1);
    outlet(g, 230, 640, 1.3, 0.5 + 0.5 * Math.sin(t * 6));
    // 線
    g.save(); g.strokeStyle = TK.C.acc; g.lineWidth = 6; g.setLineDash([18, 14]); g.lineDashOffset = -t * 120;
    g.beginPath(); g.moveTo(380, 640); g.lineTo(520, 640); g.stroke(); g.restore();
    box(g, 540, 380, 340, 560, k, '');
    TK.text(g, (5 * k).toFixed(1) + ' MJ', 710, 660, 84, { color: '#fff' });
    TK.card(g, 150, 180, 700, 130, { r: 30 });
    TK.text(g, '充電 ' + Math.round(MIN * k) + ' 分', PW / 2 - 40, 245, 80, { color: k >= 1 ? TK.C.acc : '#fff' });
    TK.text(g, '1500W のコンセント 1つ', 230, 870, 40, { color: TK.C.sub, bold: false });
    TK.note(g, t, 3.5, 10, '100V × 15A ＝ 1500W。5,000,000 J ÷ 1500 W ＝ 55.6 分', { size: 32 });
  }
  // 10〜17: 放電（スローモーション）
  if (t >= 10.0 && t < 17.0) {
    const u = clamp((t - 11.0) / 3.6, 0, 1);   // 0〜5.2ms
    box(g, 50, 380, 220, 420, 1 - u, '');
    // レール
    const x0 = 300, x1 = 920, yt = 500, yb = 680;
    g.save(); g.strokeStyle = '#e8f0ff'; g.lineWidth = 12; g.beginPath(); g.moveTo(x0, yt); g.lineTo(x1, yt); g.moveTo(x0, yb); g.lineTo(x1, yb); g.stroke();
    g.strokeStyle = TK.C.acc; g.lineWidth = 4; g.beginPath(); g.moveTo(270, 460); g.lineTo(x0, yt); g.moveTo(270, 720); g.lineTo(x0, yb); g.stroke(); g.restore();
    // 電流の流れ（上のレールは右へ、下のレールは左へ）
    const bx = lerp(x0 + 30, x1 - 20, u * u);
    if (u > 0 && u < 1) {
      g.save(); g.fillStyle = TK.C.acc; g.shadowColor = TK.C.acc; g.shadowBlur = 16;
      for (let i = 0; i < 10; i++) {
        const p = ((t * 2.2 + i / 10) % 1);
        g.beginPath(); g.arc(lerp(x0, bx, p), yt, 9, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(lerp(bx, x0, p), yb, 9, 0, Math.PI * 2); g.fill();
      }
      g.restore();
    }
    // 弾（電流を渡す板）
    g.save(); g.fillStyle = u > 0 && u < 1 ? TK.C.acc : '#9fb3d9'; g.beginPath(); g.roundRect(bx - 22, yt - 8, 44, yb - yt + 16, 8); g.fill(); g.restore();
    if (u > 0 && u < 1) { g.save(); g.strokeStyle = TK.C.acc2; g.lineWidth = 7; g.beginPath(); g.moveTo(bx + 30, 590); g.lineTo(bx + 120, 590); g.lineTo(bx + 98, 568); g.moveTo(bx + 120, 590); g.lineTo(bx + 98, 612); g.stroke(); g.restore(); }
    TK.card(g, 170, 180, 660, 120, { r: 30 });
    TK.text(g, (0.0052 * u).toFixed(4) + ' 秒', PW / 2 - 40, 242, 80, { color: u >= 1 ? TK.C.acc : '#fff' });
    TK.text(g, 'スローモーション（約1000分の1）', PW / 2 - 40, 920, 44, { color: TK.C.sub, bold: false });
    TK.text(g, '電気の箱', 160, 840, 40, { color: TK.C.sub, bold: false });
    TK.note(g, t, 10.5, 17, '0.005秒は推定（約6mを一定の加速で走るとしたときの上限）', { size: 32 });
  }
  // 17〜25: 64万倍 → 発電所1基
  if (t >= 17.0 && t < 25.0) {
    TK.text(g, '56分 → 0.005秒', PW / 2 - 40, 230, 64, { color: TK.C.sub });
    TK.count(g, t, 17.2, 20.5, 1, 640000, { y: 420, size: 200, dur: 1.2, unit: '倍の速さで使う', fmt: v => Math.round(v / 10000) >= 1 ? Math.round(v / 10000) + '万' : Math.round(v).toString() });
    if (t >= 20.5) {
      const k = TK.pop(t, 20.5, 0.4);
      plant(g, PW / 2 - 40, 620, 1.3, k);
      g.save(); g.globalAlpha = k; TK.text(g, 'そのあいだ 約[100万 kW]', PW / 2 - 40, 880, 72); TK.text(g, '＝ 大きな発電所 1基ぶん（目安）', PW / 2 - 40, 970, 44, { color: TK.C.sub, bold: false }); g.restore();
    }
    TK.note(g, t, 17.5, 25, '平均の電力も推定（5MJ ÷ 0.0052秒）', { size: 32 });
  }
  // 25〜31: エネルギーの内わけ
  if (t >= 25.0 && t < 31.0) {
    TK.text(g, '5MJ のゆくえ', PW / 2 - 40, 240, 70, { color: TK.C.sub });
    const x = 100, w = PW - 340, y = 450, h = 240, k = TK.out((t - 25.6) / 1.0), k2 = TK.out((t - 26.6) / 1.0);
    g.save();
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.roundRect(x, y, w, h, 24); g.fill();
    g.fillStyle = TK.C.acc; g.beginPath(); g.roundRect(x, y, w * 0.17 * k, h, [24, 0, 0, 24]); g.fill();
    g.fillStyle = 'rgba(255,107,107,0.55)'; g.beginPath(); g.roundRect(x + w * 0.17, y, w * 0.83 * k2, h, [0, 24, 24, 0]); g.fill();
    g.restore();
    if (k > 0.5) { TK.text(g, '弾', x + w * 0.085, y + h / 2, 56, { color: '#0b1430', blur: 0 }); TK.text(g, '約17%', x + w * 0.085, y + h + 60, 56, { color: TK.C.acc }); }
    if (k2 > 0.5) { TK.text(g, '熱・磁場・火花', x + w * 0.585, y + h / 2, 56, { color: '#fff' }); TK.text(g, '約83%', x + w * 0.585, y + h + 60, 56, { color: TK.C.red }); }
    TK.note(g, t, 26.0, 31, '内わけはアプリのモデルの推定（弾 320g・秒速 2,297m → 0.84MJ）', { size: 32 });
  }
  // 31〜35: コンテナ4つ
  if (t >= 31.0) {
    TK.text(g, '電気をためる箱', PW / 2 - 40, 230, 64, { color: TK.C.sub });
    for (let i = 0; i < 4; i++) container(g, 130, 320 + i * 150, 680, 120, TK.pop(t, 31.6 + i * 0.4, 0.35));
    if (t > 33.0) { g.save(); g.globalAlpha = fade(t, 33, 35, 0.3); TK.text(g, '20ft コンテナ [4つ]', PW / 2 - 40, 960, 64); g.restore(); }
    TK.note(g, t, 31.5, 35, '出どころ: 防衛装備庁 技術シンポジウム2025\n「電磁加速システムの洋上射撃試験」', { size: 30 });
  }
}

triviaStart({ out: 'railgun-trivia1', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
