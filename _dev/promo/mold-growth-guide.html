<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="mold-common.js"></script>
<script>
'use strict';
// 台本: カビが育つまで ― 使い方と見どころ（横長の説明動画、150秒）
// 箱庭（浴室の壁 10cm × 6cm）を左に大きく、右にボタンの札・いまの状況・記録（アプリでも右）。日本語の字幕は上
// 塩素系のカビ取り剤の注意（酸性のものと混ぜない）は、終わりの画面と説明欄に
const END = 150, DUR = END + IDENT_CLOSE;
const BOXR = [40, 215, 1270, 800];
const SC = [
  { a: 0, b: 7, pre: 27 * 24 + 14, speed: 1 },
  { a: 7, b: 28, pre: 0, speed: 24 },
  { a: 28, b: 48, pre: 9 * 24, speed: 6, ev: [{ t: 1, run: w => { w.__mk.VIEW.hidden = true; } }, { t: 10, run: w => { w.__mk.VIEW.hidden = false; w.__mk.VIEW.moist = true; } }] },
  { a: 48, b: 68, pre: 22 * 24, speed: 1, ev: [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ t: 1.5 + i * 0.6, run: w => mkZoomTo(w, 40, 49.5, 1.32) })) },
  { a: 68, b: 92, pre: 26 * 24, speed: 1, brush: [{ a: 2, b: 6, tool: 'chlorine', from: [8, 49.5], to: [92, 49.5] }, { a: 13, b: 16.5, tool: 'dry', from: [8, 49.5], to: [92, 49.5] }] },
  { a: 92, b: 110, pre: 12 * 24, speed: 6 },
  { a: 110, b: 130, pre: 0, speed: 24, ev: [{ t: 0.5, run: w => w.startRecord() }, { t: 7, run: w => { Object.assign(w.__mk.W.habits, { fan: 'h24', after: 'squeegee' }); w.syncHabits && w.syncHabits(); w.startRecord(); } }] },
  { a: 130, b: END, page: 'zukan' },
];
const X = 1345;
const CH = {
  modes: { x: X, y: 230, title: '見え方（箱庭の上）', btns: ['見えないものも見る', '湿り気を見る'], cols: 1 },
  zoom: { x: X, y: 230, title: '拡大', btns: ['−', '＋', '全体を見る'] },
  tools: { x: X, y: 230, title: '道具（左）', btns: ['ふき取る', '乾かす', 'こする', '塩素系カビ取り剤', 'アルコール', '防カビ剤スプレー'], cols: 2 },
  habits: { x: X, y: 230, title: '毎日の習慣（毎晩21時に入浴）', btns: ['換気扇: 24時間', '入浴後: 水を切る', '8週間をはやおくりして記録'], cols: 1 },
};
const SHOW = [
  ['modes', 28.5, 47.6, t => t >= 38 ? 1 : t >= 29 ? 0 : -1],
  ['zoom', 48.5, 58, t => t >= 49.5 ? 1 : -1],
  ['tools', 68.5, 85, t => t >= 81 ? 1 : t >= 70 ? 3 : -1],
  ['habits', 110.4, 129.6, t => t >= 117 ? (t >= 117.6 ? 2 : 1) : t >= 110.5 ? 2 : -1],
];
const B = (k, i) => btnRect(CH[k], i);
const BP = (xm, ym) => ({ x: BOXR[0] + xm / 100 * BOXR[2], y: BOXR[1] + ym / 60 * BOXR[3] });
const CUR = [
  { t: 28.6, ...B('modes', 0) }, { t: 29, ...B('modes', 0), click: true }, { t: 37.3, ...B('modes', 1) }, { t: 38, ...B('modes', 1), click: true }, { t: 39.5, ...B('modes', 1), hide: true },
  { t: 48.8, ...B('zoom', 1) }, { t: 49.5, ...B('zoom', 1), click: true }, { t: 51, ...B('zoom', 1), hide: true },
  { t: 69.2, ...B('tools', 3) }, { t: 69.6, ...B('tools', 3), click: true }, { t: 70, ...BP(8, 49.5), drag: true }, { t: 74, ...BP(92, 49.5) }, { t: 74.6, ...BP(92, 49.5), hide: true },
  { t: 80.3, ...B('tools', 1) }, { t: 80.7, ...B('tools', 1), click: true }, { t: 81, ...BP(8, 49.5), drag: true }, { t: 84.5, ...BP(92, 49.5) }, { t: 85, ...BP(92, 49.5), hide: true },
  { t: 110.2, ...B('habits', 2) }, { t: 110.5, ...B('habits', 2), click: true },
  { t: 116.3, ...B('habits', 0) }, { t: 116.6, ...B('habits', 0), click: true }, { t: 117, ...B('habits', 1), click: true }, { t: 117.6, ...B('habits', 2), click: true }, { t: 119, ...B('habits', 2), hide: true },
];
const CAPS = [
  { a: 7.3, b: 17.4, main: '浴室の壁の、横10cm・縦6cmを拡大した「カビの箱庭」', sub: 'タイル・目地・ゴムパッキン・浴そうのふち',
    en: ['A "mold garden": 10 × 6 cm of bathroom wall, magnified', 'Tiles, grout, rubber seal and the edge of the bathtub'] },
  { a: 17.8, b: 27.6, main: '▶ で時間が進む。毎晩21時にお風呂に入る', sub: '空気から胞子が落ち、湿った所で芽を出す',
    en: ['Press ▶ to run time. A bath every night at 9 pm', 'Spores fall from the air and sprout where it\'s damp'] },
  { a: 28.4, b: 37.6, main: '「見えないものも見る」で、胞子や菌糸の先も', sub: '目に見えるようになる前から、カビは育っている',
    en: ['"Show the invisible" reveals spores and hyphal tips', 'Mold is growing long before you can see it'] },
  { a: 38.2, b: 47.6, main: '「湿り気を見る」で、カビが育てるほどぬれている所', sub: 'ゴムパッキンと目地は、水がたまりやすい',
    en: ['"Show moisture" marks where it\'s damp enough for mold', 'The rubber seal and grout hold water'] },
  { a: 48.4, b: 57.6, main: '寄っていくと、顕微鏡の見え方に切りかわる', sub: '菌糸の先が1本ずつのび、枝分かれする',
    en: ['Zoom in and it switches to a microscope view', 'Hyphae grow tip by tip and branch out'] },
  { a: 58, b: 67.6, main: '胞子の柄が立ち、胞子を作って、また広がる', sub: '菌糸の1本は、何十本もの束として描いている',
    en: ['Spore stalks rise, make spores, and spread again', 'Each hypha drawn stands for a bundle of dozens'] },
  { a: 68.4, b: 79.6, main: '道具を選んで、指でなぞる。塩素系カビ取り剤で色が消える', sub: '表面のカビは消えても、奥に残ったものがあると、また生える',
    en: ['Pick a tool and rub with your finger. Chlorine bleach clears the color', 'The surface clears, but anything left deep inside can grow back'] },
  { a: 80.2, b: 91.6, main: '乾かす・ふき取るで、水とえさを減らす', sub: '酸性の洗剤と塩素系をまぜない。製品の説明書のとおりに',
    en: ['Dry and wipe to cut the water and food', 'Never mix chlorine products with acidic cleaners. Follow the instructions'] },
  { a: 92.4, b: 109.6, main: '右に「いまの状況」。悪化・横ばい・よくなっている', sub: '何かが起きると「発見カード」が出る',
    en: ['On the right: current status, getting worse, steady or better', '"Discovery cards" pop up when something happens'] },
  { a: 110.4, b: 119.6, main: '「8週間をはやおくりして記録」', sub: 'いまの習慣のまま、8週間を一気に進める',
    en: ['"Fast-forward 8 weeks and record"', 'Runs 8 weeks at once with the current habits'] },
  { a: 120, b: 129.6, main: '換気扇と水切りの習慣で、8週後はこんなにちがう', sub: 'どれも同じ空気・同じ胞子の落ち方でくらべている',
    en: ['With the fan and a squeegee, 8 weeks later looks very different', 'Each run uses the same air and the same falling spores'] },
  { a: 130.4, b: 141.6, main: '「カビの図鑑」に、クロカビ・アオカビなど8種類', sub: '学習用の簡単なシミュレーション。育つ速さは推定',
    en: ['The "Mold Guide" has 8 kinds, like black mold and blue mold', 'A simplified learning simulation. Growth speeds are estimates'] },
];
promoStart({
  name: 'カビが育つまで（使い方）', out: 'mold-growth-guide', src: '../../mold-growth/index.html', iw: 1920, ih: 1080, dur: DUR, peek: 20,
  inject: { dpr: 2, raf: true },
  music: { style: 'journey', root: 110, stopAt: END, cues: [{ t: END, type: 'jingle' }] },
  ready: w => w.__mk && w.__mk.W && w.tick,
  setup(w) { mkSize(w, BOXR[2], BOXR[3]); w.tick(0, 0); return null; },
  subs: guideSubs(END, 'カビが育つまで', 'How Mold Grows', CAPS, 'Runs in your browser (PC or phone). Switch the app to English with the EN button'),
  renderAt(t, w) { mkRender(w, SC, t); },
  drawSource(g, w) {
    g.fillStyle = '#121214'; g.fillRect(0, 0, PW * RES, PH * RES);
    if (w.__mk.UI.page === 'zukan') {   // 図鑑: 横から見た形とコロニーの絵
      const a = qs(w, '#zkStruct'), b = qs(w, '#zkColony');
      if (a && a.width) { const h = 760, k = h / a.height; g.drawImage(a, 60 * RES, 230 * RES, a.width * k * RES, h * RES); }
      if (b && b.width) g.drawImage(b, 1250 * RES, 300 * RES, 560 * RES, 560 * b.height / b.width * RES);
      return;
    }
    g.drawImage(qs(w, '#world'), BOXR[0] * RES, BOXR[1] * RES, BOXR[2] * RES, BOXR[3] * RES);
  },
  overlay(g, t, w) {
    const M = w.__mk, st = w.document.querySelector('#status');
    if (M.UI.page === 'sim') drawPanel(g, BOXR[0] + 10, BOXR[1] + 10, 520, '', [mkText(w, '#hud .big')], fade(t, 7.3, 129.6, 0.4));
    const lines = st ? [...st.children].map(e => e.textContent.trim()).filter(Boolean).slice(0, 3) : [];
    drawPanel(g, X, 420, 540, 'いまの状況（右）', lines.map(s => s.slice(0, 15)), fade(t, 92.4, 109.6, 0.4));
    const card = M.DECK.list.length ? M.DECK.list[M.DECK.list.length - 1].t : '';
    drawPanel(g, X, 680, 540, '発見カード', [card.slice(0, 15)], fade(t, 96, 109.6, 0.4), '#ffd27a');
    drawPanel(g, X, 520, 560, 'ためした記録（8週間）', mkRecords(w).map(s => s.slice(0, 16)), fade(t, 114.5, 129.6, 0.4));
    if (M.UI.page === 'zukan') drawPanel(g, X, 230, 540, 'カビの図鑑（上のタブ）', [mkText(w, '#zkDetail h3') + '　' + mkText(w, '#zkDetail .zsci')], fade(t, 130.4, 141.6, 0.4));
    for (const [k, a, b, on] of SHOW) drawChip(g, CH[k], on(t), fade(t, a, b, 0.4));
    drawCursor(g, CUR, t);
    drawCaps(g, t, CAPS, true);
    drawGuideChrome(g, t, END, 'カビが育つまで',
      'おもな出どころ: Grant ほか（1989）、Sedlbauer（2001）、Hukka と Viitanen（1999）ほか。塩素系は酸性のものと混ぜない');
  },
  errors: w => [w.__mk.err].filter(Boolean).map(String),
});
</script>
</body>
</html>
