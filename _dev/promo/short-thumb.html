<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ショートのサムネイル</title>
<!-- ?app=<app> で1枚を 1080×1920 に描く。make-short-thumbs.ps1 がヘッドレスの Chrome でスクリーンショットを撮る（RULES 8.7）。
     絵は out/thumbsrc/<app>.jpg（mp4 から取ったコマ、2160×3840）。file:// でも開けるように設定は JS で読む -->
<script src="short-thumbs.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { position: relative; font-family: 'Noto Sans JP', 'Yu Gothic', sans-serif; color: #fff; }
  #bg { position: absolute; left: 0; top: 0; }
  /* 下のパネル: 絵をぼかして暗くし、焼きこみの字幕を読めなくする */
  #panel { position: absolute; left: 0; right: 0; top: 960px; bottom: 0;
    backdrop-filter: blur(40px) brightness(0.3) saturate(1.1);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 260px); mask-image: linear-gradient(to bottom, transparent 0, #000 260px); }
  #shade { position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    background: radial-gradient(ellipse 85% 55% at 50% 32%, transparent 55%, rgba(0,0,0,0.45) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.35) 0, transparent 220px); }
  #brand { position: absolute; left: 48px; top: 48px; display: flex; align-items: center; gap: 16px;
    font-size: 32px; font-weight: 500; letter-spacing: 0.14em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  #brand img { width: 60px; height: 60px; border-radius: 50%; }
  #text { position: absolute; left: 0; right: 0; top: 1200px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  /* 上品に: 太いふち・傾いた札・強い光はつかわない。明朝の大きな言葉＋細い線＋字間 */
  #kicker { display: inline-flex; align-items: center; gap: 22px; font-size: 40px; font-weight: 500; letter-spacing: 0.12em; color: var(--c1);
    text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
  #kicker::before, #kicker::after { content: ''; width: 56px; height: 1.5px; background: var(--c2); opacity: 0.8; }
  #big { margin-top: 28px; display: inline-block; position: relative; font-family: 'Noto Serif JP', 'Yu Mincho', serif; font-weight: 700;
    line-height: 1.15; letter-spacing: 0.04em; white-space: nowrap; }
  #big .s { visibility: hidden; }
  #big .f { position: absolute; left: 0; top: 0; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,0.55), 0 0 80px var(--glow); }
  #big::after { content: ''; display: block; width: 120px; height: 3px; margin: 30px auto 0; background: var(--c2); }
  #sub { margin-top: 30px; font-size: 48px; font-weight: 400; letter-spacing: 0.08em; color: rgba(255,255,255,0.92); text-shadow: 0 2px 14px rgba(0,0,0,0.7); }
  #name { position: absolute; left: 0; right: 0; bottom: 80px; text-align: center; font-size: 30px; font-weight: 400; color: rgba(255,255,255,0.7); letter-spacing: 0.24em; }
</style>
</head>
<body>
<img id="bg" alt="">
<div id="shade"></div>
<div id="panel"></div>
<div id="brand"><img src="../sns-icon/a-lion-glasses.png" alt="">しし屋 まなびラボ</div>
<div id="text"><div id="kicker"></div><div id="big"></div><div id="sub"></div></div>
<div id="name"></div>
<script>
const app = new URLSearchParams(location.search).get('app') || 'evolution';
const c = SHORT_THUMBS[app];
const root = document.documentElement.style;
root.setProperty('--c1', c.c1); root.setProperty('--c2', c.c2); root.setProperty('--glow', c.c2 + '40');
document.getElementById('kicker').textContent = c.kicker;
const big = document.getElementById('big');
for (const k of ['s', 'f']) { const e = document.createElement('span'); e.className = k; e.textContent = c.big; big.appendChild(e); }
document.getElementById('sub').textContent = c.sub;
document.getElementById('name').textContent = c.name;
// 大きな言葉は横幅に合わせて文字の大きさを決める（最大 260px）
let fs = 220; big.style.fontSize = fs + 'px';
while (big.offsetWidth > 940 && fs > 80) { fs -= 4; big.style.fontSize = fs + 'px'; }
// 絵: focus の点が上の見せ場（y = 600）に来るように寄せる。すき間ができないように端でとめる
const W = 1080 * (c.zoom || 1), H = 1920 * (c.zoom || 1);
const [fx, fy] = c.focus || [0.5, 0.33];
const x0 = Math.min(0, Math.max(1080 - W, 540 - fx * W)), y0 = Math.min(0, Math.max(1920 - H, 600 - fy * H));
const bg = document.getElementById('bg');
Object.assign(bg.style, { width: W + 'px', height: H + 'px', left: x0 + 'px', top: y0 + 'px' });
bg.src = 'out/thumbsrc/' + app + '.jpg';
</script>
</body>
</html>
