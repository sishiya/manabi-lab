function balls(g, B) {

  PL.tint(g, land, PL.T.gray, 0.55);
  PL.hatch(g, land, { angle: 0.8, gap: 11, w: 1.8 });
  PL.ink(g, gg => { for (let k = 0; k < 2; k++) { const y0 = base + 50 + k * 45; gg.moveTo(0, y0); for (let x = 0; x <= PW; x += 30) gg.lineTo(x, y0 + Math.sin(x * 0.02 + k * 2) * 5); } }, 1.4, 'rgba(35,28,21,0.5)');   // 砂の層
  PL.ink(g, gg => { for (let x = 0; x <= PW; x += 12) x ? gg.lineTo(x, surf(x)) : gg.moveTo(x, surf(x)); }, 5);
  [[620, -7, 9], [690, -4, 5], [900, -10, 7], [420, -1, 6]].map(([x, y, r]) => [x, base + y, r]).forEach(([x, y, r]) => { const s = PL.ellipse(x, y - r * 0.4, r * 1.6, r); PL.tint(g, s, PL.T.gray, 0.8); PL.ink(g, s, 2.4); });   // 石
}
function earth(g, x, y, r) {   // 月の空の地球
  PL.sphere(g, x, y, r, PL.T.sea, { light: [-1, -0.3], inside: gg => { const p = gg2 => { PL.ellipse(x - r * 0.25, y - r * 0.2, r * 0.32, r * 0.22, -0.4)(gg2); PL.ellipse(x + r * 0.3, y + r * 0.3, r * 0.25, r * 0.15, 0.3)(gg2); }; PL.tint(gg, p, PL.T.land, 0.8); PL.ink(gg, p, 2); } });
}
function legend(g, y) {
  NAMES.forEach((n, i) => {
    const x = 120 + (i % 2) * 450, yy = y + Math.floor(i / 2) * 58;
    PL.ink(g, gg => { gg.moveTo(x, yy); gg.lineTo(x + 50, yy); }, 7, COLS[i]);
    PL.label(g, n, x + 66, yy, 34, { align: 'left', color: TK.C.sub, bold: false });
  });
}

function draw(g, t) {
  // 0〜2.2: フック（月面）
  if (t < 2.2) {
    moonGround(g); earth(g, 850, 300, 80);
    TK.hook(g, t, 0.0, 2.2, '月で、[カーブ]を\n投げたら？', { y: 640, size: 120 });
  }
  // 2.2〜7: 地球。4本がそれぞれ曲がる
  if (t >= 2.2 && t < 7.0) {
    field(g, false); zone(g);
    paths(g, EARTH, clamp((t - 2.8) / 2.0, 0, 1));
    PL.label(g, '[地球]（空気あり）', PW / 2, 220, 64);
    PL.label(g, '同じ速さ・同じ向きで、回転だけちがう4球', PW / 2, 300, 36, { color: TK.C.sub, bold: false });
    TK.card(g, 90, 1040, 900, 140); legend(g, 1082);
    TK.note(g, t, 2.6, 7, '152 km/h・捕手の目から。アプリのモデルで計算', { size: 32 });
  }
  // 7〜12: 月。4本が1本に
  if (t >= 7.0 && t < 12.0) {
    field(g, true); zone(g);
    g.save(); g.globalAlpha = 0.3; paths(g, EARTH, 1, { lw: 4, balls: false }); g.restore();
    paths(g, MOON, clamp((t - 7.8) / 2.0, 0, 1), { color: PL.INK, lw: 8 });
    PL.label(g, '[月]（空気なし・重力 1/6）', PW / 2, 220, 64);
    if (t > 10.2) { g.save(); g.globalAlpha = fade(t, 10.2, 12, 0.3); g.fillStyle = PL.PAPER; g.fillRect(240, 1040, 600, 130); TK.card(g, 240, 1040, 600, 130); PL.label(g, '4本とも [同じ線]', PW / 2, 1105, 72); g.restore(); }
    TK.note(g, t, 7.4, 12, 'うすい線は地球の4本。月は同じ向きで投げると高めに着く', { size: 32 });
  }
  // 12〜19: 落ちる量
  if (t >= 12.0 && t < 19.0) {
    PL.label(g, '152 km/h の球が、ホームまでに落ちる高さ', PW / 2, 230, 46, { color: TK.C.sub });
    TK.bars(g, t, 12.2, 19.0, [
      { label: '地球・回転なし', v: 80 / 85, color: TK.C.acc2, text: '約 80 cm' },
      { label: '地球・ストレートの回転', v: 31 / 85, color: TK.C.green, text: '約 31 cm' },
      { label: '月（空気なし）… [12 cm]', v: 12.4 / 85, color: TK.C.acc, text: '' },
    ], { y: 340, gap: 210, stagger: 0.8 });
    g.save(); g.globalAlpha = fade(t, 12.4, 19, 0.3); earth(g, 230, 1050, 70); moonSmall(g, 470, 1070, 30); PL.label(g, '重力 [1/6]', 760, 1060, 56); g.restore();
    TK.note(g, t, 12.4, 19, '計算（放してからホームまで 16.5 m）', { size: 32 });
  }
  // 19〜25: 標高 1600 m の球場
  if (t >= 19.0 && t < 25.0) {
    PL.label(g, 'ストレートが落ちる高さ', PW / 2, 230, 50, { color: TK.C.sub });
    TK.bars(g, t, 19.2, 25.0, [
      { label: 'ふつうの球場（空気 1.2 kg/m³）', v: 31 / 50, color: TK.C.green, text: '31 cm' },
      { label: '標高 1600 m（空気 約8割）', v: 40 / 50, color: TK.C.red, text: '40 cm' },
    ], { y: 360, gap: 240, stagger: 0.9 });
    g.save(); g.globalAlpha = fade(t, 19.2, 25, 0.3); mountain(g, 760, 1150); g.restore();
    if (t > 21.6) { g.save(); g.globalAlpha = fade(t, 21.6, 25, 0.3); PL.label(g, '[9 cm] 低く着く', 330, 950, 80); g.restore(); }
    TK.note(g, t, 19.4, 25, '空気の割合は気温で変わる（目安）。計算', { size: 32 });
  }
  // 25〜30: 月で何球投げても同じ線
  if (t >= 25.0) {
    moonGround(g, 880); earth(g, 920, 220, 55);
    const L = MOON[0].p, X = q => lerp(140, 940, (16.64 - q[1]) / 16.2), Y = q => 900 - (q[2] - 0.4) * 300;
    PL.dots(g, L.map(q => [X(q), Y(q)]), { color: PL.INK, w: 5, dash: [12, 12] });
    for (let b = 0; b < 4; b++) {
      const u = ((t - 25.2) * 0.9 - b * 0.25); if (u < 0) continue; const k = u % 1, i = Math.floor(k * (L.length - 1)), q = L[i];
      baseball(g, X(q), Y(q), 18, { ring: COLS[b] });
    }
    PL.label(g, 'どの回転でも、[同じ道]', PW / 2, 380, 70);
    TK.note(g, t, 26.0, 30, '出どころ: A. M. Nathan (2011) Baseball Prospectus・J. Kalk (2008) The Hardball Times\n月の重力: NASA Moon Fact Sheet。計算は pitch-physics のモデル', { size: 28, y: 1140 });
  }
}
function moonSmall(g, x, y, r) { PL.sphere(g, x, y, r, PL.T.gray, { contour: false }); [[-0.3, -0.2, 0.22], [0.35, 0.25, 0.16]].forEach(([u, v, s]) => PL.ink(g, PL.circle(x + u * r, y + v * r, s * r), 1.6)); }
function mountain(g, x, y) {   // 標高 1600 m の山と球場（かざり）
  const m = PL.poly([[x - 280, y], [x - 120, y - 190], [x - 60, y - 150], [x + 40, y - 250], [x + 260, y]]);
  PL.tint(g, m, PL.T.brown, 0.45); PL.hatch(g, m, { angle: 0.9, gap: 9, w: 1.8, not: PL.poly([[x - 400, y], [x - 120, y - 190], [x - 60, y - 150], [x + 40, y - 250], [x + 40, y]]) }); PL.ink(g, m, 4);
  const snow = PL.poly([[x + 40, y - 250], [x + 82, y - 202], [x + 50, y - 210], [x + 20, y - 196], [x - 4, y - 214]]); PL.tint(g, snow, PL.PAPER, 1); PL.ink(g, snow, 3);
  PL.ink(g, gg => { gg.moveTo(x - 300, y); gg.lineTo(x + 280, y); }, 4);
  PL.leader(g, x + 40, y - 254, x + 40, y - 300); PL.label(g, '1600 m', x + 40, y - 330, 36, { color: TK.C.sub });
}

triviaStart({ out: 'pitch-physics-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
