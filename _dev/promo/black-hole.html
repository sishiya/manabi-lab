<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script>
'use strict';
// 台本: ブラックホールの見え方（40秒）
const deg = Math.PI / 180;
const CAPS = [
  { a: 6.0, b: 13.0, main: '穴の上の光の帯は、円盤の「向こう側」', sub: '光が重力で曲がって、こちらへ届いている',
    en: ['The band of light above the hole is the far side of the disk', 'Gravity bends its light toward us'] },
  { a: 13.5, b: 21.0, main: '見る角度を変えると、形が変わる', sub: '1ピクセルごとに、光の道すじを計算し直している',
    en: ['Change the viewing angle and the shape changes', 'The path of light is recalculated for every pixel'] },
  { a: 21.5, b: 28.0, main: '本当の見え方：左が明るい', sub: 'こちらへ回ってくる側の光は、明るく見える（映画では入れなかった）',
    en: ['Realistic view: the left side is brighter', 'Gas moving toward us looks brighter (the movie left this out)'] },
  { a: 28.5, b: 35.0, main: '近づいてみる', sub: '', en: ['Moving closer'] },
];
// 字幕データ（英語は YouTube の字幕（CC）に）
const SUBS = [
  { a: 0.6, b: 5.6, ja: 'ブラックホールの見え方\n映画『インターステラー』のブラックホールを、光の道すじから計算する', en: 'How a Black Hole Looks\nThe Interstellar black hole, calculated from the paths of light' },
  ...capSubs(CAPS),
  { a: 35.2, b: 40, ja: 'ブラックホールの見え方\nブラウザで動かせます。クリックした点の光の道すじも見られます', en: 'How a Black Hole Looks\nRuns in your browser (on-screen text in Japanese). Click any point to see the path of its light' },
];
function stateAt(t) {
  const K = isVert() ? 1.7 : 1;   // 縦長は左右が狭いので、カメラを引いて円盤を収める
  const s = { a: 0.6, r: 28 * K, th: 85 * deg, ph: -0.012 * t, real: false, disk: true, sky: 'stars' };
  if (t >= 13) s.th = lerp(85, 60, ease((t - 13.5) / 6)) * deg;
  if (t >= 21 && t < 28) s.real = true;
  if (t >= 28) {
    const k = ease((t - 28.5) / 6.5);
    s.th = lerp(60, 84, k) * deg; s.r = 28 * K * Math.exp(Math.log(11 / 28) * k);
  }
  return s;
}
promoStart({
  name: 'ブラックホールの見え方', out: 'black-hole', src: '../../black-hole/index.html', iw: 2270, ih: 1080, dur: 40 + IDENT_CLOSE, subs: SUBS,
  music: { style: 'drone', root: 55, stopAt: 40, cues: [{ t: 40, type: 'jingle' }] },   // 40 秒で本編を終え、しし屋の締め
  // ペインが裏だとアプリの rAF が止まって最初の描画が始まらないので、こちらから1コマ描かせる
  ready: w => w.__bh && w.__bh.R && w.__bh.R.gl && (w.__bh.R.levels.low || (w.__bh.renderNow(), w.__bh.R.levels.low)),
  setup: w => w.document.getElementById('view'),
  renderAt(t, w) {
    const BH = w.__bh, st = stateAt(t), S = BH.S;
    const geo = st.r !== S.r || st.th !== S.th || st.a !== S.a || st.disk !== S.disk || !BH.R.levels.high.ready;
    Object.assign(S, st, { paused: true, pick: null });
    if (geo) S.geoDirty = true;
    BH.renderNow(t * 8 + 40);   // 円盤の時間（アプリと同じ 1 秒で 8M）
  },
  overlay(g, t) {
    drawTitle(g, t, 0.6, 5.6, 'ブラックホールの見え方', '映画『インターステラー』のブラックホールを、光の道すじから計算する');
    drawCaps(g, t, CAPS);
    drawEnd(g, t, 35.2, 'ブラックホールの見え方', 'ブラウザで動かせます。クリックした点の光の道すじも見られます',
      '計算の式: James, von Tunzelmann, Franklin, Thorne (2015) Classical and Quantum Gravity 32, 065001');
    drawIdentMini(g, t, 0.3);   // しし屋の目印: はじまりは左上に小さく（主役は題名）、締めは 40 秒から
    drawIdent(g, t, 40);
  },
  errors: w => w.__bh.err,
  short: { iw: 1430, ih: 1920 },   // 右のパネル 350px を除いた絵が 1080×1920
  // 4K で描かせる（アプリの上限 2.6e6 ピクセルは録画のときだけ外す。光は1ピクセルずつたどり直す）
  hires(w, W, H) { w.resizeRender(W, H, Math.min(0.5, Math.sqrt(1.6e5 / (W * H))), 1); w.__bh.S.geoDirty = true; },
});
</script>
</body>
</html>
