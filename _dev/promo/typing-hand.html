<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="typing-common.js"></script>
<script>
'use strict';
// 台本: タイピングする手（ショート、40秒＋締め）。?short で縦長に録る
// 雨ニモマケズ（指の色）→ ゆっくり（指の番号）→ 皮ふを透かして骨と筋肉 → 手動のタイプライター → 世界記録の速さ（スロー、押せなかったキーを正直に）
// 音は BGM ではなく、アプリと同じ打鍵の合成で、画面の手が押すキーの音を鳴らす
const V = new URLSearchParams(location.search).has('short');
// アプリは縦長の画面では引く（1.15 / 縦横比 倍）ので、縦長の d は小さめに書く
const CV = V ? [
  [{ th: 0.3, ph: 0.7, d: 450, tg: [0, 0, -10] }, { th: 0.15, ph: 0.66, d: 420, tg: [0, 0, -10] }],
  [{ th: -0.35, ph: 0.72, d: 360, tg: [30, 0, -10] }, { th: -0.5, ph: 0.76, d: 340, tg: [30, 0, -10] }],
  [{ th: 0.45, ph: 0.78, d: 370, tg: [0, 10, -10] }, { th: 0.3, ph: 0.74, d: 350, tg: [0, 10, -10] }],
  [{ th: 0.25, ph: 0.7, d: 470, tg: [0, 20, -20] }, { th: 0.1, ph: 0.66, d: 445, tg: [0, 20, -20] }],
  [{ th: -0.2, ph: 0.68, d: 480, tg: [0, 0, -5] }, { th: 0.2, ph: 0.72, d: 450, tg: [0, 0, -5] }],
] : [
  [{ th: 0.45, ph: 0.85, d: 640, tg: [0, 0, -45] }, { th: 0.3, ph: 0.8, d: 600, tg: [0, 0, -45] }],
  [{ th: -0.35, ph: 0.8, d: 420, tg: [40, 0, -45] }, { th: -0.5, ph: 0.85, d: 400, tg: [40, 0, -45] }],
  [{ th: 0.45, ph: 0.85, d: 440, tg: [0, 10, -45] }, { th: 0.3, ph: 0.8, d: 420, tg: [0, 10, -45] }],
  [{ th: 0.3, ph: 0.8, d: 680, tg: [0, 20, -60] }, { th: 0.15, ph: 0.75, d: 640, tg: [0, 20, -60] }],
  [{ th: -0.2, ph: 0.75, d: 600, tg: [0, 0, -45] }, { th: 0.2, ph: 0.8, d: 560, tg: [0, 0, -45] }],
];
const SC = [
  { a: 0, b: 6.5, text: 'ame', kpm: 400, s0: 0.3, opt: { fingerMap: true }, cam: camLerp(...CV[0], 6.5) },
  { a: 6.5, b: 14, text: 'tenki', kpm: 120, s0: 0.4, opt: { fingerNums: true }, cam: camLerp(...CV[1], 7.5) },
  { a: 14, b: 21.5, text: 'fox', kpm: 400, s0: 0.3, speed: 0.7, look: 'xraymus', cam: camLerp(...CV[2], 7.5) },
  { a: 21.5, b: 29, text: 'fox', kpm: 300, kb: 'typewriter', s0: 0.3, cam: camLerp(...CV[3], 7.5) },
  { a: 29, b: SHORT_END + IDENT_CLOSE, text: 'fox', kpm: 1080, s0: 0.3, speed: 0.4, scene: 'stage', opt: { fingerMap: true }, cam: camLerp(...CV[4], 11) },
];
// 世界記録の速さで押せなかったキー（setup でアプリに計算させて決める）
let MISS = '';
const CAPS = () => [
  { a: 6.8, b: 13.7, main: 'どのキーをどの指で打つか', sub: '1 親指 〜 5 小指。打たない指も次のキーへ先回り',
    en: ['Which finger types which key', '1 is the thumb, 5 the little finger; idle fingers move ahead to their next key'] },
  { a: 14.3, b: 21.2, main: '皮ふの下で、骨と筋肉が動く', sub: '指の動きは測ったものではなく、骨と関節から計算',
    en: ['Bones and muscles move under the skin', 'The motion is not measured; it is worked out from bones and joints'] },
  { a: 21.8, b: 28.7, main: '手動のタイプライターも', sub: 'キーを 10mm 押しこむ。音もブラウザの中で合成',
    en: ['A manual typewriter too', 'Keys go down 10 mm; the sound is synthesized in the browser'] },
  { a: 29.3, b: 36.5, main: '世界記録の速さ：1分に 1080 キー（スロー）', sub: MISS ? `間に合わないキー（${MISS}）は「押せなかった」と正直に出す` : '関節の速さの上限ぎりぎりで打つ',
    en: ['World-record speed: 1080 keys a minute (slow motion)', MISS ? `Keys it can't reach in time (${MISS}) are honestly marked as missed` : 'Typing right at the joint speed limit'] },
];
let CAPS_NOW = [];
promoStart({
  name: 'タイピングする手', out: 'typing-hand', src: '../../typing-hand/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 18,
  inject: TY_INJECT,
  music: { style: 'none', cues: [{ t: SHORT_END, type: 'jingle' }] },   // ここで music.extra を足す（setup で計画ができてから）
  ready: tyReady,
  setup(w) {
    tySetup(w, SC);
    MISS = tyChecks(SC[4]).miss.map(n => n.ch).join('・');
    CAPS_NOW = CAPS();
    this.music.extra = tyAudio(w, SC);
    return w.document.getElementById('view');
  },
  subs: () => shortSubs('タイピングする手', 'Hands on the Keyboard', 'キーを打つ両手の動きを計算する', 'Typing hands, worked out by computer', CAPS_NOW,
    'ブラウザで動かせます。自分で打ったキーも再現', 'Runs in your browser; it can replay your own typing too'),
  renderAt(t, w) { tyRender(w, SC, t); },
  overlay(g, t) {
    drawCaps(g, t, CAPS_NOW);
    drawShortChrome(g, t, 'タイピングする手', 'キーを打つ両手の動きを計算する', 'ブラウザで動かせます。自分で打ったキーも再現',
      'おもな出どころ: Dhakal ほか（2018）打つ間隔の傾向、Asonov・Agrawal（2004）打鍵の音、Buryanov・Kotiuk（2010）骨の長さ ほか。指の動きは計算したシミュレーション');
  },
  errors: w => (w.__tyhaErr || []).map(String),
  short: { iw: 1080, ih: 1920 },
});
</script>
</body>
</html>
