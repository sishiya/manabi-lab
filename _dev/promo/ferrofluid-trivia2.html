<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく ferrofluid-2（型F 会話）「生まれはロケットの燃料、でも…」。台本は trivia/ferrofluid.md。?short で録る
// 話: R. S. Arrighi（NASA Glenn, 2021-02-25）"Novel Rocket Fuel Spawned Ferrofluid Industry": 1960年代はじめ、宇宙で燃料がポンプにとどかない問題、
// 細かい酸化鉄の粒を燃料に・電磁石で引きよせる案、低重力では液がタンクの真ん中に集まり仕切り板で足りた、のちにスピーカーの冷却・回る軸のシール。
// 特許 US 3,215,572（1965）。発明者の名前は出さない。NASA の写真は使わない（線画）。トゲの皿・タンクの中は模式図。
// 声はまだ（2人の会話。字幕の上に「聞き手」「答える人」の札を出す。札は net-route-trivia3 の書き方）
const DUR = 35;
const subs = [
  { a: 0.0, b: 1.8, who: 'q', ja: 'この黒いトゲトゲ、何のために作ったの？', en: 'Q: What was this spiky black liquid made for?', noBurn: true },
  { a: 1.8, b: 3.0, who: 'a', ja: '[ロケットの燃料]。', en: 'A: Rocket fuel.' },
  { a: 3.0, b: 9.0, who: 'a', ja: '1960年代のNASA。宇宙ではタンクの中の燃料が浮いて、\n[ポンプの口]にとどかないかもしれなかった。', en: 'A: NASA, in the 1960s. In space, fuel floats around inside the tank\nand might not reach the pump inlet.' },
  { a: 9.0, b: 13.2, who: 'a', ja: 'そこで、燃料に細かい[酸化鉄の粉]をまぜて、\n磁石で吸いよせればいい、と考えた。', en: 'A: So the idea was to mix fine iron oxide powder into the fuel\nand pull it in with a magnet.' },
  { a: 13.2, b: 15.0, who: 'q', ja: '天才。', en: 'Q: Genius.' },
  { a: 15.0, b: 20.0, who: 'a', ja: 'ところが、無重力だと液は\n[タンクの真ん中]に集まるとわかって、\n仕切り板でポンプへ導けば足りた。', en: 'A: But it turned out that in weightlessness the liquid gathers in the middle of the tank,\nand simple baffles could guide it to the pump.' },
  { a: 20.0, b: 22.0, who: 'q', ja: 'え、[出番なし]？', en: 'Q: Wait, so it was never needed?' },
  { a: 22.0, b: 25.6, who: 'a', ja: 'ロケットの燃料には、[使われなかった]。', en: 'A: It was never used as rocket fuel.' },
  { a: 25.6, b: 30.0, who: 'a', ja: 'でも今は、[スピーカー]を冷やしたり、\n[回る軸]のすき間をふさいだり。', en: 'A: But today it cools loudspeakers\nand seals the gaps around spinning shafts.' },
  { a: 30.0, b: 35.0, who: 'q', ja: '失敗作が、いちばん[出世した]パターン。', en: 'Q: The flop that became the biggest success.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.8, type: 'ding' }, { t: 3.0, type: 'whoosh' }, { t: 3.4, type: 'pop' },
  { t: 9.0, type: 'whoosh' }, { t: 9.6, type: 'tick' }, { t: 10.2, type: 'tick' }, { t: 11.5, type: 'rise' }, { t: 13.2, type: 'ding' },
  { t: 15.0, type: 'whoosh' }, { t: 17.6, type: 'pop' }, { t: 18.6, type: 'ding' }, { t: 20.0, type: 'buzz' },
  { t: 22.0, type: 'thud' }, { t: 25.6, type: 'whoosh' }, { t: 26.0, type: 'pop' }, { t: 27.6, type: 'pop' }, { t: 30.0, type: 'rise' }, { t: 31.0, type: 'ding' },
];

// トゲの皿（ferrofluid-trivia1 の模式図を小さくしたもの）。cx, cy: 皿のまん中、rx: 横の半径、H: トゲの高さ
function dish(g, cx, cy, rx, H) {
  const ry = rx * 0.43, L = rx / 6.2, sq = ry / rx;
  g.save();
  g.fillStyle = '#0a0d18'; g.strokeStyle = 'rgba(200,220,255,0.6)'; g.lineWidth = 4;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  const pts = [], rows = Math.ceil(rx / (L * 0.866)) + 1, cols = Math.ceil(rx / L) + 1;
  for (let j = -rows; j <= rows; j++) for (let i = -cols; i <= cols; i++) {
    const X = (i + (j & 1) * 0.5) * L, Y = j * L * 0.866;
    if ((X * X + Y * Y) / ((rx - L * 0.4) ** 2) > 1) continue;
    pts.push([X, Y]);
  }
  pts.sort((a, b) => a[1] - b[1]);
  for (const [X, Y] of pts) {
    const x = cx + X, y = cy + Y * sq, w = L * 0.42;
    if (H < 1) continue;
    const gr = g.createLinearGradient(x - w, 0, x + w, 0);
    gr.addColorStop(0, '#121a30'); gr.addColorStop(0.55, '#33476e'); gr.addColorStop(0.7, '#8fb0e8'); gr.addColorStop(1, '#0d1222');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(x - w, y); g.quadraticCurveTo(x - w * 0.25, y - H * 0.35, x, y - H); g.quadraticCurveTo(x + w * 0.25, y - H * 0.35, x + w, y);
    g.ellipse(x, y, w, w * sq, 0, 0, Math.PI); g.fill();
  }
  g.restore();
}
// ロケットの線画。x: まん中、y: 下のはし、s: 大きさ
function rocket(g, x, y, s, t) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = 'rgba(220,232,255,0.9)'; g.lineWidth = 5; g.fillStyle = 'rgba(20,34,72,0.9)';
  g.beginPath(); g.moveTo(-50, -60); g.lineTo(-50, -330); g.quadraticCurveTo(-50, -420, 0, -470); g.quadraticCurveTo(50, -420, 50, -330); g.lineTo(50, -60); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-50, -150); g.lineTo(-100, -40); g.lineTo(-50, -60); g.moveTo(50, -150); g.lineTo(100, -40); g.lineTo(50, -60); g.stroke();
  g.beginPath(); g.arc(0, -320, 22, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = TK.C.acc; g.setLineDash([10, 8]); g.beginPath(); g.roundRect(-34, -260, 68, 170, 10); g.stroke(); g.setLineDash([]);   // 燃料タンク
  const f = 0.8 + 0.2 * Math.sin(t * 30);
  g.fillStyle = 'rgba(255,160,60,0.85)'; g.beginPath(); g.moveTo(-30, -58); g.quadraticCurveTo(0, 60 * f + 20, 30, -58); g.closePath(); g.fill();
  g.restore();
}
// タンク（模式図）。中のまん中 (TX, TY)、幅 TW・高さ TH。下にポンプの口
const TX = 480, TY = 620, TW = 400, TH = 480;
function tank(g, o = {}) {
  g.save(); g.lineJoin = 'round';
  g.fillStyle = 'rgba(10,15,32,0.85)'; g.strokeStyle = 'rgba(200,220,255,0.75)'; g.lineWidth = 6;
  g.beginPath(); g.roundRect(TX - TW / 2, TY - TH / 2, TW, TH, TW / 2); g.fill(); g.stroke();
  // ポンプの口（下の管）
  g.fillStyle = 'rgba(20,34,72,0.95)';
  g.beginPath(); g.rect(TX - 30, TY + TH / 2 - 4, 60, 90); g.fill(); g.stroke();
  g.restore();
  TK.text(g, 'ポンプの口', TX + 150, TY + TH / 2 + 50, 38, { color: TK.C.sub, bold: false });
}
// 液のかたまり（ふわふわ浮く）。k: 真ん中/口へ寄る度合い、mode: 'center' | 'outlet'
const BLOBS = [[-90, -130, 40], [85, -90, 34], [-45, 30, 44], [95, 70, 30], [-100, 120, 28], [30, -165, 26], [45, 140, 34]];
function blobs(g, t, k, mode, dots) {
  g.save();
  BLOBS.forEach(([bx, by, r], i) => {
    let x = TX + bx + 14 * Math.sin(t * 0.9 + i * 1.7), y = TY + by + 14 * Math.cos(t * 0.8 + i * 2.3);
    const tx = TX, ty = mode === 'outlet' ? TY + TH / 2 - 40 : TY;
    x = lerp(x, tx + (mode === 'center' ? bx * 0.12 : 0), k); y = lerp(y, ty + (mode === 'center' ? by * 0.12 : 0), k);
    g.fillStyle = 'rgba(255,170,70,0.55)'; g.strokeStyle = 'rgba(255,200,120,0.9)'; g.lineWidth = 3;
    g.beginPath(); g.arc(x, y, r * (mode === 'center' ? lerp(1, 0.0, k) : lerp(1, 0.5, k)), 0, Math.PI * 2); g.fill(); g.stroke();
    if (dots > 0) {
      g.fillStyle = '#1a1a1a';
      for (let d = 0; d < 7; d++) { const a = d * 2.4 + i, rr = r * 0.6 * ((d * 37 % 10) / 10); if (d / 7 < dots) { g.beginPath(); g.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, 5, 0, Math.PI * 2); g.fill(); } }
    }
  });
  if (mode === 'center' && k > 0) {   // まん中のひとつのかたまり
    const R = 150 * ease(k);
    g.fillStyle = 'rgba(255,170,70,0.55)'; g.strokeStyle = 'rgba(255,200,120,0.9)'; g.lineWidth = 4;
    g.beginPath(); g.ellipse(TX, TY, R, R * 0.85, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  g.restore();
}
// 電磁石（口のまわりの巻き線）
function magnet(g, a = 1, off) {
  g.save(); g.globalAlpha *= a;
  const y = TY + TH / 2 + 40, col = off ? 'rgba(160,170,190,0.6)' : TK.C.red;
  g.strokeStyle = col; g.lineWidth = 6;
  for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(TX, y - 30 + i * 15, 62, 14, 0, 0, Math.PI); g.stroke(); }
  TK.text(g, '電磁石', TX - 170, y, 40, { color: col });
  g.restore();
}
// スピーカー（円すいと、すき間の液）
function speaker(g, x, y, t) {
  g.save(); g.lineJoin = 'round'; g.strokeStyle = 'rgba(220,232,255,0.9)'; g.lineWidth = 5; g.fillStyle = 'rgba(20,34,72,0.9)';
  g.beginPath(); g.moveTo(x - 30, y - 50); g.lineTo(x + 50, y - 120); g.lineTo(x + 50, y + 120); g.lineTo(x - 30, y + 50); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.rect(x - 110, y - 60, 80, 120); g.fill(); g.stroke();   // 磁石
  g.fillStyle = '#0c0c14'; g.strokeStyle = TK.C.acc; g.lineWidth = 4;
  g.beginPath(); g.roundRect(x - 40, y - 54, 16, 108, 6); g.fill(); g.stroke();   // すき間の液
  g.strokeStyle = TK.C.red; g.lineWidth = 4; g.globalAlpha *= 0.8;
  for (let i = 0; i < 3; i++) { const yy = y - 110 - i * 0; g.beginPath(); for (let k = 0; k <= 10; k++) { const xx = x - 110 + i * 34, py = y - 80 - k * 8; g[k ? 'lineTo' : 'moveTo'](xx + 6 * Math.sin(k * 0.9 + t * 6), py); } g.stroke(); }
  g.restore();
}
// 回る軸のシール（軸が壁をつらぬき、すき間に液の輪）
function shaft(g, x, y, t) {
  g.save(); g.strokeStyle = 'rgba(220,232,255,0.9)'; g.lineWidth = 5; g.fillStyle = 'rgba(20,34,72,0.9)';
  g.beginPath(); g.rect(x - 25, y - 120, 50, 92); g.rect(x - 25, y + 28, 50, 92); g.fill(); g.stroke();   // 壁
  g.fillStyle = 'rgba(200,210,230,0.25)'; g.beginPath(); g.rect(x - 170, y - 20, 340, 40); g.fill(); g.stroke();   // 軸
  for (let i = 0; i < 6; i++) { const xx = x - 170 + ((i * 60 + t * 120) % 340); g.beginPath(); g.moveTo(xx, y - 20); g.lineTo(xx - 14, y + 20); g.stroke(); }
  g.fillStyle = '#0c0c14'; g.strokeStyle = TK.C.acc; g.lineWidth = 4;
  g.beginPath(); g.roundRect(x - 25, y - 30, 50, 10, 4); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(x - 25, y + 20, 50, 10, 4); g.fill(); g.stroke();
  g.restore();
}
function tag(g, t) {
  const s = subs.find(x => t >= x.a && t < x.b && !x.noBurn); if (!s) return;
  const q = s.who === 'q', f = fade(t, s.a, s.b, 0.12);
  g.save(); g.globalAlpha = f;
  const lines = s.ja.split('\n').length, y = PH * 0.615 - (lines - 1) * 42 - 82;
  const w = 210, x = PW / 2 - w / 2;
  TK.card(g, x, y - 30, w, 60, { r: 30, fill: q ? 'rgba(95,212,255,0.25)' : 'rgba(255,207,74,0.25)', stroke: q ? TK.C.acc2 : TK.C.acc });
  TK.text(g, q ? '聞き手' : '答える人', PW / 2, y + 2, 34, { color: q ? TK.C.acc2 : TK.C.acc });
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック。トゲ＋ロケット
  if (t < 3.0) {
    dish(g, 330, 880, 270, 90 * ease(t / 0.8));
    rocket(g, 760, 1060, 1.1, t);
    TK.hook(g, t, 0.2, 3.0, 'これ、[ロケットの燃料]に\nなるはずだった', { y: 330, size: 84 });
  }
  // 3〜9: 1960年代 NASA。無重力で燃料が浮く
  if (t >= 3.0 && t < 9.0) {
    const k = TK.pop(t, 3.3, 0.4);
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    TK.text(g, '[1960年代]  NASA', TX, 250, 72);
    TK.text(g, '宇宙のロケットの燃料タンク（模式図）', TX, 330, 40, { color: TK.C.sub, bold: false });
    g.restore();
    tank(g); blobs(g, t, 0, 'free', 0);
    if (t > 5.5) { g.save(); g.globalAlpha = fade(t, 5.5, 9, 0.3); TK.text(g, '?', TX, TY + TH / 2 - 60, 80, { color: TK.C.red }); g.restore(); }
  }
  // 9〜15: 酸化鉄の粉 → 電磁石で口へ
  if (t >= 9.0 && t < 15.0) {
    TK.text(g, '燃料 ＋ [酸化鉄の細かい粉]', TX, 270, 56);
    tank(g);
    const dots = clamp((t - 9.4) / 1.2, 0, 1), k = ease((t - 11.6) / 2.2);
    blobs(g, t, k, 'outlet', dots);
    if (t > 11.2) magnet(g, clamp((t - 11.2) / 0.4, 0, 1));
  }
  // 15〜22: 液はまん中に集まる → 仕切り板で足りた
  if (t >= 15.0 && t < 22.0) {
    if (t < 20.0) TK.text(g, '無重力のタンクでは', TX, 270, 52, { color: TK.C.sub });
    tank(g);
    const k = ease((t - 15.4) / 2.0);
    blobs(g, t, k, 'center', 0);
    if (t > 17.6) {   // 仕切り板（バッフル）
      g.save(); g.globalAlpha = clamp((t - 17.6) / 0.4, 0, 1);
      g.strokeStyle = TK.C.green; g.lineWidth = 8; g.lineCap = 'round';
      [[-1, 1]].forEach(() => {
        g.beginPath(); g.moveTo(TX - 110, TY + 60); g.lineTo(TX - 35, TY + TH / 2 - 20); g.stroke();
        g.beginPath(); g.moveTo(TX + 110, TY + 60); g.lineTo(TX + 35, TY + TH / 2 - 20); g.stroke();
      });
      g.fillStyle = 'rgba(255,170,70,0.55)'; g.beginPath(); g.moveTo(TX - 70, TY + 100); g.lineTo(TX + 70, TY + 100); g.lineTo(TX + 30, TY + TH / 2 - 10); g.lineTo(TX - 30, TY + TH / 2 - 10); g.closePath(); g.fill();
      TK.text(g, '仕切り板', TX + 250, TY + 20, 40, { color: TK.C.green });
      g.restore();
    }
    if (t > 18.6) {
      g.save(); g.globalAlpha = fade(t, 18.6, 22, 0.2); g.strokeStyle = TK.C.green; g.lineWidth = 12;
      g.beginPath(); g.arc(TX, TY + 140, 150, 0, Math.PI * 2); g.stroke(); g.restore();
    }
    if (t > 20.0) {
      magnet(g, fade(t, 20.0, 22, 0.2), true);
      g.save(); g.globalAlpha = fade(t, 20.0, 22, 0.2);
      TK.card(g, TX - 200, 230, 400, 80, { r: 40, fill: 'rgba(255,107,107,0.2)', stroke: TK.C.red });
      TK.text(g, '磁石は 出番なし', TX, 271, 44, { color: TK.C.red });
      g.restore();
    }
  }
  // 22〜30: ロケットには使われなかった → いまの使いみち
  if (t >= 22.0 && t < 30.0) {
    if (t < 25.6) {
      rocket(g, TX, 950, 1.25, t);
      if (t > 22.4) {
        g.save(); g.globalAlpha = fade(t, 22.4, 25.6, 0.2); g.strokeStyle = TK.C.red; g.lineWidth = 16; g.lineCap = 'round';
        g.beginPath(); g.moveTo(TX - 200, 400); g.lineTo(TX + 200, 900); g.moveTo(TX + 200, 400); g.lineTo(TX - 200, 900); g.stroke(); g.restore();
      }
      TK.text(g, 'ロケットの燃料には', TX, 270, 56, { color: TK.C.sub });
    } else {
      TK.text(g, 'いまの使いみち', TX, 250, 56, { color: TK.C.sub });
      const k1 = TK.pop(t, 25.9, 0.4), k2 = TK.pop(t, 27.5, 0.4);
      g.save(); g.globalAlpha = clamp(k1, 0, 1);
      TK.card(g, 110, 320, 740, 320, { r: 30 });
      speaker(g, 300, 480, t);
      TK.lines(g, 'スピーカーを\n[冷やす]', 620, 450, 50);
      g.restore();
      if (t > 27.5) {
        g.save(); g.globalAlpha = clamp(k2, 0, 1);
        TK.card(g, 110, 670, 740, 320, { r: 30 });
        shaft(g, 300, 830, t);
        TK.lines(g, '回る軸の\nすき間を[ふさぐ]', 640, 800, 50);
        g.restore();
      }
    }
  }
  // 30〜35: トゲにもどる
  if (t >= 30.0) {
    dish(g, TX, 800, 340, 120 * ease((t - 30) / 0.8));
    TK.card(g, 140, 220, 680, 200, { r: 36 });
    TK.text(g, 'ロケットの燃料に使われた回数', TX, 280, 44, { color: TK.C.sub });
    TK.text(g, '[0 回]', TX, 365, 90);
    TK.note(g, t, 31.5, 35, '出どころ: R. S. Arrighi, NASA Glenn (2021)\n“Novel Rocket Fuel Spawned Ferrofluid Industry”・特許 US 3,215,572（1965）', { size: 28 });
  }
  tag(g, t);
}

triviaStart({ out: 'ferrofluid-trivia2', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
