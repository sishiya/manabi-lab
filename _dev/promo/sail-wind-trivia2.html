<!doctype html>
<html lang="ja">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく sail-wind-2（型A ぜんぶ逆）「追い風がいちばん速い、はウソ」。台本は trivia/sail-wind.md。?short で録る
// 数字（台本のまま）: Python-VPP（M. Lauber、MIT）の YD-41 の結果、風 4 ノットで 真後ろ 180° → 風の 0.58 倍、真横 88° → 1.26 倍。
// 船・帆・空気の流れ・キールは上から見た線の模式図（流れの線は形だけ）
const DUR = 30;
const subs = [
  { a: 0.0, b: 2.2, ja: 'ヨットは、[追い風]がいちばんおそい。', en: 'A sailboat is slowest with the wind right behind it.', noBurn: true },
  { a: 2.2, b: 8.0, ja: '弱い風で、真後ろから受けると、\n船は風の[6割]の速さ。', en: 'In a light wind from directly behind,\nthe boat goes at 60% of the wind speed.' },
  { a: 8.0, b: 14.0, ja: '同じ風を真横から受けると、風の[1.26倍]。\n風より速い。2倍以上ちがう。', en: 'Take the same wind from the side: 1.26× the wind.\nFaster than the wind, more than twice as fast.' },
  { a: 14.0, b: 21.0, ja: '横の風では、帆は押されるのではなく、\n飛行機の翼のように、空気の流れで[前へ引っぱられる]。', en: 'With a side wind, the sail isn’t pushed:\nlike a wing, the airflow pulls it forward.' },
  { a: 21.0, b: 26.0, ja: '横へ流されそうな力は、船の底の板（[キール]）が\n水でおさえて、前へ進む力だけが残る。', en: 'The sideways push is resisted by the keel in the water,\nleaving only the forward push.' },
  { a: 26.0, b: 30.0, ja: '追い風は、押されるだけ。\nだから、[いちばんおそい]。', en: 'A tailwind can only push.\nThat’s why it’s the slowest.' },
];
const cues = [
  { t: 0.05, type: 'whoosh' }, { t: 0.8, type: 'buzz' }, { t: 2.2, type: 'pop' }, { t: 5.0, type: 'tick' },
  { t: 8.0, type: 'whoosh' }, { t: 11.0, type: 'ding' }, { t: 14.0, type: 'whoosh' }, { t: 16.5, type: 'rise' },
  { t: 21.0, type: 'pop' }, { t: 23.0, type: 'thud' }, { t: 26.0, type: 'pop' }, { t: 27.4, type: 'ding' },
];

function arrow(g, x0, y0, x1, y1, color, w = 10) {
  g.save(); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  const a = Math.atan2(y1 - y0, x1 - x0), h = w * 3;
  g.beginPath(); g.moveTo(x1 + Math.cos(a) * h * 0.5, y1 + Math.sin(a) * h * 0.5); g.lineTo(x1 - Math.cos(a - 0.5) * h, y1 - Math.sin(a - 0.5) * h); g.lineTo(x1 - Math.cos(a + 0.5) * h, y1 - Math.sin(a + 0.5) * h); g.fill();
  g.restore();
}
// 船（上から）。heading: 船首の向き（0 = 上）、boom: 帆の角度（船に対して）
function boat(g, x, y, heading, boom, s = 1) {
  g.save(); g.translate(x, y); g.rotate(heading); g.scale(s, s);
  g.strokeStyle = '#fff'; g.lineWidth = 5; g.fillStyle = 'rgba(255,255,255,0.08)';
  g.beginPath(); g.moveTo(0, -150); g.bezierCurveTo(60, -80, 55, 90, 35, 140); g.lineTo(-35, 140); g.bezierCurveTo(-55, 90, -60, -80, 0, -150); g.fill(); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -30, 9, 0, Math.PI * 2); g.fill();
  g.rotate(boom); g.strokeStyle = TK.C.acc; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -30); g.quadraticCurveTo(18, 50, 0, 140); g.stroke();
  g.restore();
}
// 風の矢印の列（dir: 風が吹いていく向き、ラジアン。0 = 上）
function windField(g, t, dir, color = 'rgba(95,212,255,0.5)') {
  g.save(); g.strokeStyle = color; g.lineWidth = 5; g.lineCap = 'round';
  const dx = Math.sin(dir), dy = -Math.cos(dir);
  for (let i = 0; i < 12; i++) {
    const k = ((t * 0.5 + i * 0.37) % 1), off = (i - 5.5) * 80;
    const cx = 540 + (-dy) * off + dx * (k - 0.5) * 900, cy = 640 + dx * off + dy * (k - 0.5) * 900;
    if (cy < 180 || cy > 1080) continue;
    g.globalAlpha = Math.sin(k * Math.PI);
    g.beginPath(); g.moveTo(cx - dx * 40, cy - dy * 40); g.lineTo(cx + dx * 40, cy + dy * 40); g.stroke();
  }
  g.restore();
}
function speedCard(g, label, v, color) {
  TK.card(g, 260, 180, 560, 150, { r: 40 });
  TK.text(g, label, 540, 222, 38, { color: TK.C.sub });
  TK.text(g, '風の ' + v, 540, 285, 70, { color });
}

function draw(g, t) {
  // 0〜2.2: フック
  if (t < 2.2) {
    windField(g, t, 0);
    boat(g, 540, 600, 0, 1.35, 1.3);
    if (t > 0.7) { const p = clamp(TK.pop(t, 0.7, 0.3), 0, 1.2); g.save(); g.strokeStyle = TK.C.red; g.lineWidth = 28; g.lineCap = 'round';
      g.beginPath(); g.moveTo(540 - 180 * p, 600 - 180 * p); g.lineTo(540 + 180 * p, 600 + 180 * p); g.moveTo(540 + 180 * p, 600 - 180 * p); g.lineTo(540 - 180 * p, 600 + 180 * p); g.stroke(); g.restore(); }
    TK.hook(g, t, 0.0, 2.2, '追い風が、\n[いちばんおそい]。', { y: 1000, size: 110 });
  }
  // 2〜8: 真後ろの風 0.58 倍
  if (t >= 2.2 && t < 8.0) {
    windField(g, t, 0);
    boat(g, 540, 680, 0, 1.35, 1.3);
    speedCard(g, '真後ろの風（4ノット）', '[0.58] 倍', '#fff');
    arrow(g, 540, 1020, 540, 960, TK.C.acc2, 10);
    TK.text(g, '風', 600, 1000, 40, { align: 'left', color: TK.C.acc2 });
    TK.note(g, t, 2.6, 8, '計算: ある12mのヨット（YD-41）・弱い風。上から見た図', { size: 32 });
  }
  // 8〜14: 真横の風 1.26 倍
  if (t >= 8.0 && t < 14.0) {
    const k = ease((t - 8.3) / 1.6);
    windField(g, t, Math.PI / 2 * k);   // 風の向きを、船に対して横へ（見やすいよう風を回す）
    boat(g, 540, 680, 0, lerp(1.35, -0.35, k), 1.3);
    speedCard(g, k < 0.5 ? '真後ろの風' : '真横の風（4ノット）', k < 0.98 ? '…' : '[1.26] 倍', TK.C.acc);
    if (t > 11.0) { g.save(); g.globalAlpha = fade(t, 11, 14, 0.3); TK.text(g, '[風より速い]', PW / 2, 1020, 76); g.restore(); }
  }
  // 14〜21: 帆は翼。流れで前へ引っぱられる（風は左から右、船の前は上）
  if (t >= 14.0 && t < 21.0) {
    const cx = 540, cy = 660;
    const sail = u => { const x = lerp(cx - 300, cx + 300, u), y = lerp(cy + 20, cy + 110, u) - Math.sin(u * Math.PI) * 90; return [x, y]; };
    // 流れの線（帆の上は持ち上がって速く、下はゆっくり。形だけ）
    g.save(); g.lineWidth = 4; g.setLineDash([24, 18]);
    for (let i = 0; i < 9; i++) {
      const y0 = cy - 330 + i * 80, above = y0 < cy + 40, near = Math.exp(-Math.abs(y0 - cy) / 220);
      g.strokeStyle = 'rgba(95,212,255,0.55)'; g.lineDashOffset = -((t * (above ? 1.4 : 0.8)) % 1) * 84 * 3;
      g.beginPath();
      for (let x = 60; x <= 1020; x += 20) { const u = clamp((x - (cx - 300)) / 600, 0, 1), bump = Math.sin(u * Math.PI) * (above ? -70 : -30) * near + (x > cx + 300 ? (x - cx - 300) * 0.25 * near : u * 90 * near); const yy = y0 + bump; x === 60 ? g.moveTo(x, yy) : g.lineTo(x, yy); }
      g.stroke();
    }
    g.restore();
    g.save(); g.strokeStyle = TK.C.acc; g.lineWidth = 14; g.lineCap = 'round'; g.beginPath();
    for (let k = 0; k <= 30; k++) { const [x, y] = sail(k / 30); k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore();
    TK.text(g, '風 →', 140, 250, 44, { color: TK.C.acc2, align: 'left' });
    TK.text(g, '↑ 船の前', 940, 250, 40, { color: TK.C.sub, align: 'right', bold: false });
    if (t > 16.4) { g.save(); g.globalAlpha = fade(t, 16.4, 21, 0.3); arrow(g, cx, cy - 40, cx - 40, cy - 330, TK.C.green, 14); TK.text(g, '引っぱる力', cx + 150, cy - 280, 54, { color: TK.C.green }); g.restore(); }
    TK.text(g, '帆を上から見た断面（翼と同じ形）', PW / 2, 1040, 40, { color: TK.C.sub, bold: false });
    TK.note(g, t, 14.4, 21, '模式図（流れの線は形だけ）', { size: 32 });
  }
  // 21〜26: キール
  if (t >= 21.0 && t < 26.0) {
    windField(g, t, Math.PI / 2); boat(g, 540, 640, 0, -0.35, 1.3);
    g.save(); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 12; g.beginPath(); g.moveTo(540, 600); g.lineTo(540, 720); g.stroke(); g.restore();
    TK.text(g, 'キール（船の底の板）', 640, 820, 40, { align: 'left', color: TK.C.sub });
    const p = clamp((t - 21.4) / 0.8, 0, 1);
    arrow(g, 540, 600, 540 + 280 * p, 600 - 140 * p, TK.C.green, 12);
    if (t > 22.6) { const q = clamp((t - 22.6) / 0.6, 0, 1); arrow(g, 520, 600, 520 - 260 * q, 600, TK.C.red, 10); TK.text(g, '水がおさえる', 250, 560, 40, { color: TK.C.red }); }
    if (t > 23.8) { const q = clamp((t - 23.8) / 0.6, 0, 1); arrow(g, 540, 560, 540, 560 - 260 * q, TK.C.acc, 14); TK.text(g, '[前へ] 進む力', 540, 230, 60); }
  }
  // 26〜30: まとめの棒
  if (t >= 26.0) {
    TK.text(g, '同じ 4 ノットの風で', PW / 2, 240, 52, { color: TK.C.sub });
    TK.bars(g, t, 26.1, 30.0, [
      { label: '真後ろの風', v: 0.58 / 1.4, color: TK.C.acc2, text: '0.58 倍' },
      { label: '真横の風', v: 1.26 / 1.4, color: TK.C.acc, text: '1.26 倍' },
    ], { y: 380, gap: 240, stagger: 0.5 });
    TK.note(g, t, 26.4, 30, '出どころ: Python-VPP（M. Lauber, MIT）・ORC の帆と船体の式。YD-41 の計算\n強い風では差が小さくなる', { size: 28 });
  }
}

triviaStart({ out: 'sail-wind-trivia2', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
