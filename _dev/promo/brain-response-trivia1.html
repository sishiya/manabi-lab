<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく brain-1（型A ぜんぶ逆）「光より、音が先に脳に届く（大脳の最初の反応）」。台本は trivia/brain-response.md。?short で録る
// 数字: 聴覚野 30 ms（Liégeois-Chauvel 1994、脳の中の電極）・V1 56 ms（Foxe & Simpson 2002、頭の表面の波）。
// 約9 m は (56−30) ms × 343 m/s の自分の計算（推定）。光の速さ ÷ 音の速さ ≈ 3.0e8 / 343 ≈ 87万倍。
const DUR = 35;
const subs = [
  { a: 0.0, b: 1.8, ja: '光より、[音]が先に脳に届く', en: 'Sound reaches your brain before light', noBurn: true },
  { a: 1.8, b: 3.0, ja: '光は音の[約87万倍]速いのに', en: 'even though light is about 870,000 times faster' },
  { a: 3.0, b: 9.0, ja: '目の前でパンと鳴ったとき\n目と耳には[同時に]届く', en: 'A clap right in front of you\nreaches your eyes and ears at the same time' },
  { a: 9.0, b: 15.0, ja: '音は[約0.03秒]で\n大脳の「聞く場所」が反応しはじめる', en: 'For sound, the brain’s hearing area\nstarts responding in about 0.03 s' },
  { a: 15.0, b: 21.0, ja: '光で「見る場所」が反応するのは[約0.056秒]\n目で信号に変えるのに時間がかかる', en: 'For light, the seeing area starts at about 0.056 s:\nthe eye takes time to turn light into signals' },
  { a: 21.0, b: 28.0, ja: '約9mはなれると、音が空気を進む遅れで\n[ちょうど同時]になる（推定）', en: 'About 9 m away, the time sound spends in the air\nmakes them arrive together (estimate)' },
  { a: 28.0, b: 33.0, ja: 'それより近いと、大脳の最初の反応は[音が先]\n少しのずれは、脳が同時にまとめて感じる', en: 'Closer than that, the first response is to sound.\nYour brain blends small gaps into “at once”' },
  { a: 33.0, b: 35.0, ja: '光より、[音]が先に脳に届く', en: 'Sound reaches your brain before light', noBurn: true },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.8, type: 'whoosh' }, { t: 4.0, type: 'thud' }, { t: 9.0, type: 'pop' }, { t: 11.2, type: 'ding' },
  { t: 15.0, type: 'pop' }, { t: 17.0, type: 'ding' }, { t: 21.0, type: 'whoosh' }, { t: 26.0, type: 'ding' }, { t: 28.0, type: 'pop' }, { t: 33.0, type: 'pop' },
];
const SOUND = '#5fd4ff', LIGHT = '#ffcf4a';

// 横向きの頭（左を向く）。cx, cy が頭の中心、s が大きさ。耳と目の位置を返す
function head(g, cx, cy, s, o = {}) {
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.strokeStyle = 'rgba(207,224,255,0.9)'; g.lineWidth = 6 / s; g.lineJoin = 'round'; g.lineCap = 'round';
  g.fillStyle = 'rgba(30,50,100,0.55)';
  g.beginPath();
  g.moveTo(-140, 230); g.lineTo(-150, 130); g.quadraticCurveTo(-200, 125, -192, 80);
  g.lineTo(-210, 48); g.lineTo(-200, 18); g.lineTo(-238, -24); g.lineTo(-205, -58);
  g.quadraticCurveTo(-215, -150, -150, -200);
  g.bezierCurveTo(-60, -285, 165, -265, 205, -80);
  g.bezierCurveTo(222, 20, 175, 110, 112, 140); g.lineTo(95, 230);
  g.fill(); g.stroke();
  // 脳（うすく）
  g.strokeStyle = 'rgba(160,190,255,0.35)'; g.lineWidth = 4 / s;
  g.beginPath(); g.ellipse(15, -95, 172, 118, 0, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(-90, -40); g.quadraticCurveTo(0, -10, 80, -40); g.stroke();   // 外側溝（かざり）
  // 光る場所
  if (o.aud) { g.fillStyle = `rgba(95,212,255,${0.75 * o.aud})`; g.beginPath(); g.ellipse(10, -50, 62, 34, -0.1, 0, Math.PI * 2); g.fill(); }
  if (o.vis) { g.fillStyle = `rgba(255,207,74,${0.75 * o.vis})`; g.beginPath(); g.ellipse(160, -95, 34, 62, 0.2, 0, Math.PI * 2); g.fill(); }
  // 目・耳
  g.strokeStyle = 'rgba(207,224,255,0.9)'; g.lineWidth = 5 / s;
  g.beginPath(); g.ellipse(-168, -70, 18, 9, 0, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(55, 15, 28, -1.9, 1.9); g.stroke();
  g.restore();
  return { eye: [cx - 168 * s, cy - 70 * s], ear: [cx + 55 * s, cy + 15 * s] };
}
// 手をたたく（2つの手のひら）。k=0 開く → 1 合わさる
function clap(g, x, y, k, flash) {
  g.save(); g.strokeStyle = '#fff'; g.lineWidth = 6; g.fillStyle = 'rgba(255,255,255,0.12)';
  const d = (1 - k) * 60;
  [-1, 1].forEach(sd => { g.beginPath(); g.ellipse(x + sd * (d + 18), y, 18, 60, sd * 0.15, 0, Math.PI * 2); g.fill(); g.stroke(); });
  if (flash > 0) {
    g.globalAlpha = flash; g.strokeStyle = LIGHT; g.lineWidth = 6;
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, r0 = 85, r1 = 85 + 50 * flash; g.beginPath(); g.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); g.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); g.stroke(); }
  }
  g.restore();
}
// 時間の目もり（0〜max ms）
const TX0 = 130, TX1 = 930;
function timeAxis(g, y, max, f = 1) {
  g.save(); g.globalAlpha *= f;
  g.strokeStyle = 'rgba(207,224,255,0.6)'; g.lineWidth = 4; g.beginPath(); g.moveTo(TX0, y); g.lineTo(TX1, y); g.stroke();
  for (let m = 0; m <= max; m += 10) { const x = TX0 + (TX1 - TX0) * m / max; g.beginPath(); g.moveTo(x, y - 12); g.lineTo(x, y + 12); g.stroke(); TK.text(g, String(m), x, y + 44, 34, { color: TK.C.dim, bold: false }); }
  g.restore();
}
function marker(g, y, max, ms, color, label, k, below) {
  if (k <= 0) return;
  const x = TX0 + (TX1 - TX0) * Math.min(ms, max * k) / max;
  g.save(); g.strokeStyle = color; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(TX0, y); g.lineTo(x, y); g.stroke();
  g.fillStyle = color; g.beginPath(); g.arc(x, y, 18, 0, Math.PI * 2); g.fill();
  if (k >= 1) TK.text(g, label, x, below ? y + 52 : y - 50, 46, { color });
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック → 87万倍
  if (t < 1.8) TK.hook(g, t, 0, 1.8, '光より、\n[音]が先に\n脳に届く', { y: 640, size: 140 });
  if (t >= 1.8 && t < 3.0) {
    TK.count(g, t, 1.8, 3.0, 1, 870000, { y: 640, size: 170, dur: 0.6, label: '光の速さ ÷ 音の速さ', unit: '倍', fmt: v => '約' + Math.round(v / 10000).toLocaleString('ja-JP') + '万' });
  }
  // 3〜9: 目の前でパン。目と耳に同時に届く
  if (t >= 3.0 && t < 9.0) {
    const f = fade(t, 3, 9, 0.3); g.save(); g.globalAlpha = f;
    const p = head(g, 660, 700, 1.15);
    const k = ease((t - 3.4) / 0.6), hit = t >= 4.0, sx = 220, sy = 640;
    clap(g, sx, sy, k, hit ? clamp(1 - (t - 4.0) / 0.8, 0, 1) : 0);
    if (hit) {
      const u = clamp((t - 4.2) / 1.6, 0, 1);
      // 光（目へ）と音（耳へ）が同じ速さで進むように描く（この距離ではどちらも一瞬）
      g.strokeStyle = LIGHT; g.lineWidth = 8; g.setLineDash([24, 14]);
      g.beginPath(); g.moveTo(sx + 70, sy - 20); g.lineTo(lerp(sx + 70, p.eye[0] - 20, u), lerp(sy - 20, p.eye[1], u)); g.stroke();
      g.setLineDash([]); g.strokeStyle = SOUND; g.lineWidth = 6;
      for (let i = 0; i < 4; i++) { const r = 60 + (p.ear[0] - sx - 60) * clamp(u - i * 0.06, 0, 1); if (r <= 60) continue; g.globalAlpha = f * (1 - i * 0.2); g.beginPath(); g.arc(sx, sy, r, -0.25, 0.4); g.stroke(); }
      g.globalAlpha = f;
      if (u >= 1) {
        TK.text(g, '光', p.eye[0] - 40, p.eye[1] - 70, 56, { color: LIGHT });
        TK.text(g, '音', p.ear[0] + 10, p.ear[1] + 90, 56, { color: SOUND });
        TK.card(g, 220, 230, 640, 120, { r: 60 });
        TK.text(g, '目と耳には [同時]', PW / 2, 290, 66);
      }
    }
    g.restore();
  }
  // 9〜21: 大脳の反応のはじまり（音 30 ms → 光 56 ms）
  if (t >= 9.0 && t < 21.0) {
    const f = fade(t, 9, 21, 0.3); g.save(); g.globalAlpha = f;
    const ka = clamp((t - 9.6) / 1.6, 0, 1), kv = clamp((t - 15.4) / 1.6, 0, 1);
    head(g, 560, 470, 0.95, { aud: ka >= 1 ? 0.6 + 0.4 * Math.abs(Math.sin(t * 4)) : 0, vis: kv >= 1 ? 0.6 + 0.4 * Math.abs(Math.sin(t * 4)) : 0 });
    if (ka >= 1) TK.text(g, '聞く場所', 520, 280, 40, { color: SOUND });
    if (kv >= 1) TK.text(g, '見る場所', 820, 280, 40, { color: LIGHT });
    TK.text(g, '大脳が反応しはじめるまで（ミリ秒）', PW / 2, 755, 40, { color: TK.C.sub, bold: false });
    timeAxis(g, 1010, 60);
    marker(g, 920, 60, 30, SOUND, '音 30', ka, true);
    if (t >= 9.6 && t < 15) TK.text(g, '（耳のすぐ奥の脳幹には数ミリ秒）', PW / 2, 220, 38, { color: TK.C.dim, bold: false });
    marker(g, 850, 60, 56, LIGHT, '光 56', kv);
    g.restore();
    if (t >= 15.4) TK.note(g, t, 15.4, 21, '音＝脳の中の電極、光＝頭の表面の波\n測り方のちがう2つの研究のくらべ', { size: 34 });
  }
  // 21〜28: はなれると、音が空気を進むぶん遅れる。約9 m でそろう
  if (t >= 21.0 && t < 28.0) {
    const f = fade(t, 21, 28, 0.3); g.save(); g.globalAlpha = f;
    const d = 8.9 * ease((t - 21.8) / 4.0), px = 75, x0 = 170, y0 = 540;
    // 人（小さな頭）と、音の出る所
    head(g, x0 - 10, y0 - 40, 0.45);
    const sx = x0 + 130 + d * px * 0.95;
    clap(g, sx, y0 - 40, 1, 0.5 + 0.5 * Math.abs(Math.sin(t * 5)));
    // ものさし
    g.strokeStyle = 'rgba(207,224,255,0.6)'; g.lineWidth = 4; g.beginPath(); g.moveTo(x0 + 80, y0 + 70); g.lineTo(x0 + 80 + 9 * px, y0 + 70); g.stroke();
    for (let m = 0; m <= 9; m += 3) { const x = x0 + 80 + m * px; g.beginPath(); g.moveTo(x, y0 + 58); g.lineTo(x, y0 + 82); g.stroke(); TK.text(g, m + 'm', x, y0 + 116, 34, { color: TK.C.dim, bold: false }); }
    TK.card(g, 150, 210, 780, 120, { r: 60 });
    TK.text(g, d > 8.85 ? '[約9 m] でそろう（推定）' : 'はなれる距離  ' + d.toFixed(1) + ' m', PW / 2, 270, 62);
    // 2本の棒（大脳が反応しはじめるまで）
    const sms = 30 + d / 343 * 1000;
    TK.text(g, '大脳が反応しはじめるまで（ミリ秒）', PW / 2, 755, 40, { color: TK.C.sub, bold: false });
    timeAxis(g, 1020, 60);
    marker(g, 870, 60, 56, LIGHT, '光 56', 1);
    marker(g, 930, 60, sms, SOUND, '音 ' + Math.round(sms), 1, true);
    g.restore();
  }
  // 28〜33: それより近いと、音が先
  if (t >= 28.0 && t < 33.0) {
    const f = fade(t, 28, 33, 0.3); g.save(); g.globalAlpha = f;
    TK.card(g, 110, 300, 860, 400);
    TK.lines(g, '9 m より近いと\n大脳の最初の反応は\n[音が先]', PW / 2, 500, 84);
    TK.text(g, '「先に聞こえる」わけではありません', PW / 2, 820, 44, { color: TK.C.sub, bold: false });
    g.restore();
  }
  if (t >= 33.0) TK.hook(g, t, 33.0, 35.0, '光より、\n[音]が先に\n脳に届く', { y: 640, size: 140 });
  if (t >= 21.0 && t < 28.0) TK.note(g, t, 21, 28, '音の速さ 343 m/s・2つの研究の値からの計算', { size: 32 });
  if (t >= 30.5) TK.note(g, t, 30.5, 35, '出どころ: Liégeois-Chauvel ほか (1994) EEG Clin Neurophysiol\nFoxe & Simpson (2002) Exp Brain Res', { size: 30 });
}

triviaStart({ out: 'brain-response-trivia1', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
