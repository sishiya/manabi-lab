<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく phage-1（型C この動画のあいだに）「この30秒で、海ではウイルスの感染が 3×10²⁴ 回」。台本は trivia/phage.md、直しは trivia/REVIEW.md
// 出どころ: Suttle (2007) Nature Reviews Microbiology 5, 801–812（海のウイルス 約10³⁰・1秒に約10²³回の感染。桁の見積もり）
// 人の数: 国連 世界人口推計 2024（約82億）→ 10²³ ÷ 8.2×10⁹ ≒ 1.2×10¹³（約12兆）
// 細菌・ウイルスの絵は形のイメージ。右上の時計はキットの TK.clock だと右はし 120px にかかるので、このページで少し左に描く
const DUR = 30;
const subs = [
  { a: 0.0, b: 2.0, ja: 'この動画を見ているあいだに、海で起きていること。', en: 'What happens in the ocean while you watch this.', noBurn: true },
  { a: 2.0, b: 7.0, ja: 'ウイルスが、[細菌にとりつく]。', en: 'Viruses latch onto bacteria.' },
  { a: 7.0, b: 12.0, ja: 'その回数、1秒に、\n[およそ10の23乗回]。', en: 'That happens about 10²³ times\nevery second.' },
  { a: 12.0, b: 18.0, ja: '世界の人ひとりあたり、\n1秒に[約12兆回]。', en: 'That’s about 12 trillion per person\non Earth, every second.' },
  { a: 18.0, b: 24.0, ja: '海のウイルスは、ぜんぶで[10の30乗]。\n海でいちばん多い「いのちのようなもの」。', en: 'There are about 10³⁰ viruses in the sea,\nthe most numerous life-like things there.' },
  { a: 24.0, b: 30.0, ja: 'この30秒で、およそ[3×10の24乗回]。\n…いまも。', en: 'In these 30 seconds: about 3×10²⁴.\n…And it’s still going.' },
];
const cues = [{ t: 0.05, type: 'pop' }, { t: 2.0, type: 'whoosh' }, { t: 4.4, type: 'pop' }, { t: 12.0, type: 'whoosh' }, { t: 14.0, type: 'ding' },
  { t: 18.0, type: 'rise' }, { t: 24.0, type: 'whoosh' }, { t: 28.0, type: 'ding' }];
for (let s = 7; s <= 11; s++) cues.push({ t: s, type: 'tick', v: 0.8 });

/// ---- 絵は「図鑑の版画」（trivia-plate.js の PL.*）----
// a×10^n を上つきで描く（中心 x。o.align で左よせ）。字は明朝、影なし
function sci(g, mant, exp, x, y, size, o = {}) {
  const base = (mant ? mant + '×' : '') + '10', ex = String(exp), pre = o.pre || '', post = o.post || '';
  const font = sz => (o.bold === false ? '' : 'bold ') + Math.round(sz) + 'px ' + PL.MIN;
  g.save(); g.font = font(size); const w1 = g.measureText(pre + base).width;
  g.font = font(size * 0.55); const w2 = g.measureText(ex).width;
  g.font = font(size * (o.postScale || 0.5)); const w3 = post ? g.measureText(post).width + size * 0.15 : 0;
  let cx = o.align === 'left' ? x : x - (w1 + w2 + w3) / 2;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = o.color || PL.RED; g.font = font(size); g.fillText(pre + base, cx, y); cx += w1;
  g.font = font(size * 0.55); g.fillText(ex, cx, y - size * 0.38); cx += w2 + size * 0.15;
  if (post) { g.fillStyle = o.postColor || PL.INK; g.font = font(size * (o.postScale || 0.5)); g.fillText(post, cx, y + size * 0.08); }
  g.restore();
}
// 今まで（t 秒）の回数: t × 10²³ を a.b×10^n に
function tally(t) {
  const v = Math.max(1e22, t * 1e23), n = Math.floor(Math.log10(v)), m = v / Math.pow(10, n);
  return [m.toFixed(1), n];
}
// 上の帯: 懐中時計・経った秒・回数（ずっと出す）
function header(g, t) {
  g.save(); g.globalAlpha *= clamp(t / 0.3, 0, 1);
  PL.ink(g, gg => { gg.moveTo(110, 285); gg.lineTo(970, 285); }, 3); PL.ink(g, gg => { gg.moveTo(110, 293); gg.lineTo(970, 293); }, 1.2);
  PL.watch(g, 280, 200, 52, (Math.min(t, 30) % 60) / 60);
  PL.label(g, Math.min(t, 30).toFixed(1) + ' 秒', 360, 205, 52, { align: 'left' });
  const [m, n] = tally(t);
  sci(g, m, n, 610, 210, 58, { post: '回', postScale: 0.75, align: 'left' });
  g.restore();
}
// 細菌（棒の形。二重の膜・中の粒・DNA のかたまり）。x, y が中心
function bacterium(g, x, y, s, ang = 0) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  const cap = (w, h) => gg => { gg.moveTo(-w + h, -h); gg.lineTo(w - h, -h); gg.arc(w - h, 0, h, -Math.PI / 2, Math.PI / 2); gg.lineTo(-w + h, h); gg.arc(-w + h, 0, h, Math.PI / 2, Math.PI * 1.5); gg.closePath(); };
  const out = cap(150, 60), inn = cap(140, 50);
  PL.tint(g, out, PL.T.leaf, 0.55);
  PL.hatch(g, out, { angle: 0.7, gap: 8, w: 1.4, not: cap(150, 60), cx: 0, cy: 0 });
  g.save(); g.beginPath(); out(g); g.clip(); PL.hatch(g, PL.rect(-170, 15, 340, 60), { angle: 0.7, gap: 8, w: 1.4, cx: 0, cy: 0 }); g.restore();
  PL.ink(g, gg => { for (let i = 0; i < 26; i++) { const px = -120 + ((i * 53) % 240), py = -36 + ((i * 37) % 72); gg.moveTo(px + 2.5, py); gg.arc(px, py, 2.5, 0, Math.PI * 2); } }, 2);   // リボソームの粒
  PL.ink(g, gg => { gg.moveTo(-60, 0); for (let i = 0; i <= 30; i++) gg.lineTo(-60 + i * 4, Math.sin(i * 1.3) * 14 + Math.sin(i * 0.4) * 6); }, 2.4, '#4a3f33');   // DNA のかたまり
  PL.ink(g, inn, 2); PL.ink(g, out, 6);
  g.restore();
}
// T4 ファージ（細長い20面体の頭・えり・縞のあるしっぽのさや・基盤・折れ曲がった長い尾繊維）。y は足先。legs: 0〜1 で開く
function phage(g, x, y, s, legs = 1, a = 1) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  const lw = 4 / Math.max(0.6, s) * Math.min(1, s * 1.2);
  const head = PL.poly([[0, -212], [40, -188], [40, -128], [0, -104], [-40, -128], [-40, -188]]);
  PL.tint(g, head, PL.T.sky, 0.7);
  PL.hatch(g, head, { angle: 0.7, gap: 7, w: 1.3, not: PL.poly([[-60, -230], [0, -230], [0, -90], [-60, -90]]), cx: 0, cy: 0 });
  PL.ink(g, gg => { gg.moveTo(-40, -188); gg.lineTo(0, -168); gg.lineTo(40, -188); gg.moveTo(0, -168); gg.lineTo(0, -128); gg.moveTo(-40, -128); gg.lineTo(0, -128); gg.lineTo(40, -128); gg.moveTo(0, -212); gg.lineTo(0, -168); }, lw * 0.5);
  PL.ink(g, head, lw);
  const collar = PL.rect(-15, -104, 30, 8), sheath = PL.rect(-12, -96, 24, 64), plate = PL.poly([[-28, -32], [28, -32], [22, -20], [-22, -20]]);
  [collar, sheath, plate].forEach(p => { PL.tint(g, p, PL.T.sand, 0.85); PL.ink(g, p, lw * 0.8); });
  PL.ink(g, gg => { for (let yy = -90; yy < -32; yy += 7) { gg.moveTo(-12, yy); gg.lineTo(12, yy); } }, lw * 0.4);   // さやの縞
  PL.ink(g, gg => {   // 長い尾繊維（ひざで折れる）。手前と奥に2本ずつ
    for (const sd of [-1, 1]) for (const k of [0.75, 1]) {
      const kx = sd * (30 + 52 * legs * k), ky = -62 + 34 * (1 - legs), fx = sd * (34 + 50 * legs * k), fy = 0;
      gg.moveTo(sd * 22, -26); gg.lineTo(kx, ky); gg.lineTo(fx, fy);
    }
    for (const sd of [-1, 1]) { gg.moveTo(sd * 12, -20); gg.lineTo(sd * 16, -6); }   // 短い釘
  }, lw * 0.8);
  g.restore();
}

function draw(g, t) {
  // 0〜2: フック
  if (t < 2.0) {
    TK.hook(g, t, 0.0, 2.0, 'この30秒で、海では\nウイルスの感染が\n[3じょ回]', { y: 640, size: 108 });
    if (t > 0.5) { g.save(); g.globalAlpha *= fade(t, 0.5, 2.0, 0.2); sci(g, '3', 24, PW / 2, 930, 84, { pre: '（', post: '）', postScale: 1, postColor: PL.RED }); g.restore(); }
  }
  // 2〜7: 海の中で、細菌にファージがとりつく
  if (t >= 2.0 && t < 7.0) {
    const f = fade(t, 2.0, 7.0, 0.3);
    g.save(); g.globalAlpha *= f;
    for (let i = 0; i < 6; i++) { const aa = i * 0.9 + t * 0.2; phage(g, 120 + (i * 157) % 760, 520 + (i * 97) % 240 + Math.sin(aa) * 20, 0.4, 1, 0.55); }
    bacterium(g, 470, 900, 1.6, Math.sin(t * 0.5) * 0.04);
    const k = TK.out((t - 2.4) / 2.0), y = lerp(600, 806, k);
    phage(g, 470 + Math.sin(t * 2) * 30 * (1 - k), y, 1.4, clamp((t - 4.2) / 0.4, 0, 1));
    PL.leader(g, 760, 920, 860, 1040); PL.label(g, '細菌', 870, 1075, 46);
    PL.leader(g, 530, y - 230, 720, 390); PL.label(g, 'ウイルス（ファージ）', 1000, 360, 44, { align: 'right' });
    g.restore();
  }
  // 7〜12: 1秒に 10²³ 回
  if (t >= 7.0 && t < 12.0) {
    const f = fade(t, 7.0, 12.0, 0.3);
    g.save(); g.globalAlpha *= f;
    PL.label(g, '1秒あたり', 110, 440, 60, { align: 'left' });
    const k = clamp(TK.pop(t, 7.2, 0.4), 0, 1.2);
    g.save(); g.translate(110, 640); g.scale(k, k); sci(g, '', 23, 0, 0, 220, { post: '回', postScale: 0.4, align: 'left' }); g.restore();
    PL.label(g, 'およそ（桁の見積もり）', 110, 860, 46, { align: 'left', bold: false });
    bacterium(g, 860, 700, 0.55, -0.5); phage(g, 820, 650, 0.5, 1);   // とりつく1回
    PL.ink(g, gg => { gg.moveTo(110, 900); gg.lineTo(700, 900); }, 3);
    g.restore();
    TK.note(g, t, 7.4, 12.0, '多くは、細菌やラン藻にとりつくウイルス', { size: 32 });
  }
  // 12〜18: 人ひとりあたり
  if (t >= 12.0 && t < 18.0) {
    const f = fade(t, 12.0, 18.0, 0.3);
    g.save(); g.globalAlpha *= f;
    sci(g, '', 23, PW / 2, 420, 100, { post: '回／秒', postScale: 0.45, color: PL.INK });
    PL.label(g, '÷  82億人', PW / 2, 560, 84);
    PL.ink(g, gg => { gg.moveTo(240, 650); gg.lineTo(840, 650); }, 5);
    if (t > 14.0) {
      g.globalAlpha = f * clamp(TK.pop(t, 14.0, 0.4), 0, 1);
      PL.label(g, '1人 1秒に', PW / 2, 735, 56);
      PL.label(g, '約[12兆]回', PW / 2, 860, 124);
    }
    g.globalAlpha = f * 0.85;
    for (let i = 0; i < 9; i++) PL.walker(g, 160 + i * 95, 1150, 0, i * 0.7, 0.32);   // 人の列（かざり）
    g.restore();
    TK.note(g, t, 12.4, 18.0, '人の数: 国連 世界人口推計 2024', { size: 32 });
  }
  // 18〜24: 海のウイルス 10³⁰（点がだんだんふえる。1つずつは小さなファージの点）
  if (t >= 18.0 && t < 24.0) {
    const f = fade(t, 18.0, 24.0, 0.3);
    g.save(); g.globalAlpha *= f;
    const n = Math.floor(Math.min(1400, 10 * Math.pow(10, (t - 18.2) / 1.2)));
    PL.ink(g, gg => { for (let i = 0; i < n; i++) { const x = 100 + ((i * 7919) % 881), y = 330 + ((i * 104729) % 760) * 0.95; gg.moveTo(x, y); gg.lineTo(x + 3, y - 5); } }, 2.4, '#2f5f7a');
    TK.card(g, 150, 540, 780, 280);
    PL.label(g, '海のウイルス ぜんぶで', PW / 2, 610, 54);
    sci(g, '', 30, PW / 2, 735, 140, { pre: 'およそ ' });
    g.restore();
  }
  // 24〜30: 30秒で 3×10²⁴
  if (t >= 24.0) {
    const f = fade(t, 24.0, 31, 0.3);
    g.save(); g.globalAlpha *= f;
    PL.label(g, 'この動画のあいだに', 110, 440, 58, { align: 'left' });
    const [m, n] = tally(Math.min(t, 30));
    sci(g, m, n, 110, 620, 160, { post: '回', postScale: 0.4, align: 'left' });
    if (t > 28.6) PL.label(g, '…いまも', 110, 800, 64, { align: 'left' });
    // 海の波（下の方に、小さなファージがただよう）
    const sea = PL.poly([[30, 900], ...Array.from({ length: 21 }, (_, i) => [30 + i * 51, 900 + Math.sin(i * 1.2 + t * 2) * 10]), [1050, 900], [1050, 1060], [30, 1060]]);
    PL.tint(g, sea, PL.T.sea, 0.45); PL.hatch(g, sea, { angle: 0, gap: 12, w: 1.4, color: 'rgba(47,95,122,0.6)' });
    PL.ink(g, gg => { gg.moveTo(30, 900); for (let i = 0; i <= 20; i++) gg.lineTo(30 + i * 51, 900 + Math.sin(i * 1.2 + t * 2) * 10); }, 4);
    for (let i = 0; i < 5; i++) phage(g, 150 + i * 190, 1020 + Math.sin(t * 1.5 + i) * 10, 0.3, 1);
    g.restore();
  }
  header(g, t);
  if (t >= 28.0) TK.note(g, t, 28.0, 30.0, '出どころ: Suttle (2007) Nature Reviews Microbiology 5, 801–812\n人の数: 国連 世界人口推計 2024', { size: 30, y: 1130 });   // 2行の注は帯の上に
}

triviaStart({ out: 'phage-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
