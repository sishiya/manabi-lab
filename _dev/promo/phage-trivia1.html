<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく phage-1（型C この動画のあいだに）「この30秒で、海ではウイルスの感染が 3×10²⁴ 回」。台本は trivia/phage.md、直しは trivia/REVIEW.md
// 出どころ: Suttle (2007) Nature Reviews Microbiology 5, 801–812（海のウイルス 約10³⁰・1秒に約10²³回の感染。桁の見積もり）
// 人の数: 国連 世界人口推計 2024（約82億）→ 10²³ ÷ 8.2×10⁹ ≒ 1.2×10¹³（約12兆）
// 細菌・ウイルスの絵は形のイメージ。右上の時計はキットの TK.clock だと右はし 120px にかかるので、このページで少し左に描く
const DUR = 30;
const subs = [
  { a: 0.0, b: 2.0, ja: 'この動画を見ているあいだに、海で起きていること。', en: 'What happens in the ocean while you watch this.', noBurn: true },
  { a: 2.0, b: 7.0, ja: 'ウイルスが、[細菌にとりつく]。', en: 'Viruses latch onto bacteria.' },
  { a: 7.0, b: 12.0, ja: 'その回数、1秒に、\n[およそ10の23乗回]。', en: 'That happens about 10²³ times\nevery second.' },
  { a: 12.0, b: 18.0, ja: '世界の人ひとりあたり、\n1秒に[約12兆回]。', en: 'That’s about 12 trillion per person\non Earth, every second.' },
  { a: 18.0, b: 24.0, ja: '海のウイルスは、ぜんぶで[10の30乗]。\n海でいちばん多い「いのちのようなもの」。', en: 'There are about 10³⁰ viruses in the sea,\nthe most numerous life-like things there.' },
  { a: 24.0, b: 30.0, ja: 'この30秒で、およそ[3×10の24乗回]。\n…いまも。', en: 'In these 30 seconds: about 3×10²⁴.\n…And it’s still going.' },
];
const cues = [{ t: 0.05, type: 'pop' }, { t: 2.0, type: 'whoosh' }, { t: 4.4, type: 'pop' }, { t: 12.0, type: 'whoosh' }, { t: 14.0, type: 'ding' },
  { t: 18.0, type: 'rise' }, { t: 24.0, type: 'whoosh' }, { t: 28.0, type: 'ding' }];
for (let s = 7; s <= 11; s++) cues.push({ t: s, type: 'tick', v: 0.8 });

// a×10^n を上つきで描く（中心 x）。pre・post は前後の文字
function sci(g, mant, exp, x, y, size, o = {}) {
  const base = (mant ? mant + '×' : '') + '10', ex = String(exp), pre = o.pre || '', post = o.post || '';
  setFont(g, size, true); const w1 = g.measureText(pre + base).width;
  setFont(g, size * 0.55, true); const w2 = g.measureText(ex).width;
  setFont(g, size * (o.postScale || 0.5), true); const w3 = post ? g.measureText(post).width + size * 0.15 : 0;
  let cx = x - (w1 + w2 + w3) / 2;
  g.save(); g.textAlign = 'left'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 12 * RES;
  g.fillStyle = o.color || TK.C.acc; setFont(g, size, true); g.fillText(pre + base, cx, y); cx += w1;
  setFont(g, size * 0.55, true); g.fillText(ex, cx, y - size * 0.38); cx += w2 + size * 0.15;
  if (post) { g.fillStyle = o.postColor || TK.C.sub; setFont(g, size * (o.postScale || 0.5), true); g.fillText(post, cx, y + size * 0.08); }
  g.restore();
}
// 今まで（t 秒）の回数: t × 10²³ を a.b×10^n に
function tally(t) {
  const v = Math.max(1e22, t * 1e23), n = Math.floor(Math.log10(v)), m = v / Math.pow(10, n);
  return [m.toFixed(1), n];
}
// 右上の時計＋回数（ずっと出す）
function header(g, t) {
  g.save(); g.globalAlpha = clamp(t / 0.3, 0, 1);
  TK.card(g, 120, 150, 800, 120, { r: 60 });
  g.fillStyle = TK.C.red; g.beginPath(); g.arc(180, 210, 14 * (0.7 + 0.3 * Math.abs(Math.sin(t * 3))), 0, 7); g.fill();
  TK.text(g, Math.min(t, 30).toFixed(1) + ' 秒', 300, 212, 56, { align: 'center' });
  const [m, n] = tally(t);
  sci(g, m, n, 650, 214, 60, { post: '回', postScale: 0.75, color: TK.C.acc });
  g.restore();
}
// 細菌（カプセル形）
function bacterium(g, x, y, s, ang = 0) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.fillStyle = 'rgba(89,227,154,0.18)'; g.strokeStyle = TK.C.green; g.lineWidth = 6;
  g.beginPath(); g.roundRect(-150, -60, 300, 120, 60); g.fill(); g.stroke();
  g.restore();
}
// ファージ（頭＝六角形、しっぽ、足）。y は足先。legs: 0〜1 で開く
function phage(g, x, y, s, legs = 1, c = '#5fd4ff') {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = c; g.lineWidth = 5; g.lineJoin = 'round'; g.lineCap = 'round';
  g.fillStyle = 'rgba(95,212,255,0.15)';
  g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g.lineTo(Math.cos(a) * 40, -150 + Math.sin(a) * 46); } g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(0, -104); g.lineTo(0, -30); g.stroke();
  g.strokeRect(-12, -30, 24, 12);
  for (const sd of [-1, 1]) for (const k of [0.5, 1]) { g.beginPath(); g.moveTo(sd * 10, -20); g.lineTo(sd * (20 + 30 * k * legs), -10); g.lineTo(sd * (24 + 36 * k * legs), 0); g.stroke(); }
  g.restore();
}

function draw(g, t) {
  // 0〜2: フック
  if (t < 2.0) {
    TK.hook(g, t, 0.0, 2.0, 'この30秒で、海では\nウイルスの感染が\n[3じょ回]', { y: 640, size: 108 });
    if (t > 0.5) { g.save(); g.globalAlpha = fade(t, 0.5, 2.0, 0.2); sci(g, '3', 24, PW / 2, 930, 84, { pre: '（', post: '）', postScale: 1, postColor: TK.C.acc }); g.restore(); }
  }
  // 2〜7: 海の中で、細菌にファージがとりつく
  if (t >= 2.0 && t < 7.0) {
    const f = fade(t, 2.0, 7.0, 0.3);
    g.save(); g.globalAlpha = f;
    bacterium(g, PW / 2, 820, 1.6, Math.sin(t * 0.5) * 0.04);
    const k = TK.out((t - 2.4) / 2.0), y = lerp(380, 724, k);
    phage(g, PW / 2 + Math.sin(t * 2) * 30 * (1 - k), y, 1.6, clamp((t - 4.2) / 0.4, 0, 1));
    // まわりの小さなファージ
    for (let i = 0; i < 7; i++) { const a = i * 0.9 + t * 0.2; phage(g, 140 + (i * 157) % 780, 420 + (i * 97) % 300 + Math.sin(a) * 20, 0.45, 1, 'rgba(95,212,255,0.5)'); }
    TK.text(g, '細菌', PW / 2 + 260, 990, 46, { color: TK.C.green });
    TK.text(g, 'ウイルス（ファージ）', 300, 360, 44, { color: TK.C.acc2 });
    g.restore();
  }
  // 7〜12: 1秒に 10²³ 回
  if (t >= 7.0 && t < 12.0) {
    const f = fade(t, 7.0, 12.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, '1秒あたり', PW / 2, 480, 60, { color: TK.C.sub });
    const k = TK.pop(t, 7.2, 0.4);
    g.translate(PW / 2, 660); g.scale(k, k); g.translate(-PW / 2, -660);
    sci(g, '', 23, PW / 2, 660, 220, { post: '回', postScale: 0.4 });
    g.restore();
    g.save(); g.globalAlpha = f; TK.text(g, 'およそ（桁の見積もり）', PW / 2, 880, 50, { color: TK.C.sub }); g.restore();
    TK.note(g, t, 7.4, 12.0, '多くは、細菌やラン藻にとりつくウイルス', { size: 32 });
  }
  // 12〜18: 人ひとりあたり
  if (t >= 12.0 && t < 18.0) {
    const f = fade(t, 12.0, 18.0, 0.3);
    g.save(); g.globalAlpha = f;
    sci(g, '', 23, PW / 2, 430, 100, { post: '回／秒', postScale: 0.45 });
    TK.text(g, '÷  82億人', PW / 2, 580, 90, { color: '#fff' });
    stroke(g); g.beginPath(); g.moveTo(240, 680); g.lineTo(840, 680); g.stroke();
    if (t > 14.0) {
      g.globalAlpha = f * TK.pop(t, 14.0, 0.4);
      TK.text(g, '1人 1秒に', PW / 2, 770, 60, { color: TK.C.sub });
      TK.text(g, '約[12兆]回', PW / 2, 900, 130);
    }
    // 人の列（かざり）
    g.globalAlpha = f * 0.5;
    for (let i = 0; i < 9; i++) { const x = 180 + i * 90; g.fillStyle = '#cfe0ff'; g.beginPath(); g.arc(x, 1010, 12, 0, 7); g.fill(); g.fillRect(x - 10, 1026, 20, 34); }
    g.restore();
    TK.note(g, t, 12.4, 18.0, '人の数: 国連 世界人口推計 2024', { size: 32 });
  }
  // 18〜24: 海のウイルス 10³⁰
  if (t >= 18.0 && t < 24.0) {
    const f = fade(t, 18.0, 24.0, 0.3);
    g.save(); g.globalAlpha = f;
    // 点がだんだんふえる（10倍ずつ）
    const n = Math.floor(Math.min(1400, 10 * Math.pow(10, (t - 18.2) / 1.2)));
    g.fillStyle = 'rgba(95,212,255,0.55)';
    for (let i = 0; i < n; i++) { const x = 100 + ((i * 7919) % 881), y = 330 + ((i * 104729) % 760) * 0.95; g.fillRect(x, y, 5, 5); }
    TK.card(g, 150, 520, 780, 300, { r: 40, fill: 'rgba(11,20,48,0.85)' });
    TK.text(g, '海のウイルス ぜんぶで', PW / 2, 590, 54, { color: TK.C.sub });
    sci(g, '', 30, PW / 2, 720, 150, { pre: 'およそ ', post: '', color: TK.C.acc });
    g.restore();
  }
  // 24〜30: 30秒で 3×10²⁴
  if (t >= 24.0) {
    const f = fade(t, 24.0, 31, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, 'この動画のあいだに', PW / 2, 480, 60, { color: TK.C.sub });
    const [m, n] = tally(Math.min(t, 30));
    sci(g, m, n, PW / 2, 680, 170, { post: '回', postScale: 0.4 });
    if (t > 28.6) TK.text(g, '…いまも', PW / 2, 900, 64, { color: '#fff' });
    g.restore();
  }
  header(g, t);
  if (t >= 28.0) TK.note(g, t, 28.0, 30.0, '出どころ: Suttle (2007) Nature Reviews Microbiology 5, 801–812\n人の数: 国連 世界人口推計 2024', { size: 30 });
}
function stroke(g) { g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 6; g.lineCap = 'round'; }

triviaStart({ out: 'phage-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
