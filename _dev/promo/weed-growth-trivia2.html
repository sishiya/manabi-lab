<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく weed-growth-2（型G ループ）「1879年に埋めたタネが、2021年に芽を出した」。台本は trivia/weed-growth.md。?short で録る
// 数字は MSU Beal Botanical Garden「Beal Seed Experiment」: 1879年秋、20本のびん、2021年に16本目、Verbascum が20粒発芽、次は2040年。
// 途中の掘った年は出さない（台本にないので）。最後の字幕が最初の「1879年」につながるループ
const DUR = 18;
const subs = [
  { a: 0.0, b: 1.4, ja: '1879年', en: '1879', noBurn: true },
  { a: 1.4, b: 4.0, ja: '1879年、アメリカの大学で\n雑草のタネを[びん]に入れて埋めた', en: 'In 1879, a US university buried weed seeds in bottles' },
  { a: 4.0, b: 8.0, ja: '[20本]。何十年かごとに1本ずつ掘って\n芽が出るか試す', en: 'Twenty bottles. Every few decades, one is dug up\nto see if anything sprouts' },
  { a: 8.0, b: 13.0, ja: '2021年、[142年目]のびん。\nモウズイカのなかまが、芽を出した', en: 'In 2021, after 142 years,\nmullein seeds sprouted' },
  { a: 13.0, b: 16.6, ja: '次に掘るのは[2040年]。\nいまも土の下で待っている', en: 'The next dig is in 2040.\nThe rest are still waiting underground' },
  { a: 16.6, b: 18.0, ja: '1879年に埋めたタネが…', en: 'Seeds buried in 1879…' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.6, type: 'thud' }, { t: 4.0, type: 'whoosh' },
  ...Array.from({ length: 15 }, (_, i) => ({ t: 4.6 + i * 0.22, type: 'tick' })),
  { t: 8.0, type: 'rise' }, { t: 9.4, type: 'ding' }, { t: 13.0, type: 'pop' }, { t: 16.6, type: 'whoosh' },
];
const GY = 560;   // 地面の高さ
const SOIL = '#6b4a2c';
// びんの位置（5×4。地面の下）
const BOT = Array.from({ length: 20 }, (_, i) => [210 + (i % 5) * 165, GY + 105 + Math.floor(i / 5) * 92]);
// 口を下にしたびん
function bottle(g, x, y, s = 1, glow = 0, seeds = true) {
  g.save(); g.translate(x, y); g.scale(s, s);
  if (glow > 0) { g.shadowColor = TK.C.acc; g.shadowBlur = 40 * glow * RES; }
  g.fillStyle = 'rgba(190,230,255,0.22)'; g.strokeStyle = glow > 0 ? TK.C.acc : '#cfe0ff'; g.lineWidth = 5;
  g.beginPath(); g.roundRect(-34, -50, 68, 74, 12); g.moveTo(-14, 24); g.lineTo(-14, 46); g.lineTo(14, 46); g.lineTo(14, 24); g.fill(); g.stroke();
  g.shadowBlur = 0;
  g.fillStyle = '#d8c49a'; g.fillRect(-28, -20, 56, 40);   // 砂
  if (seeds) { g.fillStyle = '#3b2a12'; for (let j = 0; j < 9; j++) { g.beginPath(); g.ellipse(-20 + (j % 3) * 20, -10 + Math.floor(j / 3) * 12, 4, 3, 0.5, 0, Math.PI * 2); g.fill(); } }
  g.restore();
}
function ground(g) {
  g.fillStyle = SOIL; g.fillRect(0, GY, PW, 1100 - GY);
  g.fillStyle = 'rgba(0,0,0,0.18)'; for (let i = 0; i < 120; i++) { const x = (i * 97) % PW, y = GY + 20 + (i * 53) % 500; g.fillRect(x, y, 8, 5); }
  g.fillStyle = '#59e39a'; g.fillRect(0, GY - 10, PW, 12);
  // 下の端をぼかす（字幕の上で消える）
  const gr = g.createLinearGradient(0, 960, 0, 1110); gr.addColorStop(0, 'rgba(11,20,48,0)'); gr.addColorStop(1, 'rgba(11,20,48,1)');
  g.fillStyle = gr; g.fillRect(0, 960, PW, 150);
}
function yearCard(g, y, s, acc) {
  TK.card(g, 290, 150, 500, 150, { r: 40 });
  TK.text(g, s, PW / 2, 228, 96, { color: acc ? TK.C.acc : '#fff' });
}
function sprout(g, x, y, k) {
  g.save(); g.strokeStyle = TK.C.green; g.fillStyle = TK.C.green; g.lineWidth = 8; g.lineCap = 'round';
  const h = 120 * k; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - h); g.stroke();
  if (k > 0.4) { const l = (k - 0.4) / 0.6 * 50; g.beginPath(); g.ellipse(x - l * 0.7, y - h + 8, l * 0.8, l * 0.35, -0.5, 0, Math.PI * 2); g.ellipse(x + l * 0.7, y - h + 8, l * 0.8, l * 0.35, 0.5, 0, Math.PI * 2); g.fill(); }
  g.restore();
}

function draw(g, t) {
  // 0〜4: びんを埋める
  if (t < 4.0) {
    ground(g);
    const k = ease((t - 1.5) / 1.2), x = PW / 2, y = lerp(GY - 120, GY + 200, k);
    bottle(g, x, y, 1.8);
    if (t < 1.4) TK.hook(g, t, 0, 1.4, '[1879]年', { y: 250, size: 170 });
    else { yearCard(g, 0, '1879年', false); TK.text(g, 'タネ＋湿った砂、口を下に', PW / 2, 360, 46, { color: TK.C.sub }); }
  }
  // 4〜8: 20本。1本ずつ掘る
  if (t >= 4.0 && t < 8.0) {
    ground(g);
    const dug = Math.floor(clamp((t - 4.6) / 0.22 + 1, 0, 15));
    BOT.forEach(([x, y], i) => { if (i >= dug) bottle(g, x, y, 0.82 * TK.pop(t, 4.0 + i * 0.03, 0.3)); });
    const yr = Math.round(lerp(1879, 2021, clamp((t - 4.6) / 3.4, 0, 1)));
    yearCard(g, 0, yr + '年', false);
    TK.text(g, '残り ' + (20 - dug) + ' 本', PW / 2, 360, 52, { color: TK.C.sub });
  }
  // 8〜13: 2021年のびん（16本目）から芽
  if (t >= 8.0 && t < 13.0) {
    ground(g);
    BOT.forEach(([x, y], i) => { if (i >= 16) bottle(g, x, y, 0.82); });
    const k = ease((t - 8.0) / 0.9), x = BOT[15][0], y = lerp(BOT[15][1], GY - 75, k);
    bottle(g, lerp(x, PW / 2, k), y, lerp(0.82, 1.6, k), k);
    const sk = clamp((t - 9.2) / 1.5, 0, 1);
    if (sk > 0) sprout(g, PW / 2 + 160, GY - 12, sk);
    yearCard(g, 0, '2021年', true);
    TK.text(g, '[142年目]・16本目のびん', PW / 2, 360, 56);
    if (t > 10.2) { g.save(); g.globalAlpha = fade(t, 10.2, 13, 0.3); TK.text(g, 'モウズイカのなかま（Verbascum）20粒が芽を出した', PW / 2, 1050, 38, { color: TK.C.sub, bold: false }); g.restore(); }
  }
  // 13〜18: 残り4本。次は2040年 → 1879年へ戻る
  if (t >= 13.0) {
    ground(g);
    const gl = 0.5 + 0.5 * Math.sin(t * 4);
    BOT.forEach(([x, y], i) => { if (i >= 16) bottle(g, PW / 2 + (i - 17.5) * 220, GY + 220, 1.5, gl); });
    yearCard(g, 0, t < 16.6 ? '次は 2040年' : '1879年', t < 16.6);
    TK.text(g, '残り [4] 本', PW / 2, 360, 56);
  }
  if (t >= 8 && t < 16.6) TK.note(g, t, 8, 16.6, '芽を出したのはモウズイカのなかま。エノコログサではありません', { size: 32 });
  if (t >= 16.0 && t < 18.0) TK.note(g, t, 16.0, 18.0, '出どころ: Michigan State Univ. W. J. Beal Botanical Garden「Beal Seed Experiment」', { size: 28 });
}

triviaStart({ out: 'weed-growth-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
