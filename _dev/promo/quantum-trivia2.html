<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく quantum-2（型H 当ててみて）「光をさえぎる板を1枚ふやすと明るくなる」。台本は trivia/quantum.md。?short で録る
// 理想の偏光板。ふつうの光 → 0° で 50%、→ 45° で ×cos²45°=25%、→ 90° で ×cos²45°=12.5%。45° がなければ 50%×cos²90°=0%
// 光は上から下へ。板は正面から見た丸（線の向き＝通す向き）
const DUR = 22;
const X = 470, YS = [420, 650, 880], PR = 95;   // 板の位置と半径
const subs = [
  { a: 0.0, b: 3.0, ja: '偏光板を直角に2枚。光は[0%]', en: 'Two polarizers at right angles. 0% of the light gets through', noBurn: true },
  { a: 3.0, b: 6.0, ja: 'あいだに、ななめの[3枚目]を入れると？', en: 'Now slip a third one, at 45°, in between...' },
  { a: 6.0, b: 9.4, ja: 'A 0%のまま　B もっと暗い　C 明るくなる', en: 'A: still 0%   B: even darker   C: brighter' },
  { a: 9.4, b: 14.0, ja: '答えは [C]\n光の[8分の1]が通ります', en: 'The answer is C.\nOne eighth of the light gets through' },
  { a: 14.0, b: 20.0, ja: '板は光を"止める"だけでなく、通った光の向きを\nその板の向きに"[そろえ直す]"から', en: 'A filter doesn’t just block light.\nIt re-aligns what passes through to its own angle' },
  { a: 20.0, b: 22.0, ja: 'さえぎるものを、[ふやした]のに', en: 'Even though we added another blocker' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 6.0, type: 'pop' }, { t: 6.6, type: 'tick' }, { t: 7.6, type: 'tick' }, { t: 8.6, type: 'tick' },
  { t: 9.4, type: 'ding' }, { t: 10.2, type: 'rise' }, { t: 14.0, type: 'pop' }, { t: 15.5, type: 'pop' }, { t: 17.0, type: 'pop' }, { t: 20.0, type: 'ding' },
];

// 偏光板（正面から見た丸）。金のわく・灰色の膜・通す向きの細い線・わくの目じるし。線の向き＝通す向き
function plate(g, x, y, deg, f = 1) {
  g.save(); g.globalAlpha *= f;
  const r = deg * Math.PI / 180;
  const tab = PL.poly([[x + PR + 8, y - 16], [x + PR + 44, y - 12], [x + PR + 44, y + 12], [x + PR + 8, y + 16]]);   // つまみ
  PL.tint(g, tab, PL.T.wood, 0.8); PL.ink(g, tab, 3);
  const rim = gg => { gg.moveTo(x + PR + 16, y); gg.arc(x, y, PR + 16, 0, Math.PI * 2); gg.moveTo(x + PR, y); gg.arc(x, y, PR, 0, Math.PI * 2, true); };
  PL.tint(g, rim, PL.T.gold, 0.7); PL.hatch(g, rim, { angle: 0.7, gap: 6, w: 1.4, not: PL.circle(x - 8, y - 8, PR + 16) });
  const film = PL.circle(x, y, PR);
  PL.tint(g, film, PL.T.gray, 0.35);
  g.save(); g.beginPath(); film(g); g.clip();
  PL.ink(g, gg => { for (let d = -PR; d <= PR; d += 16) { gg.moveTo(x + Math.cos(r) * d - Math.sin(r) * PR, y + Math.sin(r) * d + Math.cos(r) * PR); gg.lineTo(x + Math.cos(r) * d + Math.sin(r) * PR, y + Math.sin(r) * d - Math.cos(r) * PR); } }, 1.6, 'rgba(35,28,21,0.55)');
  g.restore();
  PL.ink(g, PL.circle(x, y, PR + 16), 5); PL.ink(g, film, 2.4);
  PL.ink(g, gg => { gg.moveTo(x + Math.sin(r) * (PR + 2), y - Math.cos(r) * (PR + 2)); gg.lineTo(x + Math.sin(r) * (PR + 24), y - Math.cos(r) * (PR + 24)); }, 6, PL.RED);   // 目じるし（通す向き）
  g.globalAlpha *= clamp((x - 300) / 100, 0, 1);   // すべりこむあいだは目もりの字を出さない（画面の外にはみ出さない）
  if (x > 300) PL.label(g, deg + '°', x - PR - 46, y, 46, { align: 'right', color: TK.C.sub });
  g.restore();
}
// 光の帯（上から下）。a: 明るさ 0〜1、pol: 向き（度。null はばらばら）
function beam(g, y0, y1, a, pol, t) {
  if (a <= 0.001) return;
  const b = PL.rect(X - 34, y0, 68, y1 - y0);
  PL.tint(g, b, PL.T.gold, 0.15 + 0.75 * Math.sqrt(a));
  PL.ink(g, gg => { gg.moveTo(X - 34, y0); gg.lineTo(X - 34, y1); gg.moveTo(X + 34, y0); gg.lineTo(X + 34, y1); }, 1.6, 'rgba(35,28,21,0.45)');
  const ym = (y0 + y1) / 2, L = 40, ax = X + 110;
  const arrow = deg => {   // ふるえる向き（両はしに矢じり）
    const r = deg * Math.PI / 180, dx = Math.sin(r) * L, dy = -Math.cos(r) * L, hx = Math.sin(r), hy = -Math.cos(r), nx = -hy, ny = hx;
    PL.ink(g, gg => { gg.moveTo(ax - dx, ym - dy); gg.lineTo(ax + dx, ym + dy);
      [[1, ax + dx, ym + dy], [-1, ax - dx, ym - dy]].forEach(([s, ex, ey]) => { gg.moveTo(ex - s * hx * 14 + nx * 9, ey - s * hy * 14 + ny * 9); gg.lineTo(ex, ey); gg.lineTo(ex - s * hx * 14 - nx * 9, ey - s * hy * 14 - ny * 9); }); }, 4, PL.INK);
  };
  g.save(); g.globalAlpha *= 0.4 + 0.6 * Math.sqrt(a);
  if (pol === null) [0, 45, 90, 135].forEach(arrow); else arrow(pol);
  g.restore();
}
function lamp(g) {   // 上の光の出口（筒）
  const c = PL.rect(X - 60, 205, 120, 30);
  PL.tint(g, c, PL.T.brown, 0.8); PL.hatch(g, c, { angle: 0.4, gap: 7, w: 1.6 }); PL.ink(g, c, 4);
}
function screen(g, a) {   // 下の白い紙（とどいた光の明るさ）
  const s = PL.rect(X - 120, 1086, 240, 26);
  PL.tint(g, s, PL.PAPER, 1); if (a > 0) PL.tint(g, PL.ellipse(X, 1099, 40, 11), PL.T.gold, 0.2 + 0.8 * Math.sqrt(a));
  PL.ink(g, s, 4);
}
const pctText = v => (v === 12.5 ? '12.5' : String(Math.round(v))) + '%';

function draw(g, t) {
  const inK = t < 9.4 ? (t < 3.0 ? 0 : 0.55 * ease((t - 3.0) / 1.6)) : lerp(0.55, 1, ease((t - 9.4) / 0.8));   // 3枚目の入り具合（1 で光の通り道に）
  const third = inK >= 0.999;
  const showPlates = !(t >= 6.0 && t < 9.4);
  if (showPlates) {
    const f = t < 6.0 ? 1 : fade(t, 9.4, 30, 0.3);
    g.save(); g.globalAlpha = f;
    const ys = [235, YS[0] - PR, YS[0] + PR, YS[1] - PR, YS[1] + PR, YS[2] - PR, YS[2] + PR, 1086];
    lamp(g);
    beam(g, ys[0], ys[1], 1, null, t);
    if (third) { beam(g, ys[2], ys[3], 0.5, 0, t); beam(g, ys[4], ys[5], 0.25, 45, t); }
    else beam(g, ys[2], ys[5], 0.5, 0, t);   // 1枚目のあと、90° の板まで
    const out = third ? 0.125 * ease((t - 10.2) / 0.6) : 0;
    beam(g, ys[6], ys[7], out, 90, t);
    screen(g, out);
    plate(g, X, YS[0], 0);
    if (inK > 0) plate(g, lerp(-200, X, inK), YS[1], 45);
    plate(g, X, YS[2], 90);
    const pv = third ? 12.5 * ease((t - 10.2) / 0.6) : 0;
    PL.label(g, pv >= 12.4 ? '12.5%' : pv.toFixed(1).replace('.0', '') + '%', X + 300, 1040, 80, { color: PL.RED });
    g.restore();
    // 14〜20: 板ごとの割合
    if (t >= 14.0 && t < 20.0) {
      const items = [[(ys[2] + ys[3]) / 2, '50%', 14.0], [(ys[4] + ys[5]) / 2, '25%', 15.5]];
      items.forEach(([y, s, a]) => { if (t > a) { g.save(); g.globalAlpha = fade(t, a, 20, 0.3); PL.label(g, s, X + 300, y, 62, { color: PL.RED }); g.restore(); } });
      TK.note(g, t, 14.0, 20.0, '光の粒1個ずつでも、同じ割合で通る（どれが通るかは確率）', { size: 30 });
    }
  }
  // 0〜3: フック
  if (t < 3.0) TK.hook(g, t, 0.0, 3.0, '2枚で[真っ暗]', { y: 140, size: 96 });
  if (t >= 3.0 && t < 6.0) { g.save(); g.globalAlpha = fade(t, 3.0, 6.0, 0.3); PL.label(g, 'あいだに [もう1枚] 足すと？', PW / 2, 150, 70); g.restore(); }
  // 6〜9.4: 3択
  TK.choices(g, t, 6.0, 9.4, ['0%のまま', 'もっと暗い', '明るくなる'], { y: 520, h: 170, think: [6.4, 9.4] });
  if (t >= 9.4 && t < 14.0) { g.save(); g.globalAlpha = fade(t, 9.4, 14.0, 0.3); PL.label(g, '答えは [C] 明るくなる', PW / 2, 150, 72); g.restore(); }
  if (t >= 14.0 && t < 20.0) { g.save(); g.globalAlpha = fade(t, 14.0, 20.0, 0.3); PL.label(g, '通るたびに、向きが[45°]回る', PW / 2, 150, 68); g.restore(); }
  if (t >= 20.0) {
    g.save(); g.globalAlpha = fade(t, 20.0, 23, 0.3); PL.label(g, 'ふやすと、[明るくなる]', PW / 2, 150, 80); g.restore();
    TK.note(g, t, 20.4, 22.0, '理想の板での値（本物の板は少し吸う）\n出どころ: HyperPhysics「Crossed Polarizers」・マリュスの法則（Hecht『Optics』）', { size: 28, y: 1155 });
  }
}

triviaStart({ out: 'quantum-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
