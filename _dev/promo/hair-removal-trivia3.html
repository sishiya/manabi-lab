<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>

<script>
'use strict';
// うんちく hair-3（型H 当ててみて）「毛を剃ると、濃くなる？」。台本は trivia/hair-removal.md。?short で録る
// 出どころ: Lynfield & MacWilliams (1970) J Invest Dermatol 55:170（5人の男性、片足だけ毎週・数か月、重さ・太さ・伸びる速さに差なし。要旨の引用で確認）。
// 「切り口が平らで濃く見える」は見た目の説明（測った値ではない）。棒は「差がない」ことを示すだけで、長さに数字の意味はない。
const DUR = 25;
const subs = [
  { a: 0.0, b: 2.0, ja: '毛を[剃り続ける]と、どうなる？', en: 'Keep shaving your hair. What happens?' },
  { a: 2.0, b: 4.0, ja: '（考えてみて）', en: '(Take a guess)' },
  { a: 4.0, b: 9.0, ja: '答え: [変わらない]', en: 'Answer: nothing changes' },
  { a: 9.0, b: 15.0, ja: '5人の男性が、[片足だけ]\n毎週剃り続けた実験', en: 'Five men shaved just one leg\nevery week' },
  { a: 15.0, b: 19.0, ja: '毛の量も、太さも、伸びる速さも\n[差はなかった]', en: 'Amount, thickness, growth speed:\nno difference' },
  { a: 19.0, b: 25.0, ja: '濃く見えるのは、切り口が平らで\n[先の細いところ]がないから', en: 'It looks thicker because the cut end is blunt,\nwithout the thin tapered tip' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 2.0, type: 'tick' }, { t: 3.0, type: 'tick' }, { t: 4.0, type: 'ding' },
  { t: 9.0, type: 'whoosh' }, { t: 15.0, type: 'pop' }, { t: 19.0, type: 'whoosh' }, { t: 21.0, type: 'pop' },
];
// ---- すね（ひざから下を前から見た線画。図鑑の版画の道具 PL.* で）。左を剃る ----
const TAU = Math.PI * 2;
const rnd = i => { const v = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
// ひざから下1本の道。x, y はひざのまん中、s は大きさ、sd: -1 左・1 右（ふくらはぎのふくらみを外がわに）
function shinPath(x, y, s, sd) {
  const P = (px, py) => [x + px * sd * s, y + py * s];
  return gg => {
    gg.moveTo(...P(-52, 0)); gg.quadraticCurveTo(...P(-60, 70), ...P(-46, 170)); gg.quadraticCurveTo(...P(-30, 280), ...P(-27, 350));   // 内がわ
    gg.quadraticCurveTo(...P(-32, 372), ...P(-40, 392)); gg.quadraticCurveTo(...P(-44, 408), ...P(-30, 410)); gg.lineTo(...P(48, 410)); gg.quadraticCurveTo(...P(62, 406), ...P(44, 388));   // 足
    gg.quadraticCurveTo(...P(30, 372), ...P(30, 350)); gg.quadraticCurveTo(...P(36, 250), ...P(64, 140)); gg.quadraticCurveTo(...P(78, 60), ...P(56, 0)); gg.closePath();   // 外がわ（ふくらはぎ）
  };
}
function shin(g, x, y, s, sd, hairLen, seed) {
  const path = shinPath(x, y, s, sd), P = (px, py) => [x + px * sd * s, y + py * s];
  PL.tint(g, path, PL.T.rose, 0.4);
  PL.hatch(g, path, { angle: 1.1, gap: 9, w: 1.4, not: shinPath(x - sd * 22 * s, y, s, sd) });   // 外がわにかげ
  g.save(); g.beginPath(); path(g); g.clip();
  if (hairLen > 0.5) PL.ink(g, gg => { for (let i = 0; i < 46; i++) { const px = -40 + rnd(i + seed) * 90, py = 20 + rnd(i * 3 + seed) * 320, l = hairLen * s * (0.7 + rnd(i * 7) * 0.5); gg.moveTo(...P(px, py)); const q = P(px + 4, py - 1); gg.lineTo(q[0] + sd * l * 0.35, q[1] - l * 0.2 + l); } }, Math.max(1.2, 2.2 * s));   // 毛（下向きに寝る）
  g.restore();
  PL.ink(g, gg => { gg.moveTo(...P(-22, 30)); gg.quadraticCurveTo(...P(0, 48), ...P(22, 30)); gg.moveTo(...P(4, 70)); gg.quadraticCurveTo(...P(-4, 200), ...P(2, 330)); }, Math.max(1.2, 2 * s), 'rgba(35,28,21,0.6)');   // ひざのお皿の下・すねの骨のすじ
  PL.ink(g, path, Math.max(2.5, 5 * s));
}
// カミソリ（T字）。x, y は刃のまん中
function razor(g, x, y, s = 1) {
  const head = PL.rect(x - 50 * s, y - 14 * s, 100 * s, 28 * s), handle = PL.poly([[x - 7 * s, y + 14 * s], [x + 7 * s, y + 14 * s], [x - 50 * s, y + 150 * s], [x - 64 * s, y + 146 * s]]);
  PL.tint(g, handle, PL.T.sea, 0.7); PL.hatch(g, handle, { angle: 0.4, gap: 6, w: 1.3 }); PL.ink(g, handle, 3.5);
  PL.tint(g, head, PL.T.gray, 0.8); PL.ink(g, gg => { gg.moveTo(x - 46 * s, y - 2 * s); gg.lineTo(x + 46 * s, y - 2 * s); gg.moveTo(x - 46 * s, y + 6 * s); gg.lineTo(x + 46 * s, y + 6 * s); }, 1.4); PL.ink(g, head, 3.5);
}
// 2本のすね。cut 0〜1 で左の毛が短くなる
function legs(g, cx, cy, s, cut, o = {}) {
  shin(g, cx - 120 * s, cy - 200 * s, s, -1, lerp(18, 4, cut), 3);
  shin(g, cx + 120 * s, cy - 200 * s, s, 1, 18, 9);
  if (o.razor) razor(g, cx - 120 * s - 10, cy - 120 + 200 * ((o.t * 0.8) % 1), 0.9);
}
// 毛の先を大きくした絵（縦の毛幹）。flat: 剃った平らな切り口
function bigTip(g, x, yb, flat) {
  const w = 100, path = flat
    ? gg => { gg.moveTo(x - w / 2, yb); gg.lineTo(x - w / 2, 430); gg.lineTo(x + w / 2, 420); gg.lineTo(x + w / 2, yb); gg.closePath(); }
    : gg => { gg.moveTo(x - w / 2, yb); gg.lineTo(x - w / 2, 640); gg.quadraticCurveTo(x - 30, 390, x, 270); gg.quadraticCurveTo(x + 30, 390, x + w / 2, 640); gg.lineTo(x + w / 2, yb); gg.closePath(); };
  PL.tint(g, path, PL.T.brown, 0.85);
  PL.hatch(g, path, { angle: 0.35, gap: 7, w: 1.6, not: PL.rect(x - 200, 0, 200 - 6, 1300) });
  g.save(); g.beginPath(); path(g); g.clip();   // キューティクルのうろこ（毛の表面の重なり）
  PL.ink(g, gg => { for (let y = yb - 10, k = 0; y > 260; y -= 26, k++) { const o = (k % 2) * 12; gg.moveTo(x - w / 2 - 4, y + 8); gg.quadraticCurveTo(x - 20 + o, y - 8, x + 4 + o, y + 2); gg.quadraticCurveTo(x + 30, y - 6, x + w / 2 + 4, y + 6); } }, 1.6, 'rgba(35,28,21,0.65)');
  g.restore();
  if (flat) {   // 切り口（上から少し見える楕円。まん中に髄）
    const cut = PL.ellipse(x, 425, w / 2, 14, -0.1);
    PL.tint(g, cut, PL.T.sand, 0.9); PL.ink(g, PL.ellipse(x, 425, 12, 5, -0.1), 2); PL.ink(g, cut, 3.5);
  }
  PL.ink(g, path, 5);
  const sk = PL.rect(x - 150, yb, 300, 26); PL.tint(g, sk, PL.T.rose, 0.7); PL.hatch(g, sk, { angle: 1.2, gap: 7, w: 1.3 }); PL.ink(g, gg => { gg.moveTo(x - 150, yb); gg.lineTo(x - w / 2, yb); gg.moveTo(x + w / 2, yb); gg.lineTo(x + 150, yb); }, 4);   // 皮ふの表面
}

// 選択肢（TK.choices と同じ並び。答えの札の手彩色をうすくして、字の下を色でつぶさない）
function choices(g, t, a, b, opts, o = {}) {
  if (t < a || t > b) return;
  const f = fade(t, a, b, 0.3), y0 = o.y, h = o.h, gap = o.gap, rk = clamp((t - o.reveal) / 0.35, 0, 1), ans = o.answer;
  g.save(); g.globalAlpha *= f;
  opts.forEach((s, i) => {
    const k = TK.out((t - a - i * 0.18) / 0.35), y = y0 + i * (h + gap), x = 90, w = PW - 180, hit = i === ans && rk > 0;
    g.save(); g.globalAlpha *= k * (i !== ans ? 1 - 0.6 * rk : 1);
    TK.card(g, x, y, w, h);
    if (hit) { PL.tint(g, PL.rect(x, y, w, h), PL.T.gold, 0.3 * rk); PL.ink(g, PL.rect(x, y, w, h), 7, PL.RED); }
    PL.ink(g, PL.circle(x + 80, y + h / 2, 46), 5, hit ? PL.RED : PL.INK);
    TK.text(g, 'ABCDE'[i], x + 80, y + h / 2 + 2, 60, { color: hit ? PL.RED : PL.INK });
    TK.text(g, s, x + 160, y + h / 2, o.size || 64, { align: 'left', maxw: w - 200 });
    g.restore();
  });
  g.restore();
}

function draw(g, t) {
  if (t < 9.0) {
    const f = t < 8.6 ? 1 : fade(t, -1, 9, 0.3); g.save(); g.globalAlpha = f;
    legs(g, PW / 2, 360, 1.0, clamp(t / 2, 0, 1), { razor: t < 4, t });
    PL.label(g, '剃る', PW / 2 - 120, 125, 50, { color: TK.C.acc2 }); PL.label(g, '剃らない', PW / 2 + 120, 125, 50, { color: TK.C.sub });
    g.restore();
    choices(g, t, 0.2, 9.0, ['濃くなる', '変わらない', 'うすくなる'], { y: 640, h: 130, gap: 24, size: 64, reveal: 4.0, answer: 1 });
    if (t >= 2.0 && t < 4.0) PL.watch(g, 920, 330, 70, (t - 2.0) / 2.0);   // 考える時間は懐中時計で
  }
  // 9〜15: 実験（5人・片足だけ・毎週・数か月）
  if (t >= 9.0 && t < 15.0) {
    const f = fade(t, 9, 15, 0.3); g.save(); g.globalAlpha = f;
    for (let i = 0; i < 5; i++) { const k = TK.pop(t, 9.3 + i * 0.15, 0.3); g.save(); g.globalAlpha *= clamp(k, 0, 1); legs(g, 140 + i * 200, 440, 0.42, 1); g.restore(); }
    PL.label(g, '[5人]の男性', PW / 2, 210, 72);
    // 暦の升（1升＝1週）。剃った週に朱のしるし
    const weeks = Math.floor(clamp((t - 10.5) / 3.5, 0, 1) * 16);
    const sheet = PL.rect(90, 620, 900, 250); PL.tint(g, sheet, PL.T.sand, 0.3); PL.ink(g, sheet, 4);
    for (let w = 0; w < 16; w++) {
      const x = 150 + (w % 8) * 111, y = 690 + Math.floor(w / 8) * 110, c = PL.rect(x - 40, y - 40, 80, 80);
      PL.tint(g, c, w < weeks ? PL.T.sea : PL.T.sand, w < weeks ? 0.55 : 0.2); PL.ink(g, c, 2.5);
      if (w < weeks) PL.ink(g, gg => { gg.moveTo(x - 20, y); gg.lineTo(x - 4, y + 18); gg.lineTo(x + 24, y - 20); }, 7, PL.RED);
    }
    PL.label(g, '1マス＝1週（毎週、片足だけ剃る・数か月）', PW / 2, 940, 44, { color: TK.C.sub });
    g.restore();
    TK.note(g, t, 9.4, 15, '5人の小さな実験（週の数は絵の目安）', { size: 30 });
  }
  // 15〜19: 3つの棒（左右で同じ）
  if (t >= 15.0 && t < 19.0) {
    const f = fade(t, 15, 19, 0.3); g.save(); g.globalAlpha = f;
    const bar = (x, y, w, h, c) => { const r = PL.rect(x, y, w, h); PL.tint(g, r, c, 0.75); PL.hatch(g, r, { angle: 0.9, gap: 11, w: 2, cx: x, cy: y }); PL.ink(g, r, 4); };
    ['毛の重さ', '太さ', '伸びる速さ'].forEach((s, i) => {
      const x = 220 + i * 320, k = ease((t - 15.3 - i * 0.3) / 0.8), H = 400 * k;
      if (H > 2) { bar(x - 90, 820 - H, 80, H, PL.T.sea); bar(x + 10, 820 - H, 80, H, PL.T.gray); }
      PL.label(g, s, x, 880, 46, { color: TK.C.sub });
      if (k > 0.9) PL.label(g, '＝', x, 820 - H - 50, 64, { color: PL.RED });
    });
    PL.ink(g, gg => { gg.moveTo(80, 822); gg.lineTo(1000, 822); }, 4);
    bar(260, 250, 40, 40, PL.T.sea); PL.label(g, '剃った足', 320, 270, 40, { align: 'left', color: TK.C.sub });
    bar(600, 250, 40, 40, PL.T.gray); PL.label(g, '剃らない足', 660, 270, 40, { align: 'left', color: TK.C.sub });
    g.restore();
    TK.note(g, t, 15.4, 19, '棒は「差がない」ことを表す絵（長さは数字ではありません）', { size: 30 });
  }
  // 19〜25: 毛の先（剃った平らな切り口 と 自然なとがった先）
  if (t >= 19.0) {
    const f = fade(t, 19, 25.5, 0.3); g.save(); g.globalAlpha = f;
    const k = ease((t - 19.3) / 0.8);
    g.save(); g.globalAlpha *= k; bigTip(g, 320, 950, true); bigTip(g, 760, 950, false); g.restore();
    PL.label(g, '剃ったあと', 320, 200, 52, { color: TK.C.acc2 });
    PL.label(g, '剃っていない毛', 760, 200, 52, { color: TK.C.sub });
    if (t > 21.0) {
      PL.leader(g, 320 + 40, 424, 470, 330); PL.label(g, '[平ら]', 490, 330, 60, { align: 'left' });
      PL.leader(g, 768, 300, 880, 360); PL.label(g, '細い先', 900, 360, 48, { color: PL.RED, align: 'left' });
    }
    PL.label(g, '（毛を大きくした断面）', PW / 2, 1030, 40, { color: TK.C.sub, bold: false });
    g.restore();
    TK.note(g, t, 19.4, 25, '見た目の説明（測った値ではありません）\n出どころ: Lynfield & MacWilliams (1970) J Invest Dermatol 55:170', { size: 28, y: 1150 });
  }
}

triviaStart({ out: 'hair-removal-trivia3', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
