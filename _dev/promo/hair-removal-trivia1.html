<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく hair-1（型A ぜんぶ逆）「毛の長さを決めるのは、速さじゃなくて伸びる日数」。台本は trivia/hair-removal.md。?short で録る
// 数字: Seago & Ebling (1985) Br J Dermatol 113:9（太もも、20〜30歳の20人。成長期 男性54日・女性22日、長さ 約3倍、速さの比 1.22）。
// 頭の毛の成長期 3〜5年: Wolfram (2003) J Am Acad Dermatol 48:S106（BioNumbers 114255）。本によって 2〜7年 → 「一例」と画面に。
const DUR = 30;
const subs = [
  { a: 0.0, b: 3.0, ja: '男性の太ももの毛は、女性の[約3倍]長い\n速く伸びるから？… [ちがいます]', en: 'Men’s thigh hair is about 3× longer than women’s.\nBecause it grows faster? Nope' },
  { a: 3.0, b: 9.0, ja: '1日に伸びる速さは\n[2割]ちがうだけ', en: 'Daily growth speed differs\nby only about 20%' },
  { a: 9.0, b: 16.0, ja: 'ちがうのは[「伸び続ける日数」]\n男性 54日、女性 22日', en: 'The difference is how many days it keeps growing:\n54 days for men, 22 for women' },
  { a: 16.0, b: 22.0, ja: '毛は、伸びる時期が終わると\n止まって休み、やがて[抜ける]', en: 'When the growing phase ends, a hair stops,\nrests, and eventually falls out' },
  { a: 22.0, b: 27.0, ja: '頭の毛が長くなるのは\n伸びる時期が[3〜5年]もあるから', en: 'Scalp hair gets long because\nit keeps growing for 3–5 years' },
  { a: 27.0, b: 30.0, ja: '毛の長さは、速さ×日数\n決め手は[日数]でした', en: 'Length = speed × days.\nThe days are what matter' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.6, type: 'buzz' }, { t: 3.0, type: 'whoosh' }, { t: 9.0, type: 'whoosh' }, { t: 10.4, type: 'ding' },
  { t: 16.0, type: 'pop' }, { t: 22.0, type: 'rise' }, { t: 27.0, type: 'ding' },
];
const MALE = '#5fd4ff', FEMALE = '#ff9ec7';

// 皮ふの断面と毛1本。x が毛の根もと、skinY が皮ふの表面、L が皮ふから上の長さ（画素）
function hair(g, x, skinY, L, color, o = {}) {
  g.save();
  // 毛穴と毛球（皮ふの下）
  g.strokeStyle = 'rgba(207,224,255,0.5)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(x - 22, skinY); g.lineTo(x - 22, skinY + 150); g.moveTo(x + 22, skinY); g.lineTo(x + 22, skinY + 150); g.stroke();
  g.fillStyle = o.rest ? 'rgba(207,224,255,0.35)' : color; g.beginPath(); g.ellipse(x, skinY + 160, 26, 30, 0, 0, Math.PI * 2); g.fill();
  // 毛
  g.strokeStyle = color; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, skinY + 140); g.lineTo(x, skinY - L); g.stroke();
  g.restore();
}
function skin(g, y, x0 = 60, x1 = 1020) {
  g.save(); g.fillStyle = 'rgba(255,190,160,0.12)'; g.fillRect(x0, y, x1 - x0, 200);
  g.strokeStyle = 'rgba(255,200,170,0.8)'; g.lineWidth = 5; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); g.restore();
}

function draw(g, t) {
  // 0〜3: 2本の毛（長さ 3:1）＋「速く伸びるから？」に ×
  if (t < 3.0) {
    const k = ease(t / 1.0);
    skin(g, 840);
    hair(g, 340, 840, 450 * k, MALE); hair(g, 740, 840, 150 * k, FEMALE);
    TK.text(g, '男性', 380, 780, 52, { align: 'left', color: MALE }); TK.text(g, '女性', 780, 780, 52, { align: 'left', color: FEMALE });
    TK.text(g, '長さ 約3倍', 560, 520, 60, { color: TK.C.acc });
    if (t > 1.0) {
      TK.card(g, 200, 190, 680, 130, { r: 40 });
      TK.text(g, '速く伸びるから？', PW / 2, 255, 66);
      if (t > 1.6) { const kk = TK.pop(t, 1.6, 0.3); g.save(); g.strokeStyle = TK.C.red; g.lineWidth = 22; g.lineCap = 'round'; g.globalAlpha = clamp(kk, 0, 1); const r = 90 * kk; g.beginPath(); g.moveTo(540 - r * 3, 255 - r * 0.9); g.lineTo(540 + r * 3, 255 + r * 0.9); g.moveTo(540 + r * 3, 255 - r * 0.9); g.lineTo(540 - r * 3, 255 + r * 0.9); g.stroke(); g.restore(); }
    }
  }
  // 3〜9: 速さの棒
  if (t >= 3.0 && t < 9.0) {
    TK.text(g, '1日に伸びる速さ', PW / 2, 300, 60, { color: TK.C.sub });
    TK.bars(g, t, 3.0, 9.0, [
      { label: '男性', v: 1.22 / 1.3, color: MALE, text: '1.22' },
      { label: '女性', v: 1.0 / 1.3, color: FEMALE, text: '1' },
    ], { y: 440, gap: 240, stagger: 0.5 });
    if (t > 5.0) { g.save(); g.globalAlpha = fade(t, 5, 9, 0.3); TK.text(g, 'ちがいは [2割] だけ', PW / 2, 1000, 72); g.restore(); }
    TK.note(g, t, 3.3, 9, '女性を 1 としたくらべ（太ももの毛）', { size: 32 });
  }
  // 9〜16: 伸びる日数の棒
  if (t >= 9.0 && t < 16.0) {
    TK.text(g, '伸び続ける日数', PW / 2, 300, 60, { color: TK.C.sub });
    TK.bars(g, t, 9.0, 16.0, [
      { label: '男性', v: 54 / 60, color: MALE, text: '54日' },
      { label: '女性', v: 22 / 60, color: FEMALE, text: '22日' },
    ], { y: 440, gap: 240, stagger: 0.5 });
    if (t > 11.0) { g.save(); g.globalAlpha = fade(t, 11, 16, 0.3); TK.text(g, 'こちらは [約2.5倍]', PW / 2, 1000, 72); g.restore(); }
    TK.note(g, t, 9.3, 16, '太ももの毛・20〜30歳の20人の研究', { size: 32 });
  }
  // 16〜22: 毛の周期（伸びる → 止まる → 休む → 抜ける）
  if (t >= 16.0 && t < 22.0) {
    const f = fade(t, 16, 22, 0.3); g.save(); g.globalAlpha = f;
    const u = clamp((t - 16.3) / 5.0, 0, 1);   // 周期の進み
    const phases = [['伸びる', 0.0, 0.45, MALE], ['止まる', 0.45, 0.6, TK.C.acc], ['休む', 0.6, 0.85, 'rgba(207,224,255,0.8)'], ['抜ける', 0.85, 1.0, TK.C.red]];
    const cur = phases.find(p => u >= p[1] && u <= p[2]) || phases[3];
    // 上に4つの札
    phases.forEach((p, i) => {
      const x = 90 + i * 232, on = p === cur;
      TK.card(g, x, 150, 212, 110, { r: 30, fill: on ? 'rgba(255,207,74,0.25)' : 'rgba(20,34,72,0.85)', stroke: on ? TK.C.acc : 'rgba(160,190,255,0.35)', lw: on ? 6 : 3 });
      TK.text(g, p[0], x + 106, 205, 50, { color: on ? '#fff' : TK.C.dim });
    });
    skin(g, 820);
    const L = u < 0.45 ? 420 * (u / 0.45) : 420;
    const dy = u > 0.85 ? -260 * ((u - 0.85) / 0.15) : 0;   // 抜けて上へ
    const sink = u > 0.45 ? Math.min(1, (u - 0.45) / 0.3) * 90 : 0;   // 毛の根もとが浅くなる
    g.save(); g.translate(0, dy - sink * 0.3); if (u > 0.85) g.globalAlpha *= 1 - (u - 0.85) / 0.15 * 0.7;
    hair(g, 540, 820 - sink, L, MALE, { rest: u > 0.6 });
    g.restore();
    g.restore();
  }
  // 22〜27: 頭の毛は 3〜5年
  if (t >= 22.0 && t < 27.0) {
    TK.text(g, '伸び続ける日数', PW / 2, 300, 60, { color: TK.C.sub });
    const k = ease((t - 22.5) / 2.2);
    const f = fade(t, 22, 27, 0.3); g.save(); g.globalAlpha = f;
    const x0 = 110, W = PW - 220;
    [['太もも（男性）', 54 / 1100, MALE, '54日'], ['頭の毛', 1.0 * k, TK.C.acc, '']].forEach(([lab, v, c, txt], i) => {
      const y = 440 + i * 240;
      TK.text(g, lab, x0, y, 52, { align: 'left', color: TK.C.sub });
      g.fillStyle = 'rgba(255,255,255,0.10)'; g.beginPath(); g.roundRect(x0, y + 40, W, 64, 32); g.fill();
      g.fillStyle = c; g.beginPath(); g.roundRect(x0, y + 40, Math.max(64, (W + 140) * v), 64, 32); g.fill();
      if (txt) TK.text(g, txt, x0 + 90, y + 72, 44, { align: 'left' });
    });
    if (k > 0.9) { TK.text(g, '3〜5年（一例）→ 画面の外まで', PW / 2, 820, 56, { color: TK.C.acc }); TK.text(g, '太ももの [20倍以上]', PW / 2, 960, 72); }
    g.restore();
    TK.note(g, t, 22.5, 27, '頭の毛は 2〜7年と書く本もあります', { size: 32 });
  }
  // 27〜30: 長さ＝速さ×日数
  if (t >= 27.0) {
    const f = fade(t, 27, 30.5, 0.3); g.save(); g.globalAlpha = f;
    TK.card(g, 90, 300, 900, 460);
    TK.text(g, '長さ ＝ 速さ × [日数]', PW / 2, 430, 84);
    TK.text(g, '約3倍 ＝ 1.22倍 × [2.46倍]', PW / 2, 590, 64, { color: TK.C.sub });
    TK.text(g, '（太もも・男性／女性）', PW / 2, 680, 40, { color: TK.C.dim, bold: false });
    g.restore();
    TK.note(g, t, 27.2, 30, '出どころ: Seago & Ebling (1985) Br J Dermatol 113:9\nWolfram (2003) J Am Acad Dermatol 48:S106', { size: 30 });
  }
}

triviaStart({ out: 'hair-removal-trivia1', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
