<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく weed-growth-1（型H 当ててみて）「マダケの花は120年に1度。しかも世界中で同時に咲く」。台本は trivia/weed-growth.md。?short で録る
// 記録の年: 999年・1114年・1700年代はじめ・1844〜47年・1960年代後半（Ed Yong, National Geographic 2015）。
// 1960年代の同時開花の場所は台本で国名をたしかめていないので、地図に国名を出さず「何千kmはなれた場所」とだけ描く
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.4, ja: '竹の花、何年に1回 咲くと思う？', en: 'How often do you think bamboo flowers?' },
  { a: 3.4, b: 6.0, ja: 'マダケは、約[120年]に1回', en: 'This bamboo: about once every 120 years' },
  { a: 6.0, b: 14.0, ja: '記録に残っているのは、999年、1114年、\n1700年代、1840年代…そして[1960年代]', en: 'Records show 999, 1114, the 1700s,\nthe 1840s… and the 1960s' },
  { a: 14.0, b: 22.0, ja: 'おどろくのはここから。1960年代、\n何千kmも離れた国の竹が、[そろって咲いた]', en: 'Here’s the twist: in the 1960s, bamboo in countries\nthousands of km apart flowered together' },
  { a: 22.0, b: 28.0, ja: '竹はふだん、タネではなく[地下茎]でふえる。\nだから同じ「時計」を持ったまま、世界中に植えられた', en: 'Bamboo usually spreads by underground stems,\nso it was planted worldwide carrying the same “clock”' },
  { a: 28.0, b: 35.0, ja: '竹の周期は、小さい数のかけ算に\nなりやすい、という研究も', en: 'One study suggests bamboo cycles tend to be\nproducts of small numbers' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.23, type: 'pop' }, { t: 0.41, type: 'pop' }, { t: 1.6, type: 'tick' }, { t: 2.6, type: 'tick' }, { t: 3.4, type: 'ding' },
  { t: 6.4, type: 'pop' }, { t: 7.6, type: 'pop' }, { t: 8.8, type: 'pop' }, { t: 10.0, type: 'pop' }, { t: 11.4, type: 'ding' },
  { t: 14.0, type: 'whoosh' }, { t: 17.0, type: 'rise' }, { t: 18.0, type: 'ding' }, { t: 22.0, type: 'whoosh' }, { t: 24.5, type: 'tick' }, { t: 25.5, type: 'tick' },
  { t: 28.0, type: 'pop' }, { t: 29.5, type: 'pop' }, { t: 30.5, type: 'pop' }, { t: 31.5, type: 'ding' },
];
const BAMBOO = '#7fd18b', FLOWER = '#ffe08a';
// 竹1本（節つき）
function culm(g, x, base, h, w = 16, col = BAMBOO) {
  g.fillStyle = col; g.fillRect(x - w / 2, base - h, w, h);
  g.fillStyle = 'rgba(0,0,0,0.35)'; for (let y = base - 60; y > base - h; y -= 70) g.fillRect(x - w / 2 - 2, y, w + 4, 6);
  g.strokeStyle = col; g.lineWidth = 5; g.lineCap = 'round';
  for (let y = base - h + 40; y < base - 100; y += 140) { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 50, y - 20, x + 80, y + 10); g.stroke(); g.beginPath(); g.moveTo(x, y + 70); g.quadraticCurveTo(x - 50, y + 50, x - 80, y + 80); g.stroke(); }
}
// 花（穂のかたまり）
function flower(g, x, y, k) {
  if (k <= 0) return;
  g.save(); g.translate(x, y); g.scale(k, k); g.fillStyle = FLOWER;
  for (let j = 0; j < 7; j++) { const a = j / 7 * Math.PI * 2; g.beginPath(); g.ellipse(Math.cos(a) * 14, Math.sin(a) * 14, 12, 5, a, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
// 年表（たて）
const EVENTS = [[999, '999年', 6.4], [1114, '1114年', 7.6], [1720, '1700年代はじめ', 8.8], [1845, '1844〜47年', 10.0], [1967, '1960年代後半', 11.4]];
const YY = y => lerp(300, 1000, (y - 980) / (2030 - 980));
function timeline(g, t) {
  g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 6; g.beginPath(); g.moveTo(380, YY(980)); g.lineTo(380, YY(2030)); g.stroke();
  [1000, 1500, 2000].forEach(y => TK.text(g, y + '', 340, YY(y), 32, { align: 'right', color: TK.C.dim, bold: false }));
  EVENTS.forEach(([y, s, a], i) => {
    const k = TK.pop(t, a, 0.35); if (k <= 0) return;
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    flower(g, 380, YY(y), k * 1.2);
    TK.text(g, s, 430, YY(y), 54, { align: 'left', color: i === 4 ? TK.C.acc : '#fff' });
    g.restore();
  });
}
// はなれた場所の竹が同時に咲く（場所は飾り。国名は出さない）
const SPOTS = [[230, 420], [820, 360], [560, 760], [190, 900], [880, 860]];
function world(g, t) {
  g.strokeStyle = 'rgba(160,190,255,0.25)'; g.lineWidth = 3; g.setLineDash([12, 12]);
  g.beginPath(); SPOTS.forEach(([x, y], i) => { SPOTS.forEach(([x2, y2], j) => { if (j > i) { g.moveTo(x, y); g.lineTo(x2, y2); } }); }); g.stroke(); g.setLineDash([]);
  const bloom = TK.pop(t, 17.0, 0.5);
  SPOTS.forEach(([x, y]) => {
    for (let j = -1; j <= 1; j++) culm(g, x + j * 34, y + 70, 160, 12);
    for (let j = -1; j <= 1; j++) flower(g, x + j * 34 + 14, y - 80 + Math.abs(j) * 12, bloom);
  });
  TK.text(g, '何千km はなれた場所', PW / 2, 230, 60, { color: TK.C.sub });
  if (t > 17.0) { g.save(); g.globalAlpha = clamp((t - 17) / 0.4, 0, 1); TK.text(g, '[同じころ] に開花', PW / 2, 1040, 64); g.restore(); }
}
// 地下茎でつながった竹と、同じ時計
function rhizome(g, t) {
  const GY = 700;
  g.fillStyle = '#4a3420'; g.fillRect(0, GY, PW, 360);
  const gr = g.createLinearGradient(0, 940, 0, 1070); gr.addColorStop(0, 'rgba(11,20,48,0)'); gr.addColorStop(1, 'rgba(11,20,48,1)'); g.fillStyle = gr; g.fillRect(0, 940, PW, 130);
  const k = clamp((t - 22.4) / 2.0, 0, 1), xs = [160, 360, 560, 760, 920];
  g.strokeStyle = '#d9b77a'; g.lineWidth = 16; g.lineCap = 'round'; g.beginPath(); g.moveTo(100, GY + 120); g.lineTo(lerp(100, 980, k), GY + 120); g.stroke();
  xs.forEach((x, i) => {
    if (lerp(100, 980, k) < x) return;
    g.strokeStyle = '#d9b77a'; g.lineWidth = 10; g.beginPath(); g.moveTo(x, GY + 120); g.lineTo(x, GY); g.stroke();
    culm(g, x, GY, 330, 16);
    // 時計（みな同じ針）
    const cx = x, cy = GY - 400, a = t * 2.2;
    g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.arc(cx, cy, 36, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(a) * 26, cy - Math.cos(a) * 26); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(a / 12) * 18, cy - Math.cos(a / 12) * 18); g.stroke();
  });
  TK.text(g, '地下茎', 240, GY + 175, 46, { color: '#d9b77a' });
  TK.text(g, 'どれも [同じ時計]', PW / 2, 200, 66);
}
function factors(g, t) {
  TK.text(g, '120 =', PW / 2, 420, 140, { color: TK.C.acc });
  const fs = ['2', '2', '2', '3', '5'];
  fs.forEach((f, i) => {
    const k = TK.pop(t, 29.4 + i * 0.3, 0.35); if (k <= 0) return;
    const x = 150 + i * 195;
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    TK.card(g, x - 70, 560, 140, 170, { r: 30 });
    TK.text(g, f, x, 650, 120 * k);
    if (i < 4) TK.text(g, '×', x + 98, 645, 60, { color: TK.C.sub });
    g.restore();
  });
  if (t > 31.5) { g.save(); g.globalAlpha = fade(t, 31.5, 36, 0.3); TK.card(g, 380, 830, 320, 90, { r: 45, fill: 'rgba(255,107,107,0.18)', stroke: TK.C.red }); TK.text(g, '仮説', PW / 2, 876, 54, { color: TK.C.red }); g.restore(); }
}

function draw(g, t) {
  if (t < 6.0) {
    TK.text(g, '竹の花は、何年に1回？', PW / 2, 220, 84);
    TK.choices(g, t, 0, 6.0, ['毎年', '12年', '120年'], { y: 560, h: 130, gap: 30, size: 84, answer: 2, reveal: 3.4, think: [1.4, 3.4] });
    if (t > 3.8) { g.save(); g.globalAlpha = clamp((t - 3.8) / 0.3, 0, 1); TK.text(g, '（マダケ）', PW / 2, 400, 60, { color: TK.C.sub }); g.restore(); }
  } else if (t < 14.0) { TK.text(g, 'マダケの花の記録', PW / 2, 200, 64, { color: TK.C.sub }); timeline(g, t); }
  else if (t < 22.0) world(g, t);
  else if (t < 28.0) rhizome(g, t);
  else factors(g, t);
  if (t >= 3.4 && t < 14) TK.note(g, t, 3.4, 14, '「120年」は記録から言われる周期で、きっちり120年ではありません', { size: 32 });
  if (t >= 14 && t < 28) TK.note(g, t, 14, 28, '竹の絵は「竹のなかま」。場所の点は飾りです', { size: 32 });
  if (t >= 28 && t < 32.6) TK.note(g, t, 28, 32.6, '仮説: Veller, Nowak & Davis (2015) Ecology Letters', { size: 32 });
  if (t >= 32.6) TK.note(g, t, 32.6, 35, '出どころ: Ed Yong「Bamboo Mathematicians」National Geographic (2015)・Janzen (1976)', { size: 28 });
}

triviaStart({ out: 'weed-growth-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
