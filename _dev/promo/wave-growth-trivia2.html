<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく wave-growth-2（型A ぜんぶ逆）「波が来ても、水はほとんど進んでいない」。台本は trivia/wave-growth.md。?short で録る
// 深い海の小さな波（線形の式）: 水の粒は半径 a·e^(kz) の円をかく。波長の半分の深さで e^(−π) ≈ 1/23。
// 絵は波の高さを大きく描いている（見やすさのため）。ストークス・ドリフト（少しずつ前へ進む）は描いていない（注で言う）
const DUR = 25;
const subs = [
  { a: 0.0, b: 1.6, ja: '波といっしょに、水も進む？', en: 'Does the water travel with the wave?', noBurn: true },
  { a: 1.6, b: 3.0, ja: '「波といっしょに水も進む」…は[ウソ]', en: '“Water moves along with the wave” — not true' },
  { a: 3.0, b: 6.5, ja: '葉っぱの通り道をなぞると…\n上がって前へ、下がって後ろへ', en: 'Trace a floating leaf:\nup and forward, down and back' },
  { a: 6.5, b: 10.0, ja: '円をかいて、[ほとんど元の場所]', en: 'It draws a circle and ends up almost where it started' },
  { a: 10.0, b: 17.0, ja: '水の中の粒も、みんな円をかいているだけ。\n進んでいるのは、[形とエネルギー]', en: 'The water underneath just circles too.\nWhat travels is the shape and the energy' },
  { a: 17.0, b: 25.0, ja: '円は深いほど小さくなり、波の長さの半分の深さで\nほぼ止まる（表面の約[23分の1]）', en: 'The circles shrink with depth; at half a wavelength down\nthey’re about 1/23 of the surface' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.8, type: 'buzz' }, { t: 3.0, type: 'whoosh' }, { t: 7.0, type: 'ding' },
  { t: 10.0, type: 'whoosh' }, { t: 17.0, type: 'pop' }, { t: 19.5, type: 'ding' },
];
const Y0 = 520, LAM = 700, K = 2 * Math.PI / LAM, A = 70, OM = 2 * Math.PI / 2.6;   // 画面の上の波（周期 2.6 秒で描く）
const surf = (x, t) => Y0 - A * Math.cos(K * x - OM * t);
const YB = 975;   // 断面の下のはし（ここで切って見せる。海はもっと深い）
// 水の粒（もとの位置 x0・深さ d px）の今の位置
function parcel(x0, d, t) {
  const r = A * Math.exp(-K * d), ph = K * x0 - OM * t;
  return [x0 + r * Math.sin(ph), Y0 + d - r * Math.cos(ph), r];
}
// 下のはしは、図鑑の断面のように波うつ切り口
const cutY = x => YB + Math.sin(x / 37) * 6 + Math.sin(x / 13) * 3;
function sea(g, t) {
  const water = gg => { gg.moveTo(0, cutY(0)); for (let x = 0; x <= PW; x += 6) gg.lineTo(x, surf(x, t)); for (let x = PW; x >= 0; x -= 6) gg.lineTo(x, cutY(x)); gg.closePath(); };
  PL.tint(g, water, PL.T.sea, 0.55);
  PL.hatch(g, water, { angle: 0.04, gap: 18, w: 1.6, not: gg => gg.rect(-50, 0, PW + 100, Y0 + 260), cx: 540, cy: 900 });   // 深い所だけ横の線（暗くなる）
  PL.ink(g, gg => { for (let x = 0; x <= PW; x += 6) { const y = surf(x, t); x ? gg.lineTo(x, y) : gg.moveTo(x, y); } }, 6);
  PL.ink(g, gg => { for (let x = 0; x <= PW; x += 6) x ? gg.lineTo(x, cutY(x)) : gg.moveTo(x, cutY(x)); }, 3);
  // 水面の下のうすい「波の形」の線（深いほどゆれが小さい。線形の式のまま）
  PL.ink(g, gg => { [40, 110].forEach(d => { const r = A * Math.exp(-K * d); for (let x = 0; x <= PW; x += 6) { const y = Y0 + d - r * Math.cos(K * x - OM * t); x ? gg.lineTo(x, y) : gg.moveTo(x, y); } }); }, 1.3);
}
// 葉っぱ（たまご形の葉、葉柄・主脈・側脈）
function leaf(g, x, y, ang) {
  g.save(); g.translate(x, y - 10); g.rotate(ang);
  const blade = gg => { gg.moveTo(-46, 0); gg.bezierCurveTo(-30, -26, 22, -24, 48, 0); gg.bezierCurveTo(22, 20, -30, 22, -46, 0); gg.closePath(); };
  PL.tint(g, blade, PL.T.leaf, 0.85);
  PL.hatch(g, blade, { angle: 1.0, gap: 6, w: 1.4, not: gg => gg.rect(-60, -40, 120, 40), cx: 0, cy: 0 });
  PL.ink(g, blade, 3.5);
  PL.ink(g, gg => { gg.moveTo(-62, 4); gg.lineTo(44, 0); for (let i = -2; i <= 2; i++) { const px = i * 14; gg.moveTo(px, 0); gg.lineTo(px + 12, -13); gg.moveTo(px, 0); gg.lineTo(px + 12, 13); } }, 1.8);
  g.restore();
}
// 右向きの矢（墨の輪郭＋朱の手彩色）
function arrowR(g, x, y, s) {
  const a = PL.poly([[x, y - 16], [x + 70, y - 16], [x + 70, y - 36], [x + 112, y], [x + 70, y + 36], [x + 70, y + 16], [x, y + 16]]);
  PL.tint(g, a, PL.RED, 0.75); PL.hatch(g, a, { angle: 0.6, gap: 8, w: 1.8, cx: x, cy: y }); PL.ink(g, a, 4);
  PL.label(g, s, x + 140, y, 44, { align: 'left' });
}

function draw(g, t) {
  sea(g, t);
  // 葉っぱ（表面の粒）と、その通り道
  const x0 = 540;
  if (t >= 3.0) {
    const n = Math.round(clamp((t - 3.2) / 2.6, 0, 1) * 80);
    if (n > 1) PL.dots(g, Array.from({ length: n + 1 }, (_, i) => parcel(x0, 0, 3.2 + i / 80 * 2.6)), { dash: [3, 13], w: 6 });
  }
  // 10〜: 水の中の粒の円
  if (t >= 10.0) {
    const k = clamp((t - 10.2) / 1.0, 0, 1);
    g.save(); g.globalAlpha *= k * 0.45;
    PL.ink(g, gg => { for (let d = 60; d <= 360; d += 60) for (let xx = 120; xx <= 960; xx += 120) { const r = A * Math.exp(-K * d); PL.circle(xx, Y0 + d, r)(gg); } }, 1.6);
    g.restore();
    g.save(); g.globalAlpha *= k;
    for (let d = 60; d <= 360; d += 60) for (let xx = 120; xx <= 960; xx += 120) {
      const [px, py] = parcel(xx, d, t), c = PL.circle(px, py, 9); PL.tint(g, c, PL.T.gold, 0.95); PL.ink(g, c, 3);
    }
    g.restore();
    if (t < 17.0) {
      g.save(); g.globalAlpha *= fade(t, 10, 17, 0.3);
      arrowR(g, 90, 200, '進むのは 形・エネルギー');
      const c = PL.circle(118, 300, 11); PL.tint(g, c, PL.T.gold, 0.95); PL.ink(g, c, 3); PL.ink(g, PL.circle(118, 300, 30), 2);
      PL.label(g, '水の粒は その場で円', 230, 300, 44, { align: 'left' });
      g.restore();
    }
  }
  const [lx, ly] = parcel(x0, 0, t);
  leaf(g, lx, ly, -A * K * Math.sin(K * lx - OM * t));
  // 17〜: 波長の半分の深さ
  if (t >= 17.0) {
    const yd = Y0 + LAM / 2, k = clamp((t - 17.2) / 0.6, 0, 1);
    g.save(); g.globalAlpha *= k;
    g.save(); g.setLineDash([16, 12]); PL.ink(g, gg => { gg.moveTo(40, yd); gg.lineTo(1040, yd); }, 4, PL.RED); g.restore();
    // 波の長さの目盛り（山から山まで）
    PL.ink(g, gg => { gg.moveTo(190, 330); gg.lineTo(190 + LAM, 330); gg.moveTo(190, 312); gg.lineTo(190, 348); gg.moveTo(190 + LAM, 312); gg.lineTo(190 + LAM, 348); for (let i = 1; i < 10; i++) { gg.moveTo(190 + LAM * i / 10, 330); gg.lineTo(190 + LAM * i / 10, i === 5 ? 346 : 340); } }, 3);
    PL.label(g, '波の長さ', 190 + LAM / 2, 280, 44);
    // 深さの目盛り（左のはし）
    PL.ink(g, gg => { gg.moveTo(40, Y0); gg.lineTo(40, yd); for (let i = 0; i <= 5; i++) { const y = Y0 + (yd - Y0) * i / 5; gg.moveTo(40, y); gg.lineTo(58, y); } }, 3);
    PL.leader(g, 960, yd, 900, 1030, PL.RED);
    PL.label(g, '波の長さの半分の深さ', 880, 1035, 44, { align: 'right' });
    if (t > 19.5) { g.save(); g.globalAlpha *= fade(t, 19.5, 99, 0.3); PL.label(g, '円は表面の [約1/23]', 880, 1115, 58, { align: 'right' }); g.restore(); }
    g.restore();
  }
  if (t < 1.6) {   // フック: 「波といっしょに、水も進む」に朱の × （字には重ねない）
    const f = fade(t, -1, 1.6, 0.25);
    g.save(); g.globalAlpha *= f;
    PL.label(g, '波といっしょに、', 70, 220, 92, { align: 'left' });
    PL.label(g, '水も進む', 70, 335, 92, { align: 'left' });
    if (t > 0.8) { const x = TK.out((t - 0.8) / 0.25); PL.ink(g, gg => { gg.moveTo(690, 280); gg.lineTo(690 + 140 * x, 280 + 140 * x); if (x > 0.5) { const y = (x - 0.5) * 2; gg.moveTo(830, 280); gg.lineTo(830 - 140 * y, 280 + 140 * y); } }, 24, PL.RED); }
    g.restore();
  }
  if (t >= 3.0 && t < 23) TK.note(g, t, 3, 23, '沖（深い所）の波。円は少しずつ前へずれ（ストークス・ドリフト）、浜でくだけた波は水が進みます', { size: 28 });
  if (t >= 23) TK.note(g, t, 23, 25, '出どころ: Chamberlin, Shaw & Rich「Our World Ocean」13.7（CC BY 4.0）', { size: 30 });
}

triviaStart({ out: 'wave-growth-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
