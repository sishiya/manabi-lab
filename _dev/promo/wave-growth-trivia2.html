<title>紹介動画づくり</title>

<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく wave-growth-2（型A ぜんぶ逆）「波が来ても、水はほとんど進んでいない」。台本は trivia/wave-growth.md。?short で録る
// 深い海の小さな波（線形の式）: 水の粒は半径 a·e^(kz) の円をかく。波長の半分の深さで e^(−π) ≈ 1/23。
// 絵は波の高さを大きく描いている（見やすさのため）。ストークス・ドリフト（少しずつ前へ進む）は描いていない（注で言う）
const DUR = 25;
const subs = [
  { a: 0.0, b: 1.6, ja: '波といっしょに、水も進む？', en: 'Does the water travel with the wave?', noBurn: true },
  { a: 1.6, b: 3.0, ja: '「波といっしょに水も進む」…は[ウソ]', en: '“Water moves along with the wave” — not true' },
  { a: 3.0, b: 6.5, ja: '葉っぱの通り道をなぞると…\n上がって前へ、下がって後ろへ', en: 'Trace a floating leaf:\nup and forward, down and back' },
  { a: 6.5, b: 10.0, ja: '円をかいて、[ほとんど元の場所]', en: 'It draws a circle and ends up almost where it started' },
  { a: 10.0, b: 17.0, ja: '水の中の粒も、みんな円をかいているだけ。\n進んでいるのは、[形とエネルギー]', en: 'The water underneath just circles too.\nWhat travels is the shape and the energy' },
  { a: 17.0, b: 25.0, ja: '円は深いほど小さくなり、波の長さの半分の深さで\nほぼ止まる（表面の約[23分の1]）', en: 'The circles shrink with depth; at half a wavelength down\nthey’re about 1/23 of the surface' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.8, type: 'buzz' }, { t: 3.0, type: 'whoosh' }, { t: 7.0, type: 'ding' },
  { t: 10.0, type: 'whoosh' }, { t: 17.0, type: 'pop' }, { t: 19.5, type: 'ding' },
];
const Y0 = 470, LAM = 700, K = 2 * Math.PI / LAM, A = 70, OM = 2 * Math.PI / 2.6;   // 画面の上の波（周期 2.6 秒で描く）
const surf = (x, t) => Y0 - A * Math.cos(K * x - OM * t);
// 水の粒（もとの位置 x0・深さ d px）の今の位置
function parcel(x0, d, t) {
  const r = A * Math.exp(-K * d), ph = K * x0 - OM * t;
  return [x0 + r * Math.sin(ph), Y0 + d - r * Math.cos(ph), r];
}
function sea(g, t) {
  g.fillStyle = '#123a73'; g.beginPath(); g.moveTo(0, 1100);
  for (let x = 0; x <= PW; x += 6) g.lineTo(x, surf(x, t));
  g.lineTo(PW, 1100); g.closePath(); g.fill();
  g.strokeStyle = '#5fd4ff'; g.lineWidth = 6; g.beginPath();
  for (let x = 0; x <= PW; x += 6) { const y = surf(x, t); x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  const gr = g.createLinearGradient(0, 1000, 0, 1110); gr.addColorStop(0, 'rgba(11,20,48,0)'); gr.addColorStop(1, 'rgba(11,20,48,1)'); g.fillStyle = gr; g.fillRect(0, 1000, PW, 110);
}
function leaf(g, x, y, ang) {
  g.save(); g.translate(x, y - 8); g.rotate(ang); g.fillStyle = '#7fd18b';
  g.beginPath(); g.ellipse(0, 0, 44, 16, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#3f8a4a'; g.lineWidth = 3; g.beginPath(); g.moveTo(-40, 0); g.lineTo(40, 0); g.stroke(); g.restore();
}
function arrowR(g, x, y, col, s) {
  g.fillStyle = col; g.beginPath(); g.moveTo(x, y - 18); g.lineTo(x + 70, y - 18); g.lineTo(x + 70, y - 38); g.lineTo(x + 110, y); g.lineTo(x + 70, y + 38); g.lineTo(x + 70, y + 18); g.lineTo(x, y + 18); g.fill();
  TK.text(g, s, x + 55, y + 70, 40, { color: col });
}

function draw(g, t) {
  sea(g, t);
  // 葉っぱ（表面の粒）と、その通り道
  const x0 = 540;
  if (t >= 3.0) {
    g.save(); g.strokeStyle = 'rgba(255,207,74,0.9)'; g.lineWidth = 5; g.setLineDash([10, 10]); g.beginPath();
    const n = Math.round(clamp((t - 3.2) / 2.6, 0, 1) * 80);
    for (let i = 0; i <= n; i++) { const [x, y] = parcel(x0, 0, 3.2 + i / 80 * 2.6); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke(); g.restore();
  }
  const [lx, ly] = parcel(x0, 0, t);
  leaf(g, lx, ly, -A * K * Math.sin(K * lx - OM * t));
  // 10〜: 水の中の粒の円
  if (t >= 10.0) {
    const k = clamp((t - 10.2) / 1.0, 0, 1);
    for (let d = 60; d <= 420; d += 60) for (let xx = 120; xx <= 960; xx += 120) {
      if (xx === x0 && d < 60) continue;
      const [px, py, r] = parcel(xx, d, t);
      g.globalAlpha = k * 0.35; g.strokeStyle = '#cfe0ff'; g.lineWidth = 2; g.beginPath(); g.arc(xx, Y0 + d, r, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = k; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(px, py, 9, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
    if (t < 17.0) { arrowR(g, 130, 230, TK.C.acc, '形・エネルギー'); TK.text(g, '水の粒は その場で円', 700, 230, 46, { color: '#fff' }); }
  }
  // 17〜: 波長の半分の深さ
  if (t >= 17.0) {
    const yd = Y0 + LAM / 2, k = clamp((t - 17.2) / 0.6, 0, 1);
    g.save(); g.globalAlpha = k; g.strokeStyle = TK.C.acc; g.lineWidth = 5; g.setLineDash([16, 12]); g.beginPath(); g.moveTo(40, yd); g.lineTo(1000, yd); g.stroke(); g.restore();
    g.save(); g.globalAlpha = k;
    // 波長の目盛り
    g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath(); g.moveTo(190, 300); g.lineTo(190 + LAM, 300); g.moveTo(190, 285); g.lineTo(190, 315); g.moveTo(190 + LAM, 285); g.lineTo(190 + LAM, 315); g.stroke();
    TK.text(g, '波の長さ', 190 + LAM / 2, 260, 44);
    TK.text(g, '波の長さの半分の深さ', PW / 2, yd + 50, 44, { color: TK.C.acc });
    if (t > 19.5) TK.text(g, '円は表面の [約1/23]', PW / 2, yd + 120, 60);
    g.restore();
  }
  if (t < 1.6) {
    TK.hook(g, t, 0, 1.6, '波といっしょに、\n水も進む', { y: 270, size: 100 });
    if (t > 0.8) { const x = TK.out((t - 0.8) / 0.25); g.strokeStyle = TK.C.red; g.lineWidth = 26; g.lineCap = 'round'; g.beginPath(); g.moveTo(180, 180); g.lineTo(180 + 720 * x, 180 + 180 * x); if (x > 0.5) { const y = (x - 0.5) * 2; g.moveTo(900, 180); g.lineTo(900 - 720 * y, 180 + 180 * y); } g.stroke(); }
  }
  if (t >= 3.0 && t < 23) TK.note(g, t, 3, 23, '沖（深い所）の波。円は少しずつ前へずれ（ストークス・ドリフト）、浜でくだけた波は水が進みます', { size: 28 });
  if (t >= 23) TK.note(g, t, 23, 25, '出どころ: Chamberlin, Shaw & Rich「Our World Ocean」13.7（CC BY 4.0）', { size: 30 });
}

triviaStart({ out: 'wave-growth-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
