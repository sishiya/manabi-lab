<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく tree-of-life-1（型A ぜんぶ逆）「ヒトデは、タコよりヒトに近い」。台本は trivia/tree-of-life.md、直しは trivia/REVIEW.md
// 出どころ: UCMP Introduction to the Deuterostomia。分け方（後口動物／前口動物）は教科書どおり。疑う解析（Kapli ほか 2021）もあるので「多くの研究で」（REVIEW）
// 生きものはすべて線画（形はイメージ）。アプリの録画は使わない
const DUR = 28;
const subs = [
  { a: 0.0, b: 2.0, ja: 'ヒトに近いのは、タコじゃなくて、ヒトデ。', en: 'Closer to humans: not the octopus, but the starfish.', noBurn: true },
  { a: 2.0, b: 6.0, ja: 'タコはかしこくて、\n目のつくりも[ヒトそっくり]なのに。', en: 'Even though octopuses are smart\nand have eyes built much like ours.' },
  { a: 6.0, b: 13.0, ja: '動物の木は、早いうちに大きく[2つ]に分かれた。\n片方に、タコ・虫・貝。', en: 'The animal tree split in two early on.\nOne side: octopuses, insects, snails.' },
  { a: 13.0, b: 19.0, ja: 'もう片方に、ヒトデ・ウニ・ナマコと、\n魚、そして[ヒト]。', en: 'The other: starfish, sea urchins, sea cucumbers,\nfish, and us.' },
  { a: 19.0, b: 24.0, ja: '決め手は赤ちゃんのとき。体にできる最初の穴が、\n口じゃなくて[おしり]になるなかま。', en: 'The clue is in the embryo: the first opening\nbecomes the anus, not the mouth.' },
  { a: 24.0, b: 28.0, ja: 'ヒトもヒトデも、[おしりから先に]できた。', en: 'Humans and starfish: both started bottom first.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.0, type: 'ding' }, { t: 2.0, type: 'whoosh' }, { t: 6.0, type: 'whoosh' }, { t: 7.2, type: 'pop' },
  { t: 13.0, type: 'pop' }, { t: 16.5, type: 'ding' }, { t: 19.0, type: 'whoosh' }, { t: 21.6, type: 'pop' }, { t: 24.0, type: 'rise' },
];

// ---- 線画 ----
function stroke(g, c = '#cfe0ff', w = 6) { g.strokeStyle = c; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; }
function starfish(g, x, y, s, t = 0, c = '#ffb07a') {
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(Math.sin(t * 0.8) * 0.05);
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 38 : 100; i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  g.closePath(); g.fillStyle = 'rgba(255,176,122,0.15)'; g.fill(); stroke(g, c, 7); g.stroke();
  g.fillStyle = c; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; for (let k = 1; k <= 3; k++) { g.beginPath(); g.arc(Math.cos(a) * 22 * k, Math.sin(a) * 22 * k, 4, 0, 7); g.fill(); } }
  g.restore();
}
function octopus(g, x, y, s, t = 0, c = '#c9a6ff') {
  g.save(); g.translate(x, y); g.scale(s, s); stroke(g, c, 7);
  g.fillStyle = 'rgba(201,166,255,0.15)';
  g.beginPath(); g.ellipse(0, -60, 70, 85, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  for (let i = 0; i < 8; i++) {
    const x0 = -56 + i * 16, dir = (i - 3.5) / 3.5;
    g.beginPath(); g.moveTo(x0, 10);
    for (let k = 1; k <= 10; k++) { const u = k / 10; g.lineTo(x0 + dir * 70 * u + Math.sin(t * 2 + i + u * 5) * 12 * u, 10 + 110 * u); }
    g.stroke();
  }
  g.fillStyle = c; g.beginPath(); g.arc(-26, -50, 9, 0, 7); g.arc(26, -50, 9, 0, 7); g.fill();
  g.restore();
}
function human(g, x, y, s, c = '#ffffff') {
  g.save(); g.translate(x, y); g.scale(s, s); stroke(g, c, 7);
  g.beginPath(); g.moveTo(0, -40); g.lineTo(-24, 50); g.moveTo(0, -40); g.lineTo(24, 50); g.moveTo(0, -40); g.lineTo(0, -110);
  g.moveTo(0, -95); g.lineTo(-34, -50); g.moveTo(0, -95); g.lineTo(34, -50); g.stroke();
  g.fillStyle = c; g.beginPath(); g.arc(0, -135, 22, 0, 7); g.fill();
  g.restore();
}
// 目の断面（タコ・ヒトのどちらも「レンズ＋網膜」のカメラの目）
function eyeSection(g, x, y, s, c) {
  g.save(); g.translate(x, y); g.scale(s, s); stroke(g, c, 6);
  g.beginPath(); g.arc(0, 0, 100, 0.55, Math.PI * 2 - 0.55); g.stroke();
  g.lineWidth = 12; g.strokeStyle = 'rgba(255,107,107,0.8)'; g.beginPath(); g.arc(0, 0, 88, 0.9, Math.PI * 2 - 0.9); g.stroke();   // 網膜
  stroke(g, c, 6); g.fillStyle = 'rgba(95,212,255,0.25)'; g.beginPath(); g.ellipse(70, 0, 20, 42, 0, 0, 7); g.fill(); g.stroke();   // レンズ
  g.restore();
}

// 系統樹: 根 → 2つ。左＝前口動物、右＝後口動物
const ROOT = [540, 880], LNODE = [300, 680], RNODE = [740, 680];
const LEFT = [['タコ', 130], ['虫', 270], ['貝', 410]], RIGHT = [['ヒトデ', 580], ['ウニ', 660], ['ナマコ', 745], ['魚', 830], ['ヒト', 910]];
function branch(g, a, b, k, c, w = 8) {
  if (k <= 0) return; stroke(g, c, w);
  const mx = b[0], my = a[1];   // L字（系統樹らしく）
  g.beginPath(); g.moveTo(a[0], a[1]);
  const L1 = Math.abs(mx - a[0]), L2 = Math.abs(b[1] - my), L = (L1 + L2) * k;
  if (L <= L1) g.lineTo(a[0] + Math.sign(mx - a[0]) * L, a[1]);
  else { g.lineTo(mx, my); g.lineTo(mx, my + Math.sign(b[1] - my) * (L - L1)); }
  g.stroke();
}
function treeView(g, t, t0, showRight, hiRight) {
  const kRoot = clamp((t - t0) / 0.6, 0, 1), kSplit = clamp((t - t0 - 0.5) / 0.8, 0, 1);
  stroke(g, '#ffffff', 8); g.beginPath(); g.moveTo(ROOT[0], ROOT[1] + 60); g.lineTo(ROOT[0], ROOT[1] + 60 - 60 * kRoot); g.stroke();
  TK.text(g, '動物のはじまり', ROOT[0], ROOT[1] + 95, 40, { color: TK.C.sub, bold: false });
  branch(g, ROOT, LNODE, kSplit, '#c9a6ff');
  branch(g, ROOT, RNODE, kSplit, hiRight ? TK.C.acc : '#ffb07a');
  // 左の葉
  LEFT.forEach(([s, x], i) => {
    const k = clamp((t - t0 - 1.3 - i * 0.25) / 0.6, 0, 1);
    branch(g, LNODE, [x, 420], k, '#c9a6ff', 6);
    if (k > 0.8) TK.text(g, s, x, 380, 54, { color: '#e2d4ff' });
  });
  TK.text(g, '前口動物', LNODE[0] - 120, 740, 42, { color: '#c9a6ff', bold: false });
  if (!showRight) return;
  RIGHT.forEach(([s, x], i) => {
    const k = clamp((t - showRight - i * 0.3) / 0.6, 0, 1);
    branch(g, RNODE, [x, 420], k, hiRight && s === 'ヒト' ? TK.C.acc : '#ffb07a', 6);
    if (k > 0.8) TK.text(g, s, x, i % 2 ? 330 : 380, s === 'ヒト' ? 56 : 46, { color: s === 'ヒト' ? TK.C.acc : '#ffe2c4' });
  });
  TK.text(g, '後口動物', RNODE[0] + 110, 740, 42, { color: '#ffb07a', bold: false });
}
// 受精卵が分かれて、最初のくぼみ（原口）ができる。k: くぼみの深さ 0〜1
function embryo(g, cx, cy, k, mouth) {
  const R = 210, n = 28, d = k * 250;
  // 細胞の輪（くぼみの所は内側へ押しこまれる）
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + Math.PI / 2;   // 下から
    let x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    const off = Math.abs(((i / n + 0.5) % 1) - 0.5) * n;   // 下（i=0）からの距離（細胞の数）
    const push = d * Math.exp(-(off * off) / 6);
    y -= push; x = cx + (x - cx) * (1 - 0.55 * push / 250);
    g.fillStyle = 'rgba(89,227,154,0.22)'; g.strokeStyle = TK.C.green; g.lineWidth = 4;
    g.beginPath(); g.arc(x, y, 30, 0, 7); g.fill(); g.stroke();
  }
  if (k > 0.6) {   // 最初の穴
    const f = clamp((k - 0.6) / 0.3, 0, 1);
    g.save(); g.globalAlpha *= f;
    g.fillStyle = TK.C.acc; g.beginPath(); g.arc(cx, cy + R - 10, 16, 0, 7); g.fill();
    g.restore();
  }
  if (mouth > 0) {   // 口はあとから反対側に
    g.save(); g.globalAlpha *= mouth;
    g.fillStyle = TK.C.acc2; g.beginPath(); g.arc(cx, cy - R, 16, 0, 7); g.fill();
    g.restore();
  }
}

function draw(g, t) {
  // 0〜2: ヒトデとタコ、ヒトデに丸（1.0秒で）
  if (t < 2.0) {
    TK.hook(g, t, 0.0, 2.0, 'ヒトに近いのは？', { y: 260, size: 120 });
    const f = fade(t, -1, 2.0, 0.25);
    g.save(); g.globalAlpha = f;
    starfish(g, 290, 680, 1.5, t); octopus(g, 790, 660, 1.35, t);
    TK.text(g, 'ヒトデ', 290, 950, 64, { color: '#ffe2c4' }); TK.text(g, 'タコ', 790, 950, 64, { color: '#e2d4ff' });
    if (t > 1.0) {
      const k = TK.out((t - 1.0) / 0.4);
      stroke(g, TK.C.red, 14); g.beginPath(); g.arc(290, 680, 175, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); g.stroke();
      g.globalAlpha = f * clamp((t - 1.2) / 0.3, 0, 1); stroke(g, 'rgba(255,255,255,0.5)', 10);
      g.beginPath(); g.moveTo(700, 580); g.lineTo(880, 760); g.moveTo(880, 580); g.lineTo(700, 760); g.stroke();
    }
    g.restore();
  }
  // 2〜6: タコの目はヒトそっくり
  if (t >= 2.0 && t < 6.0) {
    const f = fade(t, 2.0, 6.0, 0.3);
    g.save(); g.globalAlpha = f;
    octopus(g, 540, 430, 1.1, t);
    eyeSection(g, 330, 830, 1.0, '#c9a6ff'); eyeSection(g, 750, 830, 1.0, '#ffffff');
    TK.text(g, 'タコの目', 330, 980, 46, { color: '#e2d4ff' }); TK.text(g, 'ヒトの目', 750, 980, 46);
    TK.text(g, '＝', 540, 830, 80, { color: TK.C.acc });
    g.restore();
    TK.note(g, t, 2.6, 6.0, '似ているのは、別々にできた形（収れん）。図は形のイメージ', { size: 30 });
  }
  // 6〜19: 系統樹
  if (t >= 6.0 && t < 19.0) {
    const f = fade(t, 6.0, 19.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, '動物の木', PW / 2, 150, 60, { color: TK.C.sub });
    treeView(g, t, 6.3, t >= 13.0 ? 13.3 : 0, t >= 16.5);
    if (t < 13.0) { octopus(g, 130, 250, 0.45, t); }
    if (t >= 14.0) { g.globalAlpha = f * clamp((t - 14) / 0.4, 0, 1); starfish(g, 580, 240, 0.5, t); human(g, 910, 280, 0.6, TK.C.acc); }
    g.restore();
    if (t >= 13.0) TK.note(g, t, 13.0, 19.0, '多くの研究で支持される分け方（疑う解析も一部にある）。枝の形は簡略', { size: 30 });
  }
  // 19〜24: 赤ちゃん（胚）の最初の穴
  if (t >= 19.0 && t < 24.0) {
    const f = fade(t, 19.0, 24.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, '受精卵が分かれて、くぼみができる', PW / 2, 210, 52, { color: TK.C.sub });
    embryo(g, PW / 2, 640, TK.out((t - 19.4) / 1.8), clamp((t - 22.6) / 0.5, 0, 1));
    if (t > 21.6) {
      g.globalAlpha = f * TK.pop(t, 21.6, 0.35);
      TK.text(g, '最初の穴 → [おしり]', PW / 2, 960, 64);
    }
    if (t > 22.6) { g.globalAlpha = f * clamp((t - 22.6) / 0.4, 0, 1); TK.text(g, '口はあとから', PW / 2, 350, 50, { color: TK.C.acc2 }); }
    g.restore();
    TK.note(g, t, 19.6, 24.0, '後口動物の多くは（例外もある）。図は形のイメージ', { size: 30 });
  }
  // 24〜28: ヒトデとヒト、ならぶ
  if (t >= 24.0) {
    const f = fade(t, 24.0, 29, 0.3), k = TK.out((t - 24.0) / 1.0);
    g.save(); g.globalAlpha = f;
    starfish(g, lerp(150, 340, k), 700, 1.3, t); human(g, lerp(930, 740, k), 760, 2.0);
    TK.card(g, 220, 230, 640, 130, { r: 65 }); TK.text(g, '同じ[後口動物]', PW / 2, 296, 76);
    g.restore();
  }
  if (t >= 26.0) TK.note(g, t, 26.0, 28.0, '出どころ: UCMP (Univ. of California Museum of Paleontology)\nIntroduction to the Deuterostomia', { size: 30 });
}

triviaStart({ out: 'tree-of-life-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
