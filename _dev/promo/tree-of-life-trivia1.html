<script>
'use strict';
// うんちく tree-of-life-1（型A ぜんぶ逆）「ヒトデは、タコよりヒトに近い」。台本は trivia/tree-of-life.md、直しは trivia/REVIEW.md
// 出どころ: UCMP Introduction to the Deuterostomia。分け方（後口動物／前口動物）は教科書どおり。疑う解析（Kapli ほか 2021）もあるので「多くの研究で」（REVIEW）
// 生きものはすべて線画（形はイメージ）。アプリの録画は使わない
const DUR = 28;
const subs = [
  { a: 0.0, b: 2.0, ja: 'ヒトに近いのは、タコじゃなくて、ヒトデ。', en: 'Closer to humans: not the octopus, but the starfish.', noBurn: true },
  { a: 2.0, b: 6.0, ja: 'タコはかしこくて、\n目のつくりも[ヒトそっくり]なのに。', en: 'Even though octopuses are smart\nand have eyes built much like ours.' },
  { a: 6.0, b: 13.0, ja: '動物の木は、早いうちに大きく[2つ]に分かれた。\n片方に、タコ・虫・貝。', en: 'The animal tree split in two early on.\nOne side: octopuses, insects, snails.' },
  { a: 13.0, b: 19.0, ja: 'もう片方に、ヒトデ・ウニ・ナマコと、\n魚、そして[ヒト]。', en: 'The other: starfish, sea urchins, sea cucumbers,\nfish, and us.' },
  { a: 19.0, b: 24.0, ja: '決め手は赤ちゃんのとき。体にできる最初の穴が、\n口じゃなくて[おしり]になるなかま。', en: 'The clue is in the embryo: the first opening\nbecomes the anus, not the mouth.' },
  { a: 24.0, b: 28.0, ja: 'ヒトもヒトデも、[おしりから先に]できた。', en: 'Humans and starfish: both started bottom first.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.0, type: 'ding' }, { t: 2.0, type: 'whoosh' }, { t: 6.0, type: 'whoosh' }, { t: 7.2, type: 'pop' },
  { t: 13.0, type: 'pop' }, { t: 16.5, type: 'ding' }, { t: 19.0, type: 'whoosh' }, { t: 21.6, type: 'pop' }, { t: 24.0, type: 'rise' },
];

/// ---- 図鑑の版画（PL.*）で描く生きもの ----
const LC = '#5a4a7a', RC = '#7a5530';   // 前口動物（左）・後口動物（右）の墨の色
// ---- 版画の道具（このページだけ。PL.* を組み合わせる）----
const TAU = Math.PI * 2;
// ローカル座標（右向き・足もとが y=0）から画面へ写す。dir=-1 で左向き
function mapper(x0, y0, s, rot = 0, dir = 1) { const c = Math.cos(rot), n = Math.sin(rot); return (x, y) => { x *= dir; return [x0 + s * (x * c - y * n), y0 + s * (x * n + y * c)]; }; }
// ローカル座標で道を作る。b(P) の P: M・L・Q・Z と E（楕円）
const lp = (m, b) => g => {
  const P = { M: (x, y) => g.moveTo(...m(x, y)), L: (x, y) => g.lineTo(...m(x, y)), Q: (a, c, x, y) => g.quadraticCurveTo(...m(a, c), ...m(x, y)), Z: () => g.closePath(),
    E: (cx, cy, rx, ry, rot = 0) => { for (let i = 0; i <= 40; i++) { const t = i / 40 * TAU, x = Math.cos(t) * rx, y = Math.sin(t) * ry, p = m(cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)); i ? g.lineTo(...p) : g.moveTo(...p); } g.closePath(); } };
  b(P);
};
// 手彩色＋かげの斜線＋墨の輪郭。o.lit: 光の当たる所（斜線を抜く）
function solid(g, path, color, o = {}) {
  PL.tint(g, path, color, o.a ?? 0.65);
  if (o.hatch !== false) PL.hatch(g, path, { angle: o.angle ?? 0.7, gap: o.gap ?? 9, w: o.hw ?? 1.8, not: o.lit, cx: o.cx, cy: o.cy });
  PL.ink(g, path, o.w ?? 5, o.ink || PL.INK);
}
// 墨の矢印（頭は手彩色＋輪郭）
function arrowPL(g, x0, y0, x1, y1, color = PL.INK, w = 8) {
  const a = Math.atan2(y1 - y0, x1 - x0), h = w * 3.4;
  PL.ink(g, gg => { gg.moveTo(x0, y0); gg.lineTo(x1 - Math.cos(a) * h * 0.7, y1 - Math.sin(a) * h * 0.7); }, w, color);
  const head = PL.poly([[x1, y1], [x1 - Math.cos(a - 0.42) * h, y1 - Math.sin(a - 0.42) * h], [x1 - Math.cos(a + 0.42) * h, y1 - Math.sin(a + 0.42) * h]]);
  PL.tint(g, head, color, 1); PL.ink(g, head, Math.max(2, w * 0.45), color);
}
// 答えの札: 手彩色の札（筆のルックでは字の下が濃くなり字と重なる）をやめ、紙の札に朱の二重わくで示す
function answerChoices(g, t, a, b, opts, o) {
  const card = TK.card; TK.card = (gg, x, y, w, h) => card(gg, x, y, w, h, {});
  try { TK.choices(g, t, a, b, opts, o); } finally { TK.card = card; }
  if (t < (o.reveal ?? Infinity) || t < a || t > b) return;
  const y = (o.y ?? PH * 0.34) + o.answer * ((o.h || 190) + (o.gap ?? 40)), h = o.h || 190, f = clamp((t - o.reveal) / 0.35, 0, 1) * fade(t, a, b, 0.3);
  g.save(); g.globalAlpha *= f; PL.ink(g, PL.rect(78, y - 12, PW - 156, h + 24), 6, PL.RED); PL.ink(g, PL.rect(90, y, PW - 180, h), 3, PL.RED); g.restore();
}

function ribbonPath(pts, ws) {
  const U = [], D = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    U.push([p[0] - dy * ws[i] / 2, p[1] + dx * ws[i] / 2]); D.push([p[0] + dy * ws[i] / 2, p[1] - dx * ws[i] / 2]);
  });
  return g => { U.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); for (let i = D.length - 1; i >= 0; i--) g.lineTo(...D[i]); g.closePath(); };
}
// ヒトデ（上から）。5本の腕・管足の列・かたいいぼ
function starfish(g, x, y, s, t = 0) {
  const rot = -Math.PI / 2 + Math.sin(t * 0.8) * 0.05, P = (a, r) => [x + Math.cos(a) * r * s, y + Math.sin(a) * r * s];
  const body = g2 => { for (let i = 0; i <= 10; i++) { const a = rot + i * Math.PI / 5, r = i % 2 ? 36 : 100, ap = rot + (i - 0.5) * Math.PI / 5; if (!i) { g2.moveTo(...P(a, r)); continue; } g2.quadraticCurveTo(...P(ap, i % 2 ? 72 : 60), ...P(a, r)); } g2.closePath(); };
  PL.tint(g, body, PL.T.rust, 0.7);
  PL.hatch(g, body, { angle: 0.8, gap: Math.max(5, 7 * s), w: Math.max(1.2, 1.2 * s), not: g2 => { g2.save(); g2.translate(-12 * s, -14 * s); body(g2); g2.restore(); }, cx: x, cy: y });
  PL.ink(g, gg => { for (let i = 0; i < 5; i++) { const a = rot + i * 2 * Math.PI / 5; for (let k = 1; k <= 4; k++) { const [px, py] = P(a, 18 * k + 4); gg.moveTo(px + 4 * s, py); gg.arc(px, py, 4 * s, 0, TAU); } } }, Math.max(1.2, 1.4 * s));   // いぼの列
  PL.ink(g, gg => { for (let i = 0; i < 5; i++) { const a = rot + i * 2 * Math.PI / 5; gg.moveTo(...P(a, 12)); gg.lineTo(...P(a, 90)); } }, Math.max(1, 1 * s), 'rgba(35,28,21,0.4)');   // 腕のすじ
  const mad = PL.circle(...P(rot + 0.6, 16), 6 * s); PL.tint(g, mad, PL.T.gold, 1); PL.ink(g, mad, 1.5);
  PL.ink(g, body, Math.max(3, 4.5 * s));
}
// タコ（横から。頭＝胴が上、8本の腕が下へ）
function octopus(g, x, y, s, t = 0) {
  const P = (px, py) => [x + px * s, y + py * s];
  const arms = [];
  for (let i = 0; i < 8; i++) {
    const x0 = -50 + i * 14.3, dir = (i - 3.5) / 3.5, pts = [], ws = [];
    for (let k = 0; k <= 14; k++) { const u = k / 14; pts.push(P(x0 + dir * 75 * u + Math.sin(t * 2 + i + u * 5) * 14 * u + Math.sin(u * 3 + i) * 6 * u, 4 + 120 * u - (1 - Math.abs(dir)) * 0 - 18 * u * u * Math.abs(dir))); ws.push((15 - 12 * u) * s); }
    arms.push({ pts, ws, back: i % 2 === 1 });
  }
  arms.filter(a => a.back).forEach(a => { const p = ribbonPath(a.pts, a.ws); PL.tint(g, p, PL.T.rose, 0.45); PL.ink(g, p, Math.max(1.6, 2.4 * s), 'rgba(35,28,21,0.6)'); });
  const mantle = g2 => { g2.moveTo(...P(-52, 8)); g2.bezierCurveTo(...P(-78, -40), ...P(-70, -150), ...P(4, -160)); g2.bezierCurveTo(...P(78, -165), ...P(80, -40), ...P(52, 8)); g2.closePath(); };
  PL.tint(g, mantle, PL.T.rose, 0.75);
  PL.ink(g, gg => { for (let k = 0; k < 14; k++) { const [px, py] = P(-40 + (k * 37) % 80, -140 + (k * 53) % 120); gg.moveTo(px + 4 * s, py); gg.arc(px, py, 4 * s, 0, TAU); } }, Math.max(1, 1.2 * s), 'rgba(35,28,21,0.5)');   // 皮ふのいぼ
  PL.hatch(g, mantle, { angle: 0.8, gap: Math.max(5, 7 * s), w: Math.max(1.2, 1.3 * s), not: g2 => { g2.save(); g2.translate(-18 * s, -20 * s); mantle(g2); g2.restore(); }, cx: x, cy: y });
  PL.ink(g, mantle, Math.max(3, 4.5 * s));
  arms.filter(a => !a.back).forEach(a => {
    const p = ribbonPath(a.pts, a.ws);
    PL.tint(g, p, PL.T.rose, 0.7); PL.hatch(g, p, { angle: 0.8, gap: Math.max(4, 5 * s), w: Math.max(1, 1.1 * s), cx: x, cy: y });
    PL.ink(g, gg => { for (let k = 2; k < 13; k += 2) { const [px, py] = a.pts[k], r = a.ws[k] * 0.22; gg.moveTo(px + r, py); gg.arc(px, py, r, 0, TAU); } }, Math.max(1, 1.2 * s));   // 吸盤
    PL.ink(g, p, Math.max(2, 3 * s));
  });
  [-1, 1].forEach(sd => { const e = PL.ellipse(...P(sd * 34, -30), 13 * s, 10 * s), pu = PL.rect(...P(sd * 34 - 7, -32), 14 * s, 4 * s); PL.tint(g, e, PL.T.sand, 1); PL.ink(g, e, Math.max(1.5, 2.5 * s)); PL.tint(g, pu, PL.INK, 1); });   // 目（横長のひとみ）
}
// ヒト（影絵）。x, y はもとの絵のまん中、s はもとの倍率
function human(g, x, y, s) { PL.walker(g, x, y + 50 * s, 0, 0, 185 * s / 258); }
// 目の断面（タコ・ヒトのどちらも「レンズ＋網膜」のカメラの目）
function eyeSection(g, x, y, s, inkC) {
  const ball = g2 => { g2.moveTo(x + Math.cos(0.55) * 100 * s, y + Math.sin(0.55) * 100 * s); g2.arc(x, y, 100 * s, 0.55, TAU - 0.55); g2.quadraticCurveTo(x + 112 * s, y, x + Math.cos(0.55) * 100 * s, y + Math.sin(0.55) * 100 * s); g2.closePath(); };
  PL.tint(g, ball, PL.T.sand, 0.6);
  PL.hatch(g, ball, { angle: 0.8, gap: 9, w: 1.6, not: PL.circle(x - 25 * s, y - 25 * s, 100 * s), cx: x, cy: y });
  const ret = g2 => { g2.arc(x, y, 92 * s, 0.9, TAU - 0.9); g2.arc(x, y, 80 * s, TAU - 0.9, 0.9, true); g2.closePath(); };
  PL.tint(g, ret, PL.T.rust, 0.9); PL.ink(g, ret, 2, PL.RED);
  const nerve = PL.poly([[x - 98 * s, y - 14 * s], [x - 150 * s, y - 10 * s], [x - 150 * s, y + 10 * s], [x - 98 * s, y + 14 * s]]);
  solid(g, nerve, PL.T.sand, { a: 0.8, gap: 6, hw: 1.2, w: 3 });
  const lens = PL.ellipse(x + 70 * s, y, 20 * s, 42 * s); PL.tint(g, lens, PL.T.sky, 0.8); PL.ink(g, lens, 4, TK.C.acc2);
  PL.ink(g, ball, 5, inkC);
  PL.ink(g, gg => { for (let i = -1; i <= 1; i++) { gg.moveTo(x + 160 * s, y + i * 30 * s); gg.lineTo(x + 70 * s, y + i * 30 * s); gg.lineTo(x - 82 * s, y - i * 22 * s); } }, 1.6, 'rgba(47,95,122,0.7)');   // 光の道（レンズで集まる）
}

// 系統樹: 根 → 2つ。左＝前口動物、右＝後口動物
const ROOT = [540, 880], LNODE = [300, 680], RNODE = [740, 680];
const LEFT = [['タコ', 130], ['虫', 270], ['貝', 410]], RIGHT = [['ヒトデ', 580], ['ウニ', 660], ['ナマコ', 745], ['魚', 830], ['ヒト', 910]];
function branch(g, a, b, k, c, w = 8) {
  if (k <= 0) return;
  const mx = b[0], my = a[1];   // L字（系統樹らしく）
  const L1 = Math.abs(mx - a[0]), L2 = Math.abs(b[1] - my), L = (L1 + L2) * k;
  PL.ink(g, gg => { gg.moveTo(a[0], a[1]); if (L <= L1) gg.lineTo(a[0] + Math.sign(mx - a[0]) * L, a[1]); else { gg.lineTo(mx, my); gg.lineTo(mx, my + Math.sign(b[1] - my) * (L - L1)); } }, w, c);
  if (k >= 1) { const n = PL.circle(a[0], a[1], w * 0.9); PL.tint(g, n, c, 1); }   // 分かれ目の点
}
function treeView(g, t, t0, showRight, hiRight) {
  const kRoot = clamp((t - t0) / 0.6, 0, 1), kSplit = clamp((t - t0 - 0.5) / 0.8, 0, 1);
  PL.ink(g, gg => { gg.moveTo(ROOT[0], ROOT[1] + 60); gg.lineTo(ROOT[0], ROOT[1] + 60 - 60 * kRoot); }, 8);
  TK.text(g, '動物のはじまり', ROOT[0], ROOT[1] + 95, 40, { color: TK.C.sub, bold: false });
  branch(g, ROOT, LNODE, kSplit, LC);
  branch(g, ROOT, RNODE, kSplit, hiRight ? PL.RED : RC);
  LEFT.forEach(([s, x], i) => {
    const k = clamp((t - t0 - 1.3 - i * 0.25) / 0.6, 0, 1);
    branch(g, LNODE, [x, 420], k, LC, 6);
    if (k > 0.8) TK.text(g, s, x, 380, 54, { color: LC });
  });
  TK.text(g, '前口動物', LNODE[0] - 120, 740, 42, { color: LC, bold: false });
  if (!showRight) return;
  RIGHT.forEach(([s, x], i) => {
    const k = clamp((t - showRight - i * 0.3) / 0.6, 0, 1);
    branch(g, RNODE, [x, 420], k, hiRight && s === 'ヒト' ? PL.RED : RC, 6);
    if (k > 0.8) TK.text(g, s, x, i % 2 ? 330 : 380, s === 'ヒト' ? 56 : 46, { color: s === 'ヒト' ? PL.RED : RC });
  });
  TK.text(g, '後口動物', RNODE[0] + 110, 740, 42, { color: RC, bold: false });
}
// 受精卵が分かれて、最初のくぼみ（原口）ができる。k: くぼみの深さ 0〜1
function embryo(g, cx, cy, k, mouth) {
  const R = 210, n = 28, d = k * 250, cells = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + Math.PI / 2;   // 下から
    let x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    const off = Math.abs(((i / n + 0.5) % 1) - 0.5) * n;
    const push = d * Math.exp(-(off * off) / 6);
    y -= push; x = cx + (x - cx) * (1 - 0.55 * push / 250);
    cells.push([x, y]);
  }
  const all = g2 => cells.forEach(([x, y]) => PL.circle(x, y, 30)(g2));
  PL.tint(g, all, PL.T.leaf, 0.55);
  PL.hatch(g, all, { angle: 0.8, gap: 8, w: 1.4, not: g2 => cells.forEach(([x, y]) => PL.circle(x - 10, y - 12, 30)(g2)) });
  PL.ink(g, gg => cells.forEach(([x, y]) => { gg.moveTo(x + 7, y); gg.arc(x, y, 7, 0, TAU); }), 1.6, 'rgba(35,28,21,0.6)');   // 核
  PL.ink(g, all, 3.5);
  if (k > 0.6) {   // 最初の穴
    g.save(); g.globalAlpha *= clamp((k - 0.6) / 0.3, 0, 1);
    const h = PL.circle(cx, cy + R - 10, 16); PL.tint(g, h, PL.RED, 1); PL.ink(g, h, 3, PL.RED);
    g.restore();
  }
  if (mouth > 0) {   // 口はあとから反対側に
    g.save(); g.globalAlpha *= mouth;
    const h = PL.circle(cx, cy - R, 16); PL.tint(g, h, TK.C.acc2, 1); PL.ink(g, h, 3, TK.C.acc2);
    g.restore();
  }
}

function draw(g, t) {
  // 0〜2: ヒトデとタコ、ヒトデに丸（1.0秒で）
  if (t < 2.0) {
    TK.hook(g, t, 0.0, 2.0, 'ヒトに近いのは？', { y: 260, size: 120 });
    const f = fade(t, -1, 2.0, 0.25);
    g.save(); g.globalAlpha = f;
    starfish(g, 290, 680, 1.5, t); octopus(g, 790, 720, 1.25, t);
    TK.text(g, 'ヒトデ', 290, 950, 64, { color: RC }); TK.text(g, 'タコ', 790, 950, 64, { color: LC });
    if (t > 1.0) {
      const k = TK.out((t - 1.0) / 0.4);
      PL.ink(g, gg => { gg.arc(290, 680, 175, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); }, 12, PL.RED);
      g.globalAlpha = f * clamp((t - 1.2) / 0.3, 0, 1);
      PL.ink(g, gg => { gg.moveTo(700, 560); gg.lineTo(880, 740); gg.moveTo(880, 560); gg.lineTo(700, 740); }, 10, 'rgba(35,28,21,0.5)');
    }
    g.restore();
  }
  // 2〜6: タコの目はヒトそっくり
  if (t >= 2.0 && t < 6.0) {
    const f = fade(t, 2.0, 6.0, 0.3);
    g.save(); g.globalAlpha = f;
    octopus(g, 540, 460, 1.0, t);
    eyeSection(g, 330, 830, 0.9, LC); eyeSection(g, 760, 830, 0.9, PL.INK);
    TK.text(g, 'タコの目', 330, 980, 46, { color: LC }); TK.text(g, 'ヒトの目', 760, 980, 46);
    TK.text(g, '＝', 545, 830, 80, { color: PL.RED });
    g.restore();
    TK.note(g, t, 2.6, 6.0, '似ているのは、別々にできた形（収れん）。図は形のイメージ', { size: 30 });
  }
  // 6〜19: 系統樹
  if (t >= 6.0 && t < 19.0) {
    const f = fade(t, 6.0, 19.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, '動物の木', PW / 2, 150, 60, { color: TK.C.sub });
    treeView(g, t, 6.3, t >= 13.0 ? 13.3 : 0, t >= 16.5);
    if (t < 13.0) octopus(g, 130, 270, 0.42, t);
    if (t >= 14.0) { g.globalAlpha = f * clamp((t - 14) / 0.4, 0, 1); starfish(g, 580, 240, 0.5, t); human(g, 910, 270, 0.6); }
    g.restore();
    if (t >= 13.0) TK.note(g, t, 13.0, 19.0, '多くの研究で支持される分け方（疑う解析も一部にある）。枝の形は簡略', { size: 30 });
  }
  // 19〜24: 赤ちゃん（胚）の最初の穴
  if (t >= 19.0 && t < 24.0) {
    const f = fade(t, 19.0, 24.0, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, '受精卵が分かれて、くぼみができる', PW / 2, 210, 52, { color: TK.C.sub });
    embryo(g, PW / 2, 640, TK.out((t - 19.4) / 1.8), clamp((t - 22.6) / 0.5, 0, 1));
    if (t > 21.6) { g.globalAlpha = f * Math.min(1, TK.pop(t, 21.6, 0.35)); TK.text(g, '最初の穴 → [おしり]', PW / 2, 960, 64); }
    if (t > 22.6) { g.globalAlpha = f * clamp((t - 22.6) / 0.4, 0, 1); TK.text(g, '口はあとから', PW / 2, 340, 50, { color: TK.C.acc2 }); }
    g.restore();
    TK.note(g, t, 19.6, 24.0, '後口動物の多くは（例外もある）。図は形のイメージ', { size: 30 });
  }
  // 24〜28: ヒトデとヒト、ならぶ
  if (t >= 24.0) {
