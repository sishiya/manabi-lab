<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script>
'use strict';
// うんちく動画 う2: バラバラのメトロノームも、動く板にのせるとそろう（40秒＋締め。縦で録る: ?short。README「うんちく動画」）
// アプリの描画ループは止めて（inject.raf）、計算の時刻を下の表で決めて SIM.advance・__mesy.draw をこちらで呼ぶ。
// 条件: 5台・ばらばら・ばらつき 0.1%・van der Pol（アプリの初期値の押し方）。そろい具合と板のゆれは setup で測って字幕に入れる
const SEG = [   // 動画の時刻 a〜b で、計算の時刻を from から rate 倍で進める。pin = 板をおさえる。新しいはじまりは reset
  { a: 0, b: 6, from: 0, rate: 1, pin: false, reset: true },
  { a: 6, b: 18, from: 6, rate: 4, pin: false },
  { a: 18, b: 21.5, from: 54, rate: 1, pin: false },
  { a: 21.5, b: 99, from: 0, rate: 4, pin: true, reset: true },
];
const OPT = { n: 5, start: 'rand', spread: 0.001, addMass: 0, damp: 0, esc: 'vdp' };
const segAt = t => SEG.find(s => t >= s.a && t < s.b);
const simT = t => { const s = segAt(t); return s.from + (t - s.a) * s.rate; };
const M = { syncT: 0, rFree: 0, rPin: 0, mm: 0 };   // setup で測る
const CAPS = [
  { a: 6.0, b: 17.5, main: 'ひとりでに、そろっていく', sub: '', en: ['They fall into step on their own', ''] },
  { a: 18.0, b: 21.3, main: '', sub: '', en: ['', ''] },
  { a: 21.8, b: 28.8, main: '', sub: '板をおさえると、いつまでもそろわない', en: ['', 'Hold the board still, and they never line up'] },
  { a: 29.2, b: 35.0, main: '板をおさえる・台数を変える', sub: '自分で確かめられます', en: ['Hold the board, change how many', 'Try it yourself'] },
];
function fillCaps() {
  CAPS[0].sub = `5台がそろうまで 約${M.syncT}秒（ここは 4倍の早送り）`;
  CAPS[0].en[1] = `About ${M.syncT} s for all five to line up (shown at 4× speed)`;
  CAPS[1].main = `秘密は、板が 約${M.mm}mm ゆれること`; CAPS[1].sub = 'カチッのたびに、板がほんの少し押される';
  CAPS[1].en = [`The secret: the board sways about ${M.mm} mm`, 'Every swing gives the board a tiny push'];
  CAPS[2].main = '板をおさえてみると…';
  CAPS[2].en[0] = 'Now hold the board still…';
}
const NAME = 'メトロノームがそろうまで', NAME_EN = 'Metronomes Falling into Step';
const Q = 'バラバラのメトロノーム、板にのせると？', Q_EN = 'Out-of-step metronomes on a board… then what?';
const BGM = new URLSearchParams(location.search).get('bgm') || 'promo_trivia_clock_v1';
const TICKS = [];   // カチの音を鳴らす動画の時刻（等倍の場面だけ。早送りは鳴らさない）
let cur = null, curSeg = null;   // いまアプリに入っている計算の時刻と場面
function goTo(w, t) {   // アプリの計算を動画の時刻 t の状態にする（戻るときは場面のはじめからやり直す）
  const SIM = w.__mesy.SIM, s = segAt(t), want = simT(t);
  if (curSeg !== s || cur === null || want < cur - 1e-9) {
    let k = SEG.indexOf(s); while (!SEG[k].reset) k--;   // その場面がつながっている、いちばん前のはじまり
    SIM.reset(OPT); SIM.S.sys.pinned = s.pin; SIM.S.speed = 1; SIM.S.playing = true;
    cur = SEG[k].from; curSeg = s;
  }
  while (cur < want - 1e-9) { const d = Math.min(5, want - cur); SIM.advance(d); cur += d; }
}
promoStart({
  name: 'うんちく: ' + NAME, out: 'metronome-sync-trivia1', src: '../../metronome-sync/index.html', iw: 540, ih: 960, dur: SHORT_END + IDENT_CLOSE,
  inject: { raf: true, dpr: 2, top: true },   // top: <head> のないページなので、差しかえを先頭に入れる（promo.js の注意）
  subs: () => [
    { a: 0.6, b: 5.6, ja: Q + '\n【うんちく】' + NAME, en: Q_EN + '\nDid you know? / ' + NAME_EN },
    ...capSubs(CAPS),
    { a: 35.2, b: SHORT_END, ja: NAME + '\nブラウザで動かせます。動きは運動方程式から計算しています', en: NAME_EN + '\nRuns in your browser. The motion is computed from the equations of motion' },
  ],
  music: { style: 'file', file: `out/bgm/${BGM}.ogg`, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }],
    async extra(ctx, out) {   // メトロノームのカチ（アプリの音と同じく短い音。BGM の音量とは別）
      const bus = ctx.createGain(); bus.gain.value = 0.22; bus.connect(out);
      for (const [t, i] of TICKS) {
        const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1800 + 140 * i;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.001); g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
        const p = ctx.createStereoPanner(); p.pan.value = (i - 2) * 0.3;
        o.connect(g); g.connect(p); p.connect(bus); o.start(t); o.stop(t + 0.05);
      }
    } },
  ready: w => w.__mesy && w.__mesy.SIM.S.sys,
  setup(w) {
    const SIM = w.__mesy.SIM;
    // 測る: そろい具合が 0.98 をこえる時刻（グラフでも線が 0 に集まって見える）・おさえたときのそろい具合・そろったあとの板のゆれ
    SIM.reset(OPT); SIM.S.sys.pinned = false; SIM.S.speed = 1; SIM.S.playing = true; SIM.S.onTick = null;
    let syncT = 0; for (let t = 0; t < 120; t += 1) { SIM.advance(1); if (!syncT && SIM.order() > 0.98) syncT = t + 1; }
    let lo = 1, hi = -1; for (let i = 0; i < 2000; i++) { SIM.advance(0.005); const x = SIM.S.sys.y[0]; lo = Math.min(lo, x); hi = Math.max(hi, x); }
    const mx = (hi - lo) / 2;   // ゆれの振れはば（板が少しずつずれていくぶんは入れない）
    M.rFree = SIM.order();
    SIM.reset(OPT); SIM.S.sys.pinned = true; SIM.advance(10); SIM.advance(10); SIM.advance(10); SIM.advance(10); SIM.advance(10); SIM.advance(10); M.rPin = SIM.order();
    M.syncT = Math.round(syncT / 5) * 5; M.mm = mx * 1000 < 1.5 ? 1 : Math.round(mx * 1000 * 10) / 10;
    console.log('measure', syncT, mx, M.rFree, M.rPin);
    fillCaps();
    // カチの時刻: 等倍の場面（rate 1）だけ、動画の時刻に直して集める
    let seg = null;
    SIM.S.onTick = i => { if (seg && seg.rate === 1) TICKS.push([seg.a + (SIM.S.sys.t - seg.from) / seg.rate, i]); };
    for (const s of SEG) {
      if (s.reset) { SIM.reset(OPT); SIM.S.sys.pinned = s.pin; }
      seg = s; const len = (Math.min(s.b, SHORT_END) - s.a) * s.rate;
      for (let d = 0; d < len - 1e-9; d += 5) SIM.advance(Math.min(5, len - d));
    }
    SIM.S.onTick = null; cur = null; curSeg = null;
    // アプリの音（カチ）は止めておく（動画の音はこちらで作る）
    return w.document.getElementById('cv');
  },
  renderAt(t, w) { goTo(w, t); w.__mesy.draw(); },
  drawSource(g, w, OW, OH) {   // 上は文字の場所（0〜470）、まん中にアプリの図、下にずれのグラフ
    const cv = w.document.getElementById('cv'), gv = w.document.getElementById('gv'), k = OW / 1080;
    g.fillStyle = '#0f1724'; g.fillRect(0, 0, OW, OH);
    const h1 = 1080 * cv.height / cv.width;
    g.drawImage(cv, 0, 470 * k, OW, h1 * k);
    const gw = 1000, gh = gw * gv.height / gv.width, gy = 470 + h1 + 90;
    g.drawImage(gv, 40 * k, gy * k, gw * k, gh * k);
    g.fillStyle = '#b9bfcc'; g.font = `bold ${26 * k}px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText('1台目とのずれ（0 の線に集まると、そろった）', 52 * k, (gy - 22) * k);
  },
  overlay(g, t, w) {
    drawTop(g, t, 0.6, 5.6, Q, '【うんちく】' + NAME, true);
    for (const c of CAPS) drawTop(g, t, c.a, c.b, c.main, c.sub);
    // 早送り・板をおさえた の札（図の上の空いている所）
    const s = segAt(t), lab = [s.rate > 1 ? `早送り ×${s.rate}` : '', s.pin ? '板をおさえた' : ''].filter(Boolean).join('・');
    if (lab && t < 35.2) {
      g.shadowBlur = 0; setFont(g, 34, true); const tw = g.measureText(lab).width + 44, y = 640;
      g.fillStyle = s.pin ? 'rgba(220,90,60,0.9)' : 'rgba(255,200,80,0.92)'; g.beginPath(); g.roundRect(PW / 2 - tw / 2, y - 30, tw, 60, 30); g.fill();
      g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(lab, PW / 2, y + 1);
    }
    drawEnd(g, t, 35.2, NAME, 'ブラウザで動かせます。動きは運動方程式から計算しています',
      '値と式: Pantaleone (2002) American Journal of Physics 70, 992');
    drawIdentMini(g, t, 0.3);
    drawIdent(g, t, SHORT_END);
  },
  errors: w => w.__mesyErr,
});
// 文字は上の空き（0〜470）に
function drawTop(g, t, a, b, main, sub, big) {
  const f = fade(t, a, b, big ? 0.8 : 0.5); if (f <= 0 || (!main && !sub)) return;
  prep(g); g.globalAlpha = f;
  drawBlock(g, [{ s: main, size: big ? 84 : 64, color: '#fff', bold: true }, { s: sub, size: big ? 40 : 38, color: '#f2c79a', gap: big ? 14 : 10 }], big ? 300 : 270, 'center');
  g.globalAlpha = 1; g.shadowBlur = 0;
}
</script>
</body>
</html>
