<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script>
'use strict';
// 台本: 体内ダイブ（59秒）。カプセル内視鏡になって口から入り、自動航行で肛門まで（アプリの時間で約52秒）。
// 場所の名前はアプリの表示（#locName）を読む。字幕の文はアプリの場所の説明（REG の d）を短くしたもの
const AUTO_AT = 5;   // ここまでは口の中で題名、そのあと自動航行
const DESC = {
  '口腔': '歯で食べ物をかみ砕き、唾液と混ぜる',
  '咽頭': '空気と食べ物の交差点',
  '食道': '長さ約25cm。筋肉の波（蠕動）で胃へ運ぶ',
  '胃': '胃液は強い酸性（pH1.5〜3.5）',
  '十二指腸': '胆汁と膵液が流れ込み、黄色く染まる',
  '空腸': 'ひだと絨毛で表面積を広げ、栄養を吸収する',
  '回腸': 'ビタミンB12や胆汁酸を吸収する',
  '上行結腸': '腸内細菌が食物繊維を発酵させ、水分を吸収していく',
  '横行結腸': '細菌のはたらきで、便が茶色くなる',
  '下行結腸': 'ここまで来ると、便はかなり固まっている',
  'S状結腸': '直腸の手前で、便をためておく',
  '直腸': '便がたまって壁が伸びると、便意が起こる',
  '肛門': '2つの括約筋で開け閉めする',
};
// 英語（YouTube の字幕（CC）に）: [場所の名前, 説明]
const DESC_EN = {
  '口腔': ['Mouth', 'Teeth crush the food and mix it with saliva'],
  '咽頭': ['Pharynx', 'Where the paths for air and food cross'],
  '食道': ['Esophagus', 'About 25 cm long. Waves of muscle (peristalsis) carry food to the stomach'],
  '胃': ['Stomach', 'Gastric juice is strongly acidic (pH 1.5 to 3.5)'],
  '十二指腸': ['Duodenum', 'Bile and pancreatic juice flow in and stain it yellow'],
  '空腸': ['Jejunum', 'Folds and villi increase the surface area to absorb nutrients'],
  '回腸': ['Ileum', 'Absorbs vitamin B12 and bile acids'],
  '上行結腸': ['Ascending colon', 'Gut bacteria ferment fiber, and water is absorbed'],
  '横行結腸': ['Transverse colon', 'Bacteria turn the stool brown'],
  '下行結腸': ['Descending colon', 'By now the stool is fairly firm'],
  'S状結腸': ['Sigmoid colon', 'Stool is stored here, just before the rectum'],
  '直腸': ['Rectum', 'When stool stretches its wall, you feel the urge to go'],
  '肛門': ['Anus', 'Two sphincter muscles open and close it'],
};
// 字幕データは場所が変わった時刻で決まるので、録画しながら作る（録り終えてから保存しなおす）
let SUBS = [];
const TITLE_SUB = { a: 0.6, b: AUTO_AT - 0.2, ja: '体内ダイブ\nカプセル内視鏡になって、口から入ってみる', en: 'Body Dive\nBecome a capsule endoscope and go in through the mouth' };
const END_SUB = { a: 55.2, b: 59, ja: '体内ダイブ\n口から肛門まで、消化管の中を3Dで進めます。食べ物も選べます', en: 'Body Dive\nTravel through the digestive tract in 3D, from mouth to anus. You can also become a food (on-screen text in Japanese)' };
function addSub(t, n) {
  if (t >= 54.5) return;   // 終わりの画面の直前からは字幕を出さない（出てもすぐ消えるので）
  const last = SUBS[SUBS.length - 1]; if (last) last.b = t;
  SUBS.push({ a: t, b: 55, ja: n + '\n' + DESC[n], en: DESC_EN[n].join('\n') });
}
let place = '口腔', placeEn = 'Cavitas oris', placeAt = 0, frameN = 0, autoOn = false;
promoStart({
  name: '体内ダイブ', out: 'body-dive', src: '../../body-dive/index.html', iw: 2560, ih: 1440, dur: 59, peek: 3,
  // アプリは devicePixelRatio を 1.5 までにしているので、iframe を 2560×1440 にして 3840×2160 で描かせる
  inject: { dpr: 2, raf: true },
  short: { iw: 1440, ih: 2560 },
  // 体の中の旅: 少し低めの明るい和音
  music: { style: 'journey', root: 110 },
  ready: w => w.__bd && w.__rafQ && w.__rafQ.length,
  setup(w) {
    appStep(w, 2);
    w.__bd.begin('capsule', 'mouth', 'hungry');   // サムネイルと同じカプセル内視鏡・口から
    appStep(w, 2);
    return w.document.querySelector('canvas');
  },
  async renderAt(t, w) {
    const d = w.document;
    if (t === 0) { place = '口腔'; placeEn = 'Cavitas oris'; placeAt = 0; frameN = 0; SUBS = []; addSub(AUTO_AT + 0.3, '口腔'); }
    if (t >= AUTO_AT && !autoOn) { d.getElementById('btnAuto').click(); autoOn = true; }   // 自動航行（Space と同じ）
    appStep(w, 1);
    // 場所の名前は 0.22 秒の演出のあとで書きかわるので、10コマごとに実際に少し待って読む
    if (++frameN % 10 === 0) {
      await sleep(240);
      const n = d.getElementById('locName').textContent;
      if (n !== place && DESC[n]) { place = n; placeEn = d.getElementById('locEn').textContent; placeAt = t; addSub(t, n); }
    }
  },
  overlay(g, t) {
    const f = clamp((t - 0.3) / 0.6, 0, 1) * (1 - clamp((t - 55) / 0.6, 0, 1));
    // 場所の名前（左上。アプリの表示と同じ位置）
    if (f > 0) {
      prep(g); g.textAlign = 'left'; g.globalAlpha = f;
      txt(g, place, 70, 100, 80, '#fff', true);
      txt(g, placeEn, 72, 165, 30, '#f2c79a');
      g.globalAlpha = 1; g.shadowBlur = 0;
    }
    drawTitle(g, t, 0.6, AUTO_AT - 0.2, '体内ダイブ', 'カプセル内視鏡になって、口から入ってみる');
    // 場所ごとの説明（場所が変わるたびに出す）
    if (t > AUTO_AT + 0.3 && t < 55) drawCaps(g, t, [{ a: placeAt, b: 55, main: DESC[place] || '' }]);
    drawEnd(g, t, 55.2, '体内ダイブ', '口から肛門まで、消化管の中を3Dで進めます。食べ物も選べます',
      'おもな出どころ: Betts ほか（2022）OpenStax『Anatomy and Physiology 2e』ほか（アプリのスタート画面）');
  },
  subs: () => [TITLE_SUB, ...SUBS, END_SUB], subsAfterRecord: true,
  errors: w => [w.__bdErr].filter(Boolean),
});
</script>
</body>
</html>
