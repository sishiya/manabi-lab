<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく phonograph-2（型A ぜんぶ逆）「世界最古の録音はエジソン…じゃない」。台本は trivia/phonograph.md。?short で録る
// First Sounds（スコットの 1860-04-09 の録音、再生するつもりはなかった／2008年に紙を撮って計算で音に）。
// 「最古」は言いきらず「いまわかっている最古の一つ」。本物の紙の写真・復元音は使わない（すすの紙と線は自分で描いた）。曲名・歌詞は出さない
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.0, ja: '世界最古の録音は、エジソン…じゃない', en: 'The oldest recording isn’t Edison’s.', noBurn: true },
  { a: 3.0, b: 10.0, ja: '1860年、パリのスコット。\nすすを塗った紙に、声の波を[線で描いた]', en: 'In 1860, Scott in Paris\ntraced a voice as a line on soot-covered paper.' },
  { a: 10.0, b: 17.0, ja: 'でも、それを音に戻す方法は作らなかった。\n[見るための]記録だった', en: 'He never built a way to play it back.\nIt was a record to look at.' },
  { a: 17.0, b: 25.0, ja: '[148年後]の2008年。紙を細かく撮って、\n線の形を計算で音に戻した', en: '148 years later, in 2008, researchers scanned the paper\nand turned the line back into sound by computation.' },
  { a: 25.0, b: 31.0, ja: '形が残っていれば、\n音は[計算で]取りもどせる', en: 'If the shape survives,\nthe sound can be recovered by computation.' },
  { a: 31.0, b: 35.0, ja: 'エジソンがはじめてだったのは、\n自分の機械で[聴きかえせる]録音', en: 'Edison’s first was a recording\nhis own machine could play back.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.0, type: 'buzz' }, { t: 1.8, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.0, type: 'rise' },
  { t: 10.0, type: 'whoosh' }, { t: 11.0, type: 'buzz' }, { t: 17.0, type: 'whoosh' }, { t: 18.0, type: 'rise' }, { t: 21.5, type: 'ding' },
  { t: 25.0, type: 'pop' }, { t: 31.0, type: 'whoosh' }, { t: 31.6, type: 'pop' }, { t: 32.2, type: 'pop' }, { t: 32.8, type: 'pop' },
];
const sig = u => Math.sin(u * 40) * (0.5 + 0.5 * Math.sin(u * 7)) * Math.exp(-((u - 0.5) ** 2) * 3) + 0.25 * Math.sin(u * 95);

function cross(g, cx, cy, rx, ry, k) {
  g.save(); g.strokeStyle = TK.C.red; g.lineWidth = 20; g.lineCap = 'round'; g.globalAlpha *= k;
  g.beginPath(); g.moveTo(cx - rx, cy - ry); g.lineTo(cx + rx, cy + ry); g.moveTo(cx + rx, cy - ry); g.lineTo(cx - rx, cy + ry); g.stroke(); g.restore();
}
// すすの紙に、線をひっかいて描く（u まで）
function soot(g, x, y, w, h, u) {
  g.save();
  g.fillStyle = '#23262e'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#e8e2d0'; g.lineWidth = 3; g.beginPath();
  const n = Math.floor(240 * u);
  for (let i = 0; i <= n; i++) { const v = i / 240, xx = x + 20 + v * (w - 40), yy = y + h / 2 + sig(v) * h * 0.3; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
  g.stroke();
  if (u > 0 && u < 1) { const v = n / 240; g.fillStyle = TK.C.acc; g.beginPath(); g.arc(x + 20 + v * (w - 40), y + h / 2 + sig(v) * h * 0.3, 10, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
function eye(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = '#e8f0ff'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(-90, 0); g.quadraticCurveTo(0, -80, 90, 0); g.quadraticCurveTo(0, 80, -90, 0); g.stroke();
  g.beginPath(); g.arc(0, 0, 30, 0, Math.PI * 2); g.stroke(); g.fillStyle = '#e8f0ff'; g.beginPath(); g.arc(0, 0, 12, 0, Math.PI * 2); g.fill(); g.restore();
}
function speaker(g, x, y, s, t, on) {
  g.save(); g.translate(x, y); g.scale(s, s); g.strokeStyle = '#e8f0ff'; g.lineWidth = 6; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-60, -25); g.lineTo(-30, -25); g.lineTo(10, -60); g.lineTo(10, 60); g.lineTo(-30, 25); g.lineTo(-60, 25); g.closePath(); g.stroke();
  if (on) { g.strokeStyle = TK.C.acc; for (let i = 0; i < 3; i++) { g.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 4 - i)); g.beginPath(); g.arc(20, 0, 30 + i * 24, -0.7, 0.7); g.stroke(); } }
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック
  if (t < 3.0) {
    g.save(); g.globalAlpha = TK.pop(t, 0.1, 0.4);
    TK.card(g, 110, 280, 740, 220);
    TK.text(g, '最古の録音', PW / 2 - 60, 345, 60, { color: TK.C.sub });
    TK.text(g, '＝ エジソン（1877）', PW / 2 - 60, 435, 72);
    g.restore();
    cross(g, PW / 2 - 60, 390, 300, 90, TK.pop(t, 1.0, 0.3));
    TK.hook(g, t, 1.8, 3.0, 'じつは [1860年]', { y: 720, size: 130 });
  }
  // 3〜10: すすの紙に線
  if (t >= 3.0 && t < 10.0) {
    g.save(); g.globalAlpha = TK.pop(t, 3.1, 0.4);
    TK.text(g, '1860年4月9日  パリ', PW / 2 - 60, 230, 66, { color: TK.C.acc });
    TK.text(g, 'É.-L. スコット', PW / 2 - 60, 320, 50);
    g.restore();
    soot(g, 90, 420, 780, 360, clamp((t - 4.0) / 4.5, 0, 1));
    TK.text(g, 'すすを塗った紙（線は自分で描いたたとえ）', PW / 2 - 60, 840, 36, { color: TK.C.dim, bold: false });
    TK.note(g, t, 3.5, 10, 'いまわかっている最古の録音の一つ', { size: 32 });
  }
  // 10〜17: 見るための記録
  if (t >= 10.0 && t < 17.0) {
    soot(g, 90, 220, 780, 260, 1);
    eye(g, 300, 650, 1.2);
    speaker(g, 660, 650, 1.4, t, false);
    cross(g, 660, 650, 90, 90, TK.pop(t, 11.0, 0.3));
    TK.text(g, '見る', 300, 790, 56, { color: TK.C.green });
    TK.text(g, '聴く機械はなかった', 660, 790, 46, { color: TK.C.red });
  }
  // 17〜25: 2008年、撮って計算で音に
  if (t >= 17.0 && t < 25.0) {
    const k = clamp((t - 18.0) / 3.0, 0, 1);
    soot(g, 90, 300, 780, 260, 1);
    g.save(); g.strokeStyle = TK.C.acc2; g.lineWidth = 6; g.shadowColor = TK.C.acc2; g.shadowBlur = 20;
    const sx = 90 + 780 * k; g.beginPath(); g.moveTo(sx, 280); g.lineTo(sx, 580); g.stroke(); g.restore();
    TK.text(g, '細かく撮る', 480, 620, 44, { color: TK.C.acc2 });
    g.save(); g.globalAlpha = TK.pop(t, 21.5, 0.4); TK.text(g, '[2008年]（148年後）', PW / 2 - 60, 210, 70); g.restore();
    if (t > 21.5) { speaker(g, PW / 2 - 60, 800, 1.4, t, true); TK.text(g, '計算で音に', PW / 2 - 60, 940, 48, { color: TK.C.acc }); }
    TK.note(g, t, 18, 25, '復元した音はこの動画では流しません', { size: 32 });
  }
  // 25〜31: 形 → 数 → 音
  if (t >= 25.0 && t < 31.0) {
    const rows = [{ y: 300, l: '線の形' }, { y: 560, l: '数（点の高さ）' }, { y: 820, l: '音の波' }];
    rows.forEach((r, i) => {
      const k = TK.pop(t, 25.2 + i * 1.2, 0.4); if (k <= 0) return;
      g.save(); g.globalAlpha = clamp(k, 0, 1);
      TK.text(g, r.l, 110, r.y - 110, 44, { align: 'left', color: TK.C.sub });
      if (i === 0) { g.strokeStyle = '#e8e2d0'; g.lineWidth = 4; g.beginPath(); for (let j = 0; j <= 160; j++) { const v = j / 160, x = 110 + v * 740, y = r.y + sig(v) * 70; j ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
      if (i === 1) { g.fillStyle = TK.C.acc2; for (let j = 0; j <= 40; j++) { const v = j / 40, x = 110 + v * 740, y = r.y + sig(v) * 70; g.beginPath(); g.arc(x, y, 7, 0, Math.PI * 2); g.fill(); g.fillRect(x - 1.5, r.y, 3, y - r.y); } }
      if (i === 2) { g.strokeStyle = TK.C.acc; g.lineWidth = 6; g.beginPath(); for (let j = 0; j <= 160; j++) { const v = j / 160, x = 110 + v * 740, y = r.y + sig((v + t * 0.3) % 1) * 70; j ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
      g.restore();
    });
  }
  // 31〜35: 年表
  if (t >= 31.0) {
    const items = [{ y: 1860, l: '見るための記録', c: '#e8e2d0', a: 31.6 }, { y: 1877, l: '聴きかえせる録音（エジソン）', c: TK.C.acc, a: 32.2 }, { y: 2008, l: '1860年の線を、計算で音に', c: TK.C.acc2, a: 32.8 }];
    g.save(); g.strokeStyle = 'rgba(255,255,255,0.3)'; g.lineWidth = 8; g.beginPath(); g.moveTo(170, 260); g.lineTo(170, 900); g.stroke(); g.restore();
    items.forEach((it, i) => {
      if (t < it.a) return;
      const y = 300 + i * 270;
      g.save(); g.globalAlpha = TK.pop(t, it.a, 0.35);
      g.fillStyle = it.c; g.beginPath(); g.arc(170, y, 22, 0, Math.PI * 2); g.fill();
      TK.text(g, String(it.y), 230, y - 30, 72, { align: 'left', color: it.c });
      TK.text(g, it.l, 230, y + 50, 46, { align: 'left' });
      g.restore();
    });
    TK.note(g, t, 32.2, 35, '出どころ: First Sounds（firstsounds.org）', { size: 30 });
  }
}

triviaStart({ out: 'phonograph-trivia2', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
