<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく phonograph-2（型A ぜんぶ逆）「世界最古の録音はエジソン…じゃない」。台本は trivia/phonograph.md。?short で録る
// First Sounds（スコットの 1860-04-09 の録音、再生するつもりはなかった／2008年に紙を撮って計算で音に）。
// 「最古」は言いきらず「いまわかっている最古の一つ」。本物の紙の写真・復元音は使わない（すすの紙と線は自分で描いた）。曲名・歌詞は出さない
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.0, ja: '世界最古の録音は、エジソン…じゃない', en: 'The oldest recording isn’t Edison’s.', noBurn: true },
  { a: 3.0, b: 10.0, ja: '1860年、パリのスコット。\nすすを塗った紙に、声の波を[線で描いた]', en: 'In 1860, Scott in Paris\ntraced a voice as a line on soot-covered paper.' },
  { a: 10.0, b: 17.0, ja: 'でも、それを音に戻す方法は作らなかった。\n[見るための]記録だった', en: 'He never built a way to play it back.\nIt was a record to look at.' },
  { a: 17.0, b: 25.0, ja: '[148年後]の2008年。紙を細かく撮って、\n線の形を計算で音に戻した', en: '148 years later, in 2008, researchers scanned the paper\nand turned the line back into sound by computation.' },
  { a: 25.0, b: 31.0, ja: '形が残っていれば、\n音は[計算で]取りもどせる', en: 'If the shape survives,\nthe sound can be recovered by computation.' },
  { a: 31.0, b: 35.0, ja: 'エジソンがはじめてだったのは、\n自分の機械で[聴きかえせる]録音', en: 'Edison’s first was a recording\nhis own machine could play back.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.0, type: 'buzz' }, { t: 1.8, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.0, type: 'rise' },
  { t: 10.0, type: 'whoosh' }, { t: 11.0, type: 'buzz' }, { t: 17.0, type: 'whoosh' }, { t: 18.0, type: 'rise' }, { t: 21.5, type: 'ding' },
  { t: 25.0, type: 'pop' }, { t: 31.0, type: 'whoosh' }, { t: 31.6, type: 'pop' }, { t: 32.2, type: 'pop' }, { t: 32.8, type: 'pop' },
];
const sig = u => Math.sin(u * 40) * (0.5 + 0.5 * Math.sin(u * 7)) * Math.exp(-((u - 0.5) ** 2) * 3) + 0.25 * Math.sin(u * 95);

// ---- 絵は「図鑑の版画」（trivia-plate.js の PL.*）。本物の紙の写真は使わない（すすの紙と線は自分で描いたたとえ）----
function cross(g, cx, cy, r, k) { if (k <= 0) return; g.save(); g.globalAlpha *= clamp(k, 0, 1); PL.ink(g, gg => { gg.moveTo(cx - r, cy - r); gg.lineTo(cx + r, cy + r); gg.moveTo(cx + r, cy - r); gg.lineTo(cx - r, cy + r); }, 18, PL.RED); g.restore(); }
// すすを塗った紙に、豚の毛の針で線をひっかく（u まで）。紙のふちは少し波うつ
function soot(g, x, y, w, h, u) {
  const p = PL.poly([[x, y], [x + w, y + 6], [x + w - 4, y + h], [x + 6, y + h - 4]]);
  PL.tint(g, p, '#2a2622', 0.9);
  PL.hatch(g, p, { angle: 0.2, gap: 9, w: 1, color: 'rgba(120,110,95,0.35)' });   // すすのむら
  PL.ink(g, p, 5);
  const n = Math.floor(240 * u);
  if (n > 1) PL.ink(g, gg => { for (let i = 0; i <= n; i++) { const v = i / 240, xx = x + 20 + v * (w - 40), yy = y + h / 2 + sig(v) * h * 0.3; i ? gg.lineTo(xx, yy) : gg.moveTo(xx, yy); } }, 3, '#efe6d2');
  if (u > 0 && u < 1) {   // 針（毛）と、それをつけた振動板の腕
    const v = n / 240, px = x + 20 + v * (w - 40), py = y + h / 2 + sig(v) * h * 0.3;
    PL.ink(g, gg => { gg.moveTo(px, py); gg.lineTo(px - 30, y - 70); }, 3, PL.RED);
    const arm = PL.rect(px - 60, y - 100, 60, 30); PL.tint(g, arm, PL.T.wood, 0.9); PL.ink(g, arm, 3);
  }
}
// 目
function eye(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const lid = gg => { gg.moveTo(-90, 0); gg.quadraticCurveTo(0, -80, 90, 0); gg.quadraticCurveTo(0, 80, -90, 0); gg.closePath(); };
  PL.tint(g, lid, '#fbf6ea', 0.9);
  const iris = PL.circle(0, 0, 32); PL.tint(g, iris, PL.T.brown, 0.85); PL.hatch(g, iris, { angle: 0.7, gap: 6, w: 1.4, cx: 0, cy: 0 }); PL.ink(g, iris, 3);
  PL.tint(g, PL.circle(0, 0, 13), PL.INK, 1);
  PL.ink(g, lid, 6);
  PL.ink(g, gg => { for (let i = 1; i < 8; i++) { const a = i / 8, xx = -90 + a * 180, yy = -Math.sin(a * Math.PI) * 40; gg.moveTo(xx, yy); gg.lineTo(xx + (a - 0.5) * 30, yy - 22); } }, 3);
  g.restore();
}
// 聴くためのラッパ（音の出口）。on で音の弧
function horn(g, x, y, s, t, on) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const bell = gg => { gg.moveTo(-70, -10); gg.lineTo(-10, -12); gg.quadraticCurveTo(30, -20, 60, -70); gg.lineTo(60, 70); gg.quadraticCurveTo(30, 20, -10, 12); gg.lineTo(-70, 10); gg.closePath(); };
  PL.tint(g, bell, PL.T.gold, 0.8); PL.hatch(g, bell, { angle: 0.8, gap: 7, w: 1.4, not: PL.rect(-80, -80, 160, 72), cx: 0, cy: 0 }); PL.ink(g, bell, 5);
  PL.ink(g, PL.ellipse(60, 0, 14, 70), 4);
  if (on) PL.ink(g, gg => { for (let i = 0; i < 3; i++) { const r = 34 + i * 26 + ((t * 40) % 26); gg.moveTo(70 + Math.cos(-0.7) * r, Math.sin(-0.7) * r); gg.arc(70, 0, r, -0.7, 0.7); } }, 4, PL.RED);
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック
  if (t < 3.0) {
    g.save(); g.globalAlpha *= clamp(TK.pop(t, 0.1, 0.4), 0, 1);
    TK.card(g, 90, 280, 680, 220);
    PL.label(g, '最古の録音', 430, 345, 58);
    PL.label(g, '＝ エジソン（1877）', 430, 435, 58);
    g.restore();
    cross(g, 910, 390, 80, TK.pop(t, 1.0, 0.3));   // 札の横に朱の ✕（字の上には描かない）
    TK.hook(g, t, 1.8, 3.0, 'じつは [1860年]', { y: 720, size: 130 });
  }
  // 3〜10: すすの紙に線
  if (t >= 3.0 && t < 10.0) {
    g.save(); g.globalAlpha *= clamp(TK.pop(t, 3.1, 0.4), 0, 1);
    PL.label(g, '1860年4月9日  パリ', 100, 220, 64, { align: 'left', color: PL.RED });
    PL.label(g, 'É.-L. スコット', 100, 305, 50, { align: 'left' });
    g.restore();
    soot(g, 90, 480, 900, 340, clamp((t - 4.0) / 4.5, 0, 1));
    PL.label(g, 'すすを塗った紙（線は自分で描いたたとえ）', 540, 880, 36, { bold: false });
    TK.note(g, t, 3.5, 10, 'いまわかっている最古の録音の一つ', { size: 32 });
  }
  // 10〜17: 見るための記録
  if (t >= 10.0 && t < 17.0) {
    soot(g, 90, 220, 900, 260, 1);
    eye(g, 300, 680, 1.2);
    horn(g, 700, 680, 1.4, t, false);
    cross(g, 720, 680, 100, TK.pop(t, 11.0, 0.3));
    PL.label(g, '見る', 300, 830, 56, { color: PL.GREEN });
    PL.label(g, '聴く機械はなかった', 720, 830, 46, { color: PL.RED });
  }
  // 17〜25: 2008年、撮って計算で音に
  if (t >= 17.0 && t < 25.0) {
    const k = clamp((t - 18.0) / 3.0, 0, 1);
    soot(g, 90, 320, 900, 260, 1);
    const sx = 90 + 900 * k;
    PL.ink(g, gg => { gg.moveTo(sx, 300); gg.lineTo(sx, 600); }, 6, TK.C.acc2);   // 撮る線
    PL.ink(g, gg => { gg.moveTo(sx - 10, 300); gg.lineTo(sx + 10, 300); gg.moveTo(sx - 10, 600); gg.lineTo(sx + 10, 600); }, 4, TK.C.acc2);
    PL.label(g, '細かく撮る', 540, 650, 44, { color: TK.C.acc2 });
    g.save(); g.globalAlpha *= clamp(TK.pop(t, 21.5, 0.4), 0, 1); PL.label(g, '[2008年]（148年後）', 100, 220, 68, { align: 'left' }); g.restore();
    if (t > 21.5) { horn(g, 440, 820, 1.3, t, true); PL.label(g, '計算で音に', 440, 960, 48, { color: PL.RED }); }
    TK.note(g, t, 18, 25, '復元した音はこの動画では流しません', { size: 32 });
  }
  // 25〜31: 形 → 数 → 音
  if (t >= 25.0 && t < 31.0) {
    const rows = [{ y: 330, l: '線の形' }, { y: 600, l: '数（点の高さ）' }, { y: 870, l: '音の波' }];
    rows.forEach((r, i) => {
      const k = clamp(TK.pop(t, 25.2 + i * 1.2, 0.4), 0, 1); if (k <= 0) return;
      g.save(); g.globalAlpha *= k;
      PL.label(g, r.l, 110, r.y - 115, 44, { align: 'left' });
      PL.ink(g, gg => { gg.moveTo(110, r.y); gg.lineTo(850, r.y); }, 1.4, 'rgba(35,28,21,0.4)');   // 基準の線
      if (i === 0) PL.ink(g, gg => { for (let j = 0; j <= 160; j++) { const v = j / 160, x = 110 + v * 740, y = r.y + sig(v) * 70; j ? gg.lineTo(x, y) : gg.moveTo(x, y); } }, 4);
      if (i === 1) { PL.ink(g, gg => { for (let j = 0; j <= 40; j++) { const v = j / 40, x = 110 + v * 740, y = r.y + sig(v) * 70; gg.moveTo(x, r.y); gg.lineTo(x, y); } }, 2.4, TK.C.acc2); const dots = gg => { for (let j = 0; j <= 40; j++) { const v = j / 40; PL.circle(110 + v * 740, r.y + sig(v) * 70, 7)(gg); } }; PL.tint(g, dots, TK.C.acc2, 0.95); PL.ink(g, dots, 2, TK.C.acc2); }
      if (i === 2) PL.ink(g, gg => { for (let j = 0; j <= 160; j++) { const v = j / 160, x = 110 + v * 740, y = r.y + sig((v + t * 0.3) % 1) * 70; j ? gg.lineTo(x, y) : gg.moveTo(x, y); } }, 6, PL.RED);
      if (i > 0) { PL.ink(g, gg => { gg.moveTo(950, r.y - 220); gg.lineTo(950, r.y - 70); gg.moveTo(935, r.y - 90); gg.lineTo(950, r.y - 70); gg.lineTo(965, r.y - 90); }, 4); }   // 下へ（↓）
      g.restore();
    });
  }
  // 31〜35: 年表
  if (t >= 31.0) {
    const items = [{ y: 1860, l: '見るための記録', c: PL.INK, a: 31.6 }, { y: 1877, l: '聴きかえせる録音（エジソン）', c: PL.RED, a: 32.2 }, { y: 2008, l: '1860年の線を、計算で音に', c: TK.C.acc2, a: 32.8 }];
    PL.ink(g, gg => { gg.moveTo(170, 240); gg.lineTo(170, 940); for (let i = 0; i < 15; i++) { gg.moveTo(170, 250 + i * 46); gg.lineTo(150, 250 + i * 46); } }, 4);
    items.forEach((it, i) => {
      if (t < it.a) return;
      const y = 300 + i * 270;
      g.save(); g.globalAlpha *= clamp(TK.pop(t, it.a, 0.35), 0, 1);
      const dot = PL.circle(170, y, 22); PL.tint(g, dot, i === 1 ? PL.T.rust : i === 2 ? PL.T.sky : PL.T.gray, 0.95); PL.ink(g, dot, 4);
      PL.label(g, String(it.y), 230, y - 30, 72, { align: 'left', color: it.c });
      PL.label(g, it.l, 230, y + 50, 46, { align: 'left' });
      g.restore();
    });
    TK.note(g, t, 32.2, 35, '出どころ: First Sounds（firstsounds.org）', { size: 30 });
  }
}

triviaStart({ out: 'phonograph-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
