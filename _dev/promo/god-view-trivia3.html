<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく god-view-3（型D 3つ並べる）「すわっているだけで、30秒に1万km」。台本は trivia/god-view.md。?short で録る
// 自転: 2π×6378.137km/86164s×cos35.7°=0.3778 km/s → 30秒 11.3 km
// 公転: 29.78 km/s（NASA Earth Fact Sheet）→ 893 km
// 宇宙背景放射に対して: 369.82 km/s（Planck 2018 I）→ 11,095 km（地球の直径 12,742 km の 87%）
const DUR = 30.6;
const V = { spin: 0.3778, orbit: 29.78, cmb: 369.82 };
const subs = [
  { a: 0.0, b: 3.0, ja: 'すわっているだけのあなた。この30秒で、どれだけ動く？\n3つ目が、いちばん遠い', en: 'You are just sitting there. How far do you move in these 30 seconds?\nThe third one goes farthest', noBurn: true },
  { a: 3.0, b: 10.0, ja: '1つ目。[地球の自転]\n日本のあたりだと、30秒で約11km', en: 'One: Earth’s spin.\nAround Japan, about 11 km in 30 seconds' },
  { a: 10.0, b: 18.0, ja: '2つ目。太陽のまわりを回る[公転]\n30秒で、約900km', en: 'Two: our orbit around the Sun.\nAbout 900 km in 30 seconds' },
  { a: 18.0, b: 27.0, ja: '3つ目。宇宙のはじめの光、"[宇宙の残り火]"にくらべると\n太陽系ごと秒速370km。30秒で[約1万1千km]', en: 'Three: compared with the afterglow of the early universe,\nthe whole Solar System moves at 370 km/s. About 11,000 km in 30 s' },
  { a: 27.0, b: 30.6, ja: '…はい、30秒。\nいま、[地球1個ぶん近く]、動きました', en: '...and that’s 30 seconds.\nYou just moved almost one Earth-width' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.0, type: 'pop' }, { t: 6.2, type: 'ding' },
  { t: 10.0, type: 'whoosh' }, { t: 11.0, type: 'pop' }, { t: 13.2, type: 'ding' },
  { t: 18.0, type: 'rise' }, { t: 20.0, type: 'pop' }, { t: 22.4, type: 'ding' }, { t: 27.0, type: 'tick' }, { t: 30.0, type: 'ding' },
];

function seated(g, x, y, s) {   // いすにすわる棒の人。x,y はいすの足もと
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(160,190,255,0.7)'; g.lineWidth = 8;
  g.beginPath(); g.moveTo(-60, 0); g.lineTo(-60, -90); g.lineTo(40, -90); g.lineTo(40, 0); g.moveTo(-60, -90); g.lineTo(-60, -200); g.stroke();
  g.strokeStyle = '#fff'; g.lineWidth = 9;
  g.beginPath(); g.moveTo(-40, -100); g.lineTo(-40, -200); g.moveTo(-40, -100); g.lineTo(40, -100); g.lineTo(40, 0); g.lineTo(70, 0);
  g.moveTo(-40, -180); g.lineTo(10, -140); g.lineTo(40, -150); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(-40, -228, 24, 0, Math.PI * 2); g.fill();
  g.restore();
}
function earth(g, x, y, r, rot, f = 1) {
  g.save(); g.globalAlpha *= f;
  const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  gr.addColorStop(0, '#5fa8ff'); gr.addColorStop(1, '#1d4fa3');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.clip();
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2;   // 経線（回って見える）
  for (let i = 0; i < 12; i++) { const a = rot + i * Math.PI / 6, c = Math.cos(a); if (Math.sin(a) < 0) continue; g.beginPath(); g.ellipse(x, y, Math.abs(c) * r, r, 0, 0, Math.PI * 2); g.stroke(); }
  g.restore();
}
function meter(g, t, a, b, v, unit, o = {}) {   // 30秒で動く距離の数字
  if (t < a || t > b) return;
  g.save(); g.globalAlpha = fade(t, a, b, 0.3);
  TK.text(g, '30秒で', PW / 2, o.y - 120, 48, { color: TK.C.sub });
  const k = TK.out((t - a) / 1.6);
  TK.text(g, (o.fmt || (x => Math.round(x).toLocaleString('ja-JP')))(v * k) + ' ' + unit, PW / 2, o.y, o.size || 150, { color: TK.C.acc, stroke: 'rgba(0,0,0,0.5)' });
  g.restore();
}
// 宇宙の残り火（宇宙背景放射）っぽい、ぼんやりした背景（かざり）
const blobs = Array.from({ length: 70 }, (_, i) => { const r = Math.sin(i * 12.9898) * 43758.5453; const f = r - Math.floor(r); const r2 = Math.sin(i * 78.233) * 12345.678; const f2 = r2 - Math.floor(r2); return [f * PW, 120 + f2 * 1000, 60 + ((f * 7) % 1) * 120, (f2 * 3) % 1]; });
function cmb(g, f) {
  g.save(); g.globalAlpha *= f * 0.5;
  for (const [x, y, r, c] of blobs) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c < 0.5 ? 'rgba(255,140,90,0.55)' : 'rgba(90,150,255,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
  g.restore();
}

function draw(g, t) {
  const tt = Math.min(t, 30);
  // ずっと右上に経った時間
  TK.clock(g, tt, 0, 31);
  // 0〜3: フック
  if (t < 3.0) {
    seated(g, 560, 1080, 1.6);
    TK.hook(g, t, 0.0, 3.0, 'この30秒で、\nあなたは[何km]動く？', { y: 380, size: 112 });
  }
  // 3〜10: 自転
  if (t >= 3.0 && t < 10.0) {
    const f = fade(t, 3.0, 10.0, 0.3);
    TK.text(g, '① 地球の自転', PW / 2, 330, 68);
    const rot = t * 0.8, x = 540, y = 620, r = 210;
    earth(g, x, y, r, rot, f);
    // 日本のあたり（北緯36°）の点が、手前を横切る
    const lat = 36 * Math.PI / 180, ph = ((t - 3.0) * 0.8) % (Math.PI * 2) - 1.2;
    if (Math.cos(ph) > 0) { g.save(); g.globalAlpha = f; g.fillStyle = TK.C.acc; g.beginPath(); g.arc(x + Math.sin(ph) * r * Math.cos(lat), y - r * Math.sin(lat), 16, 0, Math.PI * 2); g.fill(); g.restore(); }
    meter(g, t, 4.0, 10.0, 11.3, 'km', { y: 1000, fmt: v => v.toFixed(1) });
  }
  // 10〜18: 公転
  if (t >= 10.0 && t < 18.0) {
    const f = fade(t, 10.0, 18.0, 0.3), cx = 540, cy = 560, R = 320;
    TK.text(g, '② 太陽のまわりの公転', PW / 2, 330, 68);
    g.save(); g.globalAlpha = f;
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 3; g.setLineDash([10, 12]); g.beginPath(); g.ellipse(cx, cy, R, R * 0.42, 0, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    const sg = g.createRadialGradient(cx, cy, 0, cx, cy, 80); sg.addColorStop(0, '#fff6c8'); sg.addColorStop(0.6, '#ffc24a'); sg.addColorStop(1, 'rgba(255,140,40,0)');
    g.fillStyle = sg; g.beginPath(); g.arc(cx, cy, 80, 0, Math.PI * 2); g.fill();
    g.restore();
    const a = 0.6 + (t - 10) * 0.5;
    earth(g, cx + Math.cos(a) * R, cy + Math.sin(a) * R * 0.42, 34, t, f);
    meter(g, t, 11.0, 18.0, 893, 'km', { y: 880 });
    if (t > 14.0) { g.save(); g.globalAlpha = fade(t, 14.0, 18.0, 0.3); TK.text(g, '東京〜札幌（直線 約830km）より遠い', PW / 2, 1010, 44, { color: TK.C.sub, bold: false }); g.restore(); }
    TK.note(g, t, 11.0, 18.0, '平均の速さ 秒速29.78km（季節で少しかわる）', { size: 30 });
  }
  // 18〜27: 宇宙の残り火にくらべて
  if (t >= 18.0 && t < 27.0) {
    const f = fade(t, 18.0, 27.0, 0.4);
    cmb(g, f);
    TK.text(g, '③ 宇宙の残り火にくらべて', PW / 2, 330, 64);
    // 太陽系（点）が矢印の向きに進む
    g.save(); g.globalAlpha = f;
    const x0 = 260 + ((t - 18) * 30) % 80, y0 = 470;
    g.strokeStyle = TK.C.acc; g.fillStyle = TK.C.acc; g.lineWidth = 12; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x0 + 80, y0); g.lineTo(x0 + 520, y0); g.stroke();
    g.beginPath(); g.moveTo(x0 + 560, y0); g.lineTo(x0 + 500, y0 - 36); g.lineTo(x0 + 500, y0 + 36); g.fill();
    const sg = g.createRadialGradient(x0, y0, 0, x0, y0, 60); sg.addColorStop(0, '#fff6c8'); sg.addColorStop(0.6, '#ffc24a'); sg.addColorStop(1, 'rgba(255,140,40,0)');
    g.fillStyle = sg; g.beginPath(); g.arc(x0, y0, 60, 0, Math.PI * 2); g.fill();
    TK.text(g, '太陽系ごと 秒速370km', 540, 565, 50);
    g.restore();
    meter(g, t, 20.0, 27.0, 11095, 'km', { y: 770, size: 120 });
    if (t > 22.4) {   // 地球の直径とくらべる
      TK.bars(g, t, 22.4, 27.0, [
        { label: '30秒で動く', v: 11095 / 12742, color: TK.C.acc, text: '1万1095 km' },
        { label: '地球の直径', v: 1, color: TK.C.acc2, text: '1万2742 km' },
      ], { y: 845, gap: 145, size: 44, stagger: 0.3 });
    }
    TK.note(g, t, 18.0, 27.0, '宇宙背景放射（宇宙の残り火）を止まった目印にしたときの速さ', { size: 30 });
  }
  // 27〜30.6: 3つをならべて、30秒で止まる
  if (t >= 27.0) {
    const f = fade(t, 27.0, 32, 0.3);
    g.save(); g.globalAlpha = f;
    const rows = [['自転', V.spin, 1], ['公転', V.orbit, 0], ['宇宙の残り火にくらべて', V.cmb, 0]];
    rows.forEach(([s, v, d], i) => {
      const y = 380 + i * 210;
      TK.card(g, 90, y - 80, 900, 160);
      TK.text(g, s, 130, y - 32, 44, { align: 'left', color: TK.C.sub, maxw: 760 });
      TK.text(g, (v * tt).toLocaleString('ja-JP', { maximumFractionDigits: d }) + ' km', 950, y + 28, 76, { align: 'right', color: i === 2 ? TK.C.acc : '#fff' });
    });
    if (t >= 30.0) TK.text(g, '[地球1個ぶん]近く', PW / 2, 1000, 90);
    g.restore();
    TK.note(g, t, 27.0, 30.6, '出どころ: NASA Earth Fact Sheet・Planck Collaboration (2020) A&A 641, A1\n自転は東京（北緯35.7°）', { size: 28 });
  }
}

triviaStart({ out: 'god-view-trivia3', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
