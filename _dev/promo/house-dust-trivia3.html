<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく house-dust-3（型C この動画のあいだに）「1日に、1円玉1枚ぶん」。台本は trivia/house-dust.md。?short で録る
// 皮ふのかけら 30〜90 mg/時（Weschler ほか 2011 の紹介、ScienceDaily）→ 1日 0.7〜2.2 g ≒ 1円玉（1g）1〜2枚。かけらの油（スクアレン）でオゾンが 2〜15% へる。
// 右上の「この動画のあいだに」の mg は 30〜90 mg/時 × 経った秒数 で計算（からだの話なので字幕だけ・こわがらせない言い方）
const DUR = 30;
const subs = [
  { a: 0.0, b: 1.8, ja: 'この動画のあいだにも、あなたは…', en: 'Even while you watch this…', noBurn: true },
  { a: 1.8, b: 3.6, ja: '皮ふのかけらを、落としている', en: 'you’re shedding tiny skin flakes' },
  { a: 3.6, b: 10.0, ja: '1時間に、約[30〜90ミリグラム]', en: 'About 30–90 milligrams an hour' },
  { a: 10.0, b: 16.0, ja: '1日なら、ほぼ[1円玉1枚]（1グラム）', en: 'In a day, about the weight of a 1-yen coin (1 gram)' },
  { a: 16.0, b: 24.0, ja: 'でも、ただのごみじゃない。\nかけらには[皮ふの油]がついている', en: 'But it’s not just junk.\nThe flakes carry skin oil' },
  { a: 24.0, b: 30.0, ja: 'その油が、部屋の空気のオゾンを\n[2〜15%]減らしている、という研究も', en: 'One study found that oil cuts indoor ozone\nby about 2–15%' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.8, type: 'tick' }, { t: 3.6, type: 'whoosh' }, { t: 4.4, type: 'pop' },
  { t: 10.0, type: 'rise' }, { t: 12.6, type: 'ding' }, { t: 14.0, type: 'ding' }, { t: 16.0, type: 'whoosh' },
  { t: 18.0, type: 'pop' }, { t: 19.0, type: 'pop' }, { t: 24.0, type: 'pop' }, { t: 26.5, type: 'ding' },
];
const SKIN = '#f3d6c4', OIL = '#ffcf4a', O3 = '#7fe0ff';
const rnd = (i, k = 1) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };

function person(g, x, y, s, t) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -40); g.lineTo(-20, 0); g.moveTo(0, -40); g.lineTo(20, 0); g.moveTo(0, -40); g.lineTo(0, -95);
  g.moveTo(0, -85); g.lineTo(-24, -55); g.moveTo(0, -85); g.lineTo(24, -55); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -112, 16, 0, Math.PI * 2); g.fill();
  g.restore();
  // かけら（小さな点が少しずつ落ちる）
  for (let i = 0; i < 26; i++) {
    const ph = (t * 0.25 + rnd(i)) % 1, px = x + (rnd(i, 2) - 0.5) * 70 * s, py = y - (110 - ph * 110) * s;
    g.globalAlpha = 0.8 * (1 - ph * 0.6); g.fillStyle = SKIN; g.beginPath(); g.arc(px, py, 4, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
}
// 「この動画のあいだに」の量（右上の下）
function shedNow(g, t) {
  const lo = t * 30 / 3600, hi = t * 90 / 3600;
  TK.card(g, 140, 300, 800, 120, { r: 40 });
  TK.text(g, 'この動画のあいだに  ' + lo.toFixed(2) + '〜' + hi.toFixed(2) + ' mg', PW / 2, 360, 52);
}
function coin(g, x, y, r, k) {
  if (k <= 0) return;
  g.save(); g.translate(x, y); g.scale(k, k);
  g.fillStyle = '#d6dbe2'; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#9aa3ad'; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, r - 12, 0, Math.PI * 2); g.stroke();
  TK.text(g, '1', 0, 4, r * 0.9, { color: '#5b6470', blur: 0 });
  g.restore();
}
function flake(g, t) {
  const cx = PW / 2, cy = 640;
  g.save(); g.translate(cx, cy);
  g.fillStyle = SKIN; g.globalAlpha = 0.9; g.beginPath();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, r = 230 + Math.sin(i * 2.7) * 50; i ? g.lineTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 0.8) : g.moveTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 0.8); }
  g.closePath(); g.fill(); g.globalAlpha = 1;
  const k = clamp((t - 18.0) / 1.5, 0, 1);
  for (let i = 0; i < 14; i++) {
    const x = (rnd(i, 3) - 0.5) * 520, y = (rnd(i, 4) - 0.5) * 300, r = (14 + rnd(i, 5) * 18) * TK.back(clamp(k * 1.5 - i * 0.04, 0, 1));
    g.fillStyle = OIL; g.globalAlpha = 0.85; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.restore(); g.globalAlpha = 1;
}
// オゾンの点が、かけらの油に当たって消える
function ozone(g, t) {
  const cx = PW / 2, cy = 700, k = clamp((t - 24.6) / 4.0, 0, 1);
  g.fillStyle = SKIN; g.globalAlpha = 0.9; g.beginPath(); g.ellipse(cx, cy + 160, 330, 90, 0, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  for (let i = 0; i < 9; i++) { g.fillStyle = OIL; g.beginPath(); g.arc(cx - 260 + i * 65, cy + 140 + Math.sin(i) * 20, 16, 0, Math.PI * 2); g.fill(); }
  const n = 60;
  for (let i = 0; i < n; i++) {
    const gone = i < n * 0.15 && rnd(i, 9) < 0.95 && k > (i / (n * 0.15)) * 0.9;   // 最大 15% ほどが消える
    const x = cx - 420 + rnd(i, 6) * 840, y0 = 320 + rnd(i, 7) * 360;
    let y = y0 + Math.sin(t * 2 + i) * 12, a = 1;
    if (i < n * 0.15) { const p = clamp(k * 1.1 - i / (n * 0.15) * 0.9, 0, 1); y = lerp(y0, cy + 130, p); a = 1 - clamp((p - 0.85) / 0.15, 0, 1); }
    if (a <= 0) continue;
    g.globalAlpha = a; g.fillStyle = O3; g.beginPath(); g.arc(x, y, 12, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  TK.text(g, '● オゾン', 200, 320, 44, { align: 'left', color: O3 });
  TK.text(g, '● 皮ふの油', 560, 320, 44, { align: 'left', color: OIL });
  if (t > 26.5) { g.save(); g.globalAlpha = clamp((t - 26.5) / 0.4, 0, 1); TK.text(g, 'オゾン [−2〜15%]', PW / 2, 1010, 68); g.restore(); }
}

function draw(g, t) {
  TK.clock(g, t, 0, DUR, { label: '' });
  if (t < 10.0) {
    person(g, PW / 2, 1000, 3.2, t);
    if (t < 1.8) TK.hook(g, t, 0, 1.8, 'この動画のあいだにも、\nあなたは…', { y: 470, size: 96 });
    else shedNow(g, t);
    if (t > 4.4) { g.save(); g.globalAlpha = clamp((t - 4.4) / 0.3, 0, 1); TK.card(g, 200, 450, 680, 120, { r: 40 }); TK.text(g, '1時間 [30〜90 mg]', PW / 2, 510, 64); g.restore(); }
  } else if (t < 16.0) {
    const h = 24 * TK.out((t - 10.4) / 2.2);
    TK.text(g, '早送り  ' + Math.floor(h) + ' 時間', PW / 2, 330, 60, { color: TK.C.sub });
    TK.text(g, (h * 30 / 1000).toFixed(1) + '〜' + (h * 90 / 1000).toFixed(1) + ' g', PW / 2, 470, 120, { color: TK.C.acc });
    coin(g, 400, 760, 130, TK.pop(t, 12.6, 0.4));
    coin(g, 690, 760, 130, TK.pop(t, 14.0, 0.4) * 0.999);
    if (t > 12.6) TK.text(g, '1円玉 = 1 g', PW / 2, 960, 48, { color: TK.C.sub });
  } else if (t < 24.0) {
    TK.text(g, '皮ふのかけら（ルーペで）', PW / 2, 300, 56, { color: TK.C.sub });
    flake(g, t);
    if (t > 19.0) { g.save(); g.globalAlpha = clamp((t - 19) / 0.4, 0, 1); TK.text(g, '皮ふの油（スクアレン など）', PW / 2, 990, 54, { color: OIL }); g.restore(); }
  } else ozone(g, t);
  if (t >= 3.6 && t < 16) TK.note(g, t, 3.6, 16, '平均の目安。人・服・動きでちがい、多くは服やふとんに残ります', { size: 32 });
  if (t >= 24 && t < 27.8) TK.note(g, t, 24, 27.8, 'デンマークの家と保育園のほこりを調べた研究から', { size: 32 });
  if (t >= 27.8) TK.note(g, t, 27.8, 30, '出どころ: Weschler ほか (2011) Environ. Sci. Technol.・造幣局（1円玉 1g）', { size: 30 });
}

triviaStart({ out: 'house-dust-trivia3', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
