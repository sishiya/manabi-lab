<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく wave-growth-1（型E ズーム）「カリフォルニアの浜の波は、地球の反対がわ近くの嵐から来ていた」。台本は trivia/wave-growth.md。?short で録る
// Munk, Miller, Snodgrass & Barber (1963): 1959年9月、南緯60度・東経111度付近の嵐 → San Clemente Island（北緯33度・西経118.5度）。
// きょり約15,300km、0.03Hz（約33秒）6.7日・26.5m/s、0.07Hz（約14秒）15.5日・11.4m/s。地球儀は陸の形を描かない（緯線・経線と点だけ）
const DUR = 35;
const subs = [
  { a: 0.0, b: 1.6, ja: 'この波、どこから来た？', en: 'Where did this wave come from?', noBurn: true },
  { a: 1.6, b: 4.0, ja: '風もないのに、波が来る。\nこの波、どこで生まれた？', en: 'No wind, yet waves keep coming.\nWhere were they born?' },
  { a: 4.0, b: 10.0, ja: '1959年、カリフォルニアの島で\n波を測っていた研究者たちがいた', en: 'In 1959, researchers were measuring waves\non an island off California' },
  { a: 10.0, b: 13.6, ja: '波の向きと、届いた波の長さの変わり方から\n生まれた場所を逆算すると…', en: 'From the direction and how the wave periods changed,\nthey traced the birthplace back to…' },
  { a: 13.6, b: 17.0, ja: 'オーストラリアの南、\n[インド洋の嵐]', en: 'a storm in the Indian Ocean,\nsouth of Australia' },
  { a: 17.0, b: 25.0, ja: 'きょりは、約[1万5300km]。\n地球を半分近く回ってきた', en: 'About 15,300 km away —\nnearly halfway around the globe' },
  { a: 25.0, b: 31.0, ja: '長い波ほど速い。33秒の波は[6.7日]、\n14秒の波は[15.5日]かけて着いた', en: 'Longer waves travel faster: 33-second waves took 6.7 days,\n14-second waves took 15.5 days' },
  { a: 31.0, b: 35.0, ja: '目の前の波は、\n[2週間前]の、遠い嵐の便り', en: 'The wave in front of you is a message\nfrom a distant storm two weeks ago' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 4.0, type: 'whoosh' }, { t: 5.5, type: 'whoosh' }, { t: 7.0, type: 'whoosh' },
  { t: 10.0, type: 'rise' }, { t: 13.6, type: 'thud' }, { t: 17.0, type: 'whoosh' }, { t: 22.0, type: 'ding' },
  { t: 25.0, type: 'pop' }, { t: 27.4, type: 'ding' }, { t: 30.0, type: 'ding' }, { t: 31.0, type: 'whoosh' },
];
const D2R = Math.PI / 180;
const CAL = [33.0, -118.5], STORM = [-60, 111], AUS = [-25, 134];
const CX0 = 540, CY0 = 700, CF = [-15, -170], RF = 370;
let SCX = CX0, SCY = CY0;
// 正射図法（中心 c=[lat,lon]、半径 R）。見えない側は null
function proj(p, c, R) {
  const [f, l] = [p[0] * D2R, p[1] * D2R], [f0, l0] = [c[0] * D2R, c[1] * D2R];
  const cosc = Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l - l0);
  const x = R * Math.cos(f) * Math.sin(l - l0), y = R * (Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(l - l0));
  return [SCX + x, SCY - y, cosc >= 0];
}
const vec = p => [Math.cos(p[0] * D2R) * Math.cos(p[1] * D2R), Math.cos(p[0] * D2R) * Math.sin(p[1] * D2R), Math.sin(p[0] * D2R)];
const ll = v => [Math.asin(v[2]) / D2R, Math.atan2(v[1], v[0]) / D2R];
const A = vec(STORM), B = vec(CAL), OM = Math.acos(A[0] * B[0] + A[1] * B[1] + A[2] * B[2]);
const gc = u => { const s = Math.sin(OM); return ll(A.map((a, i) => (Math.sin((1 - u) * OM) * a + Math.sin(u * OM) * B[i]) / s)); };   // 大円の上の点
// 地球儀の見え方: 4〜10秒でカリフォルニアの浜から引いていく
function view(t) {
  const k = ease((t - 4.2) / 5.4);
  const R = Math.exp(lerp(Math.log(9000), Math.log(RF), k));
  // カリフォルニアの点を、最後の地球儀での位置に止めたまま引く
  SCX = CX0; SCY = CY0; const [fx, fy] = proj(CAL, CF, RF);
  SCX = fx - (fx - CX0) * R / RF; SCY = fy - (fy - CY0) * R / RF;
  return { c: CF, R, k };
}
function globe(g, t, v) {
  const { c, R } = v;
  g.save(); g.beginPath(); g.arc(SCX, SCY, R, 0, Math.PI * 2);
  const gr = g.createRadialGradient(SCX - R * 0.3, SCY - R * 0.3, R * 0.1, SCX, SCY, R); gr.addColorStop(0, '#1f5aa8'); gr.addColorStop(1, '#0d2a5c');
  g.fillStyle = gr; g.fill(); g.clip();
  g.strokeStyle = 'rgba(160,190,255,0.25)'; g.lineWidth = 2;
  for (let lat = -75; lat <= 75; lat += 15) { g.beginPath(); let on = false; for (let lon = -180; lon <= 180; lon += 3) { const [x, y, vis] = proj([lat, lon], c, R); if (vis) { on ? g.lineTo(x, y) : g.moveTo(x, y); on = true; } else on = false; } g.stroke(); }
  for (let lon = -180; lon < 180; lon += 20) { g.beginPath(); let on = false; for (let lat = -88; lat <= 88; lat += 3) { const [x, y, vis] = proj([lat, lon], c, R); if (vis) { on ? g.lineTo(x, y) : g.moveTo(x, y); on = true; } else on = false; } g.stroke(); }
  g.restore();
  g.strokeStyle = 'rgba(160,190,255,0.5)'; g.lineWidth = 4; g.beginPath(); g.arc(SCX, SCY, R, 0, Math.PI * 2); g.stroke();
}
function dot(g, p, v, col, r, label, align = 'left', dy = 0) {
  const [x, y, vis] = proj(p, v.c, v.R); if (!vis) return;
  g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  if (label) TK.lines(g, label, x + (align === 'left' ? 30 : -30), y + dy, 40, { align, color: col });
}
function storm(g, p, v, t, k) {
  const [x, y, vis] = proj(p, v.c, v.R); if (!vis || k <= 0) return;
  g.save(); g.translate(x, y); g.rotate(-t * 2); g.globalAlpha = k; g.strokeStyle = '#ffffff'; g.lineWidth = 6;
  for (let j = 0; j < 3; j++) { g.rotate(Math.PI * 2 / 3); g.beginPath(); for (let i = 0; i <= 30; i++) { const a = i / 30 * 2.6, r = 10 + i * 2.2; i ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r); } g.stroke(); }
  g.restore();
}
// 海の断面（長いうねり）
function sea(g, t, amp = 50) {
  const y0 = 720;
  g.fillStyle = '#123a73'; g.beginPath(); g.moveTo(0, 1100);
  for (let x = 0; x <= PW; x += 6) g.lineTo(x, y0 + Math.sin(x / 260 - t * 1.4) * amp);
  g.lineTo(PW, 1100); g.closePath(); g.fill();
  g.strokeStyle = '#5fd4ff'; g.lineWidth = 6; g.beginPath();
  for (let x = 0; x <= PW; x += 6) { const y = y0 + Math.sin(x / 260 - t * 1.4) * amp; x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  g.fillStyle = '#d8c49a'; g.beginPath(); g.moveTo(760, 1100); g.lineTo(PW, 760); g.lineTo(PW, 1100); g.closePath(); g.fill();   // 浜
  const gr = g.createLinearGradient(0, 980, 0, 1110); gr.addColorStop(0, 'rgba(11,20,48,0)'); gr.addColorStop(1, 'rgba(11,20,48,1)'); g.fillStyle = gr; g.fillRect(0, 980, PW, 130);
  TK.text(g, '風 0 m/s', 200, 300, 48, { color: TK.C.sub });
}

function draw(g, t) {
  if (t < 4.0 || t >= 31.0) {
    sea(g, t);
    if (t < 1.6) TK.hook(g, t, 0, 1.6, 'この波、\n[どこから]来た？', { y: 430, size: 120 });
    if (t >= 31.0) { g.save(); g.globalAlpha = fade(t, 31, 40, 0.4); TK.text(g, '[15,300 km] 先の嵐から', PW / 2, 430, 76); g.restore(); }
    if (t >= 31.6) TK.note(g, t, 31.6, 35, '出どころ: Munk, Miller, Snodgrass & Barber (1963) Phil. Trans. R. Soc. A', { size: 30 });
    return;
  }
  const v = view(t);
  globe(g, t, v);
  // ズームの段の名前
  if (t < 10.0) {
    const names = ['浜', '沖', '太平洋', '地球'], i = Math.min(3, Math.floor(v.k * 3.999));
    TK.card(g, 340, 150, 400, 110, { r: 55 }); TK.text(g, names[i], PW / 2, 205, 64);
  }
  dot(g, CAL, v, TK.C.acc, 16, 'カリフォルニア\n（San Clemente島）', 'right', -60);
  if (t > 9.0) dot(g, AUS, v, 'rgba(255,255,255,0.6)', 8, 'オーストラリア', 'left');
  const sk = clamp((t - 10.6) / 1.0, 0, 1);
  storm(g, STORM, v, t, sk);
  if (t > 13.6) { const [x, y] = proj(STORM, v.c, v.R); TK.lines(g, '嵐\n南緯60度・東経111度', x + 60, y - 70, 40, { align: 'left', color: '#fff' }); }
  // 大円の道
  if (t > 17.0) {
    const u = clamp((t - 17.4) / 4.4, 0, 1);
    g.save(); g.strokeStyle = TK.C.acc; g.lineWidth = 7; g.setLineDash([18, 12]); g.beginPath();
    for (let i = 0; i <= 80; i++) { const [x, y] = proj(gc(u * i / 80), v.c, v.R); i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke(); g.restore();
    if (t < 25.0) {
      TK.card(g, 240, 150, 600, 120, { r: 50 });
      TK.text(g, '約 ' + Math.round(15300 * u).toLocaleString('ja-JP') + ' km', PW / 2, 210, 72, { color: u >= 1 ? TK.C.acc : '#fff' });
      if (t > 22.0) { g.save(); g.globalAlpha = fade(t, 22, 25, 0.3); TK.text(g, '地球1周（約4万km）の約0.4', PW / 2, 305, 40, { color: TK.C.sub, bold: false }); g.restore(); }
    }
  }
  // 2つの波の到着（15.5日を 5秒で）
  if (t >= 25.0) {
    const days = clamp((t - 25.4) / 4.6, 0, 1) * 15.5;
    [[6.7, '#ffcf4a', '33秒の波', 0], [15.5, '#5fd4ff', '14秒の波', 1]].forEach(([d, col, s, row]) => {
      const u = clamp(days / d, 0, 1), [x, y] = proj(gc(u), v.c, v.R);
      g.fillStyle = col; g.beginPath(); g.arc(x, y, 18, 0, Math.PI * 2); g.fill();
      const by = 140 + row * 70;
      TK.text(g, s, 130, by + 30, 46, { align: 'left', color: col });
      TK.text(g, u >= 1 ? '[' + d + ' 日]で着いた' : '…', 950, by + 30, 46, { align: 'right', color: '#fff', acc: col });
    });
    TK.text(g, Math.floor(days) + ' 日目', PW / 2, 300, 44, { color: TK.C.sub });
  }
  if (t >= 31.6) TK.note(g, t, 31.6, 35, '出どころ: Munk, Miller, Snodgrass & Barber (1963) Phil. Trans. R. Soc. A', { size: 30 });
  if (t >= 4 && t < 31.6) TK.note(g, t, 4, 31.6, '1963年の解析。嵐の場所はのちの研究で一部見直されたが、インド洋の嵐とされる', { size: 30 });
  if (t >= 25 && t < 31) TK.note(g, t, 25, 31, '速さ: 33秒の波 秒速26.5m・14秒の波 秒速11.4m', { y: PH * 0.712 + 44, size: 30 });
}

triviaStart({ out: 'wave-growth-trivia1', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
