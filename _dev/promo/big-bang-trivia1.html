<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく big-bang-1（型B もしも計算）「生まれたばかりの月は、空にこんなに大きかった」。台本は trivia/big-bang.md。?short で録る
// できた場所: 中心どうし 約22,500km（Ida, Canup, Stewart 1997。約14,000マイル）。月の真下の地表から 16,130km → 見かけの直径 12.3°
// いま: 地表から 378,030km → 0.53°。比 約23（中心からの距離の比なら 17）→「約20倍」。距離の数字のいまの遠ざかる速さは確かめていないので出さない
const DUR = 30;
const HZ = 1010;   // 地平線の y
const R_NOW = 0.53, R_NEW = 12.3;   // 見かけの直径（度）
const PX_PER_DEG = 50;   // 空の絵の大きさ（12.3° → 直径 615px）
const subs = [
  { a: 0.0, b: 3.0, ja: 'この大きな月。\nむかし、本当にあった空です', en: 'This huge Moon.\nIt was really in the sky, long ago', noBurn: true },
  { a: 3.0, b: 9.0, ja: '45億年ほど前、火星くらいの星が地球にぶつかり\nとび散ったかけらが、地球のまわりで[円盤]に', en: 'About 4.5 billion years ago, a Mars-sized body hit Earth.\nThe debris formed a disk around it' },
  { a: 9.0, b: 15.0, ja: '計算では、かけらは[1年たらず]で集まって月に\nできた場所は、地球からたった[2万2千km]', en: 'In simulations, the debris gathered into the Moon in under a year,\njust 22,000 km from Earth' },
  { a: 15.0, b: 21.0, ja: 'いまの月は38万km。もし地上に立てたら\n月は今の[約20倍]の大きさに見えたはず', en: 'Today it is 380,000 km away. Standing on the ground then,\nthe Moon would have looked about 20 times wider' },
  { a: 21.0, b: 27.0, ja: '月は、それから少しずつ遠ざかって\nいまの場所に', en: 'Since then, the Moon has slowly drifted away\nto where it is now' },
  { a: 27.0, b: 30.0, ja: '…ただ、そのころの地面は[とけた岩の海]\n立てる人はいませんでした', en: '...but back then the ground was a sea of molten rock.\nNo one could have stood there' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 4.6, type: 'thud' }, { t: 9.0, type: 'rise' }, { t: 12.0, type: 'ding' },
  { t: 15.0, type: 'whoosh' }, { t: 17.0, type: 'pop' }, { t: 18.6, type: 'ding' }, { t: 21.0, type: 'whoosh' }, { t: 27.0, type: 'thud' },
];

function moon(g, x, y, r, f = 1) {
  g.save(); g.globalAlpha *= f;
  const gl = g.createRadialGradient(x, y, r * 0.95, x, y, r * 1.35);
  gl.addColorStop(0, 'rgba(255,240,210,0.35)'); gl.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 1.35, 0, Math.PI * 2); g.fill();
  const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  gr.addColorStop(0, '#f4efe2'); gr.addColorStop(1, '#a9a395');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(90,90,100,0.28)';   // 海（形はかざり）
  [[-0.3, -0.2, 0.28], [0.25, 0.15, 0.22], [0.05, 0.45, 0.16], [-0.4, 0.35, 0.12]].forEach(([dx, dy, rr]) => { g.beginPath(); g.arc(x + dx * r, y + dy * r, rr * r, 0, Math.PI * 2); g.fill(); });
  g.restore();
}
// 空と地平線（lava: 0〜1 で地面がとけた岩に）
function sky(g, t, lava = 0) {
  g.fillStyle = '#081024'; g.fillRect(0, HZ, PW, PH - HZ);
  if (lava > 0) {
    g.save(); g.globalAlpha = lava;
    const gr = g.createLinearGradient(0, HZ, 0, HZ + 300); gr.addColorStop(0, '#ff8a3a'); gr.addColorStop(1, '#5a1406');
    g.fillStyle = gr; g.fillRect(0, HZ, PW, 300);
    g.strokeStyle = 'rgba(255,220,120,0.8)'; g.lineWidth = 4;
    for (let i = 0; i < 9; i++) { const y = HZ + 30 + i * 30, ph = t * 1.5 + i; g.beginPath(); for (let x = 0; x <= PW; x += 30) { const yy = y + Math.sin(x * 0.012 + ph) * 8; x ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke(); }
    g.restore();
  }
  g.strokeStyle = 'rgba(160,190,255,0.6)'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, HZ); g.lineTo(PW, HZ); g.stroke();
}
// ぶつかって円盤 → 集まって月（上から見た図）
const debris = Array.from({ length: 220 }, (_, i) => { const a = Math.sin(i * 91.7) * 1e4, b = Math.sin(i * 27.3) * 1e4; return { th: (a - Math.floor(a)) * Math.PI * 2, rr: 1.4 + (b - Math.floor(b)) * 2.6, s: 2 + ((a * 7) % 1 + 1) % 1 * 4 }; });
function topView(g, t) {
  const cx = 540, cy = 640, ER = 95;   // 地球の半径の絵（6,371km）
  // 地球
  const gr = g.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, ER);
  gr.addColorStop(0, t < 9 ? '#ffb070' : '#7aa8e0'); gr.addColorStop(1, t < 9 ? '#a8401a' : '#2a4f8f');
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, ER, 0, Math.PI * 2); g.fill();
  if (t < 4.6) {   // ぶつかりにくる星
    const k = ease((t - 3.2) / 1.4), x = lerp(cx + 520, cx + ER + 30, k), y = lerp(cy - 380, cy - 40, k);
    g.fillStyle = '#c96a4a'; g.beginPath(); g.arc(x, y, 52, 0, Math.PI * 2); g.fill();
    return;
  }
  const spread = clamp((t - 4.6) / 1.5, 0, 1), gather = clamp((t - 9.5) / 3.5, 0, 1);
  const mx = cx + Math.cos(-0.6) * ER * 3.5, my = cy + Math.sin(-0.6) * ER * 3.5;   // 月ができる所（地球の中心から 約3.5 倍）
  g.fillStyle = 'rgba(255,220,180,0.85)';
  for (const d of debris) {
    const th = d.th + t * 0.6 / Math.pow(d.rr, 1.5);
    let x = cx + Math.cos(th) * ER * (1 + (d.rr - 1) * spread), y = cy + Math.sin(th) * ER * (1 + (d.rr - 1) * spread);
    x = lerp(x, mx, ease(gather)); y = lerp(y, my, ease(gather));
    g.globalAlpha = 1 - 0.9 * ease(gather); g.beginPath(); g.arc(x, y, d.s, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  if (gather > 0) moon(g, mx, my, 26 * ease(gather), ease(gather));
  if (gather >= 1) {   // 距離の線
    g.save(); g.globalAlpha = fade(t, 13.0, 15.0, 0.3);
    g.strokeStyle = TK.C.acc; g.lineWidth = 4; g.setLineDash([12, 10]); g.beginPath(); g.moveTo(cx, cy); g.lineTo(mx, my); g.stroke(); g.setLineDash([]);
    TK.text(g, '約2万2千km', 820, 600, 52, { color: TK.C.acc });
    g.restore();
  }
}

function draw(g, t) {
  // 0〜3: フック（大きな月）
  if (t < 3.0) {
    sky(g, t);
    g.save(); g.beginPath(); g.rect(0, 0, PW, HZ); g.clip(); moon(g, 540, 780, R_NEW * PX_PER_DEG / 2, fade(t, -1, 3, 0.3)); g.restore();
    TK.hook(g, t, 0.0, 3.0, 'これ、\n[本当にあった空]', { y: 260, size: 110 });
  }
  // 3〜15: ぶつかる → 円盤 → 月
  if (t >= 3.0 && t < 15.0) {
    g.save(); g.globalAlpha = fade(t, 3.0, 15.0, 0.3);
    topView(g, t);
    TK.text(g, t < 9 ? '45億年ほど前' : 'かけらが集まって月に', PW / 2, 230, 64);
    if (t >= 10.0) TK.text(g, '計算では [1年たらず]', PW / 2, 920, 60);
    g.restore();
    TK.note(g, t, 3.0, 9.0, '大きな星がぶつかって月ができた、と考えられています（有力な説）', { size: 30 });
    TK.note(g, t, 9.0, 15.0, '上から見た図。内側の円盤の分まで入れると約100年（Salmon & Canup 2012）', { size: 30 });
  }
  // 15〜21: いまの月とならべる
  if (t >= 15.0 && t < 21.0) {
    const f = fade(t, 15.0, 21.0, 0.3);
    g.save(); g.globalAlpha = f;
    sky(g, t);
    g.save(); g.beginPath(); g.rect(0, 0, PW, HZ); g.clip();
    moon(g, 640, 700, R_NEW * PX_PER_DEG / 2);
    moon(g, 170, 520, R_NOW * PX_PER_DEG / 2);
    g.restore();
    TK.text(g, 'いま', 170, 600, 44, { color: TK.C.sub });
    TK.text(g, 'できたて', 640, 340, 48, { color: TK.C.sub });
    if (t > 17.0) TK.text(g, '幅で [約20倍]', PW / 2, 220, 84);
    g.restore();
    TK.note(g, t, 15.5, 21.0, '腕をのばして: いまの月は5円玉の穴、できたての月は手のひらくらい\n月の真下の地面から見た計算（地球の中心からなら約17倍）', { size: 28 });
  }
  // 21〜27: 遠ざかって小さくなる
  if (t >= 21.0 && t < 27.0) {
    const k = ease((t - 21.3) / 5.0), d = Math.exp(lerp(Math.log(16130), Math.log(378030), k));
    const deg = 2 * Math.atan(1737 / d) * 180 / Math.PI;
    g.save(); g.globalAlpha = fade(t, 21.0, 27.0, 0.3);
    sky(g, t);
    moon(g, 540, 700, deg * PX_PER_DEG / 2);
    TK.card(g, 220, 180, 640, 120);
    TK.text(g, '地球から ' + ((d + 6371) / 1e4).toFixed(1) + '万km', PW / 2, 240, 62);
    g.restore();
  }
  // 27〜30: 地面はとけた岩
  if (t >= 27.0) {
    sky(g, t, ease((t - 27.0) / 0.8));
    g.save(); g.beginPath(); g.rect(0, 0, PW, HZ); g.clip(); moon(g, 540, 780, R_NEW * PX_PER_DEG / 2); g.restore();
    TK.note(g, t, 27.6, 30.0, '出どころ: Ida, Canup & Stewart (1997) Nature 389, 353・Salmon & Canup (2012)\nKleine ほか (2002) Nature 418, 952', { size: 28 });
  }
}

triviaStart({ out: 'big-bang-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
