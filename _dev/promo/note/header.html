<!doctype html>
<!-- note のクリエイターページの背景（ヘッダー）画像。1920×1006（note のおすすめ）。
     書き出し: msedge --headless --screenshot=header.png --window-size=1920,1006 header.html → ffmpeg で jpg。
     note は真ん中を切りとって見せる。スマホでは高さの真ん中 3割ほどの細い帯になる（2026-10-17 に確かめた）ので、文字は2段だけにして真ん中に寄せる（しし屋の名前は下に出る）。 -->
<html lang="ja"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1006px; overflow: hidden; background: #0b1424; }
  .grid { position: absolute; inset: -40px -60px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
          transform: rotate(-6deg) scale(1.12); }
  .grid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; filter: saturate(0.85); }
  .veil { position: absolute; inset: 0;
          background: radial-gradient(ellipse 62% 48% at 50% 50%, rgba(11,20,36,0.94) 0%, rgba(11,20,36,0.82) 55%, rgba(11,20,36,0.45) 100%); }
  .text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          color: #eef3fb; font-family: 'Yu Gothic UI', 'Meiryo', sans-serif; text-align: center; }
  .lead { font-size: 44px; letter-spacing: 0.08em; color: #bcd0ea; margin-bottom: 18px; }
  .labs { font-size: 92px; font-weight: 700; letter-spacing: 0.06em; }
  .labs span { color: #6d8bb3; font-weight: 400; margin: 0 0.3em; }
  .line { width: 520px; height: 2px; background: #5b7aa6; margin: 34px 0 26px; }
  .brand { font-size: 40px; letter-spacing: 0.3em; color: #9fb6d6; }
</style></head><body>
<div class="grid" id="g"></div>
<div class="veil"></div>
<div class="text">
  <div class="lead">百科事典の続きを、AI といっしょに</div>
  <div class="labs">まなびラボ<span>・</span>あそびラボ</div>
</div>
<script>
  // 入口の18本（並びは似た色が隣りあわないように手で混ぜた）
  const ids = ['black-hole','evolution','body-dive','quantum','animal-senses','god-view',
               'immune-battle','wifi-wave','metamorphosis','pitch-physics','eye-optics','ga-creatures',
               'mold-growth','phage','air-flow','tree-of-life','piano-hand','hair-removal'];
  const g = document.getElementById('g');
  for (let i = 0; i < 63; i++) {
    const img = document.createElement('img');
    img.src = '../../../assets/thumbs/' + ids[(i * 5) % ids.length] + '.jpg';
    g.appendChild(img);
  }
</script>
</body></html>
