<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく typing-hand-3（型A ぜんぶ逆）「習えば速くなる…差は毎分5語」。台本は trivia/typing-hand.md。?short で録る
// Dhakal ほか 2018（CHI、表3）: 習った（自己申告）毎分 54.35語・習っていない 49.00語、どちらも SD 約20語、d = 0.27（小さい）。
// Feit, Weir & Oulasvirta 2016（30人のモーションキャプチャ）は Dhakal 2018 の本文の紹介で確かめた。
// 「指の数は関係ない」とは言わない（同じ論文で指の数は速さと関係があった）。台本は「習ったかどうか」の差が小さい、だけ。
const DUR = 31;
const subs = [
  { a: 0.0, b: 3.0, ja: 'タイピングは、習った人のほうがずっと速い…と思いますよね', en: 'You’d think people who took typing lessons are much faster…', noBurn: true },
  { a: 3.0, b: 8.0, ja: '16万人をくらべると\n差は1分に[5語]ほど', en: 'Across 160,000 people,\nthe gap is about 5 words a minute' },
  { a: 8.0, b: 14.0, ja: '同じ“習った人”の中の[ばらつき]のほうが\nずっと大きい', en: 'The spread within the trained group\nis far bigger than that' },
  { a: 14.0, b: 18.0, ja: '30人の指の動きを測った研究では', en: 'In a study that tracked 30 people’s fingers' },
  { a: 18.0, b: 22.0, ja: '10本ぜんぶ使わない、習ってもいない人でも\n習った人と同じくらい、[それより速い人も]', en: 'some who never learned and don’t use all ten fingers\nmatched or beat trained typists' },
  { a: 22.0, b: 28.0, ja: '速さに効いていたのは\n[打ち方]のほう', en: 'What mattered for speed\nwas how they typed' },
  { a: 28.0, b: 31.0, ja: '習ったかより、[どう打っているか]', en: 'Not whether you learned, but how you type' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 5.2, type: 'ding' }, { t: 8.0, type: 'whoosh' }, { t: 9.0, type: 'rise' }, { t: 14.0, type: 'pop' },
  { t: 18.0, type: 'ding' }, { t: 22.0, type: 'whoosh' }, { t: 22.6, type: 'pop' }, { t: 24.0, type: 'pop' }, { t: 25.4, type: 'pop' }, { t: 28.0, type: 'ding' },
];

// 正規分布の山（模式。平均・SD は論文の値）
const AX = { x0: 110, x1: 950, v0: 0, v1: 120 };
const vx = v => AX.x0 + (AX.x1 - AX.x0) * (v - AX.v0) / (AX.v1 - AX.v0);
function bell(g, mu, sd, y0, h, col, k) {
  g.save(); g.fillStyle = col + '40'; g.strokeStyle = col; g.lineWidth = 5;
  g.beginPath(); g.moveTo(vx(AX.v0), y0);
  for (let v = AX.v0; v <= AX.v1; v += 1) { const z = (v - mu) / sd; g.lineTo(vx(v), y0 - h * k * Math.exp(-z * z / 2)); }
  g.lineTo(vx(AX.v1), y0); g.closePath(); g.fill(); g.stroke();
  g.setLineDash([10, 10]); g.beginPath(); g.moveTo(vx(mu), y0); g.lineTo(vx(mu), y0 - h * k - 20); g.stroke();
  g.restore();
}

function draw(g, t) {
  // 0〜3: フック
  if (t < 3.0) {
    TK.hook(g, t, 0.0, 3.0, '習っても\n[速くならない]？', { y: 520, size: 140 });
  }
  // 3〜8: 2本の棒
  if (t >= 3.0 && t < 8.0) {
    TK.text(g, '1分に打つ語の数（平均）', PW / 2, 280, 56, { color: TK.C.sub });
    TK.bars(g, t, 3.0, 8.0, [
      { label: 'タイピングを習った', v: 54.35 / 70, color: TK.C.acc2, text: '54語' },
      { label: '習っていない', v: 49.0 / 70, color: TK.C.green, text: '49語' },
    ], { y: 420, gap: 260, stagger: 0.6 });
    if (t > 5.2) { g.save(); g.globalAlpha = fade(t, 5.2, 8, 0.3); TK.text(g, '差は [5語]', PW / 2, 1000, 80); g.restore(); }
  }
  // 8〜14: ばらつきの山
  if (t >= 8.0 && t < 14.0) {
    const f = fade(t, 8, 14, 0.3), k = TK.out((t - 8.3) / 1.2);
    g.save(); g.globalAlpha = f;
    const Y = 860;
    bell(g, 49.0, 20, Y, 480, TK.C.green, k);
    bell(g, 54.35, 20, Y, 480, TK.C.acc2, k);
    g.strokeStyle = 'rgba(200,215,255,0.6)'; g.lineWidth = 4; g.beginPath(); g.moveTo(AX.x0, Y); g.lineTo(AX.x1, Y); g.stroke();
    for (let v = 0; v <= 120; v += 20) TK.text(g, String(v), vx(v), Y + 40, 32, { color: TK.C.dim, bold: false });
    TK.text(g, '1分に打つ語の数', PW / 2, Y + 92, 36, { color: TK.C.sub, bold: false });
    TK.text(g, '習った', vx(54.35) + 30, 200, 46, { color: TK.C.acc2, align: 'left' });
    TK.text(g, '習っていない', vx(49) - 30, 200, 46, { color: TK.C.green, align: 'right' });
    if (t > 10.0) {
      g.globalAlpha = f * fade(t, 10, 14, 0.3);
      g.strokeStyle = TK.C.acc; g.lineWidth = 6;
      const y = 330; g.beginPath(); g.moveTo(vx(34.35), y); g.lineTo(vx(74.35), y); g.moveTo(vx(34.35), y - 18); g.lineTo(vx(34.35), y + 18); g.moveTo(vx(74.35), y - 18); g.lineTo(vx(74.35), y + 18); g.stroke();
      TK.text(g, 'ばらつき ±20語', vx(54.35), y - 50, 44, { color: TK.C.acc });
    }
    g.restore();
    TK.note(g, t, 8.5, 14, '習った・習っていないは自己申告。山の形は平均と標準偏差（約20語）からの模式', { size: 30 });
  }
  // 14〜22: 30人の研究（札で）
  if (t >= 14.0 && t < 22.0) {
    const f = fade(t, 14, 22, 0.3);
    g.save(); g.globalAlpha = f;
    // 30人の点（ただの人数の目印。速さの並びではない）
    for (let i = 0; i < 30; i++) {
      const k = TK.pop(t, 14.2 + i * 0.04), x = 200 + (i % 10) * 75, y = 260 + Math.floor(i / 10) * 85;
      g.save(); g.globalAlpha *= k; g.fillStyle = TK.C.acc2; g.beginPath(); g.arc(x, y - 18, 16, 0, Math.PI * 2); g.fill(); g.beginPath(); g.roundRect(x - 22, y + 2, 44, 34, 14); g.fill(); g.restore();
    }
    if (t > 18.0) {
      const k = TK.pop(t, 18.0);
      g.save(); g.globalAlpha *= k;
      TK.card(g, 110, 600, 860, 330, { fill: 'rgba(255,207,74,0.16)', stroke: TK.C.acc, lw: 5 });
      TK.text(g, '10本ぜんぶは使わない', PW / 2, 680, 56);
      TK.text(g, '＋ 習っていない', PW / 2, 760, 56);
      TK.text(g, '→ [習った人と同じか、速い人も]', PW / 2, 860, 56);
      g.restore();
    }
    g.restore();
    TK.note(g, t, 14.4, 22, 'Feit, Weir & Oulasvirta (2016) の30人（Dhakal 2018 の本文の紹介で確かめた）', { size: 30 });
  }
  // 22〜28: 速い人の共通点 3つ
  if (t >= 22.0 && t < 28.0) {
    const f = fade(t, 22, 28, 0.3);
    g.save(); g.globalAlpha = f;
    TK.text(g, '速い人の共通点', PW / 2, 250, 64, { color: TK.C.sub });
    ['いつも同じ指で打つ', '次のキーへ先回り', '手全体はあまり動かさない'].forEach((s, i) => {
      const k = TK.pop(t, 22.6 + i * 1.4);
      g.save(); g.globalAlpha *= k;
      TK.card(g, 110, 340 + i * 220, 860, 180);
      TK.text(g, '①②③'[i], 190, 430 + i * 220, 80, { color: TK.C.acc });
      TK.text(g, s, 260, 430 + i * 220, 58, { align: 'left', maxw: 680 });
      g.restore();
    });
    g.restore();
  }
  // 28〜31
  if (t >= 28.0) {
    TK.text(g, '習ったか', PW / 2, 420, 100, { color: TK.C.dim });
    TK.text(g, 'より', PW / 2, 560, 70, { color: TK.C.sub });
    TK.text(g, '[どう打っているか]', PW / 2, 720, 110);
    TK.note(g, t, 28.3, 31, '出どころ: Dhakal, Feit, Kristensson & Oulasvirta (2018) CHI\nFeit, Weir & Oulasvirta (2016) CHI', { size: 30 });
  }
}

triviaStart({ out: 'typing-hand-trivia3', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
