<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく typing-hand-3（型A ぜんぶ逆）「習えば速くなる…差は毎分5語」。台本は trivia/typing-hand.md。?short で録る
// Dhakal ほか 2018（CHI、表3）: 習った（自己申告）毎分 54.35語・習っていない 49.00語、どちらも SD 約20語、d = 0.27（小さい）。
// Feit, Weir & Oulasvirta 2016（30人のモーションキャプチャ）は Dhakal 2018 の本文の紹介で確かめた。
// 絵は図鑑の版画（PL.*）。キーボード・人の影絵・ばらつきの山を版画の道具で。
// 「指の数は関係ない」とは言わない（同じ論文で指の数は速さと関係があった）。台本は「習ったかどうか」の差が小さい、だけ。
const DUR = 31;
const subs = [
  { a: 0.0, b: 3.0, ja: 'タイピングは、習った人のほうがずっと速い…と思いますよね', en: 'You’d think people who took typing lessons are much faster…', noBurn: true },
  { a: 3.0, b: 8.0, ja: '16万人をくらべると\n差は1分に[5語]ほど', en: 'Across 160,000 people,\nthe gap is about 5 words a minute' },
  { a: 8.0, b: 14.0, ja: '同じ“習った人”の中の[ばらつき]のほうが\nずっと大きい', en: 'The spread within the trained group\nis far bigger than that' },
  { a: 14.0, b: 18.0, ja: '30人の指の動きを測った研究では', en: 'In a study that tracked 30 people’s fingers' },
  { a: 18.0, b: 22.0, ja: '10本ぜんぶ使わない、習ってもいない人でも\n習った人と同じくらい、[それより速い人も]', en: 'some who never learned and don’t use all ten fingers\nmatched or beat trained typists' },
  { a: 22.0, b: 28.0, ja: '速さに効いていたのは\n[打ち方]のほう', en: 'What mattered for speed\nwas how they typed' },
  { a: 28.0, b: 31.0, ja: '習ったかより、[どう打っているか]', en: 'Not whether you learned, but how you type' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.0, type: 'whoosh' }, { t: 5.2, type: 'ding' }, { t: 8.0, type: 'whoosh' }, { t: 9.0, type: 'rise' }, { t: 14.0, type: 'pop' },
  { t: 18.0, type: 'ding' }, { t: 22.0, type: 'whoosh' }, { t: 22.6, type: 'pop' }, { t: 24.0, type: 'pop' }, { t: 25.4, type: 'pop' }, { t: 28.0, type: 'ding' },
];

/// 正規分布の山（模式。平均・SD は論文の値）
const AX = { x0: 110, x1: 950, v0: 0, v1: 120 };
const vx = v => AX.x0 + (AX.x1 - AX.x0) * (v - AX.v0) / (AX.v1 - AX.v0);
// ---- 図鑑の版画（PL.*）の道具で描く ----
function bell(g, mu, sd, y0, h, col, k, hatchAng) {
  const pts = []; for (let v = AX.v0; v <= AX.v1; v += 1) { const z = (v - mu) / sd; pts.push([vx(v), y0 - h * k * Math.exp(-z * z / 2)]); }
  const area = gg => { gg.moveTo(vx(AX.v0), y0); pts.forEach(p => gg.lineTo(...p)); gg.lineTo(vx(AX.v1), y0); gg.closePath(); };
  PL.tint(g, area, col, 0.45); PL.hatch(g, area, { angle: hatchAng, gap: 14, w: 1.6, cx: vx(mu), cy: y0 });
  PL.ink(g, gg => pts.forEach((p, i) => i ? gg.lineTo(...p) : gg.moveTo(...p)), 5);
  g.save(); g.setLineDash([10, 10]); PL.ink(g, gg => { gg.moveTo(vx(mu), y0); gg.lineTo(vx(mu), y0 - h * k - 20); }, 3); g.restore();
}
// キー1つ（ななめ上から見たキートップ）。x, y は上の面のまん中、w は幅、down: 0〜1
function keyCap(g, x, y, w, ch, down) {
  const d = down * w * 0.1, y0 = y - w * 0.24 + d, y1 = y + w * 0.2 + d, yb = y + w * 0.36;
  const top = PL.poly([[x - w * 0.35, y0], [x + w * 0.35, y0], [x + w * 0.41, y1], [x - w * 0.41, y1]]);
  const front = PL.poly([[x - w * 0.41, y1], [x + w * 0.41, y1], [x + w * 0.46, yb], [x - w * 0.46, yb]]);
  g.save(); g.fillStyle = '#f4efe2'; [top, front].forEach(pp => { g.beginPath(); pp(g); g.fill(); }); g.restore();
  PL.tint(g, front, PL.T.brown, 0.45); PL.hatch(g, front, { angle: 1.25, gap: Math.max(5, w * 0.06), w: Math.max(1.2, w * 0.014), cx: x, cy: yb });
  PL.ink(g, front, Math.max(2, w * 0.03)); PL.ink(g, top, Math.max(2.2, w * 0.034));
  if (ch) PL.label(g, ch, x, (y0 + y1) / 2, w * 0.34, { color: down > 0.5 ? PL.RED : PL.INK });
}
// キーボード（3段。段ごとに少しずらす）。cx, cy は全体のまん中、w はキーの幅。pressed: 押されているキーの字
function keyboard(g, cx, cy, w, pressed = '') {
  const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'], hw = w * 5.5;
  const top = PL.poly([[cx - hw + w * 0.2, cy - w * 1.75], [cx + hw - w * 0.2, cy - w * 1.75], [cx + hw, cy + w * 1.55], [cx - hw, cy + w * 1.55]]);
  const edge = PL.rect(cx - hw, cy + w * 1.55, hw * 2, w * 0.18);
  PL.tint(g, top, PL.T.gray, 0.45); PL.hatch(g, top, { angle: 0.25, gap: 14, w: 1.4, cx, cy }); PL.ink(g, top, Math.max(3, w * 0.04));
  PL.tint(g, edge, PL.T.brown, 0.55); PL.hatch(g, edge, { angle: 1.1, gap: 6, w: 1.6, cx, cy }); PL.ink(g, edge, Math.max(3, w * 0.04));
  rows.forEach((r, j) => [...r].forEach((ch, i) => keyCap(g, cx - (r.length - 1) / 2 * w * 1.02 + i * w * 1.02 + j * w * 0.25, cy - w * 1.05 + j * w * 1.02, w, ch, pressed.includes(ch) ? 1 : 0)));
}
// 人（胸から上の影絵。頭・首・肩）
function bust(g, x, y, s, col) {
  const sh = gg => { gg.moveTo(x - 24 * s, y + 36 * s); gg.quadraticCurveTo(x - 24 * s, y + 8 * s, x - 8 * s, y + 4 * s); gg.lineTo(x + 8 * s, y + 4 * s); gg.quadraticCurveTo(x + 24 * s, y + 8 * s, x + 24 * s, y + 36 * s); gg.closePath(); };
  const head = PL.ellipse(x, y - 14 * s, 12 * s, 14 * s);
  PL.tint(g, sh, col, 0.75); PL.hatch(g, sh, { angle: 1.1, gap: 6, w: 1.3, not: gg => gg.rect(x - 40 * s, y - 40 * s, 40 * s, 90 * s), cx: x, cy: y }); PL.ink(g, sh, 2.6);
  PL.tint(g, head, PL.T.rose, 0.7); PL.ink(g, head, 2.6);
}

function draw(g, t) {
  // 0〜3: フック（キーボードの上に問い）
  if (t < 3.0) {
    TK.hook(g, t, 0.0, 3.0, '習っても\n[速くならない]？', { y: 400, size: 130 });
    g.save(); g.globalAlpha *= fade(t, -1, 3, 0.3);
    const ks = 'FJ', p = ks[Math.floor(t * 3) % 2];
    keyboard(g, 560, 900, 84, (t * 3) % 1 < 0.35 ? p : '');
    g.restore();
  }
  // 3〜8: 2本の棒
  if (t >= 3.0 && t < 8.0) {
    TK.text(g, '1分に打つ語の数（平均）', PW / 2, 280, 56, { color: TK.C.sub });
    TK.bars(g, t, 3.0, 8.0, [
      { label: 'タイピングを習った', v: 54.35 / 70, color: TK.C.acc2, text: '54語' },
      { label: '習っていない', v: 49.0 / 70, color: TK.C.green, text: '49語' },
    ], { y: 420, gap: 260, stagger: 0.6 });
    if (t > 5.2) {
      g.save(); g.globalAlpha *= fade(t, 5.2, 8, 0.3);
      // 2本の棒の先の差を、朱の目盛りで（棒の長さは W*v、W = PW-220）
      const xa = 110 + (PW - 220) * 49.0 / 70, xb = 110 + (PW - 220) * 54.35 / 70;
      PL.ink(g, gg => { gg.moveTo(xa, 880); gg.lineTo(xb, 880); gg.moveTo(xa, 862); gg.lineTo(xa, 898); gg.moveTo(xb, 862); gg.lineTo(xb, 898); }, 5, PL.RED);
      PL.label(g, '差は [5語]', xa - 40, 1000, 80, { align: 'right' });
      g.restore();
    }
  }
  // 8〜14: ばらつきの山
  if (t >= 8.0 && t < 14.0) {
    const f = fade(t, 8, 14, 0.3), k = TK.out((t - 8.3) / 1.2);
    g.save(); g.globalAlpha *= f;
    const Y = 860;
    bell(g, 49.0, 20, Y, 480, PL.T.leaf, k, 0.7);
    bell(g, 54.35, 20, Y, 480, PL.T.sea, k, -0.7);
    PL.ink(g, gg => { gg.moveTo(AX.x0, Y); gg.lineTo(AX.x1, Y); for (let v = 0; v <= 120; v += 5) { gg.moveTo(vx(v), Y); gg.lineTo(vx(v), Y + (v % 20 ? 8 : 16)); } }, 3.5);
    for (let v = 0; v <= 120; v += 20) PL.label(g, String(v), vx(v), Y + 44, 32, { color: '#4a3f33', bold: false });
    PL.label(g, '1分に打つ語の数', PW / 2, Y + 96, 36, { color: '#4a3f33', bold: false });
    PL.label(g, '習った', vx(54.35) + 30, 200, 46, { align: 'left', color: '#2f5f7a' });
    PL.label(g, '習っていない', vx(49) - 30, 200, 46, { align: 'right', color: PL.GREEN });
    if (t > 10.0) {
      g.save(); g.globalAlpha *= fade(t, 10, 14, 0.3);
      const y = 330; PL.ink(g, gg => { gg.moveTo(vx(34.35), y); gg.lineTo(vx(74.35), y); gg.moveTo(vx(34.35), y - 18); gg.lineTo(vx(34.35), y + 18); gg.moveTo(vx(74.35), y - 18); gg.lineTo(vx(74.35), y + 18); }, 6, PL.RED);
      PL.label(g, 'ばらつき ±20語', vx(74.35) + 20, y, 40, { align: 'left', color: PL.RED });
      g.restore();
    }
    g.restore();
    TK.note(g, t, 8.5, 14, '習った・習っていないは自己申告。山の形は平均と標準偏差（約20語）からの模式', { size: 30 });
  }
  // 14〜22: 30人の研究
  if (t >= 14.0 && t < 22.0) {
    const f = fade(t, 14, 22, 0.3);
    g.save(); g.globalAlpha *= f;
    for (let i = 0; i < 30; i++) {   // 30人の目印（速さの並びではない）
      const k = clamp(TK.pop(t, 14.2 + i * 0.04), 0, 1), x = 200 + (i % 10) * 75, y = 260 + Math.floor(i / 10) * 95;
      if (k <= 0) continue;
      g.save(); g.globalAlpha *= k; bust(g, x, y, 1.15, i % 3 ? PL.T.sea : PL.T.wood); g.restore();
    }
    if (t > 18.0) {
      const k = clamp(TK.pop(t, 18.0), 0, 1);
      g.save(); g.globalAlpha *= k;
      TK.card(g, 110, 620, 860, 330);
      TK.text(g, '10本ぜんぶは使わない', PW / 2, 700, 56);
      TK.text(g, '＋ 習っていない', PW / 2, 780, 56);
      TK.text(g, '→ [習った人と同じか、速い人も]', PW / 2, 880, 56);
      g.restore();
    }
    g.restore();
    TK.note(g, t, 14.4, 22, 'Feit, Weir & Oulasvirta (2016) の30人（Dhakal 2018 の本文の紹介で確かめた）', { size: 30 });
  }
  // 22〜28: 速い人の共通点 3つ
  if (t >= 22.0 && t < 28.0) {
    const f = fade(t, 22, 28, 0.3);
    g.save(); g.globalAlpha *= f;
    PL.label(g, '速い人の共通点', 110, 250, 64, { align: 'left', color: '#4a3f33' });
    ['いつも同じ指で打つ', '次のキーへ先回り', '手全体はあまり動かさない'].forEach((s, i) => {
      const k = clamp(TK.pop(t, 22.6 + i * 1.4), 0, 1);
      g.save(); g.globalAlpha *= k;
      TK.card(g, 110, 340 + i * 220, 860, 180);
      TK.text(g, '①②③'[i], 190, 430 + i * 220, 80, { color: PL.RED });
      TK.text(g, s, 260, 430 + i * 220, 58, { align: 'left', maxw: 680 });
      g.restore();
    });
    g.restore();
  }
  // 28〜31
  if (t >= 28.0) {
    PL.label(g, '習ったか', 110, 300, 96, { align: 'left', color: '#7a6d5e' });
    PL.label(g, 'より', 110, 420, 66, { align: 'left', color: '#4a3f33' });
    PL.label(g, '[どう打っているか]', 110, 560, 110, { align: 'left' });
    const p = 'ASDF'[Math.floor(t * 5) % 4];
    keyboard(g, 560, 930, 80, (t * 5) % 1 < 0.4 ? p : '');
    TK.note(g, t, 28.3, 31, '出どころ: Dhakal, Feit, Kristensson & Oulasvirta (2018) CHI\nFeit, Weir & Oulasvirta (2016) CHI', { size: 30, y: 1476 });
  }
}

triviaStart({ out: 'typing-hand-trivia3', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
