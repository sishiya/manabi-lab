<!doctype html>

<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく crt-pixels-1（型H 当ててみて）「ブラウン管の中の電子、どれくらい速い？」。台本は trivia/crt-pixels.md。?short で録る
// 25kV（The Physics Factbook, Hong 2000）、電子の静止エネルギー 511keV（CODATA）。
// 相対論: γ = 1 + 25/511 = 1.0489、β = 0.302 → 90,500 km/s（地球1周 0.44秒）。ふつうの式: β = √(2×25/511) = 0.313。ずれ 約3%
// 実在のゲームの絵・機種名は出さない。最後のアプリの録画（光る点の組）は Canvas の赤緑青の点の図に
const DUR = 30;
const subs = [
  { a: 0.0, b: 3.0, ja: 'ブラウン管テレビの中を飛ぶ電子。\nどれくらい速い？', en: 'Electrons flying inside an old CRT TV.\nHow fast are they?', noBurn: true },
  { a: 5.0, b: 11.0, ja: '答えは C。光の速さの[約3割]、\n1秒で地球を[2周以上]', en: 'The answer is C: about 30% of light speed,\nmore than twice around the Earth per second.' },
  { a: 11.0, b: 18.0, ja: 'カラーテレビは、およそ[2万5千ボルト]で\n電子を押し出していた', en: 'Color TVs pushed electrons\nwith about 25,000 volts.' },
  { a: 18.0, b: 25.0, ja: 'ここまで速いと、ふつうの式では少しずれる。\nアインシュタインの式で、[約3%]なおす', en: 'At that speed the everyday formula is a bit off.\nEinstein’s formula corrects it by about 3%.' },
  { a: 25.0, b: 30.0, ja: 'その電子が当たって光ったのが、\nあのにじんだ[ドット絵]', en: 'Those electrons hitting the screen\nmade the soft, glowing pixel art.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.3, type: 'pop' }, { t: 0.5, type: 'pop' }, { t: 0.7, type: 'pop' }, { t: 3.0, type: 'tick' }, { t: 4.0, type: 'tick' }, { t: 5.0, type: 'ding' },
  { t: 7.6, type: 'whoosh' }, { t: 11.0, type: 'whoosh' }, { t: 11.6, type: 'rise' }, { t: 18.0, type: 'pop' }, { t: 18.6, type: 'pop' }, { t: 19.2, type: 'pop' }, { t: 21.5, type: 'ding' },
  { t: 25.0, type: 'whoosh' },
];

/// 絵は「図鑑の版画」（trivia-plate.js の PL.*）。ブラウン管は横からの断面図（ガラスの漏斗・電子銃・偏向コイル・蛍光面）
const line = pts => g => pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
const fadeIn = (g, f, fn) => { g.save(); g.globalAlpha *= f; fn(); g.restore(); };
// ブラウン管の横から見た図。x, y は首の左はし、s は大きさ。電子の点を飛ばす
function tube(g, x, y, s, t, o = {}) {
  const m = (a, b) => [x + a * s, y + b * s], W = v => Math.max(1.2, v * s);
  const glass = gg => { gg.moveTo(...m(0, -30)); gg.lineTo(...m(220, -30)); gg.lineTo(...m(560, -230)); gg.quadraticCurveTo(...m(600, 0), ...m(560, 230)); gg.lineTo(...m(220, 30)); gg.lineTo(...m(0, 30)); gg.closePath(); };
  PL.tint(g, glass, PL.T.sky, 0.45);
  PL.hatch(g, glass, { angle: 0.6, gap: Math.max(7, 12 * s), w: W(2), not: gg => gg.rect(x - 20, y - 400 * s, 700 * s, 400 * s + 40 * s) });   // 下半分にかげ
  // 電子銃（陰極・格子・陽極の筒）
  [[18, 26, PL.T.rust], [50, 30, PL.T.gray], [86, 52, PL.T.gray], [144, 40, PL.T.gray]].forEach(([a, w, c]) => { const p = PL.rect(...m(a, -17), w * s, 34 * s); PL.tint(g, p, c, 0.85); PL.ink(g, p, W(3)); });
  PL.ink(g, gg => { gg.moveTo(...m(4, 0)); gg.lineTo(...m(18, 0)); for (let k = 0; k < 4; k++) { gg.moveTo(...m(-20, -10 + k * 7)); gg.lineTo(...m(4, -10 + k * 7)); } }, W(2));   // 足の線
  // 偏向コイル（首と漏斗のさかい）
  [-1, 1].forEach(k => { const p = PL.poly([m(200, k * 30), m(290, k * 82), m(290, k * 112), m(200, k * 56)]); PL.tint(g, p, PL.T.rust, 0.9); PL.hatch(g, p, { angle: 1.2, gap: Math.max(4, 6 * s), w: W(1.2) }); PL.ink(g, p, W(3)); });
  // 陽極のボタン（高い電圧をかける所）
  const an = PL.ellipse(...m(424, -146), 16 * s, 8 * s, -0.53); PL.tint(g, an, PL.T.gray, 0.9); PL.ink(g, an, W(3));
  // 蛍光面（画面のうら）
  PL.ink(g, gg => { gg.moveTo(...m(548, -220)); gg.quadraticCurveTo(...m(586, 0), ...m(548, 220)); }, W(8), PL.GREEN);
  PL.ink(g, glass, W(5));
  // 電子（だんだん速く。朱の点）
  for (let i = 0; i < 6; i++) {
    const p = ((t * (o.speed || 0.9) + i / 6) % 1), q = p * p, xx = lerp(190, 560, q), yy = Math.sin(i * 2.3) * 140 * q * q;
    const d = PL.circle(...m(xx, yy), Math.max(5, 8 * s)); PL.tint(g, d, PL.RED, 0.95); PL.ink(g, d, W(2));
  }
  return { gun: m(70, 20), screen: m(580, 120), anode: m(424, -156) };
}
function earth(g, cx, cy, r, t) {
  if (window.LOOK && LOOK.planet) LOOK.planet(g, cx, cy, r, 1); else PL.sphere(g, cx, cy, r, PL.T.sea);
  const a = -Math.PI / 2 + t * Math.PI * 2 * 2.26, R = r + 34;
  PL.dots(g, Array.from({ length: 31 }, (_, i) => { const b = a - 1.4 + i / 30 * 1.4; return [cx + Math.cos(b) * R, cy + Math.sin(b) * R]; }), { w: 6 });
  const e = PL.circle(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 13); PL.tint(g, e, PL.RED, 0.95); PL.ink(g, e, 3);
}

function draw(g, t) {
  // 0〜7.5: 3択
  if (t < 7.5) {
    tube(g, 120, 220, 0.45, t, { speed: 1.4 });
    if (t < 3.0) { g.save(); g.globalAlpha = TK.pop(t, 0.1, 0.4) * fade(t, 0, 3.0, 0.25); PL.label(g, 'この[点]、どれくらい速い？', PW / 2 - 60, 420, 68); g.restore(); }
    TK.choices(g, t, 0.2, 7.5, ['新幹線くらい', '音の100倍', '光の速さの3割'], { y: 520, h: 160, gap: 30, answer: 2, reveal: 5.0, think: [3.0, 5.0], size: 62 });
  }
  // 7.5〜11: 秒速9万km、地球を2周以上
  if (t >= 7.5 && t < 11.0) {
    TK.count(g, t, 7.6, 11.0, 0, 90500, { y: 330, size: 150, dur: 1.0, label: '秒速', unit: 'km', fmt: v => '約' + Math.round(v / 10000) + '万' });
    earth(g, 430, 780, 160, t - 7.6);
    PL.leader(g, 600, 900, 760, 990); TK.lines(g, '1秒で地球を\n2周以上', 800, 1040, 50, { font: PL.MIN, color: TK.C.sub });
  }
  // 11〜18: 2万5千ボルトで押し出す
  if (t >= 11.0 && t < 18.0) {
    const p = tube(g, 90, 600, 1.15, t, { speed: 1.2 });
    fadeIn(g, TK.pop(t, 11.6, 0.4), () => {
      PL.label(g, '約 [2万5千] ボルト', PW / 2 - 60, 230, 72);
      PL.leader(g, p.anode[0], p.anode[1], 470, 290, PL.RED);
    });
    PL.leader(g, p.gun[0], p.gun[1] + 6, 150, 860); PL.label(g, '電子銃', 150, 900, 40, { color: TK.C.sub });
    PL.leader(g, 300 * 1.15 + 90, 600 + 100 * 1.15, 420, 860); PL.label(g, '曲げるコイル', 420, 900, 40, { color: TK.C.sub });
    PL.leader(g, p.screen[0] - 10, p.screen[1] + 40, 800, 860, PL.GREEN); PL.label(g, '画面（光る面）', 800, 900, 40, { color: PL.GREEN });
    TK.note(g, t, 12, 18, '電圧はテレビの大きさ・年代で 1万7千〜3万5千ボルトくらい\nこの動画の数字は 2万5千ボルトのとき', { size: 30, y: 1150 });
  }
  // 18〜25: 2つの式
  if (t >= 18.0 && t < 25.0) {
    PL.label(g, '光の速さの何%？', PW / 2 - 60, 240, 60, { color: TK.C.sub });
    TK.bars(g, t, 18.2, 25.0, [
      { label: 'ふつうの式（ニュートン）', v: 0.313 / 0.34, color: TK.C.acc2, text: '31.3%' },
      { label: 'アインシュタインの式', v: 0.302 / 0.34, color: TK.C.acc, text: '30.2%' },
    ], { y: 360, gap: 230, stagger: 0.6, size: 50 });
    fadeIn(g, fade(t, 18.2, 25, 0.3), () => {   // 目もり（％）
      const X = p => 110 + 860 * p / 0.34;
      PL.ink(g, line([[110, 800], [X(0.34), 800]]), 3);
      for (let p = 0; p <= 0.34; p += 0.01) { const big = Math.round(p * 100) % 10 === 0; PL.ink(g, line([[X(p), 800], [X(p), 800 + (big ? 20 : 9)]]), big ? 3 : 1.4); if (big) PL.label(g, Math.round(p * 100) + '%', X(p), 845, 32, { color: TK.C.sub, bold: false }); }
    });
    if (t > 21.5) { g.save(); g.globalAlpha = TK.pop(t, 21.5, 0.4); PL.label(g, 'ずれは 約[3%]', PW / 2 - 60, 960, 84); g.restore(); }
  }
  // 25〜30: 赤緑青の光る点と、電子の当たる帯（上から下へ）
  if (t >= 25.0) {
    const cols = ['#c9574a', PL.T.leaf, PL.T.sea], s = 48, x0 = 110, y0 = 260, bandY = lerp(270, 750, ((t - 25) / 2.4) % 1);
    // 点は「色 × 明るさの段」ごとに1つの道にまとめてぬる（筆のルックの手彩色は重いので）
    const bins = {};
    for (let r = 0; r < 12; r++) for (let c = 0; c < 16; c++) {
      const x = x0 + c * s + (r % 2) * s / 2, y = y0 + r * s * 0.86, d = Math.abs(y - bandY), lv = Math.min(3, Math.floor(Math.exp(-d * d / 1800) * 4)), key = ((c + r) % 3) + '_' + lv;
      (bins[key] = bins[key] || []).push([x, y]);
    }
    for (const key in bins) {
      const [ci, lv] = key.split('_').map(Number), P = bins[key], path = gg => P.forEach(([x, y]) => PL.circle(x, y, 16)(gg));
      PL.tint(g, path, cols[ci], 0.25 + 0.25 * lv);
      if (lv >= 2) PL.hatch(g, path, { angle: 0.8, gap: 6, w: 1.2, not: gg => P.forEach(([x, y]) => PL.circle(x - 5, y - 5, 14)(gg)) });
      PL.ink(g, path, lv >= 2 ? 3 : 1.6, lv >= 2 ? PL.INK : 'rgba(35,28,21,0.5)');
    }
    PL.ink(g, gg => { gg.rect(70, bandY - 26, 900, 52); }, 2, PL.RED);   // 電子の当たる帯
    PL.label(g, '寄って見ると、赤・緑・青の光る点', PW / 2 - 60, 190, 46, { color: TK.C.sub });
    PL.leader(g, 520, 790, 520, 840, PL.RED); PL.label(g, '電子の当たった列だけ光る', 520, 880, 40, { color: PL.RED });
    TK.note(g, t, 27, 30, '出どころ: The Physics Factbook（M. Hong 2000）\n電子の静止エネルギー 511 keV（CODATA）', { size: 30, y: 1150 });
  }
}

triviaStart({ out: 'crt-pixels-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
