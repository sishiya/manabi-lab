<script>
'use strict';
// うんちく metamorphosis-3（型B もしも）「イモムシは数週間で1万倍。人の赤ちゃんなら？」。台本は trivia/metamorphosis.md。?short で録る
// 出どころ: Woods (2013) Functional Ecology のデータの説明（数週間で1万倍以上、0.001 g → 12〜15 g の5齢）、
// Grunert ほか (2015) PLoS ONE 10(5):e0127988（重さの増加の約90%は5齢）。米つぶの重さは出どころがないので使わない（台本の注意）。
// 3 kg × 1万 = 30 t はただのかけ算。イモムシの絵の長さは、重さ1万倍の立方根（約22倍）に合わせた
const DUR = 25;
const subs = [
  { a: 0.0, b: 1.8, ja: '数週間で、1万倍', en: '10,000 times heavier in a few weeks', noBurn: true },
  { a: 1.8, b: 5.0, ja: 'タマゴから出たばかりのイモムシは\n[1ミリグラム]', en: 'A caterpillar fresh from the egg weighs 1 milligram' },
  { a: 5.0, b: 10.0, ja: '数週間後、[12〜15グラム]。\n1万倍以上', en: 'A few weeks later: 12–15 grams.\nOver 10,000 times more' },
  { a: 10.0, b: 14.0, ja: 'しかも増える重さの[約9割]は\n最後の1回の脱皮のあと', en: 'And about 90% of that gain comes\nafter the last molt' },
  { a: 14.0, b: 18.0, ja: 'もし 3キロの赤ちゃんが\n1万倍になったら（ただのかけ算）', en: 'If a 3 kg baby grew 10,000 times\n(just multiplication)' },
  { a: 18.0, b: 22.0, ja: '[30トン]。大型トラックくらい', en: '30 tonnes. About a big truck' },
  { a: 22.0, b: 25.0, ja: 'そして、その体を\nさなぎの中で作りかえる', en: 'Then it rebuilds that body inside the pupa' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.5, type: 'rise' }, { t: 1.8, type: 'whoosh' }, { t: 5.0, type: 'rise' }, { t: 8.6, type: 'ding' },
  { t: 10.0, type: 'whoosh' }, { t: 11.4, type: 'ding' }, { t: 14.0, type: 'whoosh' }, { t: 16.0, type: 'rise' }, { t: 18.0, type: 'thud' }, { t: 18.8, type: 'ding' },
  { t: 22.0, type: 'whoosh' }, { t: 23.0, type: 'pop' },
];
// ---- タバコスズメガ（Manduca sexta）を図鑑の版画の道具 PL.* で描く ----
// 幼虫: 緑・横に7本のななめの白いすじ（上がわに黒いふち）・お尻の近くの赤い角（尾角）・胸の3対の脚・腹の4対の腹脚＋尾脚・気門の列
// さなぎ: 赤茶・頭の下に「水さしの取っ手」のような口（口吻のさや）・翅のさやの線・腹の節・お尻のとげ
// ガ: 細長くとがった前翅（灰褐色にぎざぎざの線と白い点）・小さな後翅（黒と白の帯）・太い胸・腹の横に黄色い点の列・先が曲がった触角
const TAU = Math.PI * 2;
const rnd = (i, j = 0) => { const v = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return v - Math.floor(v); };
function mapper(x0, y0, s, rot = 0, dir = 1) { const c = Math.cos(rot), n = Math.sin(rot); return (x, y) => { x *= dir; return [x0 + s * (x * c - y * n), y0 + s * (x * n + y * c)]; }; }
const polyM = (m, pts, close = true) => g => { pts.forEach(([x, y], i) => { const q = m(x, y); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); if (close) g.closePath(); };
const linesM = (m, segs) => g => segs.forEach(seg => seg.forEach(([x, y], i) => { const q = m(x, y); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }));
const ellPts = (cx, cy, rx, ry, rot = 0, n = 32) => Array.from({ length: n }, (_, i) => { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });
const qPts = (p0, c, p1, n = 10) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, a = (1 - t) * (1 - t), b = 2 * t * (1 - t), d = t * t; return [a * p0[0] + b * c[0] + d * p1[0], a * p0[1] + b * c[1] + d * p1[1]]; });
const shift = (pts, dx, dy) => pts.map(([x, y]) => [x + dx, y + dy]);
const many = ps => g => ps.forEach(p => p(g));   // いくつかの形を1つの道に（手彩色・輪郭をまとめて1回で描く。録画と確かめを軽くする）
function arrow(g, x0, y0, x1, y1, w = 5, col = PL.INK) {
  const a = Math.atan2(y1 - y0, x1 - x0), h = 24;
  PL.ink(g, gg => { gg.moveTo(x0, y0); gg.lineTo(x1, y1); gg.moveTo(x1 - Math.cos(a - 0.45) * h, y1 - Math.sin(a - 0.45) * h); gg.lineTo(x1, y1); gg.lineTo(x1 - Math.cos(a + 0.45) * h, y1 - Math.sin(a + 0.45) * h); }, w, col);
}

// 幼虫の体の節（尾から: A10 尾・A9・A8（角）・A7〜A1・T3・T2・T1）
const HW_SEG = [30, 18, 26, 24, 24, 24, 24, 24, 24, 24, 22, 20, 18];
const HW_X0 = -150, HW_X1 = 120;
const HW_B = (() => { const tot = HW_SEG.reduce((a, b) => a + b, 0); let x = HW_X0; const b = [x]; HW_SEG.forEach(w => { x += w / tot * (HW_X1 - HW_X0); b.push(x); }); return b; })();
const hwH = x => { const u = (x - HW_X0) / (HW_X1 - HW_X0); return 50 * (u < 0.1 ? Math.pow(Math.sin(Math.PI / 2 * Math.max(0, u) / 0.1), 0.55) : u > 0.82 ? 1 - 0.3 * (u - 0.82) / 0.18 : 1); };
const segOf = x => { for (let i = 0; i < HW_SEG.length; i++) if (x < HW_B[i + 1]) return i; return HW_SEG.length - 1; };
// 横から。x, y は足もと（体のまん中）、頭が右（dir=-1 で左）。o: t（はううごき）, wig, mem（頭の記憶の印 0〜1）, rot
function hornworm(g, x, y, s, o = {}) {
  const dir = o.dir ?? 1, m = mapper(x, y, s, o.rot || 0, dir), t = o.t || 0, wig = o.wig ?? 1;
  const lift = xx => -wig * 5 * Math.max(0, Math.sin(t * 5 - xx * 0.028));
  const yb = xx => -15 + lift(xx);
  const frac = xx => { const i = segOf(xx); return (xx - HW_B[i]) / (HW_B[i + 1] - HW_B[i]); };
  const top = (dy = 0) => { const a = []; for (let xx = HW_X0; xx <= HW_X1 + 0.1; xx += 4) a.push([xx, yb(xx) - hwH(xx) - 2.2 * Math.sin(Math.PI * frac(xx)) + dy]); return a; };
  const bot = () => { const a = []; for (let xx = HW_X1; xx >= HW_X0 - 0.1; xx -= 4) a.push([xx, yb(xx) + 2 * Math.sin(Math.PI * frac(xx))]); return a; };
  const bodyPts = dy => [...top(dy), ...bot().map(([a, b]) => [a, b + dy])];
  const body = polyM(m, bodyPts(0)), lw = Math.max(1.4, 1.5 * s), ow = Math.max(2.4, 3 * s);
  g.save(); g.globalAlpha *= o.alpha ?? 1;
  // 脚（腹脚 A6〜A3・尾脚 A10・胸脚 T3〜T1）
  const legs = [];
  [0, 4, 5, 6, 7].forEach(i => { const cx = (HW_B[i] + HW_B[i + 1]) / 2 + (i ? 0 : 4), b = yb(cx) + 1, l = lift(cx); legs.push([[cx - 9, b], [cx + 9, b], [cx + 8, l - 4], [cx + 3, l], [cx - 4, l], [cx - 8, l - 4]]); });
  [10, 11, 12].forEach(i => { const cx = (HW_B[i] + HW_B[i + 1]) / 2, b = yb(cx) + 1; legs.push([[cx - 5, b], [cx + 5, b], [cx + 7, b + 9], [cx + 9, b + 13], [cx + 2, b + 10]]); });
  const legP = many(legs.map(L => polyM(m, L))); PL.tint(g, legP, PL.T.leaf, 0.85); PL.ink(g, legP, lw * 1.2);
  PL.ink(g, linesM(m, [0, 4, 5, 6, 7].map(i => { const cx = (HW_B[i] + HW_B[i + 1]) / 2 + (i ? 0 : 4), l = lift(cx); return [[cx - 5, l - 1.5], [cx + 5, l - 1.5]]; })), lw * 1.4);   // 腹脚の先のかぎ
  // 体
  PL.tint(g, body, PL.T.leaf, 0.8); PL.tint(g, body, PL.T.land, 0.35);
  g.save(); g.beginPath(); body(g); g.clip();
  PL.ink(g, linesM(m, HW_B.slice(1, -1).map(bx => [[bx, yb(bx) - hwH(bx) - 4], [bx, yb(bx) + 4]])), lw * 0.8, 'rgba(35,28,21,0.7)');   // 節の境
  PL.ink(g, linesM(m, HW_B.slice(1, -2).flatMap((bx, i) => [0.33, 0.66].map(k => { const xx = bx + k * (HW_B[i + 2] - bx); return [[xx, yb(xx) - hwH(xx) - 2], [xx, yb(xx) + 2]]; }))), lw * 0.45, 'rgba(35,28,21,0.25)');   // 小さな輪（環節のしわ）
  // ななめの白いすじ（A7〜A1。前の下から、後ろの上へ）。上がわに黒いふち
  const st = []; for (let i = 3; i <= 9; i++) { const x0 = HW_B[i + 1] - 2, x1 = x0 - 46; st.push([[x0, yb(x0) - hwH(x0) * 0.2], [x1, yb(x1) - hwH(x1) * 0.92]]); }
  PL.ink(g, linesM(m, st), Math.max(2.5, 4 * s), '#f4eedc');
  PL.ink(g, linesM(m, st.map(([a, b]) => [[a[0] - 1, a[1] - 4.5], [b[0] - 1, b[1] - 4.5]])), lw * 1.1);
  PL.hatch(g, body, { angle: 0.75, gap: Math.max(7, 4 * s), w: lw, not: polyM(m, bodyPts(-20)) });
  g.restore();
  // 気門（A8〜A1・T1）
  const spi = many([2, 3, 4, 5, 6, 7, 8, 9, 12].map(i => { const cx = (HW_B[i] + HW_B[i + 1]) / 2 + 3; return polyM(m, ellPts(cx, yb(cx) - hwH(cx) * 0.3, 2.6, 4.2, 0, 12)); }));
  PL.tint(g, spi, PL.INK, 0.85); PL.ink(g, spi, lw * 0.7, '#f4eedc');
  PL.ink(g, body, ow);
  // 尾角（A8 の背から後ろへ反る。タバコスズメガは赤い）
  const hx = (HW_B[2] + HW_B[3]) / 2 + 4, hy = yb(hx) - hwH(hx) + 1, cl = qPts([hx, hy], [hx + 4, hy - 34], [hx - 26, hy - 44], 10);
  const hornPts = [...cl.map(([px, py], i) => [px + 6 * (1 - i / 10) + 0.6, py]), ...cl.slice().reverse().map(([px, py], i) => [px - 6 * (i / 10) - 0.6, py])];
  const horn = polyM(m, hornPts); PL.tint(g, horn, PL.T.rust, 0.95); PL.ink(g, horn, lw * 1.4);
  // 頭（小さく丸い。単眼の点）
  const hb = yb(HW_X1), head = polyM(m, ellPts(HW_X1 + 12, hb - 21, 18, 22, 0.25, 28));
  PL.tint(g, head, PL.T.leaf, 0.95); PL.ink(g, head, ow);
  PL.ink(g, linesM(m, [[[HW_X1 + 20, hb - 3], [HW_X1 + 27, hb + 2], [HW_X1 + 23, hb + 5]], [[HW_X1 + 13, hb - 30], [HW_X1 + 22, hb - 22]]]), lw);
  PL.ink(g, many([[HW_X1 + 22, hb - 14], [HW_X1 + 25, hb - 9]].map(([a, b]) => polyM(m, ellPts(a, b, 1.2, 1.2, 0, 8)))), Math.max(2, 2.4 * s));
  g.restore();
  if (o.mem != null) { const [mx, my] = m(HW_X1 + 10, hb - 24); memDot(g, mx, my, Math.max(0.7, s), o.mem); }
}
// 上から（通路の中を進む）。x, y は体のまん中、頭が rot の向き
function hornwormTop(g, x, y, s, o = {}) {
  const m = mapper(x, y, s, o.rot || 0), t = o.t || 0, lw = Math.max(1.4, 1.5 * s), ow = Math.max(2.4, 3 * s);
  const w = xx => hwH(xx) * 0.46 * (1 + 0.05 * Math.sin(t * 5 - xx * 0.028));
  const sway = xx => Math.sin(t * 3 - xx * 0.02) * 4 * (o.wig ?? 1);
  const pts = dy => { const a = []; for (let xx = HW_X0; xx <= HW_X1 + 0.1; xx += 5) a.push([xx, sway(xx) - w(xx) + dy]); for (let xx = HW_X1; xx >= HW_X0 - 0.1; xx -= 5) a.push([xx, sway(xx) + w(xx) + dy]); return a; };
  const body = polyM(m, pts(0));
  g.save(); g.globalAlpha *= o.alpha ?? 1;
  const pl = many([4, 5, 6, 7].flatMap(i => { const cx = (HW_B[i] + HW_B[i + 1]) / 2; return [-1, 1].map(sd => polyM(m, ellPts(cx, sway(cx) + sd * (w(cx) + 3), 6, 4, 0, 12))); })); PL.tint(g, pl, PL.T.leaf, 0.85); PL.ink(g, pl, lw);
  PL.tint(g, body, PL.T.leaf, 0.8); PL.tint(g, body, PL.T.land, 0.35);
  g.save(); g.beginPath(); body(g); g.clip();
  PL.ink(g, linesM(m, HW_B.slice(1, -1).map(bx => [[bx, sway(bx) - 30], [bx, sway(bx) + 30]])), lw);
  PL.ink(g, linesM(m, [3, 4, 5, 6, 7, 8, 9].flatMap(i => [-1, 1].map(sd => { const x0 = HW_B[i + 1] - 2; return [[x0, sway(x0) + sd * w(x0)], [x0 - 18, sway(x0 - 18) + sd * w(x0 - 18) * 0.45]]; }))), Math.max(3, 4.5 * s), '#f4eedc');
  PL.ink(g, linesM(m, [[[HW_X0 + 30, 0], [HW_X1, 0]].map(([a]) => [a, sway(a)])]), lw * 0.6, 'rgba(35,28,21,0.5)');   // 背のまん中の線
  PL.hatch(g, body, { angle: 0.75, gap: Math.max(7, 4 * s), w: lw, not: polyM(m, pts(-12)) });
  g.restore();
  PL.ink(g, body, ow);
  const hx = (HW_B[2] + HW_B[3]) / 2, horn = polyM(m, [[hx + 6, sway(hx) - 5], [hx - 30, sway(hx - 30)], [hx + 6, sway(hx) + 5]]);
  PL.tint(g, horn, PL.T.rust, 0.95); PL.ink(g, horn, lw * 1.3);
  const head = polyM(m, ellPts(HW_X1 + 14, sway(HW_X1), 17, 17, 0, 24));
  PL.tint(g, head, PL.T.leaf, 0.95); PL.ink(g, head, ow);
  g.restore();
  if (o.mem != null) { const [mx, my] = m(HW_X1 + 12, sway(HW_X1)); memDot(g, mx, my, Math.max(0.7, s), o.mem); }
}

// さなぎ（横から。x, y はまん中、頭が右）。長さ約 200（s=1）
const PU_X0 = -92, PU_X1 = 90;
const puR = x => { const u = (x - PU_X0) / (PU_X1 - PU_X0); return 36 * (u < 0.45 ? 0.16 + 0.84 * Math.pow(Math.max(0, u) / 0.45, 0.6) : Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.45) / 0.55, 5)))); };
const puPts = (dx = 0, dy = 0) => { const a = []; for (let x = PU_X0; x <= PU_X1 + 0.1; x += 3) a.push([x + dx, -puR(x) + dy]); for (let x = PU_X1; x >= PU_X0 - 0.1; x -= 3) a.push([x + dx, puR(x) * 0.95 + dy]); return a; };
function pupa(g, x, y, s, o = {}) {
  const m = mapper(x, y, s, o.rot || 0, o.dir ?? 1), lw = Math.max(1.4, 1.5 * s), ow = Math.max(2.6, 3.2 * s), body = polyM(m, puPts());
  g.save(); g.globalAlpha *= o.alpha ?? 1;
  // お尻のとげ（cremaster）
  const cr = polyM(m, [[PU_X0 + 2, -5], [PU_X0 - 16, 0], [PU_X0 + 2, 5]]); PL.tint(g, cr, PL.T.brown, 0.9); PL.ink(g, cr, lw * 1.2);
  if (!o.cut) { PL.tint(g, body, PL.T.rust, 0.6); PL.tint(g, body, PL.T.brown, 0.55); }
  else PL.tint(g, body, PL.T.sand, 0.35);
  if (!o.cut) {
    g.save(); g.beginPath(); body(g); g.clip();
    PL.ink(g, linesM(m, [-78, -64, -50, -36, -22, -8].map(sx => qPts([sx, -40], [sx - 7, 0], [sx, 40], 8))), lw);   // 腹の節
    PL.ink(g, linesM(m, [qPts([52, -40], [30, 6], [-8, 40], 12), qPts([60, -40], [46, 0], [10, 40], 12)]), lw);   // 翅のさや・触角のさや
    PL.ink(g, linesM(m, [qPts([78, -32], [64, -10], [70, 10], 6)]), lw * 0.8);   // 頭と胸の境
    PL.hatch(g, body, { angle: 0.7, gap: Math.max(7, 4 * s), w: lw, not: polyM(m, puPts(4, -16)) });
    g.restore();
    PL.ink(g, many([-71, -57, -43, -29, -15].map(sx => polyM(m, ellPts(sx, -6, 1, 2, 0, 10)))), Math.max(1.6, 2 * s));   // 気門
  }
  PL.ink(g, body, ow);
  // 口吻のさや（水さしの取っ手）
  if (!o.cut) {
    const c = qPts([78, 18], [124, 70], [40, 33], 14), hp = [...c.map(([a, b], i) => [a + 3.5 * Math.sin(i / 14 * Math.PI), b + 3.5]), ...c.slice().reverse().map(([a, b]) => [a, b - 3])];
    const h = polyM(m, hp); PL.tint(g, h, PL.T.brown, 0.85); PL.ink(g, h, lw * 1.2);
  }
  g.restore();
  if (o.mem != null) { const [mx, my] = m(66, -6); memDot(g, mx, my, Math.max(0.7, s), o.mem); }
}

// ガ（上から。標本のように翅を広げる）。x, y は胸のまん中。o: fold（0 広げる〜1 たたむ）, flap, t, mem
// 左右の翅は同じ形を鏡に写し、手彩色・斜線・輪郭は左右まとめて1回ずつ描く
function moth(g, x, y, s, o = {}) {
  const t = o.t || 0, fold = o.fold || 0, fl = o.flap ? Math.sin(t * 9) * 0.1 : 0, lw = Math.max(1.3, 1.4 * s), ow = Math.max(2.4, 3 * s);
  g.save(); g.globalAlpha *= o.alpha ?? 1;
  const mm = mapper(x, y, s, o.rot || 0);
  PL.ink(g, many([-1, 1].map(sd => linesM(mm, [qPts([sd * 5, -78], [sd * 14, -118], [sd * 44, -126], 10), [[sd * 44, -126], [sd * 50, -122]]]))), Math.max(1.8, 2.6 * s));   // 触角（先がかぎに曲がる）
  const sides = [-1, 1].map(sd => {
    const m = mapper(x, y, s, o.rot || 0, sd);
    const wm = (bx, by, a) => (px, py) => { const dx = px - bx, dy = py - by, c = Math.cos(a), n = Math.sin(a); return m(bx + dx * c - dy * n, by + dx * n + dy * c); };
    return { hm: wm(12, -18, fold * 0.95 + fl * 0.6), fm: wm(11, -38, fold * 1.05 + fl) };
  });
  // 後翅（小さい。黒と白の帯）
  const hw = [...qPts([12, -30], [70, -36], [94, -8], 8), ...qPts([94, -8], [96, 24], [58, 30], 8).slice(1), ...qPts([58, 30], [24, 24], [12, 2], 8).slice(1)];
  const hp = many(sides.map(S => polyM(S.hm, hw)));
  PL.tint(g, hp, PL.T.gray, 0.7);
  g.save(); g.beginPath(); hp(g); g.clip();
  PL.ink(g, many(sides.map(S => linesM(S.hm, [qPts([66, -40], [90, 4], [44, 36], 10), qPts([80, -40], [104, 6], [56, 42], 10)]))), Math.max(3, 6 * s), 'rgba(35,28,21,0.85)');
  g.restore();
  PL.ink(g, hp, ow * 0.8);
  // 前翅（細長く、先がとがる。灰褐色にぎざぎざの横線）
  const fw = [...qPts([10, -52], [74, -66], [160, -48], 10), ...qPts([160, -48], [134, -18], [104, 0], 8).slice(1), ...qPts([104, 0], [54, -4], [12, -26], 8).slice(1)];
  const fp = many(sides.map(S => polyM(S.fm, fw)));
  PL.tint(g, fp, PL.T.gray, 0.85); PL.tint(g, fp, PL.T.brown, 0.35);
  g.save(); g.beginPath(); fp(g); g.clip();
  const zig = (x0, x1, n) => Array.from({ length: n + 1 }, (_, i) => { const k = i / n; return [lerp(x0, x1, k) + (i % 2 ? 5 : -5), lerp(-66, 14, k)]; });
  PL.ink(g, many(sides.map(S => linesM(S.fm, [[[14, -44], [146, -42]], [[16, -38], [128, -16]], [[18, -34], [112, 2]], [[18, -32], [92, 8]]]))), lw * 0.45, 'rgba(35,28,21,0.55)');   // 翅脈
  PL.ink(g, many(sides.map(S => linesM(S.fm, [zig(52, 36, 8), zig(104, 82, 9)]))), lw * 1.1);
  PL.ink(g, many(sides.map(S => linesM(S.fm, [qPts([138, -52], [116, -22], [104, 14], 8)]))), Math.max(2.5, 5 * s), 'rgba(35,28,21,0.55)');
  PL.hatch(g, fp, { angle: 0.9, gap: Math.max(7, 3.6 * s), w: lw * 0.8, not: many(sides.map(S => polyM(S.fm, shift(fw, 0, -16)))) });
  g.restore();
  const spot = many(sides.map(S => polyM(S.fm, ellPts(66, -40, 4.5, 3, 0, 10)))); PL.tint(g, spot, '#f4eedc', 0.95); PL.ink(g, spot, lw * 0.7);   // 白い点
  PL.ink(g, fp, ow);
  // 体: 腹（黄色い点が6対）・胸（太く毛深い）・頭（大きな目）
  const abPts = [...qPts([-14, -18], [-19, 30], [-3, 90], 10), [0, 96], ...qPts([3, 90], [19, 30], [14, -18], 10)];
  const ab = polyM(mm, abPts);
  PL.tint(g, ab, PL.T.gray, 0.9); PL.tint(g, ab, PL.T.brown, 0.3);
  g.save(); g.beginPath(); ab(g); g.clip();
  PL.ink(g, linesM(mm, [2, 15, 28, 41, 54, 67, 80].map(yy => qPts([-20, yy], [0, yy + 5], [20, yy], 6))), lw * 0.8);
  const spots = many([8, 21, 34, 47, 60, 73].flatMap((yy, i) => [-1, 1].map(sd => polyM(mm, ellPts(sd * (12 - i * 1.6), yy, 4, 4, 0, 10)))));
  PL.tint(g, spots, PL.T.gold, 1); PL.ink(g, spots, lw * 0.9);
  PL.hatch(g, ab, { angle: 0.9, gap: Math.max(7, 3.6 * s), w: lw * 0.8, not: polyM(mm, shift(abPts, -7, 0)) });
  g.restore();
  PL.ink(g, ab, ow);
  const thP = ellPts(0, -44, 18, 27, 0, 30), th = polyM(mm, thP);
  PL.tint(g, th, PL.T.gray, 0.95); PL.tint(g, th, PL.T.brown, 0.4);
  PL.ink(g, linesM(mm, [qPts([-10, -64], [-14, -44], [-8, -22], 6), qPts([10, -64], [14, -44], [8, -22], 6)]), Math.max(2, 3.5 * s), 'rgba(35,28,21,0.7)');   // 胸の濃いすじ
  PL.ink(g, linesM(mm, Array.from({ length: 18 }, (_, i) => { const a = i / 18 * TAU, cx = Math.cos(a) * 18, cy = -44 + Math.sin(a) * 27; return [[cx, cy], [cx * 1.18, -44 + (cy + 44) * 1.12]]; })), lw * 0.8);   // 胸の毛
  PL.ink(g, th, ow);
  const hd = polyM(mm, ellPts(0, -74, 11, 9, 0, 20)); PL.tint(g, hd, PL.T.gray, 0.95); PL.ink(g, hd, ow * 0.8);
  const eyes = many([-1, 1].map(sd => polyM(mm, ellPts(sd * 10, -76, 5, 6, 0, 12)))); PL.tint(g, eyes, PL.INK, 0.9); PL.ink(g, eyes, lw);
  g.restore();
  if (o.mem != null) { const [mx, my] = mm(0, -74); memDot(g, mx, my, Math.max(0.7, s), o.mem); }
}
// 記憶の印（朱の小さな丸。消えたら点線の輪だけ）
function memDot(g, x, y, s, k) {
  const r = 7 * s;
  if (k <= 0.02) { g.save(); g.setLineDash([4, 5]); PL.ink(g, PL.circle(x, y, r * 1.5), 2.5); g.restore(); return; }
  g.save(); g.globalAlpha *= clamp(k, 0, 1);
  const c = PL.circle(x, y, r); PL.tint(g, c, PL.RED, 0.9); PL.ink(g, c, 2.5, PL.RED); PL.ink(g, PL.circle(x, y, r * 1.6), 2, PL.RED);
  g.restore();
}

// 葉（横から見た葉の面。イモムシの足場）
function leaf(g, x0, x1, y) {
  const top = qPts([x0, y + 4], [(x0 + x1) / 2, y - 14], [x1, y + 10], 16), bot = qPts([x1, y + 10], [(x0 + x1) / 2, y + 16], [x0, y + 30], 16), P = PL.poly([...top, ...bot.slice(1)]);
  PL.tint(g, P, PL.T.leaf, 0.6); PL.hatch(g, P, { angle: 0.3, gap: 7, w: 1.4 }); PL.ink(g, P, 4);
  PL.ink(g, gg => { for (let i = 1; i < 12; i++) { const [px, py] = top[i + 2] || top[i]; gg.moveTo(px, py + 2); gg.lineTo(px - 18, py + 18); } }, 1.4, 'rgba(35,28,21,0.6)');   // 葉脈の切り口
}
// 赤ちゃん（立った線画）。足もとを (x, y) に
function baby(g, x, y, s) {
  const m = mapper(x, y, s), lw = Math.max(1.6, 2 * s), ow = Math.max(2.6, 3.4 * s);
  const parts = [
    polyM(m, [...qPts([-34, -92], [-62, -76], [-74, -50], 6), ...qPts([-62, -46], [-50, -70], [-26, -80], 6)]),   // 左うで
    polyM(m, [...qPts([34, -92], [62, -76], [74, -50], 6), ...qPts([62, -46], [50, -70], [26, -80], 6)]),          // 右うで
    polyM(m, [...qPts([-30, -32], [-38, -12], [-30, 0], 6), [-8, 0], ...qPts([-8, -6], [-10, -22], [-6, -34], 6)]), // 左あし
    polyM(m, [...qPts([30, -32], [38, -12], [30, 0], 6), [8, 0], ...qPts([8, -6], [10, -22], [6, -34], 6)]),        // 右あし
    polyM(m, ellPts(0, -66, 40, 46, 0, 30)),   // 胴
    polyM(m, ellPts(0, -150, 42, 40, 0, 30)),  // 頭
  ];
  parts.forEach((p, i) => { PL.tint(g, p, PL.T.rose, 0.55); });
  const diaper = polyM(m, [...qPts([-38, -52], [0, -40], [38, -52], 8), ...qPts([36, -36], [0, -6], [-36, -36], 8)]);
  PL.tint(g, diaper, '#f4eedc', 0.9);
  parts.forEach((p, i) => PL.hatch(g, p, { angle: 0.9, gap: Math.max(7, 5 * s), w: lw, not: i === 5 ? polyM(m, ellPts(-14, -160, 42, 40, 0, 30)) : i === 4 ? polyM(m, ellPts(-14, -74, 40, 46, 0, 30)) : g2 => {} }));
  parts.forEach(p => PL.ink(g, p, ow)); PL.ink(g, diaper, ow * 0.8);
  PL.ink(g, linesM(m, [qPts([-8, -190], [6, -200], [2, -186], 4), [[-14, -150], [-12, -146]], [[14, -150], [16, -146]], qPts([-8, -132], [0, -126], [8, -132], 4)]), lw * 1.2);   // かみの毛・目・口
  const ear = polyM(m, ellPts(42, -148, 7, 10, 0, 12)); PL.tint(g, ear, PL.T.rose, 0.6); PL.ink(g, ear, lw * 1.2);
}
// 大型トラック（横から）。左下を (x, y) に、幅 w
function truck(g, x, y, w) {
  const s = w / 800, X = v => x + v * s, Y = v => y - v * s;
  const box = PL.rect(X(0), Y(300), 570 * s, 230 * s), cab = PL.poly([[X(590), Y(70)], [X(590), Y(270)], [X(715), Y(270)], [X(790), Y(170)], [X(790), Y(70)]]);
  const chassis = PL.rect(X(-10), Y(70), 810 * s, 22 * s);
  PL.tint(g, chassis, PL.T.gray, 0.8); PL.ink(g, chassis, 4);
  PL.tint(g, box, PL.T.sand, 0.6); PL.hatch(g, box, { angle: 0.9, gap: 11, w: 2, not: PL.rect(X(0), Y(300), 570 * s, 150 * s) });
  PL.ink(g, gg => { for (let i = 1; i < 8; i++) { gg.moveTo(X(i * 71), Y(300)); gg.lineTo(X(i * 71), Y(70)); } }, 1.6, 'rgba(35,28,21,0.6)');   // 荷台の板
  PL.ink(g, box, 5);
  PL.tint(g, cab, PL.T.rust, 0.55); PL.hatch(g, cab, { angle: 0.9, gap: 10, w: 2, not: PL.rect(X(590), Y(270), 200 * s, 110 * s) }); PL.ink(g, cab, 5);
  const win = PL.poly([[X(620), Y(240)], [X(705), Y(240)], [X(755), Y(175)], [X(620), Y(175)]]); PL.tint(g, win, PL.T.sky, 0.7); PL.ink(g, win, 3);
  for (const wx of [90, 190, 480, 680]) { const c = PL.circle(X(wx), Y(40), 42 * s); PL.tint(g, c, PL.INK, 0.75); PL.ink(g, c, 4); const h = PL.circle(X(wx), Y(40), 16 * s); PL.tint(g, h, PL.T.gray, 0.9); PL.ink(g, h, 2.5); }
  PL.ink(g, gg => { gg.moveTo(x - 60, y + 2); gg.lineTo(x + w + 60, y + 2); }, 3);   // 地面
}

function draw(g, t) {
  // 0〜10: 点がふくらんで終齢のイモムシに（長さで約22倍＝重さで約1万倍）
  if (t < 10.0) {
    const f = fade(t, -1, 10.0, 0.3);
    g.save(); g.globalAlpha = f;
    const k = t < 5.0 ? 0 : ease(clamp((t - 5.0) / 3.4, 0, 1));
    const s = 0.09 * Math.pow(1.95 / 0.09, k);
    const y = 800;
    leaf(g, 60, 1020, y);
    if (t < 1.8) {
      const kk = TK.out((t - 0.4) / 1.2);
      hornworm(g, 540, y, 0.09 + 1.2 * kk, { t, wig: 0.5 });
    } else {
      hornworm(g, 540, y, s, { t, wig: 0.6 });
      if (k === 0) {
        PL.ink(g, PL.circle(540, y - 14, 70), 4, PL.RED);
        g.save(); g.globalAlpha *= clamp(TK.pop(t, 2.0), 0, 1); PL.label(g, '1 ミリグラム', 540, y + 140, 64, { color: PL.RED }); PL.label(g, '（0.001 g）', 540, y + 210, 44, { color: TK.C.sub }); g.restore();
        PL.label(g, 'タマゴから出たばかり', 760, 640, 40, { color: TK.C.sub, bold: false }); PL.leader(g, 600, y - 50, 700, 665, TK.C.sub);
      }
      if (t >= 5.0) {
        const w = 0.001 * Math.pow(13500, k);
        PL.label(g, w < 1 ? w.toFixed(3) + ' g' : w < 10 ? w.toFixed(1) + ' g' : (t > 8.4 ? '12〜15 g' : Math.round(w) + ' g'), 540, 1020, 88, { color: PL.RED });
        if (t > 8.6) { g.save(); g.globalAlpha *= clamp(TK.pop(t, 8.6), 0, 1); PL.label(g, '[1万倍]以上', 540, 330, 120); g.restore(); }
      }
    }
    g.restore();
    TK.hook(g, t, 0.0, 1.8, '数週間で\n[1万倍]', { y: 380, size: 130 });
  }
  // 10〜14: 増えた重さの約9割は5齢（最後のイモムシ）で
  if (t >= 10.0 && t < 14.0) {
    g.save(); g.globalAlpha = fade(t, 10.0, 14.0, 0.3);
    PL.label(g, '増えた重さ、どこで増えた？', PW / 2, 280, 60, { color: TK.C.sub });
    g.restore();
    TK.bars(g, t, 10.2, 14.0, [
      { label: '1〜4齢（4回の脱皮まで）', v: 0.10, text: '約1割' },
      { label: '5齢（最後の脱皮のあと）', v: 0.90, text: '約9割' },
    ], { y: 470, gap: 230, size: 50, stagger: 0.7, min: 150 });
    g.save(); g.globalAlpha = fade(t, 10.0, 14.0, 0.3); leaf(g, 300, 1040, 1110); hornworm(g, 700, 1110, 1.05, { t }); PL.label(g, '5齢（終齢）', 250, 1060, 40, { color: TK.C.sub, bold: false }); g.restore();
  }
  // 14〜22: もしも 3 kg の赤ちゃんが1万倍なら
  if (t >= 14.0 && t < 22.0) {
    g.save(); g.globalAlpha = fade(t, 14.0, 22.0, 0.3);
    PL.label(g, 'もしも…（ただのかけ算）', 90, 250, 56, { align: 'left', color: TK.C.sub });
    const by = 900;
    const hb = 1 - clamp((t - 18.3) / 0.4, 0, 1);   // トラックが出たら赤ちゃんの絵は消す
    g.save(); g.globalAlpha *= hb;
    baby(g, 210, by, 1.0);
    PL.label(g, '3 kg', 210, by + 60, 56, { color: PL.RED });
    g.restore();
    if (t > 15.0 && t < 18.0) { g.save(); g.globalAlpha *= clamp(TK.pop(t, 15.0), 0, 1); PL.label(g, '× 10,000', 280, 560, 90); g.restore(); }
    if (t > 16.0) {
      const k = TK.out((t - 16.0) / 2.0);
      g.save(); g.globalAlpha *= clamp((t - 16.0) / 0.4, 0, 1) * hb;
      baby(g, 720, by, 0.6 + 1.8 * k);
      g.restore();
    }
    if (t > 18.0) { g.save(); g.globalAlpha *= clamp(TK.pop(t, 18.0), 0, 1); PL.label(g, '[30 トン]', 540, 345, 140); g.restore(); }
    if (t > 18.6) {
      g.save(); g.globalAlpha *= clamp((t - 18.6) / 0.5, 0, 1);
      truck(g, 140, 1000, 800);
      PL.label(g, '大型トラック くらい', 540, 1070, 54, { color: TK.C.sub });
      g.restore();
    }
    g.restore();
  }
  // 22〜25: 大きな体 → さなぎ
  if (t >= 22.0) {
    g.save(); g.globalAlpha = fade(t, 22.0, 25.5, 0.3);
    const k = clamp((t - 22.8) / 0.6, 0, 1);
    g.save(); g.globalAlpha *= 1 - k; hornworm(g, 540, 760, 1.7, { t }); g.restore();
    if (k > 0) { g.save(); g.globalAlpha *= k; pupa(g, 540, 690, 2.6); g.restore(); }
    PL.label(g, '終齢のイモムシ → さなぎ', PW / 2, 330, 60, { color: TK.C.sub });
    g.restore();
  }
  if (t >= 5.0 && t < 10.0) TK.note(g, t, 5.0, 10.0, '絵の長さは重さに合わせた（重さ1万倍 ＝ 長さ約22倍）／えさの期間は条件で 12〜45日', { size: 28 });
  if (t >= 14.0 && t < 22.0) TK.note(g, t, 14.0, 22.0, '3 kg × 1万 のかけ算だけ（人の育ち方とはくらべていない）／トラックの重さは目安', { size: 28 });
  if (t >= 22.0) TK.note(g, t, 22.0, 25.0, '出どころ: Woods (2013) Functional Ecology のデータ／Grunert ほか (2015) PLoS ONE 10(5): e0127988', { size: 28 });
}

triviaStart({ out: 'metamorphosis-trivia3', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
