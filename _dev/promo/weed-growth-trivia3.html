<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく weed-growth-3（型E ズーム）「畑の土 1m² に、雑草のタネが最大16万粒」。台本は trivia/weed-growth.md。?short で録る
// 1株 3,811粒（green foxtail、Kegode & Forcella）・生きたタネ 600〜162,000粒/m²（Forcella ほか 1992、アメリカのコーンベルト）
// 10cm 四方に最大 1,620粒（点は 1,620 個そのまま描く）。芽を出すのは最大 30%（giant foxtail の値）
const DUR = 30;
const subs = [
  { a: 0.0, b: 1.6, ja: 'この1本から、何粒？', en: 'How many seeds from this one plant?', noBurn: true },
  { a: 1.6, b: 4.0, ja: 'エノコログサ（ねこじゃらし）1株が作るタネは\n約[3,800粒]', en: 'One foxtail plant makes about 3,800 seeds' },
  { a: 4.0, b: 10.0, ja: '引いて、畑の土 1m²。\nそこに眠っているタネは…', en: 'Zoom out to one square metre of farm soil.\nHow many seeds are sleeping in it?' },
  { a: 10.0, b: 16.0, ja: '生きたタネだけで、調べた畑によって\n[600粒]から[16万2000粒]', en: 'Living seeds alone: from 600\nto 162,000, depending on the field' },
  { a: 16.0, b: 22.0, ja: '手のひらくらいの10cm四方でも、[最大1600粒]', en: 'Even a palm-sized 10 cm square: up to 1,600' },
  { a: 22.0, b: 26.0, ja: 'その年に芽を出すのは、\nねこじゃらしのなかまでも[3割まで]', en: 'Even for foxtails, at most 30% sprout that year' },
  { a: 26.0, b: 30.0, ja: 'のこりは土の中で次の年を待つ。\nだから、抜いても抜いても、次が出る', en: 'The rest wait in the soil for next year —\nwhich is why weeds keep coming back' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.8, type: 'rise' }, { t: 3.6, type: 'ding' }, { t: 4.0, type: 'whoosh' }, { t: 6.0, type: 'whoosh' },
  { t: 10.0, type: 'rise' }, { t: 12.6, type: 'ding' }, { t: 16.0, type: 'whoosh' }, { t: 18.6, type: 'ding' }, { t: 22.0, type: 'pop' }, { t: 23.2, type: 'rise' }, { t: 26.0, type: 'whoosh' },
];
const SEED = '#e6c27a', LEAF = '#7fd18b', SOIL = '#5a3e26';
const rnd = (i, k = 1) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
function plant(g, t, x, base, s) {
  g.save(); g.translate(x, base); g.scale(s, s);
  g.strokeStyle = LEAF; g.lineWidth = 6; g.lineCap = 'round';
  for (let j = -2; j <= 2; j++) {
    const a = j * 0.22, L = 380 - Math.abs(j) * 40, tx = Math.sin(a) * L, ty = -Math.cos(a) * L;
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(tx * 0.3, ty * 0.6, tx, ty); g.stroke();
    // 穂（ふさふさ）
    g.save(); g.translate(tx, ty); g.rotate(a + 0.25 + Math.sin(t * 1.5 + j) * 0.04);
    g.fillStyle = '#b9d87a'; g.beginPath(); g.ellipse(0, -60, 18, 70, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(220,240,170,0.8)'; g.lineWidth = 2; for (let k = 0; k < 14; k++) { const yy = -120 + k * 9; g.beginPath(); g.moveTo(-14, yy); g.lineTo(-30, yy - 12); g.moveTo(14, yy); g.lineTo(30, yy - 12); g.stroke(); }
    g.restore();
  }
  g.strokeStyle = LEAF; g.lineWidth = 8; [[-1, 160], [1, 140]].forEach(([d, L]) => { g.beginPath(); g.moveTo(0, -20); g.quadraticCurveTo(d * L * 0.6, -L * 0.5, d * L, -L * 0.2); g.stroke(); });
  g.restore();
}
function soilBox(g, x0, y0, w, h) {
  g.fillStyle = SOIL; g.fillRect(x0, y0, w, h);
  g.strokeStyle = '#cfe0ff'; g.lineWidth = 6; g.strokeRect(x0, y0, w, h);
}

function draw(g, t) {
  if (t < 4.0) {
    plant(g, t, PW / 2, 1080, 1.2);
    // こぼれるタネ
    for (let i = 0; i < 40; i++) { const p = ((t - 1.6) * 0.6 + rnd(i)) % 1; if (t < 1.6) break; g.fillStyle = SEED; g.beginPath(); g.ellipse(PW / 2 + (rnd(i, 2) - 0.5) * 500, lerp(380, 1020, p), 7, 5, i, 0, Math.PI * 2); g.fill(); }
    if (t < 1.6) TK.hook(g, t, 0, 1.6, 'この1本から、\n[何粒]？', { y: 260, size: 110 });
    else TK.count(g, t, 1.6, 4.0, 0, 3800, { y: 260, size: 150, dur: 1.8, unit: '粒（1株）' });
    return;
  }
  if (t < 16.0) {
    // 引いて 1m²（ズームアウトの枠）
    const k = ease((t - 4.4) / 2.2), S = lerp(1600, 760, k);
    soilBox(g, PW / 2 - S / 2, 680 - S / 2, S, S);
    if (t < 10) TK.text(g, '1 m²', PW / 2, 680 - S / 2 - 50, 64, { color: TK.C.sub }); else TK.text(g, '1 m²', PW / 2 - 330, 350, 50, { color: '#fff' });
    if (k < 0.6) plant(g, t, PW / 2, 680, lerp(1.0, 0.3, k / 0.6));
    // 点（タネ）。数は 600 → 162,000 を見た目の濃さで（描くのは代表の点）
    if (t >= 10.0) {
      const c = Math.exp(lerp(Math.log(600), Math.log(162000), TK.out((t - 10.4) / 2.4)));
      const n = Math.round(Math.sqrt(c / 162000) * 3200);
      for (let i = 0; i < n; i++) { g.fillStyle = SEED; g.fillRect(PW / 2 - 380 + rnd(i) * 760, 300 + rnd(i, 2) * 760, 4, 3); }
      TK.card(g, 240, 140, 600, 120, { r: 50 });
      TK.text(g, Math.round(c).toLocaleString('ja-JP') + ' 粒', PW / 2, 200, 76, { color: TK.C.acc });
    }
    return;
  }
  // 16〜30: 10cm 四方に 1,620粒
  const x0 = 140, y0 = 280, S = 800;
  soilBox(g, x0, y0, S, S);
  TK.text(g, '10 cm 四方', PW / 2, 230, 58, { color: TK.C.sub });
  const n = Math.round(1620 * clamp((t - 16.4) / 2.0, 0, 1));
  const lit = t >= 22.0 ? clamp((t - 22.6) / 1.4, 0, 1) : 0;
  for (let i = 0; i < n; i++) {
    const x = x0 + 10 + rnd(i, 4) * (S - 20), y = y0 + 10 + rnd(i, 5) * (S - 20);
    const sprout = rnd(i, 6) < 0.3 * lit;
    if (sprout && t < 26) { g.fillStyle = LEAF; g.fillRect(x - 3, y - 10, 6, 14); }
    else { g.fillStyle = t >= 26 && !(rnd(i, 6) < 0.3) ? 'rgba(230,194,122,0.45)' : SEED; g.fillRect(x - 2, y - 2, 5, 4); }
    if (t >= 26 && rnd(i, 6) < 0.3) { g.fillStyle = LEAF; g.fillRect(x - 3, y - 10, 6, 14); }
  }
  if (t < 22) { TK.card(g, 290, 1040 - 60, 500, 100, { r: 50 }); TK.text(g, n.toLocaleString('ja-JP') + ' 粒', PW / 2, 1030, 64, { color: TK.C.acc }); }
  else if (t < 26) { TK.card(g, 290, 980, 500, 100, { r: 50 }); TK.text(g, '芽を出す 最大[3割]', PW / 2, 1030, 56, { acc: LEAF }); }
  else { TK.card(g, 240, 980, 600, 100, { r: 50 }); TK.text(g, 'のこり [7割] は次の年へ', PW / 2, 1030, 56, { acc: SEED }); }
  if (t >= 16 && t < 22) TK.note(g, t, 16, 22, 'いちばん多い畑の値から。ふつうの庭の値ではありません', { size: 32 });
}
function notes(g, t) {
  if (t >= 10 && t < 16) TK.note(g, t, 10, 16, 'アメリカのコーンベルトの畑。死んだタネ（全体の5〜9割）は数えていません', { size: 30 });
  if (t >= 22 && t < 27.8) TK.note(g, t, 22, 27.8, '3割は giant foxtail（アキノエノコログサのなかま）の値。点の数は 1,620 個そのまま', { size: 28 });
  if (t >= 27.8) TK.note(g, t, 27.8, 30, '出どころ: Forcella ほか (1992) Weed Science 40:636・Kegode & Forcella, Weed Science 54', { size: 28 });
}

triviaStart({ out: 'weed-growth-trivia3', dur: DUR, draw: (g, t) => { draw(g, t); notes(g, t); }, subs, cues, peek: 1.0 });
</script>
</body>
</html>
