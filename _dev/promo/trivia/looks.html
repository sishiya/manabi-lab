<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うんちくショートのルック見くらべ</title>
<style>
  :root { --bg: #111418; --card: #1d2229; --fg: #f2f2f2; --sub: #aab4c0; --acc: #ffcf4a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(17,20,24,0.96); padding: 10px 16px; border-bottom: 1px solid #2c333d; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  button, select { font: inherit; font-size: 14px; background: var(--card); color: var(--fg); border: 1px solid #3a4452; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.on { background: var(--acc); color: #111; border-color: var(--acc); }
  input[type=range] { flex: 1; min-width: 160px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 14px 16px; }
  #grid.one { grid-template-columns: minmax(260px, 420px); justify-content: center; }
  figure { margin: 0; background: var(--card); border-radius: 12px; overflow: hidden; }
  figure canvas { width: 100%; aspect-ratio: 9 / 16; display: block; background: #000; }
  figcaption { padding: 8px 10px 10px; font-size: 13px; color: var(--sub); }
  figcaption b { color: var(--fg); font-size: 15px; display: block; margin-bottom: 2px; }
  #t { font-variant-numeric: tabular-nums; min-width: 4.5em; }
</style>
</head>
<body>
<header>
  <h1>うんちくショートのルック見くらべ（試作。絵の中身は同じで、見た目だけ変える）</h1>
  <div class="bar">
    <select id="page"></select>
    <button id="play">▶ 再生</button>
    <input id="time" type="range" min="0" max="30" step="0.05" value="9">
    <span id="t"></span>
  </div>
  <div class="bar" id="looks"></div>
</header>
<div id="grid"></div>
<script src="../../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="../promo.js"></script>
<script src="../promo-audio.js"></script>
<script src="../trivia-kit.js"></script>
<script>
'use strict';
// ルックの見くらべ（2026-11-03）。うんちくのページ（../<page>.html）の台本をそのまま読み、triviaStart の代わりに
// ここで1コマずつ描く。ルック＝「下地の決まり（色・字・札）」＋「仕上げ（描いたあとの絵全体にかける刷り・紙・光）」。
// 仕上げは絵全体にかけるので、89本のページを書き直さなくても同じルックになる（決まったら trivia-kit.js へ移す）
PW = 1080; PH = 1920;
const W = 540, H = 960, S = W / PW;   // 見くらべは半分の大きさで描く（軽くするため）
const BASE_C = Object.assign({}, TK.C), BASE_FONT = setFont, BASE = { bg: TK.bg, card: TK.card };
// Windows に入っている字（なければ次の字へ）
const KYOKASHO = '"UD Digi Kyokasho NK", "UD デジタル 教科書体 NK", "UD Digi Kyokasho N", "Yu Gothic UI", sans-serif';
const BIZ = '"BIZ UDPGothic", "BIZ UDPゴシック", "Yu Gothic UI", sans-serif';

// 決まった乱数（紙のむら・粒）。毎コマ同じにして、ちらつかせない
function noiseCanvas(w, h, scale, seed) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), d = g.createImageData(w, h);
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cw = Math.ceil(w / scale) + 2, ch = Math.ceil(h / scale) + 2, v = new Float32Array(cw * ch).map(rnd);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const fx = x / scale, fy = y / scale, ix = fx | 0, iy = fy | 0, ux = fx - ix, uy = fy - iy;
    const a = v[iy * cw + ix], b = v[iy * cw + ix + 1], c2 = v[(iy + 1) * cw + ix], e = v[(iy + 1) * cw + ix + 1];
    const n = (a * (1 - ux) + b * ux) * (1 - uy) + (c2 * (1 - ux) + e * ux) * uy, i = (y * w + x) * 4;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = n * 255; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0); return g.getImageData(0, 0, w, h).data;
}
const FINE = noiseCanvas(W, H, 1, 7), MOTTLE = noiseCanvas(W, H, 90, 11), FIBER = noiseCanvas(W, H, 6, 23);
const lum = (r, g, b) => (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
// ページが札に明るい色をわたしたとき（答えの札が光るなど）は、その色を使う
const bright = c => { const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || ''); return !!m && lum(+m[1], +m[2], +m[3]) > 0.35; };

const LOOKS = [
  { id: 'now', name: 'いまの', note: '紺の地にうすい方眼。比べるための今のまま。' },
  {
    id: 'riso', name: '学校のプリント（リソグラフ）',
    note: '学校のプリントや学級通信を刷っていた孔版印刷。紙に2色のインク（青・蛍光ピンク）を網点で重ね、版が少しずれる。字はUDデジタル教科書体。',
    font: KYOKASHO,
    finish(px) {   // 明るい所ほどインクがのる。あたたかい色は蛍光ピンク、ほかは青の版へ。網点＋版ずれ＋紙の粒
      const P = [244, 242, 236], INK1 = [0, 120, 191], INK2 = [255, 72, 176];   // 紙・青（Riso Blue に近い）・蛍光ピンク
      const n = W * H, c1 = new Float32Array(n), c2 = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2], L = clamp((lum(r, g, b) - 0.14) / 0.8, 0, 1);
        const warm = clamp((r - b) / 140, 0, 1);
        c2[i] = L * warm; c1[i] = L * (1 - warm * 0.85);
      }
      const ang1 = 0.26, ang2 = 1.31, f = 2 * Math.PI / 4.2, dx = 2, dy = 1;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = y * W + x, j = Math.min(n - 1, Math.max(0, (y - dy) * W + (x - dx)));   // ピンクの版を少しずらす
        const u1 = x * Math.cos(ang1) + y * Math.sin(ang1), v1 = -x * Math.sin(ang1) + y * Math.cos(ang1);
        const u2 = x * Math.cos(ang2) + y * Math.sin(ang2), v2 = -x * Math.sin(ang2) + y * Math.cos(ang2);
        const t1 = (Math.cos(u1 * f) + Math.cos(v1 * f)) * 0.25 + 0.5, t2 = (Math.cos(u2 * f) + Math.cos(v2 * f)) * 0.25 + 0.5;
        const grain = (FINE[i * 4] / 255 - 0.5) * 0.1, mot = (MOTTLE[i * 4] / 255 - 0.5) * 0.18;
        // 網点は大きな面だけ（細い字は網点にすると読めないので、こさをそのままに少しだけ網目を残す）
        const ink = (c, th) => c < 0.06 ? 0 : clamp(Math.min(1, c * 1.25) * (0.8 + 0.4 * (c > 0.5 ? 0.5 : th)) + grain, 0, 1) * (0.9 + mot);
        const k1 = ink(c1[i], 1 - t1), k2 = ink(c2[j], 1 - t2);
        const pg = 1 + (FIBER[i * 4] / 255 - 0.5) * 0.05;
        for (let ch = 0; ch < 3; ch++) {
          const m1 = 1 - k1 * (1 - INK1[ch] / 255), m2 = 1 - k2 * (1 - INK2[ch] / 255);
          px[i * 4 + ch] = P[ch] * pg * m1 * m2;
        }
      }
    },
  },
  {
    id: 'cyan', name: '青焼き（設計図）',
    note: '昔の設計図の日光写真（シアノタイプ）。紺青の紙に白い線が焼きつく。方眼は製図の目盛り、字はBIZ UDゴシック。',
    font: BIZ,
    bg(g, t) {   // 製図の方眼（細かい線＋5マスごとの太い線）。動かさない
      g.fillStyle = '#000'; g.fillRect(0, 0, PW, PH);
      g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1.2; g.beginPath();
      for (let x = 0; x <= PW; x += 36) { g.moveTo(x, 0); g.lineTo(x, PH); }
      for (let y = 0; y <= PH; y += 36) { g.moveTo(0, y); g.lineTo(PW, y); }
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 2; g.beginPath();
      for (let x = 0; x <= PW; x += 180) { g.moveTo(x, 0); g.lineTo(x, PH); }
      for (let y = 0; y <= PH; y += 180) { g.moveTo(0, y); g.lineTo(PW, y); }
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 3; g.strokeRect(40, 40, PW - 80, PH - 80);   // 図面のわく
    },
    card(g, x, y, w, h, o = {}) {   // 札は角ばった二重線のわく
      g.save(); g.fillStyle = bright(o.fill) ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.85)'; g.fillRect(x, y, w, h);
      g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = bright(o.fill) ? 6 : 3; g.strokeRect(x, y, w, h); g.lineWidth = 1.5; g.strokeRect(x + 10, y + 10, w - 20, h - 20); g.restore();
    },
    finish(px) {   // 明るさだけを使い、紺青の紙に白（少しにじむ）。紙のむらと繊維
      const P = [20, 52, 110], INK = [232, 241, 247];
      for (let i = 0, n = W * H; i < n; i++) {
        const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
        const warm = clamp((r - b) / 160, 0, 1), L = clamp(lum(r, g, b) * 1.25 + warm * 0.15, 0, 1);
        const mot = (MOTTLE[i * 4] / 255 - 0.5), fib = (FIBER[i * 4] / 255 - 0.5), gr = (FINE[i * 4] / 255 - 0.5);
        const k = clamp(Math.pow(L, 0.85) * (0.93 + gr * 0.12), 0, 1);
        for (let ch = 0; ch < 3; ch++) px[i * 4 + ch] = P[ch] * (1 + mot * 0.35 + fib * 0.08) * (1 - k) + INK[ch] * k;
      }
    },
  },
  {
    id: 'dark', name: '暗室（ほんのり光る）',
    note: '夜の理科室で、図だけが光っている感じ。黒に近い深緑の地、光る所はにじむ。粒子と四すみを暗く。字はUDデジタル教科書体。',
    font: KYOKASHO,
    C: { bg0: '#05080a', bg1: '#0b1214', acc: '#ffb54a', acc2: '#7fe0d0', sub: '#c9d8d2', line: 'rgba(170,220,200,0.07)', green: '#8be3a6', red: '#ff7a6a' },
    bg(g, t) {   // 方眼のかわりに小さな点
      const gr = g.createRadialGradient(PW / 2, PH * 0.4, 100, PW / 2, PH * 0.45, PH * 0.75);
      gr.addColorStop(0, '#0e1a1c'); gr.addColorStop(1, '#040607'); g.fillStyle = gr; g.fillRect(0, 0, PW, PH);
      g.fillStyle = 'rgba(170,220,200,0.13)';
      for (let y = 45; y < PH; y += 90) for (let x = 45; x < PW; x += 90) { g.beginPath(); g.arc(x, y, 2.2, 0, Math.PI * 2); g.fill(); }
    },
    card(g, x, y, w, h, o = {}) {
      const hi = bright(o.fill);
      g.save(); g.fillStyle = hi ? 'rgba(255,181,74,0.22)' : 'rgba(8,14,16,0.82)'; g.strokeStyle = hi ? TK.C.acc : 'rgba(170,220,200,0.28)'; g.lineWidth = hi ? 5 : 2;
      g.beginPath(); g.roundRect(x, y, w, h, Math.min(o.r ?? 18, 18)); g.fill(); g.stroke(); g.restore();
    },
    post(g, src) {   // にじみ（明るい所をぼかして足す）＋四すみを暗く
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.55; g.filter = 'blur(10px) brightness(0.9)'; g.drawImage(src, 0, 0); g.filter = 'blur(28px)'; g.globalAlpha = 0.35; g.drawImage(src, 0, 0); g.restore();
      const v = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.5, H * 0.75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
    },
    finish(px) {   // 細かい粒（フィルムのように）
      for (let i = 0, n = W * H; i < n; i++) { const gr = (FINE[i * 4] / 255 - 0.5) * 14; px[i * 4] += gr; px[i * 4 + 1] += gr; px[i * 4 + 2] += gr; }
    },
  },
];

// ページの台本を読む: <script> の中身の triviaStart を、cfg を受けとるだけの関数に差しかえて動かす
const PAGES = [];
let cfg = null;
async function loadPage(page) {
  const html = await (await fetch(`../${page}.html`, { cache: 'no-store' })).text();
  const code = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]).pop();
  let got = null;
  new Function('triviaStart', code)(c => { got = c; });
  cfg = got; cfg.voice = null;
  const time = document.getElementById('time'); time.max = cfg.dur; if (+time.value > cfg.dur) time.value = Math.min(9, cfg.dur / 2);
}

function apply(look) {   // 下地の決まりを入れかえる
  Object.assign(TK.C, BASE_C, look.C || {});
  TK.bg = look.bg || BASE.bg; TK.card = look.card || BASE.card;
  const f = look.font || FONT;
  window.setFont = (g, size, bold) => { g.font = (bold ? 'bold ' : '') + Math.round(size) + 'px ' + f; };
}
const off = document.createElement('canvas'); off.width = W; off.height = H;
function render(look, t, out) {
  apply(look);
  const g = off.getContext('2d', { willReadFrequently: true });
  g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  TK.bg(g, t, cfg.bgOpts || {});
  try { cfg.draw(g, t); } catch (e) { console.warn(e); }
  TK.subtitle(g, t, cfg.subs || []);
  TK.progress(g, t, cfg.dur);
  drawIdentMini(g, t, 0.3, 0.8);
  const o = out.getContext('2d');
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1; o.filter = 'none'; o.globalCompositeOperation = 'source-over';
  o.drawImage(off, 0, 0);
  if (look.post) look.post(o, off);
  if (look.finish) { const d = o.getImageData(0, 0, W, H); look.finish(d.data); o.putImageData(d, 0, 0); }
  apply(LOOKS[0]);
}

const grid = document.getElementById('grid'), figs = [];
let only = null;
function build() {
  grid.innerHTML = ''; figs.length = 0;
  grid.className = only ? 'one' : '';
  for (const lk of LOOKS) {
    if (only && lk.id !== only) continue;
    const f = document.createElement('figure'), c = document.createElement('canvas'); c.width = W; c.height = H;
    const cap = document.createElement('figcaption'); cap.innerHTML = '<b></b><span></span>';
    cap.querySelector('b').textContent = lk.name; cap.querySelector('span').textContent = lk.note;
    f.append(c, cap); grid.appendChild(f); figs.push([lk, c]);
  }
}
function draw() {
  const t = +document.getElementById('time').value;
  document.getElementById('t').textContent = t.toFixed(1) + ' 秒';
  if (cfg) for (const [lk, c] of figs) render(lk, t, c);
}
// ルックのボタン（ぜんぶ並べる／1つだけ大きく）
const lb = document.getElementById('looks');
[['', 'ぜんぶ並べる'], ...LOOKS.map(l => [l.id, l.name])].forEach(([id, name]) => {
  const b = document.createElement('button'); b.textContent = name; b.dataset.id = id;
  b.onclick = () => { only = id || null; lb.querySelectorAll('button').forEach(x => x.className = x.dataset.id === id ? 'on' : ''); build(); draw(); };
  lb.appendChild(b);
});
lb.firstChild.className = 'on';
let playing = false, last = 0;
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '❚❚ 止める' : '▶ 再生'; last = performance.now(); if (playing) requestAnimationFrame(tick); };
function tick(now) {   // 再生（重いので、1つだけ大きくしたときがなめらか）
  if (!playing) return;
  const el = document.getElementById('time'); let t = +el.value + (now - last) / 1000; last = now;
  if (t > cfg.dur) t = 0; el.value = t; draw(); requestAnimationFrame(tick);
}
document.getElementById('time').oninput = draw;
document.getElementById('page').onchange = async e => { await loadPage(e.target.value); draw(); };

(async () => {
  const apps = ['tiny-earth', 'brain-response', 'evolution', 'ga-creatures', 'tree-of-life', 'black-hole', 'metamorphosis', 'extreme', 'god-view', 'body-dive', 'net-route', 'phage', 'illusions', 'pitch-physics', 'house-dust',
    'railgun', 'spider-hunt', 'quantum', 'immune-battle', 'muscle-growth', 'hair-removal', 'eye-optics', 'animal-senses', 'sound-feel', 'drop-evolution', 'big-bang', 'wifi-wave', 'passkey', 'crt-pixels', 'phonograph',
    'air-flow', 'mold-growth', 'weed-growth', 'wave-growth', 'metronome-sync', 'sail-wind', 'ferrofluid', 'piano-hand', 'typing-hand', 'snake-move'];
  const all = await Promise.all(apps.map(a => fetch(`proto/${a}.json`).then(r => r.ok ? r.json() : []).catch(() => [])));
  const sel = document.getElementById('page');
  for (const x of all.flat()) { const o = document.createElement('option'); o.value = x.page; o.textContent = `${x.id}（${x.type}）${x.title}`; sel.appendChild(o); }
  await document.fonts.ready;
  build(); await loadPage(sel.value); draw();
})();
</script>
</body>
</html>
