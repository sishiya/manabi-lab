<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>

<script>
'use strict';
// うんちく snake-move-1（型A ぜんぶ逆）「ヘビは、ろっ骨で歩く…じゃない」。台本は trivia/snake-move.md。?short で録る
// Lissmann 1950（J. Exp. Biol. 26:368）: Home (1812) の「ろっ骨で進む」説を否定。ろっ骨の先は背骨に対して同じ位置のまま、
// おなかの皮（鉛の円板の印）がろっ骨の先の上をすべる。伸びた所はちぢんだときより ろっ骨6本ぶん長い。138年 = 1950 − 1812。
// こわがらせない: 横から見た1本の体の線（顔・口・ウロコの写実なし）。皮の動きは「背骨は一定の速さ、皮は止まる・進む」の模式。
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.0, ja: 'ヘビは、ろっ骨で歩いている…わけではありません', en: 'Snakes don’t actually walk on their ribs', noBurn: true },
  { a: 3.0, b: 8.0, ja: '[1812年]、イギリスの学者が\n“ろっ骨を足のように使って進む”と考えた', en: 'In 1812, a British scientist proposed\nthat snakes use their ribs like legs' },
  { a: 8.0, b: 14.0, ja: 'まっすぐ進むときのヘビ\n体は曲げないのに、前へ', en: 'A snake crawling in a straight line:\nit moves forward without bending' },
  { a: 14.0, b: 18.0, ja: '[1950年]、おなかの皮に印を付けて\n写真で追った研究', en: 'In 1950, a study marked the belly skin\nand tracked it on film' },
  { a: 18.0, b: 22.0, ja: 'ろっ骨の先は、背骨に対して\n[まったく動いていなかった]', en: 'The rib tips didn’t move at all\nrelative to the backbone' },
  { a: 22.0, b: 26.0, ja: '動いていたのは[皮]\n伸びた所は、ろっ骨[6本ぶん]長い', en: 'It was the skin that moved.\nStretched parts spanned six more ribs' },
  { a: 26.0, b: 29.5, ja: '皮が、ろっ骨の上を[すべっていた]', en: 'The skin was sliding over the ribs' },
  { a: 29.5, b: 35.0, ja: '[138年]かかって、ろっ骨の“足”は\n皮の“くつ下”だったとわかった', en: 'After 138 years, the rib “legs”\nturned out to be skin “socks”' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 1.0, type: 'buzz' }, { t: 3.0, type: 'whoosh' }, { t: 3.8, type: 'pop' }, { t: 8.0, type: 'whoosh' },
  { t: 14.0, type: 'pop' }, { t: 15.2, type: 'tick' }, { t: 18.0, type: 'ding' }, { t: 22.0, type: 'pop' }, { t: 26.0, type: 'whoosh' },
  { t: 29.5, type: 'rise' }, { t: 31.0, type: 'ding' },
];

//// ---- 横から見た体（まっすぐ）。図鑑の版画（PL.*）で描く ----
const BODY = { len: 700, h: 74 };
const RIB = 32;                         // ろっ骨の間かく（絵）
const BLUE = TK.C.acc2, GOLD = '#b8861f';
// ---- 版画の道具（このページだけ。PL.* を組み合わせる）----
const TAU = Math.PI * 2;
// ローカル座標（右向き・足もとが y=0）から画面へ写す。dir=-1 で左向き
function mapper(x0, y0, s, rot = 0, dir = 1) { const c = Math.cos(rot), n = Math.sin(rot); return (x, y) => { x *= dir; return [x0 + s * (x * c - y * n), y0 + s * (x * n + y * c)]; }; }
// ローカル座標で道を作る。b(P) の P: M・L・Q・Z と E（楕円）
const lp = (m, b) => g => {
  const P = { M: (x, y) => g.moveTo(...m(x, y)), L: (x, y) => g.lineTo(...m(x, y)), Q: (a, c, x, y) => g.quadraticCurveTo(...m(a, c), ...m(x, y)), Z: () => g.closePath(),
    E: (cx, cy, rx, ry, rot = 0) => { for (let i = 0; i <= 40; i++) { const t = i / 40 * TAU, x = Math.cos(t) * rx, y = Math.sin(t) * ry, p = m(cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)); i ? g.lineTo(...p) : g.moveTo(...p); } g.closePath(); } };
  b(P);
};
// 手彩色＋かげの斜線＋墨の輪郭。o.lit: 光の当たる所（斜線を抜く）
function solid(g, path, color, o = {}) {
  PL.tint(g, path, color, o.a ?? 0.65);
  if (o.hatch !== false) PL.hatch(g, path, { angle: o.angle ?? 0.7, gap: o.gap ?? 9, w: o.hw ?? 1.8, not: o.lit, cx: o.cx, cy: o.cy });
  PL.ink(g, path, o.w ?? 5, o.ink || PL.INK);
}
// 墨の矢印（頭は手彩色＋輪郭）
function arrowPL(g, x0, y0, x1, y1, color = PL.INK, w = 8) {
  const a = Math.atan2(y1 - y0, x1 - x0), h = w * 3.4;
  PL.ink(g, gg => { gg.moveTo(x0, y0); gg.lineTo(x1 - Math.cos(a) * h * 0.7, y1 - Math.sin(a) * h * 0.7); }, w, color);
  const head = PL.poly([[x1, y1], [x1 - Math.cos(a - 0.42) * h, y1 - Math.sin(a - 0.42) * h], [x1 - Math.cos(a + 0.42) * h, y1 - Math.sin(a + 0.42) * h]]);
  PL.tint(g, head, color, 1); PL.ink(g, head, Math.max(2, w * 0.45), color);
}

const bodyPath = (x0, yb) => g => {
  const L = BODY.len, H = BODY.h, top = yb - H;
  g.moveTo(x0, yb - 8);
  g.quadraticCurveTo(x0 + 120, top + 10, x0 + 240, top);           // しっぽ側は細く
  g.lineTo(x0 + L - 70, top + 2);
  g.quadraticCurveTo(x0 + L - 20, top - 4, x0 + L + 18, top + 16);  // 頭（顔は描かない）
  g.quadraticCurveTo(x0 + L + 40, yb - H / 2 + 4, x0 + L + 22, yb - 12);
  g.quadraticCurveTo(x0 + L + 4, yb, x0 + L - 40, yb);
  g.lineTo(x0 + 40, yb);
  g.closePath();
};
// 体（手彩色・背中のまだら・おなかの板・かげ・輪郭）。o.scute(u) でおなかの板の位置をずらす（皮の動き）
function body(g, x0, yb, o = {}) {
  const L = BODY.len, H = BODY.h, top = yb - H, bp = bodyPath(x0, yb);
  PL.tint(g, bp, PL.T.wood, 0.6);
  g.save(); g.beginPath(); bp(g); g.clip();
  // 背中のまだら（ボアのような鞍の形）
  for (let x = x0 + 170, i = 0; x < x0 + L - 60; x += 46, i++) { const blot = PL.ellipse(x, top + 24 + (i % 2) * 8, 17, 9, 0.15); PL.tint(g, blot, PL.T.brown, 0.75); PL.ink(g, blot, 1.4, 'rgba(35,28,21,0.7)'); }
  PL.ink(g, gg => { gg.moveTo(x0 + L - 60, top + 10); gg.quadraticCurveTo(x0 + L - 10, top + 6, x0 + L + 24, top + 24); }, 1.6, 'rgba(35,28,21,0.6)');   // 頭のすじ
  // おなかの板（腹板）。皮といっしょに動く
  const belly = PL.rect(x0, yb - 14, L + 40, 14); PL.tint(g, belly, PL.T.sand, 0.9);
  PL.ink(g, gg => { for (let u = 40; u < L; u += 15) { const x = x0 + (o.scute ? o.scute(u) : u); gg.moveTo(x, yb - 14); gg.lineTo(x + 3, yb); } gg.moveTo(x0, yb - 14); gg.lineTo(x0 + L + 40, yb - 14); }, 1.4);
  g.restore();
  PL.hatch(g, bp, { angle: 0.75, gap: 8, w: 1.6, not: bodyPath(x0, yb - 34) });
  // 背骨（体の中に透かして）
  if (o.spine !== false) PL.ink(g, gg => { gg.moveTo(x0 + 150, top + 18); gg.lineTo(x0 + L - 30, top + 18); for (let x = x0 + 160; x < x0 + L - 30; x += 16) { gg.moveTo(x, top + 13); gg.lineTo(x, top + 23); } }, 2.2, 'rgba(35,28,21,0.7)');
  PL.ink(g, bp, 5);
}
// ろっ骨（背骨から おなかへ。透かして描く）。先の点の x を返す
function ribs(g, x0, yb, o = {}) {
  const top = yb - BODY.h, xs = [];
  PL.ink(g, gg => { for (let x = x0 + 240; x < x0 + BODY.len - 60; x += RIB) { gg.moveTo(x, top + 18); gg.quadraticCurveTo(x + 10, top + 40, x + 4, yb - 16); xs.push(x + 4); } }, o.tips ? 2.4 : 1.8, o.color || (o.tips ? 'rgba(35,28,21,0.75)' : 'rgba(35,28,21,0.4)'));
  if (o.tips) xs.forEach(x => { const c = PL.circle(x, yb - 16, 5); PL.tint(g, c, BLUE, 1); PL.ink(g, c, 1.5, BLUE); });
  return xs;
}
function ground(g, y, x0 = 80, x1 = 960, off = 0) {
  const soil = PL.rect(x0, y, x1 - x0, 26);
  PL.tint(g, soil, PL.T.sand, 0.6);
  PL.ink(g, gg => { for (let x = x0 + (((off % 40) + 40) % 40); x < x1; x += 40) { gg.moveTo(x, y + 4); gg.lineTo(x - 16, y + 22); } }, 1.6);
  PL.ink(g, gg => { gg.moveTo(x0, y); gg.lineTo(x1, y); }, 4);
}
// 皮の印: 背骨は一定の速さ V、皮は「止まる → すべって前へ」（波は頭からしっぽへ）
const V = 34, W = 2 * Math.PI * 0.55, KW = 2 * Math.PI / 260;
const skinX = (u, t) => u + V * t + (V / W) * Math.sin(W * t + KW * u);     // u: 印のもとの位置（体にそって）
const skinV = (u, t) => V * (1 + Math.cos(W * t + KW * u));                  // 0 〜 2V（0 = 地面に止まっている）
const skinMark = (x, y, col = PL.RED, s = 1) => g => { const r = PL.rect(x - 6 * s, y, 12 * s, 9 * s); PL.tint(g, r, col, 1); PL.ink(g, r, 1.6, col); };

function crossX(g, x, y, s, k) {
  if (k <= 0) return;
  g.save(); g.globalAlpha *= k; PL.ink(g, gg => { gg.moveTo(x - s, y - s); gg.lineTo(x + s, y + s); gg.moveTo(x + s, y - s); gg.lineTo(x - s, y + s); }, 20, PL.RED); g.restore();
}

function draw(g, t) {
  const YB = 820;
  // 0〜3: フック（ろっ骨の“足”に ×）
  if (t < 3.0) {
    g.save(); g.globalAlpha = fade(t, -1, 3, 0.3);
    ground(g, YB); body(g, 140, YB); ribs(g, 140, YB);
    g.restore();
    TK.hook(g, t, 0.0, 3.0, 'ろっ骨で\n[歩く]？', { y: 380, size: 140 });
    crossX(g, 600, 790, 110, clamp((t - 1.0) / 0.25, 0, 1));
  }
  // 3〜8: 1812年の考え（ろっ骨が足のように前後にふれる。点線・うすい色）
  if (t >= 3.0 && t < 8.0) {
    const f = fade(t, 3, 8, 0.3);
    g.save(); g.globalAlpha = f;
    TK.card(g, 100, 180, 880, 780);
    TK.text(g, '1812年', PW / 2, 270, 96, { color: PL.RED });
    TK.text(g, '昔の考え（Home の説）', PW / 2, 360, 46, { color: TK.C.sub });
    const x0 = 150 + (t - 3) * 18;
    g.save(); g.globalAlpha *= 0.75; body(g, x0, 700); g.restore();
    g.save(); g.setLineDash([10, 10]);
    let i = 0;
    PL.ink(g, gg => { for (let x = x0 + 260; x < x0 + BODY.len - 60; x += RIB * 2, i++) { const a = Math.sin(t * 7 + i * 1.3) * 0.5; gg.moveTo(x, 650); gg.lineTo(x + Math.sin(a) * 60, 690 + Math.cos(a) * 70); } }, 4, PL.RED);
    g.restore();
    PL.ink(g, gg => { gg.moveTo(150, 770); gg.lineTo(930, 770); }, 2);
    TK.text(g, 'ろっ骨が“足”？', PW / 2, 880, 58);
    g.restore();
  }
  // 8〜14: まっすぐ進む（地面に固定のカメラ）
  if (t >= 8.0 && t < 14.0) {
    const f = fade(t, 8, 14, 0.3), x0 = 60 + (t - 8) * 20, tt = t - 8;
    g.save(); g.globalAlpha = f;
    ground(g, YB);
    body(g, x0, YB, { scute: u => u + (V / W) * Math.sin(W * tt + KW * u) });
    ribs(g, x0, YB);
    // 皮の印（止まっている所は緑、動いている所は うすく）
    for (let u = 250; u < BODY.len - 60; u += RIB) {
      const x = x0 + u + (V / W) * Math.sin(W * tt + KW * u), still = skinV(u, tt) < V * 0.25;
      g.save(); if (!still) g.globalAlpha *= 0.35; skinMark(x, YB - 12, still ? PL.GREEN : PL.INK, 1.4)(g); g.restore();
    }
    arrowPL(g, 620, 560, 860, 560, PL.RED, 10);
    PL.label(g, '進む向き', 740, 500, 40, { color: PL.RED });
    TK.text(g, '体は まっすぐのまま', PW / 2, 300, 60);
    g.restore();
    TK.note(g, t, 8.5, 14, '緑 ＝ 地面に止まっている皮（模式）', { size: 32 });
  }
  // 14〜29.5: 皮の印とろっ骨の先の印
  if (t >= 14.0 && t < 29.5) {
    const f = fade(t, 14, 29.5, 0.3), tt = t - 14, x0 = 120;   // 背骨に固定のカメラ（地面が左へ流れる）
    const tw = tt * 0.6;   // 少しゆっくり
    const off = u => (V / W) * Math.sin(W * tw + KW * u);
    g.save(); g.globalAlpha = f;
    const Z = 2.4;   // おなかの一部を大きく
    g.save(); g.translate(540, YB); g.scale(Z, Z); g.translate(-(x0 + 470), -YB);
    ground(g, YB, x0 + 200, x0 + 760, -tt * V * 0.6);
    body(g, x0, YB, { scute: u => u + off(u) });
    ribs(g, x0, YB, { tips: t > 15.0 });
    const marks = [];
    for (let u = 250; u < BODY.len - 60; u += RIB) marks.push(x0 + u + off(u));
    if (t > 15.0) {
      if (t > 22.0) for (let i = 0; i < marks.length - 1; i++) if (marks[i + 1] - marks[i] > RIB * 1.18) PL.ink(g, gg => { gg.moveTo(marks[i], YB + 14); gg.lineTo(marks[i + 1], YB + 14); }, 3, GOLD);
      marks.forEach(x => skinMark(x, YB - 9)(g));
    }
    g.restore();
    if (t > 15.0) {
      TK.card(g, 150, 220, 780, 170);
      const c = PL.circle(220, 270, 13); PL.tint(g, c, BLUE, 1); PL.ink(g, c, 3, BLUE);
      TK.text(g, 'ろっ骨の先', 250, 270, 46, { align: 'left', color: BLUE });
      skinMark(220, 328, PL.RED, 2)(g);
      TK.text(g, 'おなかの皮の印', 250, 338, 46, { align: 'left', color: PL.RED });
      TK.text(g, t < 22 ? '背骨と[いっしょ]' : '背骨と いっしょ', 900, 270, 42, { align: 'right' });
      TK.text(g, t < 22 ? '止まる・すべる' : '[止まる・すべる]', 900, 338, 42, { align: 'right' });
      PL.leader(g, 540, 690, 540, 470, BLUE); PL.label(g, '背骨', 540, 440, 40, { color: BLUE });
    }
    if (t > 22.0 && t < 26.0) TK.text(g, '伸びた所（黄）', PW / 2, 985, 52, { color: GOLD });
    g.restore();
    TK.note(g, t, 15.0, 29.5, 'ボアの「まっすぐ進む」動き（Lissmann 1950）。おなかの一部を拡大\n体といっしょに動くカメラ（地面が流れる）。印の動きの大きさは模式', { size: 30, y: 1120 });
  }
  // 29.5〜35: 138年
  if (t >= 29.5) {
    const f = fade(t, 29.5, 36, 0.3);
    g.save(); g.globalAlpha = f;
    ground(g, YB + 60); body(g, 140, YB + 60); ribs(g, 140, YB + 60);
    g.restore();
    TK.count(g, t, 29.7, 35.1, 1812, 1950, { y: 330, size: 150, dur: 1.4, fmt: v => Math.round(v) + '年', label: '1812年 →' });
    if (t > 31.0) { g.save(); g.globalAlpha = fade(t, 31, 36, 0.3); TK.text(g, '[138年]', PW / 2, 580, 110); g.restore(); }
    TK.note(g, t, 32.0, 35.0, '出どころ: Lissmann (1950) J. Exp. Biol. 26:368／Newman & Jayne (2018) J. Exp. Biol.', { size: 30 });
  }
}

triviaStart({ out: 'snake-move-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
