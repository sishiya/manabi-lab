<!doctype html>

<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script src="trivia-plate.js"></script>
<script src="trivia-looks.js"></script>
<script src="trivia-style.js"></script>
<script>
'use strict';
// うんちく air-flow-2（型C）「寝ているあいだ、寝室の CO₂ はどこまで上がる？」。台本は trivia/air-flow.md。?short で録る
// 1部屋のバランス: 容積 23 m³、2人 × 0.003 L/s（Persily & de Jonge 2017 の式からの目安）、換気 11.7 m³/h、外 420 ppm。
// C(h) = 420 + G/Q × (1 − e^(−Q h / V))（ドアのすき間は考えない）。メーターはこの式で計算した値を出す
const DUR = 35;
const V = 23, G = 2 * 0.003 * 3.6, Q = 11.7, C0 = 420;   // G: m³/h
const co2 = h => C0 + G / Q * 1e6 * (1 - Math.exp(-Q * h / V));
const subs = [
  { a: 0.0, b: 1.6, ja: 'ドアを閉めて寝たら？', en: 'What if you sleep with the door shut?', noBurn: true },
  { a: 1.6, b: 3.5, ja: '6畳の寝室。2人で、ドアを閉めて寝る', en: 'A small bedroom. Two people, door closed' },
  { a: 3.5, b: 9.0, ja: '眠っている人も、息で二酸化炭素を出す。\n1人 1時間に約[10リットル]', en: 'Even asleep, we breathe out CO₂ —\nabout 10 litres an hour each' },
  { a: 9.0, b: 14.0, ja: '入れかえるのは、24時間換気の\n[1時間に0.5回]だけ、とすると…', en: 'If the only fresh air is 24-hour ventilation\nat half a room per hour…' },
  { a: 14.0, b: 19.0, ja: '1時間ほどで[1000ppm]\n（ビルの空気の基準）をこえ', en: 'Within about an hour it passes 1,000 ppm\n(the standard for office buildings)' },
  { a: 19.0, b: 24.0, ja: '朝には、約[2300ppm]', en: 'and by morning it’s about 2,300 ppm' },
  { a: 24.0, b: 30.0, ja: '[毒になる濃さではない]。でも\n「朝、部屋がむっとする」の正体のひとつ', en: 'Not a toxic level. But it’s one reason\nthe room feels stuffy in the morning' },
  { a: 30.0, b: 35.0, ja: 'ちなみに、この動画の35秒で\nあなたも約[0.1リットル]出しました', en: 'By the way, in these 35 seconds\nyou breathed out about 0.1 litres too' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 3.5, type: 'whoosh' }, { t: 9.0, type: 'pop' }, { t: 14.0, type: 'rise' },
  { t: 15.1, type: 'buzz' }, { t: 23.6, type: 'ding' }, { t: 24.0, type: 'whoosh' }, { t: 30.0, type: 'pop' }, { t: 33.5, type: 'ding' },
];
// 絵は「図鑑の版画」（trivia-plate.js の PL.*）。寝室は断面図（かべ・床に斜線）、CO₂ は赤茶の小さな輪、メーターは目盛りつきの管
const CO = '#a85a32', AIR = '#2f5f7a';
const rnd = (i, k = 1) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const hours = t => t < 14 ? 0 : 8 * clamp((t - 14.2) / 9.4, 0, 1);
const RX0 = 120, RX1 = 940, RY0 = 300, RY1 = 680, WALL = 24, DOOR = 250;
// 寝ている人の頭（あお向け・横から。顔は右上を向く）。x, y は後頭部の下
function sleeper(g, x, y, far) {
  g.save(); if (far) g.globalAlpha *= 0.55;
  const head = gg => { gg.moveTo(x, y); gg.quadraticCurveTo(x - 8, y - 46, x + 30, y - 58); gg.quadraticCurveTo(x + 62, y - 64, x + 74, y - 44); gg.lineTo(x + 86, y - 40); gg.lineTo(x + 78, y - 30); gg.quadraticCurveTo(x + 82, y - 18, x + 74, y - 8); gg.quadraticCurveTo(x + 60, y + 4, x, y); gg.closePath(); };
  PL.tint(g, head, PL.T.sand, 0.75);
  const hair = gg => { gg.moveTo(x, y); gg.quadraticCurveTo(x - 8, y - 46, x + 30, y - 58); gg.quadraticCurveTo(x + 40, y - 60, x + 46, y - 56); gg.quadraticCurveTo(x + 20, y - 40, x + 18, y - 6); gg.closePath(); };
  PL.tint(g, hair, PL.T.brown, 0.85); PL.hatch(g, hair, { angle: 0.9, gap: 6, w: 1.6 });
  PL.ink(g, head, 4);
  PL.ink(g, gg => { gg.moveTo(x + 50, y - 40); gg.lineTo(x + 60, y - 38); gg.moveTo(x + 34, y - 26); gg.quadraticCurveTo(x + 28, y - 18, x + 36, y - 14); }, 2.4);   // 閉じた目・耳
  g.restore();
}
function bed(g) {
  const frame = PL.rect(230, 610, 560, 34), head = PL.poly([[220, 500], [250, 500], [250, 680], [220, 680]]), foot = PL.rect(770, 570, 24, 110);
  [head, foot].forEach(p => { PL.tint(g, p, PL.T.wood, 0.8); PL.hatch(g, p, { angle: 0.9, gap: 8, w: 1.8 }); PL.ink(g, p, 5); });
  PL.tint(g, frame, PL.T.wood, 0.7); PL.hatch(g, frame, { angle: 0.9, gap: 9, w: 1.8, not: PL.rect(230, 600, 560, 14) }); PL.ink(g, frame, 5);
  PL.ink(g, gg => { gg.moveTo(270, 644); gg.lineTo(270, 680); gg.moveTo(740, 644); gg.lineTo(740, 680); }, 7);   // 脚
  const mat = PL.rect(250, 584, 520, 26); PL.tint(g, mat, PL.T.sand, 0.5); PL.ink(g, mat, 4);
  const pillow = PL.ellipse(320, 572, 62, 18); PL.tint(g, pillow, PL.T.sky, 0.4); PL.ink(g, pillow, 4);
  sleeper(g, 330, 566, true); sleeper(g, 290, 572, false);
  // かけぶとん（ふくらみとひだ）
  const quilt = gg => { gg.moveTo(372, 584); gg.quadraticCurveTo(380, 538, 450, 532); gg.quadraticCurveTo(560, 520, 640, 540); gg.quadraticCurveTo(700, 550, 745, 548); gg.quadraticCurveTo(772, 560, 772, 620); gg.lineTo(372, 620); gg.closePath(); };
  PL.tint(g, quilt, PL.T.sky, 0.65); PL.hatch(g, quilt, { angle: 0.8, gap: 10, w: 2, not: gg => { gg.moveTo(372, 560); gg.quadraticCurveTo(450, 516, 640, 530); gg.lineTo(745, 535); gg.lineTo(745, 575); gg.lineTo(372, 575); gg.closePath(); } });
  PL.ink(g, quilt, 5);
  PL.ink(g, gg => { [[470, 540, 500, 600], [580, 534, 600, 600], [690, 546, 705, 600]].forEach(([a, b, c, d]) => { gg.moveTo(a, b); gg.quadraticCurveTo(a + 18, (b + d) / 2, c, d); }); }, 2);
}
function room(g, t, C, open) {
  const inside = PL.rect(RX0, RY0, RX1 - RX0, RY1 - RY0), v0 = RY0 + 30, v1 = RY0 + 90, d0 = RY1 - DOOR;
  const k = clamp((C - C0) / 1900, 0, 1);
  PL.tint(g, inside, PL.T.rust, 0.04 + 0.32 * k);
  bed(g);
  // CO₂ の小さな輪（外より多いぶんに比例）
  const n = Math.round(k * 190);
  if (n > 0) PL.ink(g, gg => { for (let i = 0; i < n; i++) { const x = RX0 + 18 + rnd(i) * (RX1 - RX0 - 36) + Math.sin(t + i) * 7, y = RY0 + 18 + rnd(i, 2) * (RY1 - RY0 - 36) + Math.cos(t * 0.8 + i) * 7; gg.moveTo(x + 6, y); gg.arc(x, y, 6, 0, Math.PI * 2); } }, 2.6, CO);
  // 寝息（口から上へ、ひと筆の渦）
  PL.ink(g, gg => [[372, 528], [412, 520]].forEach(([x, y], j) => { const p = (t * 0.5 + j * 0.5) % 1, r = 8 + p * 6, cx = x + p * 30, cy = y - p * 80; gg.moveTo(cx + r, cy); gg.arc(cx, cy, r, 0, 4.4); }), 3, CO);
  // かべ・天井・床（右のかべはドアの所であく）
  const walls = gg => {
    PL.rect(RX0 - WALL, RY0 - WALL, RX1 - RX0 + WALL * 2, WALL)(gg); PL.rect(RX0 - WALL, RY1, RX1 - RX0 + WALL * 2, WALL)(gg);
    PL.rect(RX0 - WALL, RY0, WALL, v0 - RY0)(gg); PL.rect(RX0 - WALL, v1, WALL, RY1 - v1)(gg); PL.rect(RX1, RY0, WALL, d0 - RY0)(gg);
  };
  PL.tint(g, walls, PL.T.gray, 0.6); PL.hatch(g, walls, { angle: 0.8, gap: 8, w: 2 }); PL.ink(g, walls, 5);
  PL.ink(g, gg => { for (let q = 0; q < 3; q++) { const yy = v0 + 8 + q * 18; gg.moveTo(RX0 - WALL, yy); gg.lineTo(RX0, yy + 9); } }, 2.4);   // 給気口のよろい板
  const ay = (v0 + v1) / 2;
  PL.ink(g, gg => { gg.moveTo(RX0 - WALL - 64, ay); gg.lineTo(RX0 - WALL - 8, ay); gg.moveTo(RX0 - WALL - 24, ay - 12); gg.lineTo(RX0 - WALL - 8, ay); gg.lineTo(RX0 - WALL - 24, ay + 12); }, 4, AIR);
  // ドア（へやの内がわへ開く。ちょうつがいは上）
  const sw = open * 130, door = PL.poly([[RX1, d0], [RX1 + WALL - sw * 1.2, d0 + open * 18], [RX1 + WALL - sw * 1.2, RY1 - open * 18], [RX1, RY1]]);
  const dr = open > 0.02 ? door : PL.rect(RX1, d0, WALL, DOOR);
  PL.tint(g, dr, PL.T.wood, 0.85); PL.hatch(g, dr, { angle: 1.2, gap: 9, w: 1.8 }); PL.ink(g, dr, 5);
  PL.ink(g, PL.circle(RX1 + WALL / 2 - sw * 0.95, RY1 - DOOR * 0.48, 5), 3);
  if (open > 0.3) { g.save(); g.globalAlpha *= clamp((open - 0.3) / 0.4, 0, 1); PL.ink(g, gg => { for (let j = 0; j < 3; j++) { const yy = RY1 - 190 + j * 60, xx = RX1 - 30 + Math.sin(t * 3 + j) * 6; gg.moveTo(xx - 70, yy); gg.lineTo(xx + 40, yy); gg.moveTo(xx + 26, yy - 10); gg.lineTo(xx + 40, yy); gg.lineTo(xx + 26, yy + 10); } }, 4, CO); g.restore(); }
  // ラベル
  PL.leader(g, RX0 - WALL / 2, v0 - 4, RX0 + 50, RY0 - 46); PL.label(g, '給気口', RX0 + 62, RY0 - 62, 40, { align: 'left', color: AIR });
  PL.leader(g, RX1 + WALL / 2, d0 - 6, RX1 - 30, RY0 - 46); PL.label(g, open > 0.5 ? 'ドア（あけた）' : 'ドア（閉めた）', RX1 - 30, RY0 - 62, 40, { align: 'right', color: '#7a5634' });
}
function meter(g, C) {
  const x0 = 130, x1 = 950, y = 870, hh = 26, X = c => lerp(x0, x1, clamp(c / 2500, 0, 1));
  const tube = PL.rect(x0, y - hh, x1 - x0, hh * 2), fill = PL.rect(x0, y - hh, Math.max(4, X(C) - x0), hh * 2);
  PL.tint(g, tube, PL.T.sand, 0.25);
  PL.tint(g, fill, C > 1000 ? PL.T.rust : PL.T.sky, 0.85); PL.hatch(g, fill, { angle: 0.9, gap: 11, w: 2, cx: x0, cy: y });
  PL.ink(g, tube, 5);
  PL.ink(g, gg => { for (let c = 0; c <= 2500; c += 100) { const x = X(c), l = c % 500 ? 10 : 22; gg.moveTo(x, y + hh); gg.lineTo(x, y + hh + l); } }, 3);
  [0, 500, 1500, 2000, 2500].forEach(c => PL.label(g, String(c), X(c), y + hh + 46, 28, { color: TK.C.sub, bold: false }));
  PL.ink(g, gg => { gg.moveTo(X(1000), y - hh - 26); gg.lineTo(X(1000), y + hh + 26); }, 6, PL.RED);
  PL.leader(g, X(1000), y + hh + 30, X(1000) + 40, y + hh + 82, PL.RED);
  PL.label(g, '1000（ビルの基準）', X(1000) + 48, y + hh + 100, 34, { align: 'left', color: PL.RED });
  PL.label(g, 'CO₂ ' + Math.round(C).toLocaleString('ja-JP') + ' ppm', x0, y - 82, 62, { align: 'left', color: C > 1000 ? CO : PL.INK });
}
function clock(g, h) {
  const m = Math.round(23 * 60 + h * 60) % (24 * 60);
  PL.watch(g, 940, 165, 56, (m / 60 % 12) / 12);
  PL.label(g, String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'), 856, 165, 72, { align: 'right' });
}
// 横顔（右を向く）。x, y はあごの下
function profile(g, x, y, s) {
  const P = (px, py) => [x + px * s, y + py * s];
  const face = gg => {
    gg.moveTo(...P(-60, 150)); gg.lineTo(...P(-70, 40)); gg.quadraticCurveTo(...P(-125, -40), ...P(-112, -150)); gg.quadraticCurveTo(...P(-90, -265), ...P(10, -262));
    gg.quadraticCurveTo(...P(95, -255), ...P(108, -160)); gg.lineTo(...P(112, -135)); gg.quadraticCurveTo(...P(140, -110), ...P(148, -92)); gg.quadraticCurveTo(...P(138, -80), ...P(118, -80));
    gg.lineTo(...P(124, -62)); gg.quadraticCurveTo(...P(114, -55), ...P(122, -44)); gg.quadraticCurveTo(...P(118, -30), ...P(110, -14)); gg.quadraticCurveTo(...P(100, 6), ...P(64, 8));
    gg.quadraticCurveTo(...P(50, 40), ...P(58, 150)); gg.closePath();
  };
  PL.tint(g, face, PL.T.sand, 0.7);
  const hair = gg => { gg.moveTo(...P(-70, 40)); gg.quadraticCurveTo(...P(-125, -40), ...P(-112, -150)); gg.quadraticCurveTo(...P(-90, -265), ...P(10, -262)); gg.quadraticCurveTo(...P(80, -258), ...P(100, -200)); gg.quadraticCurveTo(...P(20, -215), ...P(-20, -160)); gg.quadraticCurveTo(...P(-40, -60), ...P(-30, 30)); gg.closePath(); };
  PL.tint(g, hair, PL.T.brown, 0.8);
  PL.hatch(g, face, { angle: 0.7, gap: 9, w: 2, not: gg => PL.ellipse(x + 40 * s, y - 120 * s, 110 * s, 160 * s)(gg) });
  PL.ink(g, face, 6);
  PL.ink(g, gg => { const e = P(-5, -105); gg.moveTo(e[0] + 22 * s, e[1]); gg.ellipse(e[0], e[1], 22 * s, 32 * s, 0, 0, Math.PI * 2); const a = P(70, -150), b = P(92, -152); gg.moveTo(...a); gg.lineTo(...b); }, 3);   // 耳・目
}
function cylinder(g, L) {   // メスシリンダー（0〜0.12 L）
  const x0 = 680, x1 = 800, top = 560, bot = 1110, Y = l => bot - l / 0.12 * (bot - top - 20);
  const glass = PL.rect(x0, top, x1 - x0, bot - top), gas = PL.rect(x0, Y(L), x1 - x0, bot - Y(L));
  PL.tint(g, glass, PL.T.sky, 0.18);
  PL.tint(g, gas, PL.T.rust, 0.6); PL.hatch(g, gas, { angle: 0.9, gap: 10, w: 2, cx: x0, cy: bot });
  PL.ink(g, gg => { gg.moveTo(x0 - 10, top - 14); gg.lineTo(x0, top); gg.lineTo(x0, bot); gg.lineTo(x1, bot); gg.lineTo(x1, top); }, 6);
  const foot = PL.poly([[x0 - 50, bot], [x1 + 50, bot], [x1 + 60, bot + 24], [x0 - 60, bot + 24]]); PL.tint(g, foot, PL.T.gray, 0.6); PL.hatch(g, foot, { angle: 0.8, gap: 8, w: 1.8 }); PL.ink(g, foot, 5);
  PL.ink(g, gg => { for (let l = 0.01; l <= 0.121; l += 0.01) { const yy = Y(l), w = Math.round(l * 100) % 5 ? 18 : 40; gg.moveTo(x1, yy); gg.lineTo(x1 - w, yy); } }, 2.5);
  PL.label(g, '0.05 L', x1 + 22, Y(0.05), 32, { align: 'left', color: TK.C.sub, bold: false });
  PL.label(g, '0.10 L', x1 + 22, Y(0.10), 32, { align: 'left', color: PL.RED });
}

function draw(g, t) {
  if (t >= 30.0) {   // あなたの分
    const L = t * 0.003, f = fade(t, 30, 99, 0.3);
    g.save(); g.globalAlpha *= f;
    PL.label(g, 'この動画で、あなたが出した CO₂', 90, 260, 52, { align: 'left', color: TK.C.sub });
    PL.label(g, '約 [' + L.toFixed(2) + ' L]', 90, 400, 128, { align: 'left' });
    profile(g, 270, 900, 1.25);
    // 息（口からシリンダーへ）
    PL.ink(g, gg => { for (let j = 0; j < 4; j++) { const p = (t * 0.6 + j / 4) % 1, cx = lerp(440, 700, p), cy = 800 - Math.sin(p * Math.PI) * 120 - p * 150, r = 8 + p * 10; gg.moveTo(cx + r, cy); gg.arc(cx, cy, r, 0, 4.4); } }, 3.5, CO);
    cylinder(g, L);
    g.restore();
    TK.note(g, t, 30, 35, '出どころ: Persily & de Jonge (2017) Indoor Air 27:868・建築物衛生法の基準・滋賀県', { size: 28 });
    return;
  }
  const h = hours(t);
  let C = co2(h), open = 0;
  if (t >= 24.0) { open = clamp((t - 24.6) / 0.8, 0, 1); C = lerp(co2(8), 900, ease((t - 25.0) / 4.5)); }
  room(g, t, C, open);
  clock(g, h);
  meter(g, C);
  if (t < 1.6) TK.hook(g, t, 0, 1.6, 'ドアを閉めて\n寝たら？', { y: PL.SUBY, size: 110 });   // 絵と重ねないよう、字幕の帯の所に
  if (t >= 3.5 && t < 9.0) { g.save(); g.globalAlpha *= fade(t, 3.5, 9, 0.3); PL.label(g, '1人 1時間に 約[10 L]', 130, 1090, 54, { align: 'left' }); g.restore(); }
  if (t >= 9.0 && t < 14.0) { g.save(); g.globalAlpha *= fade(t, 9, 14, 0.3); PL.label(g, '換気 1時間に [0.5回]', 130, 1090, 54, { align: 'left', color: AIR }); g.restore(); }
  if (t >= 3.5 && t < 24) TK.note(g, t, 3.5, 24, 'モデルの値: 6畳・2人・24時間換気がきちんと働く・ドアのすき間なし', { size: 30 });
  if (t >= 24) TK.note(g, t, 24, 30, 'ドアをあけたあとの下がり方は、計算ではなく飾りです', { size: 30 });
}

triviaStart({ out: 'air-flow-trivia2', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
