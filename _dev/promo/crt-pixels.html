<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="crt-common.js"></script>
<script>
'use strict';
// 台本: ブラウン管のドット絵（ショート、40秒＋締め）。?short で縦長に録る
// 8ビットの冒険（仕切りを左右に）→ 剣士に寄って走査線と光る点 → 滝のふちのチェック模様がしぶきに → チェック模様がまざる（仕切りを右から左へ）→ ししの目 → 全体
const V = new URLSearchParams(location.search).has('short');
// 縦長の画面では全体表示の絵が小さい（1ドット＝6 ピクセル）ので、7 ピクセルまで寄せて横いっぱいに近く（整数ピクセルで走査線がモアレにならない）
const M0 = V ? 7 / 6 : 1, MID = [128, 112];
const SC = [
  { a: 0, b: 7, pic: 'retro', cam: camHold(MID, M0), split: u => u < 2.4 ? 0.5 + 0.12 * Math.sin(u / 2.4 * Math.PI * 2) * Math.sin(u / 2.4 * Math.PI) : u < 4.6 ? splitMove(0.5, 0.82, 2.4, 1.1)(u) : splitMove(0.82, 0.5, 4.6, 1.4)(u) },
  { a: 7, b: 14.5, pic: 'retro', cam: camTo([127, 168], V ? 4.5 : 4, 3, { f: MID, m: M0 }) },
  { a: 14.5, b: 21.5, pic: 'falls', cam: camTo([104, 108], V ? 3 : 2.6, 2.5, { f: MID, m: M0 }) },
  { a: 21.5, b: 29, pic: 'patterns', cam: camHold([128, 128], V ? 2.2 : 1.8), split: splitMove(0.9, 0.1, 0.8, 5.5) },
  { a: 29, b: 35, pic: 'lion', cam: camTo([110, 104], V ? 4 : 3.4, 2.5, { f: MID, m: M0 }) },
  { a: 35, b: SHORT_END + IDENT_CLOSE, pic: 'retro', cam: camHold(MID, M0) },
];
const CAPS = [
  { a: 7.4, b: 14.2, main: '寄ると、1行ずつの走査線と光る点', sub: '赤・緑・青の小さな点の集まり（大きさは推定）',
    en: ['Zoom in: scan lines, one per row, and glowing dots', 'Tiny red, green and blue dots (their size is an estimate)'] },
  { a: 14.9, b: 21.2, main: '滝のふちのチェック模様が、しぶきに', sub: 'ブラウン管では、こまかい模様がまざって半透明に見える',
    en: ['The checkerboard at the waterfall\'s edge turns into spray', 'On a CRT fine patterns blend and look see-through'] },
  { a: 21.9, b: 28.7, main: 'チェック模様は、灰色に・むらさきにまざる', sub: 'ビデオ端子では、白黒の細いしまにも色がつく',
    en: ['Checkerboards blend into gray and purple', 'Over composite video, even thin black-and-white stripes pick up color'] },
  { a: 29.4, b: 34.7, main: '目の白い1ドットも、やわらかく', sub: '信号のにじみ・走査線・光る点を、しくみごとに計算',
    en: ['Even the single white pixel in the eye looks soft', 'Signal blur, scan lines and glowing dots are each calculated'] },
];
promoStart({
  name: 'ブラウン管のドット絵', out: 'crt-pixels', src: '../../crt-pixels/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 24,
  inject: CR_INJECT,
  music: { style: 'journey', root: 131, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: crReady,
  setup(w) { return w.document.getElementById('cv'); },
  subs: () => shortSubs('ブラウン管のドット絵', 'Pixel Art on a CRT', '昔のゲームの絵が、やわらかく見えたわけ', 'Why old game pictures looked soft', CAPS,
    'ブラウン管のしくみを1つずつ入り切りできます', 'Turn each part of the CRT on and off, one at a time'),
  renderAt(t, w) { crRender(w, SC, t); },
  overlay(g, t, w) {
    crDivider(g, w, SC, t, V ? 470 : 70, t < SHORT_END ? 1 : 0);
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, 'ブラウン管のドット絵', '昔のゲームの絵が、やわらかく見えたわけ', 'ブラウン管のしくみを1つずつ入り切りできます',
      'おもな出どころ: T. Lottes「crt-lottes」（パブリックドメイン）、NTSC・YIQ（Wikipedia）、ITU-R BT.1886、NESdev Wiki。絵はすべて自作。光る点の大きさ・にじみの強さは推定');
  },
  errors: w => (w.__crpiErr || []).map(String),
  short: { iw: 1080, ih: 1920 },
});
</script>
</body>
</html>
