<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="ga-common.js"></script>
<script>
'use strict';
// 台本: 進化の箱庭（ショート、40秒＋締め）。?short で縦長に録る
// 最初は入口のサムネイルと同じ第40世代の1位 → 最初の世代 → 世代が進む → 第40世代 → 月面
const V = new URLSearchParams(location.search).has('short');
const VIEWR = V ? [0, 240, 1080, 560] : [40, 40, 1840, 600], GRID = V ? [20, 830, 520, 360] : [40, 680, 900, 360], PROG = V ? [560, 830, 500, 360] : [980, 680, 900, 360];
const SC = [
  { a: 0, b: 6, seed: 1, gens: 40 },
  { a: 6, b: 13.2, seed: 1, gens: 0, fresh: true },
  { a: 13.2, b: 21.2, seed: 1, gens: 0, fresh: true, ev: gaAuto(0.3, 7.6, 0.25) },
  { a: 21.2, b: 30.2, seed: 1, gens: 40 },
  { a: 30.2, b: SHORT_END + IDENT_CLOSE, seed: 2, env: 'moon', gens: 40 },
];
const CAPS = [
  { a: 6.3, b: 13, main: '最初の世代は、ほとんど前に進めない', sub: '進んだ距離の長いものが、子を残す',
    en: ['The first generation can barely move forward', 'The ones that go farthest get to have offspring'] },
  { a: 13.5, b: 21, main: '子は親の遺伝子を受けつぎ、少しだけ変わる', sub: 'これをくり返す（遺伝的アルゴリズム）',
    en: ['Offspring inherit their parents\' genes with small changes', 'Repeat (a genetic algorithm)'] },
  { a: 21.5, b: 30, main: '40世代で、走り方が生まれた', sub: '誰も教えていない動き方',
    en: ['By generation 40, a way of running has emerged', 'Nobody taught it how'] },
  { a: 30.5, b: 35, main: '月面では、ちがう体と動き方に', sub: '重力は地球の約6分の1',
    en: ['On the Moon, a different body and gait evolve', 'Gravity is about one sixth of Earth\'s'] },
];
promoStart({
  name: '進化の箱庭', out: 'ga-creatures', src: '../../ga-creatures/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 18,
  inject: { dpr: 2, raf: true },
  music: { style: 'journey', root: 130.81, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: w => w.__ga && w.__ga.VIEW && w.__ga.VIEW.sim,
  setup(w) { gaSize(w, { '#view': [VIEWR[2], VIEWR[3]], '#grid': [GRID[2], GRID[3]], '#prog': [PROG[2], PROG[3]] }); w.render(); return null; },
  subs: shortSubs('進化の箱庭', 'Evolution Sandbox', '関節と筋肉でできた、でたらめな生きもの', 'Random creatures made of joints and muscles', CAPS,
    'ブラウザで動かせます。平地・坂・氷・月・水の中', 'Runs in your browser. Flat ground, slopes, ice, the Moon, underwater'),
  renderAt(t, w) { gaRender(w, SC, t); },
  drawSource(g, w) {
    g.fillStyle = '#0d1012'; g.fillRect(0, 0, PW * RES, PH * RES);
    for (const [sel, R] of [['#view', VIEWR], ['#grid', GRID], ['#prog', PROG]]) g.drawImage(qs(w, sel), R[0] * RES, R[1] * RES, R[2] * RES, R[3] * RES);
  },
  overlay(g, t, w) {
    drawPanel(g, 20, VIEWR[1] - 120, V ? 740 : 820, '', [gaText(w, '#wLabel'), gaText(w, '#wTime')], fade(t, IDENT_MINI + 0.3, 35, 0.4));
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, '進化の箱庭', '関節と筋肉でできた、でたらめな生きもの', 'ブラウザで動かせます。平地・坂・氷・月・水の中',
      'おもな出どころ: Holland（1975）、Sims（1994）SIGGRAPH 94 ほか');
  },
  errors: w => [w.__ga.err].filter(Boolean).map(String),
});
</script>
</body>
</html>
