<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="phage-common.js"></script>
<script>
'use strict';
// 台本: 細菌にとりつくウイルス ― 使い方と見どころ（横長の説明動画、150秒）
// アプリの図をいっぱいに。時間はアプリの u を KEYS で動かし、カメラはアプリのおまかせ（見どころごとに寄る・ルーペ）。数はアプリの右の欄を写す
const END = 150, DUR = END + IDENT_CLOSE;
const KEYS = [[0, 0], [13, 0.0429], [20, 0.0714], [32, 0.1643], [48, 0.2286], [54, 0.2714],
  [62, 0.3398], [70, 0.4766], [86, 0.6041], [92, 0.7268], [98, 0.8071], [106, 0.857], [136, 0.99]];
const LOOKS = [[0, false], [92.6, true], [99.6, false]];
const X = 1380;
const CH = {
  play: { x: 60, y: 870, title: '時間のスライダー（下）', btns: ['▶', '×¼', '×½', '×1', '×2', '×4'] },
  cam: { x: X, y: 240, title: 'カメラ（図の上）', btns: ['おまかせカメラ', '自分で動かす'], cols: 1 },
  look: { x: X, y: 240, title: '見た目（図の右上）', btns: ['わかりやすい', '本物に近い'], cols: 1 },
  conds: { x: X, y: 240, title: 'もしも（右の欄）', btns: ['通常（大腸菌 K-12）', '受け手のない細菌', 'DNA に糖のない T4', 'あとからもう1つ来る'], cols: 1 },
};
const SHOW = [
  ['play', 6, 13.6, t => t >= 8 ? 0 : -1],
  ['cam', 20.4, 25.6, () => 0],
  ['look', 92.4, 99.6, t => t >= 93.4 ? 1 : 0],
  ['conds', 136.4, 143.6, () => 0],
];
const B = (k, i) => btnRect(CH[k], i);
const CUR = [
  { t: 6.6, ...B('play', 0) }, { t: 8, ...B('play', 0), click: true }, { t: 9.5, ...B('play', 0), hide: true },
  { t: 92.6, ...B('look', 1) }, { t: 93.4, ...B('look', 1), click: true }, { t: 95, ...B('look', 1), hide: true },
  { t: 137.4, ...B('conds', 1) }, { t: 139.4, ...B('conds', 2) }, { t: 141.8, ...B('conds', 2), hide: true },
];
const CAPS = [
  { a: 6, b: 13.6, main: '下の時間のスライダーで、最初から最後まで。▶ で自動', sub: 'カメラはおまかせ。人のからだから、大腸のかべ・粘液へ寄っていく',
    en: ['Use the time slider below to go from start to finish, or press ▶', 'The camera follows the story: from the human body to the gut wall and its mucus'] },
  { a: 14, b: 20, main: '粘液の外側に、たくさんの大腸菌', sub: '黄色い点がファージ（ここでは大腸菌だけ描いている）',
    en: ['Many E. coli live in the outer mucus layer', 'The yellow dots are phages (only E. coli is drawn here)'] },
  { a: 20.4, b: 25.6, main: 'T4 ファージ（約0.2µm）は泳げない', sub: 'ホイールやドラッグで、自分で動かして寄ることもできる',
    en: ['The T4 phage (about 0.2 µm) cannot swim', 'You can also zoom and move around yourself with the wheel or by dragging'] },
  { a: 26, b: 31.6, main: '6本の長い脚が、外膜の OmpC をつかむ', sub: '3本以上くっつくと、もう後戻りしない',
    en: ['Six long legs grab OmpC on the outer membrane', 'Once three or more stick, there is no going back'] },
  { a: 32.2, b: 39.6, main: '基盤が星形に広がり、短い脚がくいこむ', sub: 'カメラが寄って、分子の大きさまで見せる（狭い画面では左上のルーペに）',
    en: ['The baseplate opens into a star and the short legs dig in', 'The camera zooms in to molecular detail (on small screens, in a loupe at the top left)'] },
  { a: 40, b: 47.6, main: 'さやが縮んで、針が外膜を突きぬける', sub: 'さやは23段。基盤の側から1段ずつ縮む（92.5 → 42nm）',
    en: ['The sheath contracts and the needle pierces the outer membrane', 'The 23-ring sheath shortens ring by ring from the baseplate (92.5 → 42 nm)'] },
  { a: 48.2, b: 54.6, main: 'DNA が管を通って細菌の中へ', sub: '168,903塩基対、のばすと約57µm。頭は空のぬけがらに',
    en: ['The DNA travels through the tube into the bacterium', '168,903 base pairs, about 57 µm stretched out. The head is left empty'] },
  { a: 55, b: 61.6, main: '細菌の工場（リボソーム）が、T4 の設計図を読みはじめる', sub: '細菌自身のたんぱく質は、ほとんど作られなくなる',
    en: ['The bacterium\'s factories (ribosomes) start reading T4\'s blueprint', 'The bacterium makes almost none of its own proteins anymore'] },
  { a: 62, b: 69.6, main: '細菌の DNA を切り、材料にして T4 の DNA をコピー', sub: 'T4 の DNA は糖の目印があるので切られない',
    en: ['It cuts up the bacterium\'s DNA and uses it to copy T4\'s DNA', 'T4\'s own DNA carries sugar tags, so it is not cut'] },
  { a: 70, b: 78.6, main: '内膜の上で頭の殻ができ、DNA をつめる', sub: 'モーターが毎秒約700塩基対で押しこむ（約4〜5分）',
    en: ['Head shells form on the inner membrane and DNA is packed in', 'A motor pushes it in at about 700 base pairs per second (about 4–5 minutes)'] },
  { a: 79, b: 87.6, main: 'しっぽは別に組み立て、首ができるとひとりでにはまる', sub: '長い脚は、いちばん最後に付く。数は右の欄に（目安）',
    en: ['Tails are built separately and snap on once the neck forms', 'The long legs attach last. Counts are on the right (rough guide)'] },
  { a: 88, b: 92, main: '細菌の中に、ファージがぎっしり', sub: '',
    en: ['The bacterium fills up with phages', ''] },
  { a: 92.4, b: 99.6, main: '「見た目: 本物に近い」で、電子顕微鏡の写真のような調子に', sub: '色を抜いて、札を消す',
    en: ['"Look: realistic" gives it the feel of an electron micrograph', 'Colors and labels are removed'] },
  { a: 100, b: 107.6, main: 'ホリンが内膜に穴をあけ、細菌は破れる', sub: '約25分で、100〜150個が外へ',
    en: ['Holins punch holes in the inner membrane and the cell bursts', 'In about 25 minutes, 100–150 phages are released'] },
  { a: 108, b: 117.6, main: '出てきたファージが、となりの細菌にとりつく', sub: '1回ごとに何十〜百倍。広がり方は模式',
    en: ['The released phages infect the neighboring bacteria', 'Tens to a hundred times more each round. How they spread is schematic'] },
  { a: 118, b: 127.6, main: 'ファージは人にはうつらない', sub: '抗生物質の効かない細菌を、ファージでやっつける研究（ファージ療法）も',
    en: ['Phages do not infect people', 'There is also research on using phages against bacteria that antibiotics cannot kill (phage therapy)'] },
  { a: 128, b: 135.6, main: 'マウスを乗せると、どの部品にも説明', sub: '研究の値・目安・模式を、札で分けている',
    en: ['Hover over any part for an explanation', 'Labels separate measured values, rough guides and schematics'] },
  { a: 136.4, b: 143.6, main: '「もしも」で、受け手のない細菌や、糖のない T4 も', sub: '結末がどう変わるかを見られる',
    en: ['"What if" lets you try bacteria without receptors, or T4 without sugar tags', 'See how the ending changes'] },
];
// ---- 案内役のライオン（promo.js の lionSetup・drawLion）。右下（x 1530〜、y 620〜）はライオンの場所 ----
const MUSIC = { style: 'journey', root: 110, stopAt: END, cues: [{ t: END, type: 'jingle' }] };
const EXP = [[0, 'calm'], [6.2, 'smile'], [10, 'calm'], [14.2, 'wow'], [18, 'calm'], [20.6, 'think'], [24, 'calm'], [26.2, 'smile'], [30, 'calm'], [32.4, 'wow'], [36, 'calm'],
  [40.2, 'shock'], [44, 'calm'], [48.4, 'wow'], [52, 'calm'], [55.2, 'think'], [59, 'calm'], [62.2, 'sad'], [66, 'calm'], [70.2, 'think'], [74, 'calm'], [79.2, 'smile'], [84, 'calm'],
  [88.2, 'wow'], [91, 'calm'], [92.6, 'smile'], [97, 'calm'], [100.2, 'shock'], [104, 'calm'], [108.2, 'think'], [113, 'calm'], [118.2, 'smile'], [123, 'proud'], [126, 'calm'],
  [128.2, 'smile'], [132, 'calm'], [136.6, 'think'], [140, 'calm'], [END - 7.6, 'smile']];
MUSIC.cues.push(...lionSetup({ caps: CAPS, cur: CUR, exp: EXP, end: END, bye: END - 5.8 }));
promoStart({
  name: '細菌にとりつくウイルス（使い方）', out: 'phage-guide', src: '../../phage/index.html', iw: 1920, ih: 1080, dur: DUR, peek: 40,
  inject: { dpr: 2, raf: true },
  music: MUSIC,
  ready: w => !!LION.api && w.__ph && w.__ph.Story && w.document.getElementById('nowCard'),
  setup(w) { phSize(w, 1920, 1080); return null; },
  subs: guideSubs(END, '細菌にとりつくウイルス', 'The Virus That Infects Bacteria', CAPS, 'Runs in your browser (PC or phone). Switch the app to English with the EN button'),
  renderAt(t, w) { phRender(w, KEYS, LOOKS, t); },
  drawSource(g, w, OW, OH) { phDraw(g, w, 0, 0, OW, OH); },
  overlay(g, t, w) {
    const n = phNow(w);
    drawPanel(g, 40, 200, 700, '', [n.title + (n.kind ? '（' + n.kind + '）' : ''), n.label], fade(t, 6, 143.6, 0.4));
    const c = phCounts(w);
    if (c.length) drawPanel(g, X, 215, 460, '細菌の中の数（右の欄）', c.slice(0, 6), fade(t, 56, 91.6, 0.4));
    for (const [k, a, b, on] of SHOW) drawChip(g, CH[k], on(t), fade(t, a, b, 0.4));
    drawCursor(g, CUR, t);
    drawCaps(g, t, CAPS, true);
    drawGuideChrome(g, t, END, '細菌にとりつくウイルス',
      'おもな出どころ: Miller ほか（2003）、Yap と Rossmann（2014）、Taylor ほか（2016）、Hu ほか（2015）ほか（アプリの「おもな出どころ」）。模式図です');
    drawLion(g, t);
  },
  errors: w => (w.__phErr || []).map(String),
});
lionOpen();
</script>
</body>
</html>
