<script>
'use strict';
// うんちく mold-growth-1（型H 当ててみて）「湿度60%の部屋でも、冷たい壁の表面は82%」。台本は trivia/mold-growth.md。?short で録る
// 表面の湿度 = 60% × 飽和水蒸気圧(20℃ 2.34 kPa) ÷ 飽和水蒸気圧(15℃ 1.70 kPa) ≈ 82%（空気の水の量がそのまま壁ぎわまで来るとした計算）
// 76%（Aspergillus repens）・79%（A. versicolor・アオカビ数種）は Grant ほか 1989（寒天の上の最低値）。80% 未満がめやす
const DUR = 30;
const subs = [
  { a: 0.0, b: 3.2, ja: '部屋は20℃・湿度60%。\n15℃の冷たい壁の表面は、何%？', en: 'Room: 20°C, 60% humidity.\nWhat is it right at a 15°C cold wall?' },
  { a: 3.2, b: 5.0, ja: '答えは、[82%]', en: 'Answer: 82%' },
  { a: 5.0, b: 9.5, ja: '空気が持てる水の量は、[温度]で決まる', en: 'How much water air can hold depends on temperature' },
  { a: 9.5, b: 14.0, ja: '冷えると、同じ水でも\n[「いっぱい」]に近づく', en: 'Cool it down and the same water\ngets close to “full”' },
  { a: 14.0, b: 18.0, ja: 'カビが育つ、いちばん低い湿り気は[76%]', en: 'The lowest humidity mould can grow at: 76%' },
  { a: 18.0, b: 22.0, ja: '家のカビの多くは79%から。\n[80%をこえない]のがめやす', en: 'Many household moulds start at 79%.\nKeeping below 80% is the rule of thumb' },
  { a: 22.0, b: 30.0, ja: 'だから、カビが生えるのは\n[部屋]じゃなく、冷たい[壁]と[すみ]', en: 'That’s why mould grows not in the room,\nbut on cold walls and corners' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.25, type: 'pop' }, { t: 0.45, type: 'pop' },
  { t: 1.4, type: 'tick' }, { t: 2.4, type: 'tick' }, { t: 3.2, type: 'ding' },
  { t: 5.0, type: 'whoosh' }, { t: 9.8, type: 'rise' }, { t: 14.0, type: 'pop' }, { t: 15.0, type: 'tick' }, { t: 16.0, type: 'tick' }, { t: 17.0, type: 'tick' },
  { t: 18.6, type: 'ding' }, { t: 22.0, type: 'whoosh' }, { t: 24.6, type: 'pop' }, { t: 26.0, type: 'rise' },
];
// 選択肢（TK.choices と同じ並び）。答えの札は金色にぬらず、朱の二重わくで示す（字の下を濃くしない）
function choices(g, t, a, b, opts, o = {}) {
  if (t < a || t > b) return;
  const f = fade(t, a, b, 0.3), y0 = o.y ?? PH * 0.34, h = o.h || 190, gap = o.gap || 40;
  const rv = o.reveal ?? Infinity, ans = o.answer ?? -1, rk = clamp((t - rv) / 0.35, 0, 1);
  g.save(); g.globalAlpha *= f;
  opts.forEach((s, i) => {
    const k = TK.out((t - a - i * 0.18) / 0.35), y = y0 + i * (h + gap), x = 90, w = PW - 180, hit = i === ans && rk > 0;
    g.save(); g.globalAlpha *= k * (ans >= 0 && i !== ans ? 1 - 0.6 * rk : 1);
    TK.card(g, x, y, w, h);
    if (hit) { g.save(); g.globalAlpha *= rk; PL.ink(g, PL.rect(x - 10, y - 10, w + 20, h + 20), 6, PL.RED); g.restore(); }
    PL.ink(g, PL.circle(x + 80, y + h / 2, 46), 5, hit ? PL.RED : PL.INK);
    TK.text(g, 'ABCDE'[i], x + 80, y + h / 2 + 2, 60, { color: hit ? PL.RED : PL.INK });
    TK.text(g, s, x + 160, y + h / 2, o.size || 64, { align: 'left', maxw: w - 200, color: hit ? PL.RED : PL.INK });
    g.restore();
  });
  if (o.think && t >= o.think[0] && t < o.think[1] + 0.3) { const [p, q] = o.think; PL.watch(g, PW / 2, y0 - 150, 70, clamp((t - p) / (q - p), 0, 1)); }
  g.restore();
}
const rnd = (i, k = 1) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
// ---- 図鑑の版画の部品 ----
// カビの小さな群れ（Aspergillus 風: 面をはう菌糸＋立ち上がる柄の先に丸い頭と胞子の列）。up: 立ち上がる向き（-1 上・1 下）
function moldTuft(g, x, y, s, k, o = {}) {
  if (k <= 0) return;
  const up = o.up ?? -1, n = o.n ?? 7;
  PL.ink(g, gg => { for (let j = 0; j < n; j++) { const a = (j / (n - 1) - 0.5) * 2.6, L = 120 * s * k * (0.6 + 0.4 * rnd(j, 5)); gg.moveTo(x, y); gg.quadraticCurveTo(x + Math.sin(a) * L * 0.5 + (rnd(j, 6) - 0.5) * 20 * s, y + up * Math.cos(a) * L * 0.15, x + Math.sin(a) * L, y + up * Math.abs(Math.cos(a)) * L * 0.08); } }, Math.max(1.4, 2 * s), '#4f6a3a');   // 面をはう菌糸
  const kk = clamp((k - 0.35) / 0.65, 0, 1); if (kk <= 0) return;
  for (let j = 0; j < 5; j++) {
    const bx = x + (j - 2) * 22 * s + (rnd(j, 7) - 0.5) * 10 * s, h = (50 + 40 * rnd(j, 8)) * s * kk, tx = bx + (rnd(j, 9) - 0.5) * 16 * s, ty = y + up * h;
    PL.ink(g, gg => { gg.moveTo(bx, y); gg.quadraticCurveTo(bx, y + up * h * 0.6, tx, ty); }, Math.max(1.4, 2.2 * s), '#4f6a3a');
    const hd = PL.circle(tx, ty, 9 * s * kk + 2); PL.tint(g, hd, PL.T.leaf, 0.95); PL.ink(g, hd, Math.max(1.2, 1.8 * s));
    PL.ink(g, gg => { for (let q = 0; q < 7; q++) { const a = Math.PI * (up < 0 ? 1.05 + q * 0.15 : 0.05 + q * 0.15); for (let r = 1; r <= 3; r++) { const rr = (9 * s * kk + 2) + r * 5 * s; gg.moveTo(tx + Math.cos(a) * rr + 2 * s, ty + Math.sin(a) * rr); gg.arc(tx + Math.cos(a) * rr, ty + Math.sin(a) * rr, 2 * s, 0, Math.PI * 2); } } }, Math.max(1, 1.4 * s), '#4f6a3a');   // 胞子の列
  }
}
// 空気のコップ（容量 = 飽和水蒸気圧に比例）。water は同じ量
function cup(g, x, base, cap, water, label, k) {
  const W = 260, H = cap * 220, wh = water * 220 * k;
  const glass = PL.poly([[x - W / 2, base - H], [x - W / 2 + 18, base], [x + W / 2 - 18, base], [x + W / 2, base - H]]);
  PL.tint(g, glass, PL.T.sky, 0.18);
  if (wh > 0) {
    const fr = v => 18 * (1 - v / H), wt = PL.poly([[x - W / 2 + 18, base], [x + W / 2 - 18, base], [x + W / 2 - fr(wh), base - wh], [x - W / 2 + fr(wh), base - wh]]);
    PL.tint(g, wt, PL.T.sea, 0.75); PL.hatch(g, wt, { angle: 0.9, gap: 10, w: 1.6, not: PL.rect(x - W / 2, base - wh, W * 0.45, wh) });
    PL.ink(g, gg => { for (let xx = x - W / 2 + fr(wh); xx <= x + W / 2 - fr(wh); xx += 8) { const yy = base - wh + Math.sin(xx * 0.08) * 3; xx === x - W / 2 + fr(wh) ? gg.moveTo(xx, yy) : gg.lineTo(xx, yy); } }, 3);
  }
  PL.ink(g, gg => { for (let i = 1; i <= Math.floor(cap * 4); i++) { const yy = base - i * 55; gg.moveTo(x + W / 2 - 18 * (1 - i * 55 / H), yy); gg.lineTo(x + W / 2 - 18 * (1 - i * 55 / H) - (i % 2 ? 14 : 26), yy); } }, 2);   // 目盛り
  PL.ink(g, gg => { gg.moveTo(x - W / 2, base - H); gg.lineTo(x - W / 2 + 18, base); gg.lineTo(x + W / 2 - 18, base); gg.lineTo(x + W / 2, base - H); }, 7);
  PL.ink(g, gg => { gg.moveTo(x - W / 2 + 26, base - H + 30); gg.lineTo(x - W / 2 + 36, base - 40); }, 3, 'rgba(255,255,255,0.8)');   // ガラスの光
  PL.label(g, label, x, base + 60, 56);
  return H;
}
// 湿り気のものさし（50〜100%）
function scale(g, t) {
  const x0 = 140, x1 = 940, y = 700, X = v => lerp(x0, x1, (v - 50) / 50);
  const bar = PL.rect(x0, y - 30, x1 - x0, 60);
  PL.tint(g, bar, PL.T.sand, 0.35);
  g.save(); g.globalAlpha *= clamp((t - 14.4) / 0.5, 0, 1);
  const zone = PL.rect(X(76), y - 30, X(100) - X(76), 60); PL.tint(g, zone, PL.T.leaf, 0.75); PL.hatch(g, zone, { angle: 0.9, gap: 8, w: 1.6 });
  moldTuft(g, X(92), y - 32, 0.7, clamp((t - 14.6) / 1.5, 0, 1), { n: 5 });
  g.restore();
  PL.ink(g, gg => { for (let v = 50; v <= 100; v += 5) { gg.moveTo(X(v), y + 30); gg.lineTo(X(v), y + (v % 10 ? 18 : 8)); } }, 2);
  PL.ink(g, bar, 4);
  [50, 70, 90, 100].forEach(v => PL.label(g, v + '%', X(v), y + 70, 36, { color: TK.C.sub, bold: false }));
  const marks = [[76, 14.6, 'カビの最低ライン', 1], [79, 18.2, '家のカビの多く', 2], [80, 19.2, 'めやす', 3]];
  marks.forEach(([v, a, s, row]) => {
    const k = TK.pop(t, a, 0.35); if (k <= 0) return;
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    PL.ink(g, gg => { gg.moveTo(X(v), y - 40); gg.lineTo(X(v), y - 60 - row * 85); }, 5, PL.GREEN);
    PL.label(g, v + '%  ' + s, X(v) - 18, y - 82 - row * 85 + 20, 46, { align: 'right', color: PL.GREEN });
    g.restore();
  });
  const tri = (v, col) => { const p = PL.poly([[X(v), y + 34], [X(v) - 24, y + 118], [X(v) + 24, y + 118]]); PL.tint(g, p, col, 1); PL.ink(g, p, 3); };
  const k = TK.pop(t, 15.4, 0.4);
  if (k > 0) { g.save(); g.globalAlpha = clamp(k, 0, 1); tri(82, PL.T.gold); PL.label(g, '冷たい壁 [82%]', X(82) + 20, y + 175, 58); g.restore(); }
  tri(60, PL.T.sea);
  PL.label(g, '部屋 60%', X(60), y + 175, 58, { color: '#2f5f7a' });
}
// 冷たい壁のすみ（ゴムパッキン）に胞子が落ちて芽を出す（部屋の断面）
function corner(g, t) {
  const L = 140, R = 940, T = 300, F = 900;
  const wall = PL.rect(L, T, 160, F - T), floor = PL.rect(L, F, R - L, 110), back = PL.rect(L, T, R - L, F - T);
  PL.tint(g, wall, PL.T.sky, 0.6); PL.hatch(g, wall, { angle: 0.9, gap: 10, w: 1.8 });
  PL.tint(g, floor, PL.T.wood, 0.6); PL.hatch(g, floor, { angle: 0.3, gap: 9, w: 1.6 });
  PL.ink(g, gg => { for (let x = L + 200; x < R; x += 120) { gg.moveTo(x, F); gg.lineTo(x - 30, F + 110); } }, 1.6, 'rgba(35,28,21,0.5)');   // 床板
  PL.ink(g, back, 4); PL.ink(g, wall, 4); PL.ink(g, floor, 4);
  const pk = PL.rect(298, F - 40, 36, 40); PL.tint(g, pk, PL.T.gray, 0.9); PL.hatch(g, pk, { angle: 0.9, gap: 7, w: 1.2 }); PL.ink(g, pk, 3);   // パッキン
  for (let i = 0; i < 9; i++) { const yy = T + 60 + ((i * 73 + t * 30) % 480), xx = 180 + (i * 37) % 100, d = PL.poly([...Array.from({ length: 9 }, (_, q) => { const a = Math.PI * q / 8; return [xx + Math.cos(a) * 7, yy + Math.sin(a) * 7]; }), [xx, yy - 16]]); PL.tint(g, d, PL.T.sea, 0.9); PL.ink(g, d, 2); }   // 結露のしずく
  PL.label(g, '冷たい壁', 220, 250, 40, { color: '#2f5f7a' }); PL.leader(g, 220, 320, 220, 272, '#2f5f7a');
  const fall = clamp((t - 23.0) / 1.6, 0, 1), sx = 316, sy = lerp(330, F - 46, ease(fall));
  const sp = PL.circle(sx, sy, 12); PL.tint(g, sp, PL.T.leaf, 1); PL.ink(g, sp, 3);
  moldTuft(g, sx, F - 42, 1.1, clamp((t - 25.0) / 4.0, 0, 1));
  PL.label(g, '部屋のまん中 60%', 660, 520, 48, { color: TK.C.sub });
  if (t > 24.6) { g.save(); g.globalAlpha = fade(t, 24.6, 30, 0.3); PL.label(g, 'すみ・パッキン 80%こえ', 720, 720, 48, { color: PL.RED }); PL.leader(g, 345, F - 30, 560, 745, PL.RED); g.restore(); }
}

function draw(g, t) {
  // 0〜5: 当ててみて
  if (t < 5.0) {
    PL.label(g, '部屋 [20℃・60%]  →  壁 15℃', 90, 200, 62, { align: 'left' });
    PL.label(g, '壁の表面は 何%？', 90, 300, 84, { align: 'left' });
    choices(g, t, 0, 5.0, ['60%', '70%', '82%'], { y: 640, h: 120, gap: 26, size: 84, answer: 2, reveal: 3.2, think: [1.3, 3.2] });
  }
  // 5〜14: 2つのコップ
  if (t >= 5.0 && t < 14.0) {
    PL.label(g, '空気が持てる水の量', 90, 190, 64, { align: 'left', color: TK.C.sub });
    const k = TK.out((t - 5.6) / 1.2);
    cup(g, 300, 960, 2.34, 0.6 * 2.34, '20℃', k);
    cup(g, 780, 960, 1.70, 0.6 * 2.34, '15℃', t > 9.8 ? k : 0);
    PL.label(g, '60%', 300, 570, 60, { color: '#2f5f7a' });
    if (t > 9.8) {
      g.save(); g.globalAlpha = fade(t, 9.8, 14, 0.3);
      PL.label(g, '[82%]', 780, 530, 64);
      PL.label(g, '60% × 2.34 ÷ 1.70 ≈ [82%]', 90, 290, 54, { align: 'left' });
      PL.label(g, '（飽和水蒸気圧 kPa）', 90, 350, 36, { align: 'left', color: TK.C.sub, bold: false });
      g.restore();
    }
    g.save(); g.globalAlpha = clamp((t - 6.6) / 0.4, 0, 1);
    const ar = PL.poly([[465, 700], [600, 700], [600, 675], [645, 720], [600, 765], [600, 740], [465, 740]]); PL.tint(g, ar, PL.T.sea, 0.9); PL.ink(g, ar, 3);
    g.restore();
  }
  // 14〜22: ものさし
  if (t >= 14.0 && t < 22.0) { PL.label(g, '湿り気（相対湿度）', 90, 210, 60, { align: 'left', color: TK.C.sub }); scale(g, t); }
  // 22〜30: すみ
  if (t >= 22.0) corner(g, t);
  if (t >= 5 && t < 14) TK.note(g, t, 5, 14, '空気の水の量が、そのまま壁ぎわまで来るとした計算', { size: 32 });
  if (t >= 14 && t < 22) TK.note(g, t, 14, 22, '76%・79% は寒天の上（よい条件）での最低値。壁の上ではもっと高い湿り気がいります', { size: 30 });
  if (t >= 27.5) TK.note(g, t, 27.5, 30, '出どころ: Grant ほか (1989) International Biodeterioration 25:259・飽和水蒸気圧の表', { size: 30 });
}

triviaStart({ out: 'mold-growth-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
