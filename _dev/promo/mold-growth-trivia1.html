<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく mold-growth-1（型H 当ててみて）「湿度60%の部屋でも、冷たい壁の表面は82%」。台本は trivia/mold-growth.md。?short で録る
// 表面の湿度 = 60% × 飽和水蒸気圧(20℃ 2.34 kPa) ÷ 飽和水蒸気圧(15℃ 1.70 kPa) ≈ 82%（空気の水の量がそのまま壁ぎわまで来るとした計算）
// 76%（Aspergillus repens）・79%（A. versicolor・アオカビ数種）は Grant ほか 1989（寒天の上の最低値）。80% 未満がめやす
const DUR = 30;
const subs = [
  { a: 0.0, b: 3.2, ja: '部屋は20℃・湿度60%。\n15℃の冷たい壁の表面は、何%？', en: 'Room: 20°C, 60% humidity.\nWhat is it right at a 15°C cold wall?' },
  { a: 3.2, b: 5.0, ja: '答えは、[82%]', en: 'Answer: 82%' },
  { a: 5.0, b: 9.5, ja: '空気が持てる水の量は、[温度]で決まる', en: 'How much water air can hold depends on temperature' },
  { a: 9.5, b: 14.0, ja: '冷えると、同じ水でも\n[「いっぱい」]に近づく', en: 'Cool it down and the same water\ngets close to “full”' },
  { a: 14.0, b: 18.0, ja: 'カビが育つ、いちばん低い湿り気は[76%]', en: 'The lowest humidity mould can grow at: 76%' },
  { a: 18.0, b: 22.0, ja: '家のカビの多くは79%から。\n[80%をこえない]のがめやす', en: 'Many household moulds start at 79%.\nKeeping below 80% is the rule of thumb' },
  { a: 22.0, b: 30.0, ja: 'だから、カビが生えるのは\n[部屋]じゃなく、冷たい[壁]と[すみ]', en: 'That’s why mould grows not in the room,\nbut on cold walls and corners' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.25, type: 'pop' }, { t: 0.45, type: 'pop' },
  { t: 1.4, type: 'tick' }, { t: 2.4, type: 'tick' }, { t: 3.2, type: 'ding' },
  { t: 5.0, type: 'whoosh' }, { t: 9.8, type: 'rise' }, { t: 14.0, type: 'pop' }, { t: 15.0, type: 'tick' }, { t: 16.0, type: 'tick' }, { t: 17.0, type: 'tick' },
  { t: 18.6, type: 'ding' }, { t: 22.0, type: 'whoosh' }, { t: 24.6, type: 'pop' }, { t: 26.0, type: 'rise' },
];
const MOLD = '#8fd16a', WATER = '#5fd4ff';

// 湿度計
function meter(g, x, y, label, val, col) {
  TK.card(g, x - 190, y - 120, 380, 240, { r: 36 });
  TK.text(g, label, x, y - 62, 42, { color: TK.C.sub });
  TK.text(g, val, x, y + 30, 110, { color: col || '#fff' });
}
// 空気のコップ（容量 = 飽和水蒸気圧に比例）。water は同じ量
function cup(g, x, base, cap, water, label, k) {
  const W = 260, H = cap * 220;
  g.save();
  g.strokeStyle = '#cfe0ff'; g.lineWidth = 7; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - W / 2, base - H); g.lineTo(x - W / 2 + 18, base); g.lineTo(x + W / 2 - 18, base); g.lineTo(x + W / 2, base - H); g.stroke();
  const wh = water * 220 * k;
  g.fillStyle = 'rgba(95,212,255,0.55)'; g.beginPath();
  g.moveTo(x - W / 2 + 18 * (1 - 0), base); g.lineTo(x + W / 2 - 18, base); g.lineTo(x + W / 2 - 18 * (1 - wh / H), base - wh); g.lineTo(x - W / 2 + 18 * (1 - wh / H), base - wh); g.closePath(); g.fill();
  g.restore();
  TK.text(g, label, x, base + 60, 56);
  return H;
}
// 湿り気のものさし（50〜100%）
function scale(g, t) {
  const x0 = 140, x1 = 940, y = 700, X = v => lerp(x0, x1, (v - 50) / 50);
  g.fillStyle = 'rgba(255,255,255,0.1)'; g.beginPath(); g.roundRect(x0, y - 30, x1 - x0, 60, 30); g.fill();
  const gr = g.createLinearGradient(X(76), 0, X(100), 0); gr.addColorStop(0, 'rgba(143,209,106,0.35)'); gr.addColorStop(1, 'rgba(143,209,106,0.85)');
  g.save(); g.globalAlpha = clamp((t - 14.4) / 0.5, 0, 1); g.fillStyle = gr; g.beginPath(); g.roundRect(X(76), y - 30, X(100) - X(76), 60, 30); g.fill(); g.restore();
  [50, 70, 90, 100].forEach(v => TK.text(g, v + '%', X(v), y + 70, 36, { color: TK.C.dim, bold: false }));
  const marks = [[76, 14.6, 'カビの最低ライン', 1], [79, 18.2, '家のカビの多く', 2], [80, 19.2, 'めやす', 3]];
  marks.forEach(([v, a, s, row]) => {
    const k = TK.pop(t, a, 0.35); if (k <= 0) return;
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    g.strokeStyle = MOLD; g.lineWidth = 6; g.beginPath(); g.moveTo(X(v), y - 40); g.lineTo(X(v), y - 60 - row * 85); g.stroke();
    TK.text(g, v + '%  ' + s, X(v) - 14, y - 82 - row * 85 + 20, 46, { align: 'right', color: MOLD });
    g.restore();
  });
  // 壁の 82%
  const k = TK.pop(t, 15.4, 0.4);
  if (k > 0) {
    g.save(); g.globalAlpha = clamp(k, 0, 1);
    g.fillStyle = TK.C.acc; g.beginPath(); g.moveTo(X(82), y + 26); g.lineTo(X(82) - 26, y + 120); g.lineTo(X(82) + 26, y + 120); g.closePath(); g.fill();
    TK.text(g, '冷たい壁 [82%]', X(82), y + 175, 58);
    g.restore();
  }
  g.fillStyle = TK.C.acc2; g.beginPath(); g.moveTo(X(60), y + 26); g.lineTo(X(60) - 26, y + 120); g.lineTo(X(60) + 26, y + 120); g.closePath(); g.fill();
  TK.text(g, '部屋 60%', X(60), y + 175, 58, { color: TK.C.acc2 });
}
// 冷たい壁のすみ（ゴムパッキン）に胞子が落ちて芽を出す
function corner(g, t) {
  const cx = PW / 2, cy = 640;
  g.fillStyle = '#2a3a63'; g.fillRect(140, 260, 800, 760);
  g.fillStyle = '#3c5288'; g.fillRect(140, 260, 160, 760);   // 冷たい壁（外に面した）
  g.fillStyle = 'rgba(95,212,255,0.25)'; g.fillRect(140, 260, 160, 760);
  TK.text(g, '冷たい壁', 220, 300, 40, { color: TK.C.acc2 });
  g.fillStyle = '#1e2740'; g.fillRect(140, 900, 800, 120);   // 床
  g.fillStyle = '#d7d7d7'; g.fillRect(296, 860, 40, 160);   // パッキン
  // 結露のしずく
  for (let i = 0; i < 10; i++) { const y = 340 + ((i * 73 + t * 30) % 520); g.fillStyle = 'rgba(95,212,255,0.7)'; g.beginPath(); g.ellipse(180 + (i * 37) % 100, y, 7, 10, 0, 0, Math.PI * 2); g.fill(); }
  // 胞子
  const fall = clamp((t - 23.0) / 1.6, 0, 1), sx = 316, sy = lerp(330, 860, ease(fall));
  g.fillStyle = MOLD; g.beginPath(); g.arc(sx, sy, 12, 0, Math.PI * 2); g.fill();
  // 菌糸
  const gk = clamp((t - 25.0) / 4.0, 0, 1);
  if (gk > 0) {
    g.strokeStyle = MOLD; g.lineWidth = 4; g.lineCap = 'round';
    for (let j = 0; j < 7; j++) {
      const a = -Math.PI / 2 + (j - 3) * 0.42, L = 160 * gk * (0.6 + 0.4 * Math.sin(j * 2.1 + 1));
      g.beginPath(); g.moveTo(sx, 860);
      g.quadraticCurveTo(sx + Math.cos(a) * L * 0.5 + Math.sin(j) * 20, 860 + Math.sin(a) * L * 0.5, sx + Math.cos(a) * L, 860 + Math.sin(a) * L); g.stroke();
    }
  }
  // 部屋の真ん中は乾いている
  TK.text(g, '部屋のまん中 60%', 660, 520, 48, { color: TK.C.sub });
  if (t > 24.6) { g.save(); g.globalAlpha = fade(t, 24.6, 30, 0.3); TK.text(g, 'すみ・パッキン 80%こえ', 560, 800, 48, { color: TK.C.acc }); g.restore(); }
}

function draw(g, t) {
  // 0〜5: 当ててみて
  if (t < 5.0) {
    TK.text(g, '部屋 [20℃・60%]  →  壁 15℃', PW / 2, 200, 62);
    TK.text(g, '壁の表面は 何%？', PW / 2, 300, 84);
    TK.choices(g, t, 0, 5.0, ['60%', '70%', '82%'], { y: 640, h: 120, gap: 26, size: 84, answer: 2, reveal: 3.2, think: [1.3, 3.2] });
  }
  // 5〜14: 2つのコップ
  if (t >= 5.0 && t < 14.0) {
    TK.text(g, '空気が持てる水の量', PW / 2, 190, 64, { color: TK.C.sub });
    const k = TK.out((t - 5.6) / 1.2);
    cup(g, 300, 940, 2.34, 0.6 * 2.34, '20℃', k);
    cup(g, 780, 940, 1.70, 0.6 * 2.34, '15℃', t > 9.8 ? k : 0);
    TK.text(g, '60%', 300, 940 - 0.6 * 2.34 * 110, 60, { color: '#0b1430', blur: 0 });
    if (t > 9.8) {
      g.save(); g.globalAlpha = fade(t, 9.8, 14, 0.3);
      TK.text(g, '[82%]', 780, 940 - 0.6 * 2.34 * 110, 60, { color: '#0b1430', acc: '#0b1430', blur: 0 });
      TK.text(g, '60% × 2.34 ÷ 1.70 ≈ [82%]', PW / 2, 290, 54);
      TK.text(g, '（飽和水蒸気圧 kPa）', PW / 2, 350, 36, { color: TK.C.dim, bold: false });
      g.restore();
    }
    g.save(); g.globalAlpha = clamp((t - 6.6) / 0.4, 0, 1); g.fillStyle = WATER;
    g.beginPath(); g.moveTo(470, 700); g.lineTo(600, 700); g.lineTo(600, 675); g.lineTo(640, 720); g.lineTo(600, 765); g.lineTo(600, 740); g.lineTo(470, 740); g.fill(); g.restore();
  }
  // 14〜22: ものさし
  if (t >= 14.0 && t < 22.0) { TK.text(g, '湿り気（相対湿度）', PW / 2, 210, 60, { color: TK.C.sub }); scale(g, t); }
  // 22〜30: すみ
  if (t >= 22.0) corner(g, t);
  if (t >= 5 && t < 14) TK.note(g, t, 5, 14, '空気の水の量が、そのまま壁ぎわまで来るとした計算', { size: 32 });
  if (t >= 14 && t < 22) TK.note(g, t, 14, 22, '76%・79% は寒天の上（よい条件）での最低値。壁の上ではもっと高い湿り気がいります', { size: 30 });
  if (t >= 27.5) TK.note(g, t, 27.5, 30, '出どころ: Grant ほか (1989) International Biodeterioration 25:259・飽和水蒸気圧の表', { size: 30 });
}

triviaStart({ out: 'mold-growth-trivia1', dur: DUR, draw, subs, cues, peek: 1.0 });
</script>
</body>
</html>
