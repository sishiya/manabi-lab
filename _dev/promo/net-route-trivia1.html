<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="../../lib/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="promo-audio.js"></script>
<script src="trivia-kit.js"></script>
<script>
'use strict';
// うんちく net-route-1（型H 当ててみて）「シカゴ→ニューヨーク、速いのはどっち？」。台本は trivia/net-route.md。?short で録る
// 数字は Laughlin, Aguirre, Grundfest (2014) Financial Review 49:283–312（arXiv:1302.5966）:
// 光の限界 3.93ms、まっすぐに掘りなおした光ファイバー 6.65ms、電波の網 4.2〜5.2ms（推定）、合わせて 5億ドル超（設備＋5年の運用）。
// 「約3割おそい」はガラスの屈折率 約1.47 の目安。会社名は出さない
const DUR = 35;
const subs = [
  { a: 0.0, b: 3.0, ja: 'シカゴからニューヨークへ、株の値段を送る。\n速いのはどっち？', en: 'Sending stock prices from Chicago to New York.\nWhich is faster?', noBurn: true },
  { a: 5.0, b: 10.0, ja: '答えは、[電波の鉄塔]', en: 'The answer: radio towers.' },
  { a: 10.0, b: 13.5, ja: '光ファイバーの中の光は、ガラスの中なので\n真空より[約3割]おそい', en: 'Light in optical fiber travels through glass,\nabout 30% slower than in a vacuum.' },
  { a: 13.5, b: 17.0, ja: '電波は空気の中を\nほぼ[光の速さ]で進む', en: 'Radio waves travel through air\nat nearly the speed of light.' },
  { a: 17.0, b: 21.0, ja: 'わざわざ地面を掘って、\nまっすぐなケーブルを通した', en: 'Someone even dug a new, straighter\nfiber route through the ground.' },
  { a: 21.0, b: 25.0, ja: 'でも、電波の鉄塔のほうが\nさらに[約2ミリ秒]速かった', en: 'But radio towers were still\nabout 2 milliseconds faster.' },
  { a: 25.0, b: 31.0, ja: 'その[2ミリ秒]のために、\n全部で[5億ドル]以上', en: 'For those 2 milliseconds,\nover 500 million dollars in total.' },
  { a: 31.0, b: 35.0, ja: 'ネットの速さを決めるのは、\n光の速さと、道の長さ', en: 'Network speed comes down to\nthe speed of light and the length of the path.' },
];
const cues = [
  { t: 0.05, type: 'pop' }, { t: 0.4, type: 'pop' }, { t: 0.6, type: 'pop' }, { t: 3.0, type: 'tick' }, { t: 4.0, type: 'tick' }, { t: 5.0, type: 'ding' },
  { t: 10.0, type: 'whoosh' }, { t: 10.6, type: 'rise' }, { t: 13.1, type: 'ding' }, { t: 14.4, type: 'tick' },
  { t: 17.0, type: 'whoosh' }, { t: 17.4, type: 'pop' }, { t: 17.9, type: 'pop' }, { t: 18.4, type: 'pop' }, { t: 21.0, type: 'ding' },
  { t: 25.0, type: 'pop' }, { t: 28.0, type: 'thud' }, { t: 31.0, type: 'whoosh' },
];

// 地図（2つの点。形はかざり）
function map(g, y, k, o = {}) {
  const ax = 150, bx = 810;
  g.save(); g.globalAlpha *= k;
  if (o.paths) {
    // 光ファイバー（地面にそって少し曲がる）と電波（鉄塔をつないでほぼまっすぐ）
    g.strokeStyle = TK.C.acc2; g.lineWidth = 7; g.beginPath(); g.moveTo(ax, y);
    for (let i = 1; i <= 40; i++) { const x = lerp(ax, bx, i / 40); g.lineTo(x, y + 150 * Math.sin(i / 40 * Math.PI) + 18 * Math.sin(i * 1.3)); }
    g.stroke();
    g.strokeStyle = TK.C.acc; g.lineWidth = 5; g.setLineDash([16, 10]); g.beginPath(); g.moveTo(ax, y); g.lineTo(bx, y - 4); g.stroke(); g.setLineDash([]);
    for (let i = 1; i < 6; i++) tower(g, lerp(ax, bx, i / 6), y - 2, 0.85);
  } else {
    g.strokeStyle = 'rgba(160,190,255,0.5)'; g.lineWidth = 4; g.setLineDash([10, 12]); g.beginPath(); g.moveTo(ax, y); g.lineTo(bx, y); g.stroke(); g.setLineDash([]);
  }
  for (const [x, s] of [[ax, 'シカゴ'], [bx, 'ニュージャージー']]) {
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 16, 0, Math.PI * 2); g.fill();
    TK.text(g, s, x, y + 56, 40, { color: TK.C.sub });
  }
  if (!o.paths) TK.text(g, '約 1,180 km', (ax + bx) / 2, y - 40, 36, { color: TK.C.dim, bold: false });
  g.restore();
}
// 電波の鉄塔（格子の三角）
function tower(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = '#e8f0ff'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(-40, 60); g.lineTo(0, -90); g.lineTo(40, 60);
  for (let i = 0; i < 4; i++) { const y0 = 60 - i * 37, y1 = y0 - 37, w0 = 40 * (y0 + 90) / 150, w1 = 40 * (y1 + 90) / 150; g.moveTo(-w0, y0); g.lineTo(w1, y1); g.moveTo(w0, y0); g.lineTo(-w1, y1); }
  g.stroke();
  g.strokeStyle = TK.C.acc; g.lineWidth = 4; for (const r of [24, 44]) { g.beginPath(); g.arc(0, -90, r, -0.7, 0.7); g.stroke(); g.beginPath(); g.arc(0, -90, r, Math.PI - 0.7, Math.PI + 0.7); g.stroke(); }
  g.restore();
}

function draw(g, t) {
  // 0〜10: 2択
  if (t < 10.0) {
    map(g, 230, TK.pop(t, 0.0, 0.4));
    TK.choices(g, t, 0.3, 10.0, ['光ファイバー（光）', '電波の鉄塔（電波）'], { y: 520, h: 180, answer: 1, reveal: 5.0, think: [3.0, 5.0], size: 60 });
    if (t < 3.0) TK.hook(g, t, 0.0, 3.0, '速いのは [どっち]？', { y: 1090, size: 100 });
    if (t >= 5.0) { const k = TK.pop(t, 5.6, 0.4); g.save(); g.globalAlpha = fade(t, 5.6, 10, 0.3); tower(g, 820, 1030, 0.7 * k); g.restore(); }
  }
  // 10〜17: 並走（ガラスの中の光と、空気の中の電波）
  if (t >= 10.0 && t < 17.0) {
    const x0 = 110, x1 = 850, u = clamp((t - 10.6) / 2.5, 0, 1.6);
    const lanes = [
      { y: 330, label: '光ファイバー（ガラスの中の光）', v: 1 / 1.47, c: TK.C.acc2 },
      { y: 650, label: '電波（空気の中）', v: 1.0, c: TK.C.acc },
    ];
    lanes.forEach((L, i) => {
      TK.text(g, L.label, x0, L.y - 80, 46, { align: 'left', color: TK.C.sub });
      g.save();
      g.strokeStyle = i === 0 ? 'rgba(95,212,255,0.35)' : 'rgba(255,255,255,0.15)'; g.lineWidth = i === 0 ? 70 : 4;
      if (i === 1) g.setLineDash([8, 14]);
      g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, L.y); g.lineTo(x1, L.y); g.stroke(); g.setLineDash([]);
      const p = clamp(u * L.v, 0, 1), x = lerp(x0, x1, p);
      g.fillStyle = L.c; g.shadowColor = L.c; g.shadowBlur = 30; g.beginPath(); g.arc(x, L.y, 26, 0, Math.PI * 2); g.fill();
      g.restore();
      if (p >= 1) TK.text(g, 'とうちゃく', x1 - 10, L.y + 80, 40, { align: 'right', color: L.c });
    });
    if (t > 13.1) { g.save(); g.globalAlpha = fade(t, 13.1, 17, 0.3); TK.card(g, 220, 840, 520, 100, { r: 50 }); TK.text(g, 'ガラスは [約3割] おそい', PW / 2 - 60, 890, 52); g.restore(); }
    TK.note(g, t, 10.3, 17, '約3割＝ガラスの屈折率 約1.47 の目安', { size: 32 });
  }
  // 17〜25: 片道の時間の帯
  if (t >= 17.0 && t < 25.0) {
    TK.text(g, 'シカゴ → ニュージャージー 片道', PW / 2 - 60, 230, 50, { color: TK.C.sub });
    const M = 7.2;
    TK.bars(g, t, 17.1, 25.0, [
      { label: '光の限界（まっすぐ・真空）', v: 3.93 / M, color: 'rgba(255,255,255,0.55)', text: '3.93 ms' },
      { label: 'まっすぐに掘った光ファイバー', v: 6.65 / M, color: TK.C.acc2, text: '6.65 ms' },
      { label: '電波の鉄塔（推定）', v: 4.7 / M, color: TK.C.acc, text: '4.2〜5.2 ms' },
    ], { y: 330, gap: 210, stagger: 0.5, size: 48 });
    if (t > 21.0) { g.save(); g.globalAlpha = fade(t, 21.0, 25, 0.3); TK.text(g, 'さらに 約[2ミリ秒] 速い', PW / 2 - 60, 1000, 70); g.restore(); }
    TK.note(g, t, 17.5, 25, '電波の 4.2〜5.2ms は論文の推定', { size: 32 });
  }
  // 25〜31: 2ミリ秒と 5億ドル
  if (t >= 25.0 && t < 31.0) {
    TK.count(g, t, 25.0, 31.0, 0, 2, { y: 360, size: 220, dur: 0.8, unit: 'ミリ秒', fmt: v => v.toFixed(1) });
    if (t > 26.0) { g.save(); g.globalAlpha = fade(t, 26.0, 31, 0.3); TK.text(g, 'まばたきの 約[100分の1]', PW / 2 - 60, 620, 62); g.restore(); }
    if (t > 28.0) { const k = TK.pop(t, 28.0, 0.4); g.save(); g.globalAlpha = k; TK.card(g, 120, 740, 720, 200, { fill: 'rgba(255,207,74,0.18)', stroke: TK.C.acc }); TK.text(g, '合わせて [5億ドル] 以上', PW / 2 - 60, 840, 72); g.restore(); }
    TK.note(g, t, 28.3, 31, '光ファイバーと電波の網を合わせた設備と5年の運用の見積もり\nまばたきは 0.1〜0.15 秒の目安', { size: 30 });
  }
  // 31〜35: 道の長さ
  if (t >= 31.0) {
    map(g, 520, TK.pop(t, 31.0, 0.4), { paths: true });
    g.save(); g.globalAlpha = fade(t, 31.3, 35, 0.3);
    TK.text(g, '光ファイバー（地面にそって）', 480, 760, 48, { color: TK.C.acc2 });
    TK.text(g, '電波（鉄塔から鉄塔へ、まっすぐ）', 480, 330, 48, { color: TK.C.acc });
    g.restore();
    TK.note(g, t, 32.0, 35, '出どころ: Laughlin, Aguirre, Grundfest (2014)\nFinancial Review 49:283–312（arXiv:1302.5966）', { size: 30 });
  }
}

triviaStart({ out: 'net-route-trivia1', voice: 'auto', dur: DUR, draw, subs, cues, peek: 1.5 });
</script>
</body>
</html>
