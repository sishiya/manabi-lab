<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紹介動画づくり</title>
<link rel="stylesheet" href="promo.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="promo.js"></script>
<script src="quantum-common.js"></script>
<script>
'use strict';
// 台本: 量子の実験室（ショート、40秒＋締め）。?short で縦長に録る
// 見せ場は二重スリット: 1個ずつ → たくさんでしま → 通り道を調べるとしまが消える。最後にトンネル効果
const V = new URLSearchParams(location.search).has('short');
const LAY = V ? {
  slit: [['#slitApp', 40, 190, 1000, 560], ['#slitScreen', 40, 770, 1000, 420]],
  tunnel: [['#tunCv', 40, 420, 1000, 640]],
} : {
  slit: [['#slitApp', 140, 60, 1640, 560], ['#slitScreen', 140, 640, 1640, 300]],
  tunnel: [['#tunCv', 140, 160, 1640, 640]],
};
const EV = [
  { t: 0.01, run: w => qxScene(w, 'slit') },
  { t: 14, run: w => clickEl(w, '#slitMany') },
  { t: 16.5, run: w => clickEl(w, '#slitMany') },
  { t: 22, run: w => { setInput(w, '#slitObs', true); } },
  { t: 23, run: w => { clickEl(w, '#slitMany'); clickEl(w, '#slitMany'); } },
  { t: 28.3, run: w => { qxScene(w, 'tunnel'); setInput(w, '#tunW', 1.25); setInput(w, '#tunE', 0.6); } },
];
const CAPS = [
  { a: 6, b: 13, main: '1個ずつ飛ばすと、点はばらばらに当たる', sub: 'どこに当たるかは、毎回わからない',
    en: ['Fired one by one, they land at random spots', 'You can never tell where the next one will land'] },
  { a: 13.5, b: 21, main: 'たくさん集めると、しま模様が現れる', sub: '2つのスリットを通った波が、重なった跡',
    en: ['Collect many and stripes appear', 'The mark of waves from both slits overlapping'] },
  { a: 21.5, b: 28, main: 'どちらを通ったか調べると、しまが消える', sub: 'なだらかな山が1つになる',
    en: ['Check which slit each one went through, and the stripes vanish', 'You get one smooth hump instead'] },
  { a: 28.5, b: 35, main: '壁を通り抜ける粒子もいる（トンネル効果）', sub: 'はね返るはずが、ある割合で向こう側へ',
    en: ['Some particles pass through a wall (quantum tunneling)', 'Part of the wave gets through instead of bouncing back'] },
];
let lastT = -1;
promoStart({
  name: '量子の実験室', out: 'quantum', src: '../../quantum/index.html', iw: 1920, ih: 1080, dur: SHORT_END + IDENT_CLOSE, peek: 18,
  inject: { dpr: 3, raf: true, pre: QX_PRE },
  music: { style: 'drone', root: 65, stopAt: SHORT_END, cues: [{ t: SHORT_END, type: 'jingle' }] },
  ready: w => w.__qx && w.__rafQ && w.__rafQ.length,
  setup(w) { qxSize(w, LAY); appStep(w, 2); return null; },
  subs: shortSubs('量子の実験室', 'Quantum Lab', '電子を1個ずつ飛ばすと、何が起きる？', 'What happens if you fire electrons one at a time?', CAPS,
    'ブラウザで動かせます。5つの実験を手で試せます', 'Runs in your browser. Try five experiments yourself'),
  async renderAt(t, w) { lastT = qxAdvance(w, EV, lastT, t); },
  drawSource(g, w) { qxDraw(g, w, LAY); },
  overlay(g, t) {
    drawCaps(g, t, CAPS);
    drawShortChrome(g, t, '量子の実験室', '電子を1個ずつ飛ばすと、何が起きる？', 'ブラウザで動かせます。5つの実験を手で試せます',
      'おもな出どころ: Feynman ほか（1965）『The Feynman Lectures on Physics』第3巻、Tonomura ほか（1989）Am. J. Phys. 57 ほか');
  },
  errors: w => w.__qx.err,
});
</script>
</body>
</html>
