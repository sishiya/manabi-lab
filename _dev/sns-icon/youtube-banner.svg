<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <!-- YouTube のバナー（header.svg をもとに）。2560×1440。
       どの画面でも見える範囲: 中央 1546×423（x 507〜2053, y 508〜932）→ 文字はここ
       パソコンで見える範囲: 横いっぱい × y 508〜932 → 左右の絵はここ
       テレビだけ全体が見える → 上下は模様と波だけ -->
  <defs>
    <pattern id="dot" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="2" fill="#F1D7B3"/></pattern>
  </defs>
  <rect width="2560" height="1440" fill="#FFF1DC"/>
  <rect width="2560" height="1440" fill="url(#dot)"/>
  <!-- うしろの波（帯の上下のふち） -->
  <path d="M0 955 q75 -40 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#F6CFA0" stroke-width="6"/>
  <path d="M0 485 q75 30 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#F6DDBC" stroke-width="5"/>

  <!-- 文字（中央） -->
  <g font-family="'Yu Gothic','Meiryo',sans-serif" text-anchor="middle">
    <rect x="1215" y="560" width="130" height="46" rx="23" fill="#D9682B"/>
    <text x="1280" y="594" font-weight="700" font-size="30" fill="#FFF6E8" letter-spacing="2">しし屋</text>
    <text x="1280" y="725" font-weight="900" font-size="124" fill="#2B3A55" letter-spacing="5">まなびラボ</text>
    <text x="1280" y="807" font-weight="700" font-size="42" fill="#D9682B">ふだん見えない「しくみ」を、動かして見る</text>
    <text x="1280" y="868" font-family="'Segoe UI','Meiryo',sans-serif" font-size="28" fill="#8A7A66">からだ ・ いきもの ・ 地球と宇宙 ・ 物理</text>
  </g>

  <!-- 左: 電波・DNA・イモムシ -->
  <g transform="translate(330 760)" fill="none" stroke="#D9682B" stroke-linecap="round">
    <circle r="12" fill="#D9682B" stroke="none"/>
    <path d="M-40 -40 a56 56 0 0 1 80 0" stroke-width="10"/>
    <path d="M-72 -72 a102 102 0 0 1 144 0" stroke-width="10" opacity=".7"/>
    <path d="M-104 -104 a147 147 0 0 1 208 0" stroke-width="10" opacity=".4"/>
  </g>
  <g transform="translate(640 560)" stroke-linecap="round">
    <path d="M0 0 c40 30 40 60 0 90 s-40 60 0 90" fill="none" stroke="#4A90C8" stroke-width="7"/>
    <path d="M0 0 c-40 30 -40 60 0 90 s40 60 0 90" fill="none" stroke="#E36A6A" stroke-width="7"/>
    <g stroke="#B9C6D6" stroke-width="5"><path d="M-22 22 h44 M-28 45 h56 M-22 68 h44 M-22 112 h44 M-28 135 h56 M-22 158 h44"/></g>
  </g>
  <g fill="#6BBF59" transform="translate(320 470)">
    <circle cx="470" cy="430" r="16"/><circle cx="496" cy="420" r="18"/><circle cx="524" cy="416" r="19"/><circle cx="553" cy="420" r="19"/>
    <circle cx="582" cy="410" r="22" fill="#5AAE49"/>
    <circle cx="588" cy="404" r="4" fill="#2B3A55"/>
  </g>

  <!-- 右: チョウ・地球・赤血球・原子 -->
  <g transform="translate(1880 600) rotate(-15)">
    <ellipse cx="-22" cy="-14" rx="24" ry="20" fill="#F5C02E"/><ellipse cx="22" cy="-14" rx="24" ry="20" fill="#F5C02E"/>
    <ellipse cx="-16" cy="16" rx="16" ry="14" fill="#E9A160"/><ellipse cx="16" cy="16" rx="16" ry="14" fill="#E9A160"/>
    <rect x="-4" y="-28" width="8" height="58" rx="4" fill="#3A2416"/>
    <path d="M-2 -28 l-10 -16 M2 -28 l10 -16" stroke="#3A2416" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(2140 690)">
    <ellipse rx="112" ry="30" fill="none" stroke="#E9A160" stroke-width="5" transform="rotate(-18)"/>
    <circle r="72" fill="#4A90C8"/>
    <path d="M-50 -38 q20 -20 40 -6 q10 16 -8 26 q-20 4 -18 22 q-18 2 -24 -18 q-4 -14 10 -24z" fill="#6BBF59"/>
    <path d="M14 -6 q24 -10 40 6 q8 22 -8 40 q-18 14 -26 0 q-4 -20 -6 -46z" fill="#6BBF59"/>
    <path d="M-30 44 q16 -6 28 6 q-6 14 -24 10z" fill="#6BBF59"/>
    <circle cx="96" cy="-60" r="10" fill="#F5C02E"/>
  </g>
  <g transform="translate(-60 455)">
    <ellipse cx="1970" cy="395" rx="40" ry="30" fill="#D84545"/><ellipse cx="1970" cy="395" rx="20" ry="13" fill="#B83232"/>
    <ellipse cx="2045" cy="440" rx="32" ry="24" fill="#E05A5A" transform="rotate(-20 2045 440)"/><ellipse cx="2045" cy="440" rx="15" ry="10" fill="#C23C3C" transform="rotate(-20 2045 440)"/>
  </g>
  <g transform="translate(2370 840)" fill="none" stroke="#2B3A55" stroke-width="5">
    <ellipse rx="58" ry="20"/><ellipse rx="58" ry="20" transform="rotate(60)"/><ellipse rx="58" ry="20" transform="rotate(120)"/>
    <circle r="11" fill="#D9682B" stroke="none"/>
    <circle cx="58" cy="0" r="7" fill="#4A90C8" stroke="none"/><circle cx="-29" cy="-50" r="7" fill="#4A90C8" stroke="none"/>
  </g>
</svg>
