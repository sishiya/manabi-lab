  <text x="800" y="296" text-anchor="middle" font-family="'Yu Gothic','Meiryo',sans-serif" font-weight="700" font-size="36" fill="#D9682B">ふだん見えない「しくみ」を、動かして見る</text>
  <text x="800" y="352" text-anchor="middle" font-family="'Segoe UI','Meiryo',sans-serif" font-size="24" fill="#8A7A66">からだ ・ いきもの ・ 地球と宇宙 ・ 物理</text>

