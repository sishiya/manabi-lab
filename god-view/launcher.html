<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神の視点マップ ランチャー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: single column version list; turning points as cards */
:root{--bg:#06080b;--ink:#eef0e8;--muted:#aab3a7;--dim:#727b70;--line:rgba(228,238,222,.15);--panel:#0e1317;--accent:#f2b45c;
  --f-display:'Shippori Mincho B1','Yu Mincho',serif;--f-body:'Zen Kaku Gothic New','Yu Gothic',system-ui,sans-serif;--f-mono:'IBM Plex Mono',Consolas,monospace;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
main{max-width:760px;margin:0 auto;padding:48px 16px 64px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:48px;margin:6px 0 0;letter-spacing:.04em}
h2{font-size:12px;letter-spacing:.18em;color:var(--dim);font-weight:500;margin:0 0 10px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:start;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:3px;text-decoration:none;color:inherit}
.card:hover,.latest{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ver{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:3px}
.card b{font-size:17px}
.card p{margin:4px 0 0;font-size:13px;line-height:1.75;color:var(--muted)}
.date{font-family:var(--f-mono);font-size:11px;color:var(--dim);white-space:nowrap;padding-top:4px}
.note{font-size:12px;color:var(--dim);line-height:1.8}
@media (max-width:520px){.card{grid-template-columns:1fr}h1{font-size:36px}}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">GOD VIEW MAP · VERSIONS</div>
    <h1>神の視点マップ</h1>
  </header>
  <section>
    <h2>版</h2>
    <div class="cards">
      <a class="card latest" href="index.html"><span class="ver">最新</span><div><b>作業中の最新版</b><p>いま作業フォルダにある index.html。</p></div><span class="date">—</span></a>
      <a class="card" href="versions/v001-earth-map/index.html"><span class="ver">v1</span><div><b>地球の地図（段階A）</b><p>CesiumJS の3D地球。日本全体から家1軒まで寄れる。航空写真・地図・淡色地図・色別標高図、陰影、立体の地形（地理院の標高、世界は AWS Terrain Tiles）、高さの強調、ワイヤフレーム、昼と夜、地名検索（OSM＋地理院）、クリックで住所と標高、画面の幅とものさし、宇宙〜素粒子の目盛り。</p></div><span class="date">2026-10-05</span></a>
    </div>
  </section>
  <p class="note">企画書は PLAN.md、開発メモは DEVNOTES.md。</p>
</main>
</body>
</html>
