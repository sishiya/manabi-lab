<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サムネイル撮影用</title>
<style>html,body{margin:0;overflow:hidden;background:#000}iframe{display:block;width:1280px;height:720px;border:0}</style>
</head>
<body>
<!--
  まなびラボのサムネイルを撮るためのページ（ローカル用）。tools/make-thumbs.ps1 がヘッドレスの Chrome で開いて撮る。
  ?app=<フォルダ名> のアプリを 1280×720 で開き、下の SETUP の手順（開始ボタンを押す・カメラを動かすなど）をしてから待つ。
-->
<iframe id="f"></iframe>
<script>
const app = new URLSearchParams(location.search).get('app');
const wait = ms => new Promise(r => setTimeout(r, ms));
const click = (w, sel) => { const e = w.document.querySelector(sel); if (e) e.click(); };

// アプリごとの準備（w = アプリの window）
const SETUP = {
  'body-dive': async w => { click(w, '#go'); await wait(6000); },
  'urinary-dive': async w => { click(w, '#go'); await wait(6000); },
  'blood-dive': async w => { click(w, '#go'); await wait(6000); },
  // 窓を2か所あけて風を通したところ（空気の古さの色と流れの粒）
  'air-flow': async w => { await wait(800); w.__af.loadScene('cross'); await wait(4000); },
  // 風船をエベレストの山頂へ（今にも割れそう）
  'extreme': async w => { await wait(800); w.__ex.setThing('balloon'); w.__ex.go(8849, true); await wait(1500); },
  // 蛹の1日目、透かして見る（幼虫の部品が壊れ、血球が集まるところ）
  'ga-creatures': async w => { await wait(800); w.__ga.gens(40); await wait(5000); },
  // 下ろす動作を重くした1回目の約2日後（傷・マクロファージ・筋肉痛）
  'muscle-growth': async w => { await wait(800); w.__mg.setCond({ mode: 'ecc' }); w.__mg.setT(62); await wait(1500); w.__mg.setT(62); },
  // 梅雨の浴室の約4週間後（ゴムパッキンと目地にカビ）
  'mold-growth': async w => { await wait(800); w.__mk.UI.playing = false; w.__mk.run(27 * 24 + 14); w.__mk.frame(3, 0.03); await wait(1500); },
  // 1世代目の夜、毒エサを置いて少したったところ（デフォルメの虫）
  'resistance': async w => { await wait(800); w.__rz.S.style = 'cute'; w.document.getElementById('btnStart').click(); w.__rz.step(10); await wait(400); },
  // 顔の写真を見せて約 180 ms（両側の視覚野から顔の領域へ。右が強い）
  'brain-response': async w => { await wait(800); w.__br.set({ sp: 'human', stim: 'face', cond: 'none' }); w.__br.seek(185); await wait(600); w.__br.seek(185); },
  // 大きい磁石の上のトゲの山（開いたときのまま、少し進める）
  'ferrofluid': async w => { await wait(800); w.__ff.advance(2, 1 / 30); await wait(1500); },
  // 映画の角度（開いたときのまま）。細かい段まで描き切る
  'black-hole': async w => { await wait(1500); w.__bh.renderNow(2); await wait(1500); w.__bh.renderNow(2); },
  'metamorphosis': async w => { await wait(800); w.__mm.setT(1.0); await wait(1500); w.__mm.setT(1.0); },
  // 恐竜の時代（約6800万年前）。生き物が多く見える
  'evolution': async w => { click(w, '#aboutStart'); await wait(1500); w.__ev.setAge(68e6); await wait(6000); },
  'god-view': async w => {
    await wait(1500);
    const C = w.Cesium, gv = w.__gv;
    gv.viewer.camera.setView({
      destination: C.Cartesian3.fromDegrees(139.7615, 35.6800, 120),
      orientation: { heading: C.Math.toRadians(70), pitch: C.Math.toRadians(-18), roll: 0 },
    });
    w.document.body.classList.remove('layers-open');
    w.GV.applyBuildings();
    await gv.run(50, 200);
  },
};

const f = document.getElementById('f');
f.onload = async () => {
  await wait(1500);
  const s = SETUP[app];
  if (s) { try { await s(f.contentWindow); } catch (e) { console.error(e); } }
  else await wait(5000);
  document.title = 'ready';
};
f.src = '../' + app + '/';
</script>
</body>
</html>
